000)/log(b) 层。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>归结原理的子句爆炸<\/td><td>定理证明衰落的技术原因<\/td><\/tr><tr><td>第 6 章<\/td><td>Minimax 与剪枝<\/td><td>用剪枝与评估绕开指数<\/td><\/tr><tr><td>第 9 章<\/td><td>停机问题<\/td><td>另一类&quot;算不动&quot;：不可判定<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">专家系统与知识获取瓶颈<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">搜索与评估函数<\/a>\n<\/ul>", "kind": "concept", "title": "组合爆炸"}, "c05": {"html": "<h1>感知机与线性不可分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>感知机是最早的&quot;可学习&quot;神经元：加权求和、过阈值输出。它只能画一条直线分类，所以做不了异或。<\/p>\n<h2>为什么重要<\/h2>\n<p>所有现代神经网络都是它的后代。理解它的局限，就理解了&quot;为什么必须加层、加非线性&quot;。<\/p>\n<h2>详解<\/h2>\n<p>模型：<code>y = 1[w·x + b ≥ 0]<\/code>。几何上这是一个超平面，把空间切成两半。<\/p>\n<p>学习规则：分错了就把权重往正确方向挪一小步。这等价于梯度下降在平方损失上的更新。<\/p>\n<p>异或为什么不行：<\/p>\n<table><thead><tr><th>x1<\/th><th>x2<\/th><th>输出<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><\/tbody><\/table>\n<p>两个&quot;1&quot;在对角线上，两个&quot;0&quot;在另一条对角线上，任何直线都无法把它们分开。必须两层：第一层画两条线切出三块，第二层对块贴标签。<\/p>\n<p>1969 年《感知机》一书证明了这个局限，但流传中被误读成&quot;整条路死了&quot;，导致经费消失十年。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为异或是&quot;很难的例子&quot;<\/strong>——它是最简单的非线性问题，四个点而已。真正的教训是：表达能力由模型的函数族决定，不由训练方法决定。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>1943 麦卡洛克-皮茨<\/td><td>神经元即阈值逻辑门<\/td><\/tr><tr><td>第 4 章<\/td><td>1958 罗森布拉特<\/td><td>感知机与硬件 Mark I<\/td><\/tr><tr><td>第 4 章<\/td><td>1969《感知机》<\/td><td>线性不可分与误读<\/td><\/tr><tr><td>第 4 章<\/td><td>1986 反向传播<\/td><td>多层网络终于能训<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">符号主义与连接主义<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">反向传播与梯度消失<\/a>\n<\/ul>", "kind": "concept", "title": "感知机与线性不可分"}, "c06": {"html": "<h1>反向传播与梯度消失<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>反向传播是用链式法则从损失倒推每一层参数的梯度；梯度消失是层数一多，梯度在往回传的过程中指数衰减到接近零。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解决了&quot;多层网络怎么训&quot;这个卡了二十年的问题；而它的失败模式（消失/爆炸）又直接催生了 ReLU、残差连接、LSTM、批归一化等一系列设计。<\/p>\n<h2>详解<\/h2>\n<p>前向：<code>z = Wx + b<\/code>，<code>a = σ(z)<\/code>，逐层传到输出，算出损失 L。<\/p>\n<p>反向：<code>∂L/∂W = ∂L/∂z · xᵀ<\/code>，<code>∂L/∂x = Wᵀ · ∂L/∂z<\/code>，逐层往回传。<\/p>\n<p>梯度为什么会消失：每一层都要乘一个权重矩阵和一个激活函数的导数。如果这些因子的量级小于 1，连乘 L 层后就趋于 0；大于 1 就爆炸。<\/p>\n<p>对应方案：<\/p>\n<table><thead><tr><th>现象<\/th><th>方案<\/th><\/tr><\/thead><tbody><tr><td>梯度消失<\/td><td>ReLU（导数为 1）、残差连接（给梯度开直通路）、LSTM 门控<\/td><\/tr><tr><td>梯度爆炸<\/td><td>梯度裁剪、权重初始化（Xavier/He）、归一化<\/td><\/tr><tr><td>训练不稳<\/td><td>批归一化、更小的学习率、warmup<\/td><\/tr><\/tbody><\/table>\n<h2>常见误解<\/h2>\n<p><strong>别以为反向传播是&quot;学习算法&quot;<\/strong>——它只是算梯度的方式，怎么用梯度（SGD、Adam、动量）是另一回事。也别以为它是 1986 年发明的，数学上就是链式法则。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>1986 年《自然》论文<\/td><td>可复现的多层训练流程<\/td><\/tr><tr><td>第 4 章<\/td><td>2006 逐层预训练<\/td><td>绕过消失的一种工程解法<\/td><\/tr><tr><td>第 4 章<\/td><td>2012 AlexNet<\/td><td>ReLU + GPU 让深网络可训<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">感知机与线性不可分<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">压缩即学习<\/a>\n<\/ul>", "kind": "concept", "title": "反向传播与梯度消失"}, "c07": {"html": "<h1>强化学习与信用分配<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5、6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>强化学习是在&quot;只有分数、没有答案&quot;的环境里学策略；信用分配是它的核心难题——赢了之后，该把功劳记在哪一步。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 AlphaGo、机器人控制、推荐系统排序的共同底层。理解它，你就明白为什么有些任务&quot;能评价但学不会&quot;。<\/p>\n<h2>详解<\/h2>\n<p>五元组：状态 S、动作 A、奖励 R、转移 P、折扣 γ。<\/p>\n<p>价值函数：<code>V(s) = 期望[未来折扣累计奖励]<\/code>。贝尔曼把它写成递推：<code>V(s) = r + γV(s&#x27;)<\/code>。<\/p>\n<p>Q 学习更新：<code>Q ← Q + α[r + γmaxQ(s&#x27;,·) − Q]<\/code>。方括号里是 TD 误差。<\/p>\n<p>信用分配的三种解法：<\/p>\n<ol><li>\n<strong>时序差分<\/strong>：把奖励沿时间往回摊，每一步只更新一点。\n<\/li><li>\n<strong>资格迹<\/strong>：给近期访问过的状态更高权重。\n<\/li><li>\n<strong>策略梯度<\/strong>：不追责到具体状态，直接按整条轨迹的回报调高/调低整条策略的概率。\n<\/ol>\n<h2>常见误解<\/h2>\n<p><strong>别以为强化学习&quot;不需要监督&quot;<\/strong>——它有监督信号，只是信号是评价性、延迟、稀疏的。也别以为奖励设计是小事，写错的奖励会让智能体精确地学会错误行为。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>贝尔曼方程、Q 学习<\/td><td>用采样替代模型<\/td><\/tr><tr><td>第 5 章<\/td><td>巴托与萨顿获图灵奖<\/td><td>慢路线的迟到认可<\/td><\/tr><tr><td>第 6 章<\/td><td>AlphaGo<\/td><td>搜索 + 价值网络解决信用分配<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">组合爆炸<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">蒙特卡洛树搜索<\/a>\n<\/ul>", "kind": "concept", "title": "强化学习与信用分配"}, "c08": {"html": "<h1>压缩即学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高阶 | <strong>涉及章节<\/strong>：第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在所有能解释数据的模型里，最短的那个是最好的；因此&quot;学习&quot;就是&quot;找更好的压缩方式&quot;。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;智能&quot;这个模糊的词换算成一个可操作的量：描述长度。也让&quot;预测下一个词&quot;这种看似低级的目标，有了理论上的解释。<\/p>\n<h2>详解<\/h2>\n<p>链条是这样的：<\/p>\n<ol><li>\n所罗门诺夫归纳（1964）：在所有能生成数据的程序里找最短的，用它预测未来。\n<\/li><li>\n柯尔莫哥洛夫复杂度：一个对象的最短描述长度就是它的复杂度。\n<\/li><li>\n奥卡姆剃刀：&quot;如无必要勿增实体&quot;被数学化为&quot;选描述更短的假设&quot;。\n<\/li><li>\n语言模型：交叉熵损失 = 平均编码长度。损失下降 = 压缩率提升。\n<\/ol>\n<p>所以当一个模型把互联网文本压得更短时，它必然掌握了语法、事实、常见推理链——因为这些规律就是可压缩的部分。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为压缩率高就等于理解<\/strong>——一段重复用词的文本可以被压得很小，但读者可能完全不懂它的意思。压缩是理解的代理指标，不是理解本身。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10 章<\/td><td>所罗门诺夫其人<\/td><td>1956 年整个暑假待在达特茅斯<\/td><\/tr><tr><td>第 10 章<\/td><td>卡尔纳普的归纳推理<\/td><td>所罗门诺夫的思想来源<\/td><\/tr><tr><td>第 10 章<\/td><td>大模型训练目标<\/td><td>最小化编码长度<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">反向传播与梯度消失<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">大语言模型的能力边界<\/a>\n<\/ul>", "kind": "concept", "title": "压缩即学习"}, "c09": {"html": "<h1>摩尔定律与专用硬件<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>通用芯片的性价比每隔一两年翻一倍，所以&quot;为某个算法专门造硬件&quot;的赌注，通常会在几年内被通用芯片追上。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释了第五代计算机为什么输，也解释了为什么 GPU（通用可编程）赢了专用 ASIC 之外的大部分市场。判断一个硬件路线值不值得押，这是第一道题。<\/p>\n<h2>详解<\/h2>\n<p>逻辑很简单：<\/p>\n<ul><li>\n专用硬件在推出时可能快 10 倍。\n<\/li><li>\n通用芯片按摩尔定律每年进步，五到七年就追平。\n<\/li><li>\n专用硬件的研发周期常常也是五到七年。\n<\/ul>\n<p>结果：等你造出来，对手的通用芯片已经追上了，而你的硬件只能跑一种算法。<\/p>\n<p>第五代计算机的具体赌注：并行逻辑推理机 + Prolog。它假设&quot;智能＝推理&quot;，所以把推理做快就能得到智能。这个假设错了，硬件再好也没用。<\/p>\n<p>对比之下，GPU 的设计是&quot;通用可编程的并行处理器&quot;，它的灵活性让它能吃下各种算法（图形、深度学习、科学计算），所以活得久。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为&quot;专用一定更快所以一定赢&quot;<\/strong>——比赛的是&quot;性价比随时间的曲线&quot;，不是&quot;发布那一刻的峰值&quot;。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>1981 日本第五代计划<\/td><td>89 页报告、6 种体系结构、Prolog<\/td><\/tr><tr><td>第 3 章<\/td><td>1992 计划结束<\/td><td>没有可商用成果<\/td><\/tr><tr><td>第 4 章<\/td><td>1980s Lisp 机<\/td><td>同样死于通用工作站的性价比<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">组合爆炸<\/a>\n<\/li><li>\n后续：无\n<\/ul>", "kind": "concept", "title": "摩尔定律与专用硬件"}, "c10": {"html": "<h1>具身智能<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高阶 | <strong>涉及章节<\/strong>：第 1、11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>智能不能只靠符号推理，还需要一个身体在真实世界里感知、行动、承担后果。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;纯符号派&quot;最主要的反对意见，也是今天机器人学、自动驾驶、具身大模型的理论基础。图灵 1948 年就提过这个区分。<\/p>\n<h2>详解<\/h2>\n<p>三条支持理由：<\/p>\n<ol><li>\n<strong>意义的接地<\/strong>：符号&quot;苹果&quot;的意义来自你能看、能拿、能吃它；没有身体，符号只有语法没有语义（对应塞尔的中文屋）。\n<\/li><li>\n<strong>常识的来源<\/strong>：大量常识来自身体经验（重的东西搬不动、湿的地面会滑），无法用规则穷举（对应德雷弗斯的批评）。\n<\/li><li>\n<strong>闭环控制<\/strong>：真实世界的行动需要感知—决策—执行的闭环，纯离线推理无法处理延迟与不确定性。\n<\/ol>\n<p>代表工作：布鲁克斯（Rod Brooks）的&quot;无表征智能&quot;、行为式机器人（behavior-based robotics）、今天的视觉-语言-动作模型（VLA）。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为具身智能等于&quot;给 AI 一个机器人外壳&quot;<\/strong>——核心是&quot;感知与行动构成学习闭环&quot;，不是硬件形态。一个只在仿真里学的智能体也算具身，只要它的学习依赖行动反馈。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>图灵 1948 年 NPL 报告<\/td><td>区分肉体智能与无肉体智能<\/td><\/tr><tr><td>第 3 章<\/td><td>德雷弗斯批评<\/td><td>熟练技能依赖身体<\/td><\/tr><tr><td>第 11 章<\/td><td>三分法中的&quot;自然主义&quot;<\/td><td>在环境中适应的行为<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">图灵测试与中文屋<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">强化学习与信用分配<\/a>\n<\/ul>", "kind": "concept", "title": "具身智能"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：建立时间轴<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：缘起——从图灵到 1956 年达特茅斯会议<\/a><br>检查点：能说清会议发明了什么<\/li><li class='path-step' id='path-02'><strong>步骤 02：符号路线的巅峰与瓶颈<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：自动定理证明的兴衰<\/a>、<a href=\"#/chapter/ch03\">第 3 章：专家系统、知识图谱与第五代计算机<\/a><br>检查点：能说出组合爆炸与知识获取瓶颈<\/li><li class='path-step' id='path-03'><strong>步骤 03：连接路线的三次起伏<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：神经网络的三起三落<\/a><br>检查点：能列出三次复兴的触发条件<\/li><li class='path-step' id='path-04'><strong>步骤 04：自然路线：进化与试错<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：向自然学习——遗传算法与强化学习<\/a><br>检查点：能手算一次 Q 更新<\/li><li class='path-step' id='path-05'><strong>步骤 05：博弈作为试金石<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：下棋——人工智能的试金石<\/a><br>检查点：能区分深蓝与 AlphaGo<\/li><li class='path-step' id='path-06'><strong>步骤 06：语言：范式反转<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：自然语言处理——从规则到统计<\/a><br>检查点：能说出统计翻盘的三条件<\/li><li class='path-step' id='path-07'><strong>步骤 07：语言与思维的争论<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：语言等于思维吗<\/a><br>检查点：能复述刺激贫乏与反驳<\/li><li class='path-step' id='path-08'><strong>步骤 08：计算的边界<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：人是机器吗——计算的理论边界<\/a><br>检查点：能反证停机问题<\/li><li class='path-step' id='path-09'><strong>步骤 09：大模型与学习理论<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：大语言模型——“学习”到底是什么<\/a><br>检查点：能解释学习即压缩<\/li><li class='path-step' id='path-10'><strong>步骤 10：哲学收束与三分法<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：哲学质疑、教科书变迁与智能的进化<\/a><br>检查点：能用三分法分析一个领域<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：缘起——从图灵到 1956 年达特茅斯会议<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 达特茅斯会议最准确的定位是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 第一台智能机器诞生<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 人工智能这个名称与学术共同体形成的标志<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 神经网络被发明的年份<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 图灵测试提出的年份<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 1955 年洛杉矶学习机讨论会上，主持人皮茨总结：一派试图模拟____，另一派试图模拟____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 图灵 1948 年 NPL 报告提出的区分是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 强人工智能与弱人工智能<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 肉体智能与无肉体智能<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 符号主义与连接主义<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 通用与专用<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 达特茅斯会议之前已经完成的工作有：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 可运行的定理证明程序<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 跳棋程序<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 乔治敦-IBM 机器翻译实验<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 反向传播算法<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：自动定理证明的兴衰<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 第一个可运行的定理证明程序是谁做的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 纽厄尔与西蒙<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 戴维斯<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 鲁滨逊<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 王浩<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 希尔伯特的形式主义把数学看作把一串____变成另一串____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 归结原理的核心操作是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 枚举所有模型<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 消去互补文字并合并子句<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 用归纳法证明<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 计算特征值<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 定理证明在当代以哪些形式存在？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> SAT/SMT 求解器<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> Coq、Lean 等交互式证明器<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 芯片与软件形式化验证<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 图像分类<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：专家系统、知识图谱与第五代计算机<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 专家系统最贵的环节是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 写代码<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 把专家知识问出来并形式化<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 买硬件<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 做界面<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 第五代计算机押注的两件事是并行逻辑推理硬件与____语言。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> MYCIN 未能临床落地的主要原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 准确率太低<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 信任、责任归属与部署成本<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 规则太少<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 算力不足<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 知识图谱相对规则库的优势包括：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 加新知识不必担心规则冲突<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 天然支持多跳查询<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 完全解决了知识获取成本<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 便于实体对齐与跨源融合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：神经网络的三起三落<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 1969 年《感知机》一书实际证明了什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 多层网络完全无用<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 单层感知机无法解决线性不可分问题<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 神经网络一定收敛<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 反向传播不可行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div ><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 语言影响注意的维度<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 语言完全决定思维<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 缺词时仍可思考但更费力<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 语言与思维完全无关<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch09__": {"html": "<h1>测验：第 9 章：人是机器吗——计算的理论边界<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 图灵机的三个部件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 纸带、读写头、状态表<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 内存、CPU、硬盘<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 输入、输出、程序<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 编码、解码、校验<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 停机问题的证明使用____构造，与哥德尔不完备定理同源。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 丘奇-图灵论题为什么不是定理？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 已被证明为假<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 它连接直观概念与数学定义，前者无法形式化<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 只有部分情况成立<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 它只是猜想<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 物理符号假设受到质疑的理由包括：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 感知与行动中的智能可能不需要符号<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 常识编码成本极高<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 符号缺乏与世界的接地<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 图灵机被证明不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch10__": {"html": "<h1>测验：第 10 章：大语言模型——“学习”到底是什么<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 所罗门诺夫归纳的核心是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 统计词频<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 在所有能生成数据的程序里找最短的<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 用最大似然估计<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 用神经网络拟合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 语言模型的交叉熵损失，本质上是最小化文本的____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 为什么预测下一个词能带来推理能力？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 因为目标本身很难<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 因为压低损失必须掌握语法、事实与推理模式<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 因为模型很大<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 因为人工标注了推理步骤<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 大模型幻觉的成因包括：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 目标是像人写的而不是符合事实<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 缺乏外部知识校验<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 参数量太大<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 长尾事实在训练数据中出现少<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch11__": {"html": "<h1>测验：第 11 章：哲学质疑、教科书变迁与智能的进化<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 塞尔中文屋论证想说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 机器一定能理解中文<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 语法操作不等于语义理解<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 中文比英文难<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 符号系统不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 人脑约 860 亿神经元，其中皮层约____亿；大象总神经元多，但皮层只有约____亿。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 作者用「计划经济」比喻哪一派？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 连接主义<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 逻辑主义（规则派）<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 自然主义<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 强化学习<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 尼尔森四本教科书的主题演变说明：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 重心从学习到符号推理再回到学习<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 技术可行性随算力变化而摆动<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 符号方法从未被使用<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 统计方法在 1990 年代末重新成为主线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='人工智能'>人工智能 — 以机器为载体展示出来的人类智能 <span class=glossary-ref>（第 1 章：缘起——从图灵到 1956 年达特茅斯会议）<\/span><\/li><li data-term='模仿游戏'>模仿游戏 — 图灵 1950 年提出的测试：文字对话中分不出人机即判定有智能 <span class=glossary-ref>（第 1 章：缘起——从图灵到 1956 年达特茅斯会议）<\/span><\/li><li data-term='图灵测试'>图灵测试 — 后世对模仿游戏的称呼 <span class=glossary-ref>（第 1 章：缘起——从图灵到 1956 年达特茅斯会议）<\/span><\/li><li data-term='肉体智能'>肉体智能 — 图灵 1948 年提出的概念：需要身体与感知的智能 <span class=glossary-ref>（第 1 章：缘起——从图灵到 1956 年达特茅斯会议）<\/span><\/li><li data-term='无肉体智能'>无肉体智能 — 不需要身体的纯符号推理式智能 <span class=glossary-ref>（第 1 章：缘起——从图灵到 1956 年达特茅斯会议）<\/span><\/li><li data-term='学科共同体'>学科共同体 — 共同关注同一类问题、共享评价标准的研究者群体 <span class=glossary-ref>（第 1 章：缘起——从图灵到 1956 年达特茅斯会议）<\/span><\/li><li data-term='逻辑主义'>逻辑主义 — 认为数学可以归约到逻辑的立场，代表是罗素 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='形式主义'>形式主义 — 认为数学是符号串到符号串的变换，代表是希尔伯特 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='直觉主义'>直觉主义 — 认为数学是心智构造、拒绝排中律的立场，代表是布劳威尔 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='不完备定理'>不完备定理 — 足够强的形式系统中存在既不可证也不可证伪的命题 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='三段论'>三段论 — 亚里士多德的形式推理，最早把推理规则化 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='谓词逻辑'>谓词逻辑 — 把句子拆成对象与性质、并允许量词的一阶逻辑 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='全称量词'>全称量词 — 符号 ∀，表示对所有对象成立 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='存在量词'>存在量词 — 符号 ∃，表示至少存在一个对象 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='根岑'>根岑 — 证明论奠基者，1935 年引入 ∀ 与 ∃ 符号 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='逻辑理论家'>逻辑理论家 — 纽厄尔与西蒙 1956 年的定理证明程序 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='归结原理'>归结原理 — 把推理化为子句消去，配合反证使用 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='子句'>子句 — 若干文字的析取，归结原理的操作单位 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='sat 求解'>SAT 求解 — 判定布尔公式是否可满足 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='smt 求解'>SMT 求解 — 在带背景理论的一阶逻辑上做可满足性判定 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='形式化验证'>形式化验证 — 用机器检查数学证明或程序正确性 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='专家系统'>专家系统 — 把领域专家的规则写进程序做推理的系统 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='知识库'>知识库 — 存规则或三元组的仓库 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='推理机'>推理机 — 拿事实匹配规则、推出新结论的部件 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='前向链'>前向链 — 从事实出发推结论，数据驱动 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='后向链'>后向链 — 从目标出发倒推条件，目标驱动 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='知识获取瓶颈'>知识获取瓶颈 — 把专家知识问出来并形式化的困难 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='知识工程师'>知识工程师 — 负责访谈专家、把知识写成规则的人 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='知识图谱'>知识图谱 — 用（头实体, 关系, 尾实体）三元组存储事实的网络 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='语义网'>语义网 — 给网页加机器可读语义标注的构想 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='三元组'>三元组 — 知识图谱的最小存储单位 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='路径排序'>路径排序 — 把关系路径当特征、学习哪条路径可信的推理方法 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='第五代计算机'>第五代计算机 — 日本 1981—1992 年押注并行逻辑推理硬件的计划 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='prolog'>Prolog — 基于逻辑程序的编程语言，第五代机的核心语言 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='感知机'>感知机 — 最早的线性神经元模型，无法解决异或 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='赫布规则'>赫布规则 — 同时激活的神经元之间连接会增强 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='控制论'>控制论 — 维纳创立的动物与机器通信控制研究 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='线性可分'>线性可分 — 存在一个超平面能把两类点分开 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='异或'>异或 — 两输入不同则输出 1 的逻辑运算，线性不可分 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='反向传播'>反向传播 — 用链式法则从损失倒推各层梯度 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='梯度消失'>梯度消失 — 层数多时梯度连乘衰减到近零 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='联结主义'>联结主义 — 以神经网络为智能模型的研究纲领 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='遗传算法'>遗传算法 — 编码、选择、交叉、变异的随机搜索方法 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='适应度'>适应度 — 衡量个体好坏的打分函数 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='遗传编程'>遗传编程 — 以树结构为基因、能自动生成程序的进化方法 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='细胞自动机'>细胞自动机 — 规则统一作用于格点、整体涌现复杂行为的模型 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='没有免费午餐'>没有免费午餐 — 平均所有问题时任何优化算法表现相同 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='马尔可夫决策过程'>马尔可夫决策过程 — 状态、动作、奖励、转移、折扣构成的序贯决策框架 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='贝尔曼方程'>贝尔曼方程 — 把状态价值拆成当下奖励加折扣未来价值 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='q 学习'>Q 学习 — 用采样替代期望、学最优动作价值的算法 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='时序差分误差'>时序差分误差 — 实际奖励加未来估计减去当前估计 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='信用分配'>信用分配 — 把最终回报归功或归咎到具体动作的问题 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='dqn'>DQN — 用深度网络近似 Q 值，配合经验回放与目标网络 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='minimax'>Minimax — 我方取最大、对手取最小的对抗搜索 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='alpha-beta 剪枝'>Alpha-Beta 剪枝 — 用上下界剪掉不影响决策的分支 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='评估函数'>评估函数 — 给非终局局面打分的函数 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='蒙特卡洛树搜索'>蒙特卡洛树搜索 — 选择、扩展、模拟、回溯四步迭代的搜索方法 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='土耳其人'>土耳其人 — 1769 年肯佩伦造的下棋木偶，实为藏人骗局 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='深蓝'>深蓝 — IBM 1997 年战胜卡斯帕罗夫的国际象棋系统 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='完全信息'>完全信息 — 所有参与者都能看到全部局面信息 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='不完美信息'>不完美信息 — 存在隐藏信息的博弈，如扑克 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='反事实遗憾最小化'>反事实遗憾最小化 — 按累计遗憾调整策略、逼近期望均衡的方法 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='机器翻译'>机器翻译 — 用机器把一种语言转成另一种 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='alpac 报告'>ALPAC 报告 — 1966 年叫停机器翻译资助的评估报告 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='正则文法'>正则文法 — 3 型文法，对应有限状态自动机 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='上下文无关文法'>上下文无关文法 — 2 型文法，对应下推自动机 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='下推自动机'>下推自动机 — 带栈的自动机，能处理嵌套结构 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='n-gram'>n-gram — 用前 n−1 个词预测下一个词的语言模型 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='平滑'>平滑 — 给未出现的组合分配少量概率，避免零概率 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='bleu'>BLEU — 机器翻译的自动评价指标 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='词向量'>词向量 — 把词表示成稠密向量，语义近则距离近 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='transformer'>Transformer — 2017 年提出的纯注意力架构 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='预训练'>预训练 — 先用海量无标注数据学通用表示，再微调 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='刺激贫乏'>刺激贫乏 — 儿童输入有限却掌握复杂语法，故有先天官能 <span class=glossary-ref>（第 8 章：语言等于思维吗）<\/span><\/li><li data-term='普遍语法'>普遍语法 — 乔姆斯基假设的人脑先天语法框架 <span class=glossary-ref>（第 8 章：语言等于思维吗）<\/span><\/li><li data-term='柏拉图之问'>柏拉图之问 — 经验贫乏为何能知道这么多 <span class=glossary-ref>（第 8 章：语言等于思维吗）<\/span><\/li><li data-term='奥威尔之问'>奥威尔之问 — 证据充分为何仍会错得离谱 <span class=glossary-ref>（第 8 章：语言等于思维吗）<\/span><\/li><li data-term='萨丕尔-沃尔夫假说'>萨丕尔-沃尔夫假说 — 语言影响或决定思维的主张 <span class=glossary-ref>（第 8 章：语言等于思维吗）<\/span><\/li><li data-term='上下文学习'>上下文学习 — 给几个例子就能临时学会任务模式 <span class=glossary-ref>（第 8 章：语言等于思维吗）<\/span><\/li><li data-term='图灵机'>图灵机 — 纸带、读写头、状态表构成的抽象计算模型 <span class=glossary-ref>（第 9 章：人是机器吗——计算的理论边界）<\/span><\/li><li data-term='可计算'>可计算 — 存在图灵机在有限步内对所有输入给出正确答案 <span class=glossary-ref>（第 9 章：人是机器吗——计算的理论边界）<\/span><\/li><li data-term='丘奇-图灵论题'>丘奇-图灵论题 — 直觉上可机械计算的函数都是图灵可计算的 <span class=glossary-ref>（第 9 章：人是机器吗——计算的理论边界）<\/span><\/li><li data-term='λ 演算'>λ 演算 — 丘奇提出的函数抽象与替换形式系统 <span class=glossary-ref>（第 9 章：人是机器吗——计算的理论边界）<\/span><\/li><li data-term='停机问题'>停机问题 — 不存在通用算法判定任意程序是否停机 <span class=glossary-ref>（第 9 章：人是机器吗——计算的理论边界）<\/span><\/li><li data-term='对角化'>对角化 — 用自指构造矛盾、证明不可能性的手法 <span class=glossary-ref>（第 9 章：人是机器吗——计算的理论边界）<\/span><\/li><li data-term='物理符号假设'>物理符号假设 — 符号操作是智能的必要且充分条件 <span class=glossary-ref>（第 9 章：人是机器吗——计算的理论边界）<\/span><\/li><li data-term='所罗门诺夫归纳'>所罗门诺夫归纳 — 在所有能生成数据的程序里找最短的做预测 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='柯尔莫哥洛夫复杂度'>柯尔莫哥洛夫复杂度 — 一个对象的最短描述长度 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='奥卡姆剃刀'>奥卡姆剃刀 — 同等解释力下选假设更少的那个 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='交叉熵'>交叉熵 — 衡量模型分布与真实分布差异的损失 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='困惑度'>困惑度 — 平均编码长度的指数形式，语言模型的常用指标 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='缩放定律'>缩放定律 — 性能随参数、数据、算力按幂律提升的经验规律 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='涌现能力'>涌现能力 — 小模型测不出、过某个规模才显现的能力 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='幻觉'>幻觉 — 模型流畅生成不符合事实的内容 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='强化学习人类反馈'>强化学习人类反馈 — 用人类偏好数据调模型输出倾向的方法 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='中文屋'>中文屋 — 塞尔的思想实验：照规则搬符号不等于理解 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='缸中脑'>缸中脑 — 普特南的思想实验：意义可能依赖外部世界 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='缸中脑论证'>缸中脑论证 — 指称依赖因果联系，故纯内部状态不构成意义 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='物理符号系统'>物理符号系统 — 能操作符号的物理装置 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='德雷弗斯'>德雷弗斯 — 《计算机不能做什么》作者，批评符号派忽视常识与身体 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='自然主义'>自然主义 — 主张智能是在环境中适应的行为 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='大脑汤'>大脑汤 — 把脑组织溶解后直接数细胞核的计数方法 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='皮层神经元'>皮层神经元 — 决定智能水平更关键的指标，人脑约 160 亿 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='具身智能'>具身智能 — 需要身体在环境中感知与行动的智能 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架一：问&quot;他当时被什么卡住了&quot;<\/h2>\n<p>读任何一段 AI 史，先问这个问题，而不是问&quot;他用了什么方法&quot;。<\/p>\n<p>三种卡点，对应三种历史结局：<\/p>\n<table><thead><tr><th>卡点<\/th><th>表现<\/th><th>典型案例<\/th><\/tr><\/thead><tbody><tr><td>算力不够<\/td><td>方法对，跑不动<\/td><td>归结原理、深层网络<\/td><\/tr><tr><td>数据不够<\/td><td>方法对，没样本<\/td><td>统计 NLP、深度学习<\/td><\/tr><tr><td>假设错了<\/td><td>方法再快也没用<\/td><td>第五代计算机<\/td><\/tr><\/tbody><\/table>\n<p>判断标准：如果几年后同一方法被重新用起来并成功，卡点是前两类；如果这个方法再也没人用，卡点大概率是第三类。<\/p>\n<h2>框架二：判断一项技术属于哪一派<\/h2>\n<table><thead><tr><th>提问<\/th><th>符号派<\/th><th>连接派<\/th><th>自然派<\/th><\/tr><\/thead><tbody><tr><td>知识从哪来<\/td><td>人写的规则<\/td><td>数据里的参数<\/td><td>与环境的交互<\/td><\/tr><tr><td>出错会怎样<\/td><td>遇到未覆盖情况就崩<\/td><td>给出自信的错误答案<\/td><td>行为不稳但不解释<\/td><\/tr><tr><td>怎么评价<\/td><td>可解释、可审计<\/td><td>基准分数<\/td><td>任务完成率<\/td><\/tr><\/tbody><\/table>\n<p>用途：看到一个新技术，先归类，再预测它的失败模式。这比记住它的技术细节有用。<\/p>\n<h2>框架三：演示成功 ≠ 系统可用<\/h2>\n<p>看任何 AI 演示，按顺序问四个问题：<\/p>\n<ol><li>\n规则/参数是不是为这个例子专门调的？\n<\/li><li>\n换了领域还能跑吗？\n<\/li><li>\n失败时的表现是什么样的（崩掉还是给错答案）？\n<\/li><li>\n谁为错误负责？\n<\/ol>\n<p>1954 年乔治敦机器翻译、1970 年代专家系统、今天的很多产品演示，都栽在这四问上。<\/p>\n<h2>框架四：复兴的四个前兆<\/h2>\n<p>历史上每次 AI 复兴都不是突然的，都有四个前兆同时出现：<\/p>\n<ol><li>\n一个新工具解决了旧的训练/推理瓶颈（反向传播、ReLU、Transformer）。\n<\/li><li>\n出现大规模、可评价的数据集（MNIST、ImageNet）。\n<\/li><li>\n算力成本降到学术界能用。\n<\/li><li>\n有一个标志性的基准突破（AlexNet、AlphaGo）。\n<\/ol>\n<p>四个缺一个，复兴就会晚几年。<\/p>\n<h2>框架五：哲学批评 → 技术问题<\/h2>\n<p>历史上每一次重要的哲学批评，最后都变成了一个具体的技术问题：<\/p>\n<table><thead><tr><th>批评<\/th><th>变成的技术问题<\/th><\/tr><\/thead><tbody><tr><td>德雷弗斯：常识无法穷举<\/td><td>知识表示、常识推理、检索增强<\/td><\/tr><tr><td>塞尔：符号没有语义<\/td><td>接地、多模态、具身<\/td><\/tr><tr><td>乔姆斯基：模式匹配不是理解<\/td><td>因果推理、形式化验证、可解释性<\/td><\/tr><tr><td>图灵：行为能否作为判据<\/td><td>评测基准的设计<\/td><\/tr><\/tbody><\/table>\n<p>所以读哲学章节不要当&quot;闲谈&quot;，它是未来技术需求的清单。<\/p>\n<h2>反模式<\/h2>\n<p><strong>反模式一：把&quot;能通过考试&quot;当成&quot;具备能力&quot;。<\/strong> 考试题是有限的、可被模式覆盖的；真实任务是开放的。<\/p>\n<p><strong>反模式二：押注专用硬件。<\/strong> 摩尔定律会追上你（第五代计算机、Lisp 机的教训）。<\/p>\n<p><strong>反模式三：把寒冬归因于&quot;某个人的打压&quot;。<\/strong> 明斯基与罗森布拉特的私人恩怨被过度叙述，真实原因是理论悲观 + 经费削减 + 技术条件不足三重叠加。<\/p>\n<p><strong>反模式四：认为历史是线性进步的。<\/strong> 神经网络三次起伏、NLP 两次范式反转，都不是&quot;越来越好&quot;，而是&quot;条件变了就换一条路&quot;。<\/p>\n<p><strong>反模式五：忽略宣传与实际的差距。<\/strong> 1958 年感知机的媒体报道、1954 年机器翻译的新闻标题，都是&quot;技术未成熟先被吹大&quot;的经典案例。<\/p>\n<p><strong>反模式六：把&quot;规模&quot;当成&quot;理解&quot;。<\/strong> 规模带来能力，但不带来因果模型。幻觉就是这条反模式的代价。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>关键时间线<\/h2>\n<table><thead><tr><th>年份<\/th><th>事件<\/th><th>归属<\/th><\/tr><\/thead><tbody><tr><td>1936<\/td><td>图灵提出图灵机、停机问题<\/td><td>计算理论<\/td><\/tr><tr><td>1943<\/td><td>麦卡洛克-皮茨：神经元＝阈值逻辑门<\/td><td>连接主义<\/td><\/tr><tr><td>1948<\/td><td>图灵 NPL 报告《智能机器》；维纳《控制论》<\/td><td>前史<\/td><\/tr><tr><td>1950<\/td><td>图灵《计算机与智能》，模仿游戏<\/td><td>前史<\/td><\/tr><tr><td>1951<\/td><td>斯特雷奇跳棋程序<\/td><td>博弈<\/td><\/tr><tr><td>1954<\/td><td>戴维斯定理证明程序（JOHNNIAC）<\/td><td>符号<\/td><\/tr><tr><td>1954<\/td><td>乔治敦-IBM 机器翻译（6 条规则、250 词）<\/td><td>NLP<\/td><\/tr><tr><td>1955<\/td><td>洛杉矶学习机讨论会<\/td><td>前史<\/td><\/tr><tr><td>1956<\/td><td>达特茅斯会议，&quot;人工智能&quot;一词通行<\/td><td>建制<\/td><\/tr><tr><td>1956<\/td><td>塞缪尔自学习跳棋程序<\/td><td>机器学习<\/td><\/tr><tr><td>1958<\/td><td>罗森布拉特感知机<\/td><td>连接主义<\/td><\/tr><tr><td>1965<\/td><td>鲁滨逊归结原理<\/td><td>符号<\/td><\/tr><tr><td>1966<\/td><td>ALPAC 报告叫停机器翻译<\/td><td>NLP<\/td><\/tr><tr><td>1969<\/td><td>明斯基与帕波特《感知机》<\/td><td>连接主义<\/td><\/tr><tr><td>1972<\/td><td>德雷弗斯《计算机不能做什么》<\/td><td>哲学<\/td><\/tr><tr><td>1975<\/td><td>霍兰德《自然与人工系统中的适应》<\/td><td>进化计算<\/td><\/tr><tr><td>1980<\/td><td>塞尔中文屋<\/td><td>哲学<\/td><\/tr><tr><td>1981<\/td><td>日本第五代计算机计划启动<\/td><td>硬件<\/td><\/tr><tr><td>1982<\/td><td>Hopfield 网络<\/td><td>连接主义<\/td><\/tr><tr><td>1986<\/td><td>反向传播论文（《自然》）<\/td><td>连接主义<\/td><\/tr><tr><td>1989<\/td><td>Watkins Q 学习<\/td><td>强化学习<\/td><\/tr><tr><td>1992<\/td><td>第五代计划结束<\/td><td>硬件<\/td><\/tr><tr><td>1997<\/td><td>深蓝胜卡斯帕罗夫<\/td><td>博弈<\/td><\/tr><tr><td>2006<\/td><td>逐层预训练（深度信念网络）<\/td><td>连接主义<\/td><\/tr><tr><td>2012<\/td><td>AlexNet；谷歌知识图谱<\/td><td>连接主义<\/td><\/tr><tr><td>2015<\/td><td>DQN<\/td><td>强化学习<\/td><\/tr><tr><td>2016<\/td><td>AlphaGo 胜李世石 4:1<\/td><td>博弈<\/td><\/tr><tr><td>2017<\/td><td>AlphaGo Zero；Transformer；Libratus<\/td><td>多线<\/td><\/tr><tr><td>2022<\/td><td>ChatGPT<\/td><td>大模型<\/td><\/tr><tr><td>2023<\/td><td>乔姆斯基《ChatGPT 的虚假承诺》<\/td><td>哲学<\/td><\/tr><\/tbody><\/table>\n<h2>方法与人物对照<\/h2>\n<table><thead><tr><th>问题<\/th><th>方法<\/th><th>代表人物<\/th><\/tr><\/thead><tbody><tr><td>定理怎么自动证明<\/td><td>归结原理、SAT/SMT<\/td><td>戴维斯、鲁滨逊<\/td><\/tr><tr><td>专家知识怎么用<\/td><td>规则库 + 推理机<\/td><td>费根鲍姆、 Buchanan<\/td><\/tr><tr><td>知识怎么组织<\/td><td>三元组、知识图谱<\/td><td>谷歌、Berners-Lee<\/td><\/tr><tr><td>神经网络怎么训<\/td><td>反向传播 + 梯度下降<\/td><td>鲁梅哈特、辛顿、威廉姆斯<\/td><\/tr><tr><td>搜索空间太大怎么办<\/td><td>剪枝、启发、学习引导<\/td><td>深蓝团队、DeepMind<\/td><\/tr><tr><td>只有分数怎么学<\/td><td>贝尔曼方程、Q 学习、策略梯度<\/td><td>萨顿、巴托<\/td><\/tr><tr><td>语言怎么处理<\/td><td>规则 → 统计 → 预训练<\/td><td>乔姆斯基、曼宁<\/td><\/tr><\/tbody><\/table>\n<h2>关键数字<\/h2>\n<table><thead><tr><th>数字<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>6 条规则、250 词<\/td><td>1954 乔治敦机器翻译系统的规模<\/td><\/tr><tr><td><code>O(b^d)<\/code><\/td><td>搜索树节点数<\/td><\/tr><tr><td>2 亿局面/秒<\/td><td>深蓝的评估速度<\/td><\/tr><tr><td>b≈250<\/td><td>围棋的分支因子<\/td><\/tr><tr><td>4.5 亿美元<\/td><td>第五代计算机计划投入（约）<\/td><\/tr><tr><td>860 亿 / 160 亿<\/td><td>人脑总神经元 / 皮层神经元<\/td><\/tr><tr><td>2570 亿 / 56 亿<\/td><td>大象总神经元 / 皮层神经元<\/td><\/tr><tr><td>25%<\/td><td>人脑占身体能量消耗的比例<\/td><\/tr><\/tbody><\/table>\n<h2>一句话对照<\/h2>\n<table><thead><tr><th>容易混<\/th><th>区别<\/th><\/tr><\/thead><tbody><tr><td>图灵测试 vs 中文屋<\/td><td>外部行为 vs 内部理解<\/td><\/tr><tr><td>强人工智能 vs 弱人工智能<\/td><td>真有理解 vs 模拟智能行为<\/td><\/tr><tr><td>完全信息 vs 不完美信息<\/td><td>局面全可见 vs 存在隐藏信息<\/td><\/tr><tr><td>符号派 vs 统计派<\/td><td>人写规则 vs 数据拟合<\/td><\/tr><tr><td>深度学习 vs 机器学习<\/td><td>子集关系，深度指多层网络<\/td><\/tr><tr><td>演示成功 vs 系统可用<\/td><td>为例子调参 vs 能泛化<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38451880427759874/AI点化学习系统/02-人工智能简史", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：缘起——从图灵到 1956 年达特茅斯会议", "href": "#/chapter/ch01"}, {"label": "第 2 章：自动定理证明的兴衰", "href": "#/chapter/ch02"}, {"label": "第 3 章：专家系统、知识图谱与第五代计算机", "href": "#/chapter/ch03"}, {"label": "第 4 章：神经网络的三起三落", "href": "#/chapter/ch04"}, {"label": "第 5 章：向自然学习——遗传算法与强化学习", "href": "#/chapter/ch05"}, {"label": "第 6 章：下棋——人工智能的试金石", "href": "#/chapter/ch06"}, {"label": "第 7 章：自然语言处理——从规则到统计", "href": "#/chapter/ch07"}, {"label": "第 8 章：语言等于思维吗", "href": "#/chapter/ch08"}, {"label": "第 9 章：人是机器吗——计算的理论边界", "href": "#/chapter/ch09"}, {"label": "第 10 章：大语言模型——“学习”到底是什么", "href": "#/chapter/ch10"}, {"label": "第 11 章：哲学质疑、教科书变迁与智能的进化", "href": "#/chapter/ch11"}]}, {"label": "概念", "children": [{"label": "图灵测试与中文屋", "href": "#/concept/c01"}, {"label": "符号主义与连接主义", "href": "#/concept/c02"}, {"label": "专家系统与知识获取瓶颈", "href": "#/concept/c03"}, {"label": "组合爆炸", "href": "#/concept/c04"}, {"label": "感知机与线性不可分", "href": "#/concept/c05"}, {"label": "反向传播与梯度消失", "href": "#/concept/c06"}, {"label": "强化学习与信用分配", "href": "#/concept/c07"}, {"label": "压缩即学习", "href": "#/concept/c08"}, {"label": "摩尔定律与专用硬件", "href": "#/concept/c09"}, {"label": "具身智能", "href": "#/concept/c10"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：缘起——从图灵到 1956 年达特茅斯会议", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：自动定理证明的兴衰", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：专家系统、知识图谱与第五代计算机", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：神经网络的三起三落", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：向自然学习——遗传算法与强化学习", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：下棋——人工智能的试金石", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：自然语言处理——从规则到统计", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：语言等于思维吗", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章：人是机器吗——计算的理论边界", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章：大语言模型——“学习”到底是什么", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章：哲学质疑、教科书变迁与智能的进化", "href": "#/quiz/ch11"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：缘起——从图灵到 1956 年达特茅斯会议<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：无\n<\/li><li>\n<strong>对应原书<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 1956 年达特茅斯会议到底&quot;发明&quot;了什么，没发明什么。\n<\/li><li>\n举出会议之前已经完成的三件事，说明这门学科不是凭空开始的。\n<\/li><li>\n说出图灵 1950 年文章的贡献，以及它和 1948 年那份内部报告的区别。\n<\/li><li>\n解释&quot;符号派&quot;与&quot;神经网络派&quot;的分裂从哪一天开始。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>1956 年那场会议没有发明智能，它发明的是<strong>一个名字和一套共同体<\/strong>：把原本散在逻辑学、控制论、心理学、神经生理学里的人聚到一起，让&quot;用机器模拟智能&quot;变成一门可以申请经费、可以招学生、可以开会的学科。<\/p>\n<h2>零基础讲解<\/h2>\n<blockquote>原书开篇引了莎士比亚的一句：What is past is prologue，过去只是序幕。这句话是本章的基调——达特茅斯会议是序幕之后的第一幕，不是第一声锣。<\/blockquote>\n<h3>概念 1：前史——1955 年那场&quot;会中会&quot;（难度：基础）<\/h3>\n<p>1955 年，美国西部计算机联合大会在洛杉矶召开，会中套了一个&quot;学习机讨论会&quot;。两位关键参加者后来都去了达特茅斯：塞弗里奇（Oliver Selfridge）讲模式识别，纽厄尔（Allen Newell）讲计算机下棋。<\/p>\n<p>主持人皮茨（Walter Pitts，神经网络的奠基者之一）当场做了总结：一派人试图模拟神经系统，纽厄尔则试图模拟心智，&quot;但殊途同归&quot;。<\/p>\n<p>这句总结值钱的地方在于，它把此后几十年最主要的矛盾提前说了出来：<strong>模拟大脑的硬件结构，还是模拟思维的符号过程<\/strong>。两派都认为自己才是&quot;真正的人工智能&quot;。<\/p>\n<h3>概念 2：六个关键人物（难度：基础）<\/h3>\n<table><thead><tr><th>人物<\/th><th>当时的身份<\/th><th>后来<\/th><\/tr><\/thead><tbody><tr><td>麦卡锡（John McCarthy）<\/td><td>达特茅斯数学系助理教授，会议召集人<\/td><td>发明 LISP，提出&quot;人工智能&quot;一词<\/td><\/tr><tr><td>明斯基（Marvin Minsky）<\/td><td>普林斯顿数学博士，与麦卡锡读书时相熟<\/td><td>麻省理工人工智能实验室创始人，写《感知机》<\/td><\/tr><tr><td>香农（Claude Shannon）<\/td><td>贝尔实验室，信息论之父<\/td><td>为会议提供学术声望与经费支持<\/td><\/tr><tr><td>罗切斯特（Nathaniel Rochester）<\/td><td>IBM 第一代通用计算机 701 的主设计师<\/td><td>提供 IBM 的算力与背书<\/td><\/tr><tr><td>纽厄尔（Allen Newell）<\/td><td>兰德公司研究员<\/td><td>与西蒙合作&quot;逻辑理论家&quot;，1975 年图灵奖<\/td><\/tr><tr><td>西蒙（Herbert Simon）<\/td><td>卡内基理工学院的博导级人物<\/td><td>1975 年图灵奖、1978 年诺贝尔经济学奖<\/td><\/tr><\/tbody><\/table>\n<p>一个值得注意的细节：麦卡锡的博士导师是拓扑学家莱夫谢茨，他的博士论文不是逻辑；但他后半生都在用数理逻辑把常识形式化。明斯基的博士论文也不是逻辑，却写了一本很有影响力的计算理论教材。这两个人后来主导了符号派，但他们的学术出身并不是逻辑学。<\/p>\n<h3>概念 3：会议提案里那句关键的话（难度：基础）<\/h3>\n<p>1955 年，四位学者联名提交了《达特茅斯夏季人工智能研究项目提案》，第一次在正式文件里使用 &quot;artificial intelligence&quot; 这个词。提案的核心猜想是：<strong>学习的每一个方面，或者智能的任何其他特征，原则上都可以被精确描述，以至于可以造一台机器来模拟它<\/strong>。<\/p>\n<p>这句话是整门学科的&quot;立项理由&quot;。它包含一个很强的假设：智能可以被形式化。后面几十年的争论，本质上都是在这句话上打补丁或者拆台。<\/p>\n<h3>概念 4：图灵的两份文本（难度：进阶）<\/h3>\n<p>一般认为学科的源头是图灵 1950 年发表在《心》（Mind）杂志上的《计算机与智能》。这篇文章提出了后来被称为&quot;图灵测试&quot;的模仿游戏：如果一个人通过文字对话分不出对面是人还是机器，就可以说机器具有智能。<\/p>\n<p>但书里补了一个更早的文本：1948 年，图灵在英国国家物理实验室（NPL）写过一份内部报告《智能机器》，里面区分了&quot;肉体智能&quot;（embodied intelligence）和&quot;无肉体智能&quot;（disembodied intelligence）。机器人学家布鲁克斯认为这份报告比 1950 年那篇更重要，因为它预示了后来符号派与统计派之争——<strong>智能到底要不要有身体<\/strong>。<\/p>\n<blockquote>类比：1950 年那篇像&quot;产品说明书&quot;，告诉你什么样的机器算合格；1948 年那份像&quot;设计草图&quot;，里面有好几条互相冲突的技术路线，但还没定稿。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：图灵测试只测&quot;行为上能否骗过人&quot;，不测&quot;内部是否真的理解&quot;。这个区分后来成了塞尔&quot;中文屋&quot;论证的靶子（见第 11 章）。<\/blockquote>\n<h3>概念 5：为什么说它是&quot;学科的起点&quot;而不是&quot;概念的起点&quot;（难度：进阶）<\/h3>\n<p>书里反复强调一件事：达特茅斯会议之前，机器翻译、定理证明、下棋、模式识别都已经有人在做。1954 年乔治敦-IBM 实验已经把几十个俄文句子翻成英文（见第 7 章）；1954 年戴维斯已经写出第一个可运行的定理证明程序（见第 2 章）；1951 年斯特雷奇已经写了跳棋程序（见第 6 章）。<\/p>\n<p>所以会议真正的作用是&quot;命名 + 组织&quot;：给它一个名字，让分散的研究者意识到彼此在做同一件事，从此有了共同的语言、会议、期刊和评价标准。<\/p>\n<blockquote>原书用了一个很妙的说法：一门学科就是&quot;学科共同体共同关注的东西&quot;。这是从实用主义角度给的定义，比从内涵上下定义更管用。<\/blockquote>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[1936 图灵机] --&gt; D[1943 麦卡洛克与皮茨]\n    B[1948 NPL 智能机器报告] --&gt; E[1950 计算机与智能]\n    D --&gt; E\n    E --&gt; F[1955 学习机讨论会]\n    G[1954 定理证明程序] --&gt; F\n    H[1951 跳棋程序] --&gt; F\n    I[1954 乔治敦机器翻译] --&gt; F\n    F --&gt; J[1956 达特茅斯会议]\n    J --&gt; K[符号派 逻辑与搜索]\n    J --&gt; L[连接派 神经网络]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图要看的不是时间顺序，而是&quot;多条线汇到一个点，再分叉&quot;。汇入点之前，各路工作彼此不知道对方存在；分叉之后，两派开始争夺&quot;什么才算人工智能&quot;的定义权。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：达特茅斯会议像一次行业标准的发布会。在它之前，各家都在自己做零件，接口不一样；会议之后，大家至少同意&quot;我们做的是同一类东西&quot;，于是可以互相比较、互相批评、互相引用。<\/p>\n<p>失效边界：标准发布会能统一名字，不能统一方法。名字统一了，路线反而打得更凶——这正是后面几章的主题。<\/p>\n<p><strong>实例<\/strong>（名称的传播）：书里提到一个常被忽略的点：达特茅斯会议更多是&quot;人工智能&quot;这个词流行的源头，而不是学科的绝对起点。乔治敦-IBM 实验早于会议，就是证据之一。所以看到&quot;1956 年是人工智能元年&quot;这种说法，要理解它是&quot;命名元年&quot;，不是&quot;第一行代码之年&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 1956 年之前没人想过机器智能。<\/strong> 图灵 1936 年就在定义&quot;可计算&quot;，1943 年麦卡洛克和皮茨就画出了神经元的逻辑模型。\n<\/li><li>\n<strong>别以为达特茅斯会议提出了统一的方法论。<\/strong> 它提出的是一批松散的猜想，参会者各干各的，会后很快分成符号和连接两条路。\n<\/li><li>\n<strong>别以为图灵测试是图灵最看重的东西。<\/strong> 他在 1948 年的报告里讨论的&quot;肉体智能&quot;才是他更关心的方向，与后来机器人学、具身智能一脉相承。\n<\/li><li>\n<strong>别以为&quot;人工智能&quot;这个词是麦卡锡随手起的。<\/strong> 他刻意避开了&quot;控制论&quot;（cybernetics）这个词，因为不想让维纳的框架笼罩整个领域。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>单选<\/strong>：达特茅斯会议最准确的定位是？\n<ul>\n<li>\nA. 第一台智能机器诞生\n<\/li><li>\nB. 人工智能这个名称与学术共同体形成的标志\n<\/li><li>\nC. 神经网络被发明的年份\n<\/li><li>\nD. 图灵测试提出的年份\n<p><strong>答案<\/strong>：B。解析：会议命名并组织了领域；图灵测试是 1950 年，神经网络模型是 1943 年。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>填空<\/strong>：1955 年学习机讨论会上，主持人皮茨总结说，一派试图模拟________，另一派试图模拟________。\n<p><strong>答案<\/strong>：神经系统；心智。<\/p>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么说 1948 年图灵的 NPL 报告比 1950 年那篇文章更能预示后来的路线之争？\n<p><strong>答案<\/strong>：它区分了&quot;肉体智能&quot;与&quot;无肉体智能&quot;，即智能是否需要身体与感知。这正对应后来符号派（纯符号推理）与具身/连接派（靠感知与行动）的分歧。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：达特茅斯会议之前已经存在的工作有：\n<ul>\n<li>\nA. 可运行的定理证明程序\n<\/li><li>\nB. 跳棋程序\n<\/li><li>\nC. 乔治敦-IBM 机器翻译实验\n<\/li><li>\nD. 反向传播算法\n<p><strong>答案<\/strong>：A、B、C。解析：反向传播在 1980 年代才被系统推广。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n1956 年达特茅斯会议＝命名 + 建共同体，不是技术起点。\n<\/li><li>\n会议提案的核心假设：智能可以被精确描述并模拟。\n<\/li><li>\n图灵：1936 定义可计算，1948 分肉体/无肉体智能，1950 提模仿游戏。\n<\/li><li>\n两派分裂从 1955 年那场会中会就已经摆上台面。\n<\/ul>", "ch02": "<h1>第 2 章：自动定理证明的兴衰<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清逻辑主义、形式主义、直觉主义三派的差别，以及它们和机器证明的关系。\n<\/li><li>\n说出&quot;逻辑理论家&quot;和戴维斯程序谁先谁后，以及为什么在后世的叙述里前者更有名。\n<\/li><li>\n用一句话解释归结原理在做什么。\n<\/li><li>\n说清定理证明为什么在 1970 年代衰落，又在 2000 年代以什么形式回来。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>自动定理证明是符号派的技术地基：如果&quot;证明&quot;能被机械化，那么&quot;推理&quot;就能被机械化；它衰落不是因为逻辑错了，而是因为<strong>组合爆炸<\/strong>——逻辑上可行，算力上不可行。<\/p>\n<h2>零基础讲解<\/h2>\n<blockquote>原书这一章开篇引用约翰逊：&quot;就像机器能省体力一样，符号演算能省脑力。演算越完美，付出的脑力就越少。&quot;<\/blockquote>\n<h3>概念 1：三派数学哲学（难度：基础）<\/h3>\n<table><thead><tr><th>派别<\/th><th>代表<\/th><th>主张<\/th><th>对机器证明的意义<\/th><\/tr><\/thead><tbody><tr><td>逻辑主义<\/td><td>罗素<\/td><td>数学可以归约到逻辑<\/td><td>把数学问题变成逻辑问题，逻辑能机械算<\/td><\/tr><tr><td>形式主义<\/td><td>希尔伯特<\/td><td>数学是把一串符号变成另一串符号<\/td><td>只要设计出统一算法，所有数学问题都能解<\/td><\/tr><tr><td>直觉主义<\/td><td>布劳威尔<\/td><td>数学是心智构造，排中律不能随便用<\/td><td>拒绝&quot;非真即假&quot;的机械判定<\/td><\/tr><\/tbody><\/table>\n<p>希尔伯特那个&quot;大一统算法&quot;的梦想，被哥德尔 1931 年的不完备定理击碎：任何足够强的一致系统里，都存在既不能证明也不能证伪的命题。但机器定理证明没有因此消亡——它换了个更谦虚的目标：<strong>在能证明的问题上，把证明找出来<\/strong>。<\/p>\n<h3>概念 2：符号的来历（难度：基础）<\/h3>\n<p>日常写的 <code>∀<\/code>（对所有）和 <code>∃<\/code>（存在）不是自古就有的。书里给了一条清楚的谱系：<\/p>\n<ul><li>\n亚里士多德：三段论，最早的推理形式化。\n<\/li><li>\n弗雷格、罗素：现代逻辑的奠基，用函数表示谓词。\n<\/li><li>\n皮亚诺、约翰逊：用 <code>(x)<\/code> 表示全称，<code>∃x<\/code> 表示存在。\n<\/li><li>\n根岑（Gerhard Gentzen）1935 年：取 All 的首字母倒过来造成 <code>∀<\/code>，取 Exist 的首字母反写造成 <code>∃<\/code>。\n<\/ul>\n<p>根岑是证明论的奠基者之一，也是希尔伯特的逻辑助手。他的身世很曲折：纳粹冲锋队早期成员，战时参与 V-2 导弹研发，1945 年饿死在布拉格的战俘营。这类细节在书里很多，读的时候可以当人物志看，但技术上只需要记住：<strong>证明论给了&quot;证明&quot;一个可以操作的定义<\/strong>。<\/p>\n<h3>概念 3：谁写出了第一个程序（难度：基础）<\/h3>\n<p>这里有个常见的叙述偏差。<\/p>\n<ul><li>\n纽厄尔和西蒙的&quot;逻辑理论家&quot;（Logic Theorist）在人工智能圈子里开风气之先，它证明了《数学原理》里的若干定理。他们给罗素写信，罗素回信说：&quot;我相信演绎逻辑里的所有事，机器都能干。&quot;\n<\/li><li>\n但<strong>第一个可运行的定理证明程序<\/strong>是逻辑学家戴维斯（Martin Davis）1954 年做的，跑在普林斯顿高等研究院那台以冯诺依曼昵称命名的电子管计算机 JOHNNIAC 上。文章迟至 1957 年才发表。\n<\/ul>\n<p>为什么后人记住的是&quot;逻辑理论家&quot;？因为它被当成了&quot;机器能做人以为只有人才能做的事&quot;的标志性事件，叙事价值大于技术首创。<\/p>\n<blockquote>类比：第一个做出电灯的人不一定是最有名的那个；爱迪生赢在系统化、商业化和叙事。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：这个类比不是说&quot;逻辑理论家&quot;没技术含量，它的启发式搜索思想后来影响很大；只是提醒&quot;第一&quot;这个头衔要看定义。<\/blockquote>\n<h3>概念 4：归结原理——把证明变成机械消去（难度：进阶）<\/h3>\n<p>1965 年，鲁滨逊（John Alan Robinson）提出<strong>归结原理<\/strong>：把所有的公式化成子句形式（一堆文字的析取），然后反复做一件事——如果两个子句里有互补的文字（一个 <code>P<\/code>、一个 <code>¬P<\/code>），就把它们消掉，剩下的部分合并成新子句。推到出现空子句，就说明矛盾，反证成立。<\/p>\n<p>它的价值在于：<strong>只用一条规则<\/strong>，就能完成一阶逻辑的全部推理。这比&quot;人设计一堆推理规则&quot;优雅得多，也让程序实现变得简单——一个循环加匹配就够了。<\/p>\n<p>代价是<strong>组合爆炸<\/strong>：每一步都可能产生大量新子句，子句数量指数增长。所以后来的研究都在&quot;怎么少生成无用子句&quot;上做文章：设置文字顺序、支持集策略、单元优先等等。<\/p>\n<h3>概念 5：为什么衰落，又怎么回来（难度：进阶）<\/h3>\n<p>1970 年代之后，定理证明在人工智能里逐渐边缘化，原因有三个：<\/p>\n<ol><li>\n<strong>算力不够<\/strong>：组合爆炸让中等难度的定理都跑不动。\n<\/li><li>\n<strong>知识不够<\/strong>：很多证明需要领域知识（比如数学归纳法该用在哪一步），纯逻辑搜索找不到。\n<\/li><li>\n<strong>目标转移<\/strong>：专家系统证明了&quot;把知识直接喂给程序&quot;比&quot;让程序自己推&quot;更划算。\n<\/ol>\n<p>但它没有死，而是换了名字和场景回来了：<\/p>\n<ul><li>\n<strong>SAT/SMT 求解器<\/strong>：把问题编码成布尔可满足性或带理论的判定问题，工业界用它做芯片验证、软件漏洞检测、调度排程。今天的 SMT 求解器能处理几十万变量的工业实例。\n<\/li><li>\n<strong>交互式定理证明<\/strong>：Coq、Isabelle、Lean。人给大方向，机器检查每一步。2013 年 Gonthier 团队用 Coq 完成了四色定理的形式化验证；Lean 社区正在形式化整个数学基础。\n<\/li><li>\n<strong>数学竞赛<\/strong>：把形式化证明和搜索结合，让机器在有限时间内找证明。\n<\/ul>\n<blockquote>原书对这段历史的评价很克制：定理证明的衰落不是&quot;逻辑不行了&quot;，而是&quot;当年想要的通用推理太贵了&quot;。今天的复兴，是把目标从&quot;通用&quot;降到&quot;特定领域 + 强约束&quot;，代价小了，就能跑起来。<\/blockquote>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[数学哲学三派] --&gt; B[形式化 可机械检验]\n    B --&gt; C[1954 戴维斯 JOHNNIAC]\n    B --&gt; D[1956 逻辑理论家]\n    C --&gt; E[1965 归结原理]\n    D --&gt; E\n    E --&gt; F[组合爆炸 子句数量指数增长]\n    F --&gt; G[1970s 边缘化]\n    G --&gt; H[SAT SMT 工业求解]\n    G --&gt; I[Coq Lean 交互式证明]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从&quot;哲学上的形式化&quot;到&quot;程序上的消去规则&quot;，中间只隔了一步；但从&quot;规则&quot;到&quot;能跑&quot;隔了一座算力的山。看这张图要抓住中间那个瓶颈节点——它解释了一切兴衰。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：归结原理像一台只会做减法的机器。你给它两个式子，它把能抵消的部分抵消掉，剩下的吐出来；一直减到空，就证明完了。它不需要会加法、乘法、除法——只要这一种操作，就够表达所有推理。<\/p>\n<p>失效边界：只会一种操作意味着&quot;路径很长&quot;。人做证明会跳步、会用直觉、会类比，机器只能一步一步消，所以步数爆炸。<\/p>\n<p><strong>实例<\/strong>（子句消去）：前提是 <code>P ∨ Q<\/code> 和 <code>¬P ∨ R<\/code>。<\/p>\n<ul><li>\n两个子句里有互补的 <code>P<\/code> 和 <code>¬P<\/code>\n<\/li><li>\n归结得到 <code>Q ∨ R<\/code>\n<\/ul>\n<p>这就是一步。如果还能和 <code>¬Q<\/code> 归结，得到 <code>R<\/code>；再和 <code>¬R<\/code> 归结，得到空子句，矛盾成立，原命题得证。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为哥德尔定理&quot;杀死了&quot;机器证明。<\/strong> 不完备性说明有些命题证不出来，但没说&quot;能证的证不出来&quot;。机器证明的目标本来就限定在可证的部分。\n<\/li><li>\n<strong>别以为&quot;逻辑理论家&quot;是第一个程序。<\/strong> 第一个可运行的是戴维斯的程序，早两年。\n<\/li><li>\n<strong>别以为定理证明已经死了。<\/strong> 它变成了 SMT 求解器和形式化验证，藏在芯片设计、编译器验证、操作系统内核验证的背后。\n<\/li><li>\n<strong>别以为归结原理只对数学有用。<\/strong> 任何能写成&quot;前提-结论&quot;的问题都能编码，包括法律条款推理、电路等价性检查。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：希尔伯特的形式主义想把数学变成&quot;把一串________变成另一串________&quot;。\n<p><strong>答案<\/strong>：符号；符号。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：第一个可运行的定理证明程序是谁做的？\n<ul>\n<li>\nA. 纽厄尔和西蒙\n<\/li><li>\nB. 戴维斯\n<\/li><li>\nC. 鲁滨逊\n<\/li><li>\nD. 王浩\n<p><strong>答案<\/strong>：B。解析：1954 年在 JOHNNIAC 上运行；&quot;逻辑理论家&quot;名气更大但不是第一。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：归结原理为什么&quot;优雅但低效&quot;？\n<p><strong>答案<\/strong>：优雅在于只用一条消去规则就能完成一阶逻辑推理，实现简单；低效在于每步会产生大量新子句，搜索空间指数增长。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：定理证明在当代以哪些形式存在？\n<ul>\n<li>\nA. SAT/SMT 求解器\n<\/li><li>\nB. Coq、Lean 等交互式证明器\n<\/li><li>\nC. 芯片与软件形式化验证\n<\/li><li>\nD. 图像分类\n<p><strong>答案<\/strong>：A、B、C。解析：图像分类属于统计学习，与定理证明无直接关系。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三派哲学：逻辑主义归约、形式主义符号操作、直觉主义拒排中律。\n<\/li><li>\n第一个程序是戴维斯的，名气和首创不是一回事。\n<\/li><li>\n归结原理：一条规则完成全部推理，代价是组合爆炸。\n<\/li><li>\n衰落因算力与知识，复兴靠 SAT/SMT 与形式化验证。\n<\/ul>", "ch03": "<h1>第 3 章：专家系统、知识图谱与第五代计算机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 2 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 3、4 章合并\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清专家系统的基本结构，以及它为什么在 1980 年代能卖钱。\n<\/li><li>\n说出&quot;知识获取瓶颈&quot;是什么，并解释它为什么难以绕过。\n<\/li><li>\n解释第五代计算机计划的赌注押在哪，为什么输了。\n<\/li><li>\n说清知识图谱与专家系统的承继关系：换了存储形式，没换问题本质。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这三件事是同一条思路的三个阶段：把专家的知识抽出来写成显式规则，让机器照着推。专家系统是它的小型化，第五代计算机是想把它塞进硬件，知识图谱是把它改成网络并放大到全网规模。<\/p>\n<h2>零基础讲解<\/h2>\n<blockquote>原书这一章讲费根鲍姆时用了一个词：&quot;知识就是力量&quot;。他的主张是：通用推理机没有用，真正的智能来自领域知识。<\/blockquote>\n<h3>概念 1：专家系统是怎么搭起来的（难度：基础）<\/h3>\n<p>一个典型专家系统有三个部件：<\/p>\n<table><thead><tr><th>部件<\/th><th>作用<\/th><th>类比<\/th><\/tr><\/thead><tbody><tr><td>知识库<\/td><td>一堆&quot;如果…那么…&quot;的规则<\/td><td>老医生的经验笔记<\/td><\/tr><tr><td>推理机<\/td><td>拿事实去匹配规则，推出新结论<\/td><td>一个只会照笔记查的实习生<\/td><\/tr><tr><td>解释器<\/td><td>说明&quot;为什么得出这个结论&quot;<\/td><td>实习生把引用过的笔记页码报给你<\/td><\/tr><\/tbody><\/table>\n<p>关键差别在这里：<strong>通用问题求解程序什么都不懂，专家系统什么都懂一点但只懂一个领域<\/strong>。<\/p>\n<p>书里讲的第一个成功例子是斯坦福的 DENDRAL。它是费根鲍姆、遗传学家莱德伯格（Joshua Lederberg，1958 年诺贝尔生理学或医学奖）、化学家翟若适（Carl Djerassi，口服避孕药的主要发明者）合作做出来的，任务是根据质谱数据推断有机分子的结构。这个任务有明确的判定标准——分子结构可以被实验验证，错了立刻知道。<\/p>\n<h3>概念 2：MYCIN 与&quot;专家级表现&quot;（难度：基础）<\/h3>\n<p>1970 年代斯坦福做的 MYCIN 是更著名的一个：诊断血液感染并推荐抗生素。它大约有 450 条规则，在测试中的表现被认为达到了专家水平。<\/p>\n<p>但它从没在临床上真正用起来。原因不是准确率，而是：<\/p>\n<ul><li>\n当时的机器太贵，医院没有终端；\n<\/li><li>\n医生不信任一个不能解释清楚的黑箱（MYCIN 的解释器能说明规则链，但链条太长时人看不懂）；\n<\/li><li>\n责任归属不清——机器开错药谁负责。\n<\/ul>\n<p>这三点今天依然成立。<strong>这是本章最有现实价值的一段<\/strong>：技术指标过关不等于产品能用。<\/p>\n<h3>概念 3：知识获取瓶颈（难度：进阶）<\/h3>\n<p>专家系统最贵的一步不是写代码，是&quot;把专家的知识问出来&quot;。书里把这个障碍叫<strong>知识获取瓶颈<\/strong>，它有三个层次：<\/p>\n<ol><li>\n<strong>专家说不出<\/strong>：很多判断是模式识别式的直觉，他自己也讲不清依据。\n<\/li><li>\n<strong>专家说的不准<\/strong>：人对自己决策的解释常常是事后编的，与真实依据不一致。\n<\/li><li>\n<strong>规则会冲突<\/strong>：不同专家给的规则互相矛盾，需要仲裁机制。\n<\/ol>\n<p>于是出现了一个行业：知识工程师。他们的工作是坐在专家旁边，一遍遍问&quot;这种情况你会怎么处理&quot;&quot;为什么&quot;，然后把回答翻译成规则。这个过程慢、贵、不可复用。<\/p>\n<blockquote>类比：知识获取像给一位老师傅录口述史。他干了一辈子，但你问&quot;你怎么知道这个零件该换了&quot;，他只能说&quot;听声音不对&quot;。你得自己把&quot;声音不对&quot;拆成频率、振幅、时长。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：有些领域的知识确实是可形式化的（配置、诊断、税务），有些不是（写作、谈判、诊断罕见病）。瓶颈的严重程度取决于领域。<\/blockquote>\n<h3>概念 4：第五代计算机——一次押错方向的豪赌（难度：进阶）<\/h3>\n<p>1981 年，日本通产省启动&quot;第五代计算机&quot;计划。背景是 1978 年委托元冈达做的调研，1981 年发布了一份 89 页的报告，提出 6 种并行体系结构方案。主导者是渕一博，执行机构是 ICOT。<\/p>\n<p>赌注的核心有两个：<strong>并行逻辑推理硬件 + Prolog 作为核心语言<\/strong>。逻辑是：如果智能等于推理，那么把推理做得又快又便宜，智能就自然来了。整个计划投入约 4.5 亿美元，1992 年结束，没有产出可商用的成果。<\/p>\n<p>失败的原因可以拆成三层：<\/p>\n<ul><li>\n<strong>技术层<\/strong>：专用逻辑推理机打不过通用微处理器。摩尔定律让&quot;专门为推理造的芯片&quot;在几年内就落后于便宜得多的通用 CPU。\n<\/li><li>\n<strong>方法论层<\/strong>：把智能等同于逻辑推理，忽略了感知、学习、不确定性。\n<\/li><li>\n<strong>组织层<\/strong>：全国一盘棋的集中研发，缺乏市场竞争的反馈回路。\n<\/ul>\n<p>同一时期，美国走了另一条路：不造专用硬件，让 AI 跑在通用工作站上（Symbolics、LMI 这些 Lisp 机后来也死于此）。教训是一样的：<strong>不要在通用算力快速进步的年代押注专用架构<\/strong>。<\/p>\n<h3>概念 5：知识图谱——把规则换成三元组（难度：进阶）<\/h3>\n<p>专家系统的规则库有个致命缺陷：只能处理预先想到的情况，加一条新知识可能和旧规则冲突，规模一大就维护不动。<\/p>\n<p>知识图谱换了表示方式：用（头实体，关系，尾实体）这样的<strong>三元组<\/strong>存事实，比如（吴飞，任职于，浙江大学）。一堆三元组连起来就是一张网。查询变成&quot;沿边找路径&quot;，扩展变成&quot;加新的三元组&quot;，不冲突。<\/p>\n<p>这条线索的谱系是：<\/p>\n<ul><li>\n语义网（Tim Berners-Lee 2001 年提出）：给网页加机器可读的语义标注。\n<\/li><li>\n谷歌 2012 年提出 Knowledge Graph，把搜索结果从&quot;字符串匹配&quot;变成&quot;实体理解&quot;。\n<\/li><li>\n学术界：Freebase、DBpedia、Wikidata、YAGO；中文有 CN-DBpedia、OwnThink。\n<\/li><li>\n推理方法：路径排序（把关系路径当特征，学习哪条路径更可信）、FOIL（归纳规则）、以及后来的表示学习（TransE 把实体和关系嵌入向量空间，让&quot;头 + 关系 ≈ 尾&quot;）。\n<\/ul>\n<blockquote>注意一个容易误解的点：知识图谱没有解决知识获取瓶颈，它只是把成本从&quot;写规则&quot;转成&quot;抽三元组 + 对齐实体&quot;。信息抽取的准确率、实体消歧、schema 设计，仍然是硬骨头。<\/blockquote>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[专家经验] --&gt; B[知识工程师访谈]\n    B --&gt; C[规则库 if then]\n    C --&gt; D[推理机 前向 后向链]\n    D --&gt; E[专家系统 MYCIN XCON]\n    E --&gt; F[知识获取瓶颈 维护困难]\n    F --&gt; G[换表示 三元组]\n    G --&gt; H[知识图谱 语义网]\n    H --&gt; I[表示学习 TransE]\n    J[第五代机 逻辑推理硬件] -.押错方向.-&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是&quot;人把知识搬进机器&quot;，右边是&quot;机器把知识连成网&quot;。中间的断点标注了两个失败点：知识获取太贵、专用硬件打不过通用芯片。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：专家系统像一本装订好的操作手册 + 一个严格照手册执行的实习生；知识图谱像维基百科的链接网络 + 一个会顺着链接找答案的搜索者。前者精确但僵，后者灵活但可能不准。<\/p>\n<p>失效边界：手册能覆盖的场景有限，一旦遇到手册没写的情况就卡住；网络能覆盖的场景多，但&quot;顺着链接找到的答案&quot;未必有推理保证。<\/p>\n<p><strong>实例<\/strong>（规则链）：一条简化版的感染诊断规则链：<\/p>\n<pre><code>R1: IF 病人有发热 AND 白细胞升高 THEN 可能存在细菌感染\nR2: IF 可能存在细菌感染 AND 培养结果为革兰氏阳性 THEN 考虑链球菌\nR3: IF 考虑链球菌 AND 病人对青霉素不过敏 THEN 推荐青霉素<\/code><\/pre>\n<p>前向链：从已知事实出发，反复匹配规则，推出结论（数据驱动）。后向链：从目标&quot;推荐什么药&quot;出发，倒推需要哪些条件（目标驱动）。前者适合监控告警，后者适合诊断问答。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为专家系统失败是因为算力不够。<\/strong> MYCIN 在 1970 年代的机器上就能跑，问题是责任、信任、部署成本。\n<\/li><li>\n<strong>别以为规则越多越聪明。<\/strong> 规则之间会冲突，规模上千条后维护成本爆炸，这是&quot;知识获取瓶颈&quot;的另一面。\n<\/li><li>\n<strong>别以为知识图谱是新技术。<\/strong> 它继承了语义网和描述逻辑，形式化基础在 1990 年代就成熟了。\n<\/li><li>\n<strong>别以为第五代计算机是纯失败。<\/strong> 它在并行推理、约束逻辑编程上留下了技术遗产，只是没有形成产业。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：专家系统最贵的环节不是编程，而是________，它指的是把专家知识问出来并形式化的困难。\n<p><strong>答案<\/strong>：知识获取。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：第五代计算机计划的核心赌注是？\n<ul>\n<li>\nA. 通用 CPU 加统计学习\n<\/li><li>\nB. 并行逻辑推理硬件加 Prolog\n<\/li><li>\nC. 神经网络加 GPU\n<\/li><li>\nD. 大规模分布式存储\n<p><strong>答案<\/strong>：B。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么第五代计算机在技术上输给了通用微处理器？\n<p><strong>答案<\/strong>：摩尔定律让通用 CPU 性价比快速提升，专用逻辑推理机几年内就落后；同时把智能等同于逻辑推理的方法论假设本身站不住。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：知识图谱相对规则库的优势包括：\n<ul>\n<li>\nA. 加新知识不必担心规则冲突\n<\/li><li>\nB. 天然支持多跳查询\n<\/li><li>\nC. 完全解决了知识获取成本\n<\/li><li>\nD. 便于与实体对齐、跨源融合\n<p><strong>答案<\/strong>：A、B、D。解析：知识获取从&quot;写规则&quot;变成&quot;抽三元组&quot;，成本转移而非消失。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n专家系统三件套：知识库、推理机、解释器。\n<\/li><li>\nMYCIN 准确率够但没落地，卡在信任与责任。\n<\/li><li>\n知识获取瓶颈三层：说不出、说不准、规则冲突。\n<\/li><li>\n第五代机输在&quot;专用硬件 vs 摩尔定律&quot;。\n<\/li><li>\n知识图谱＝三元组网络，换了表示，没换成本问题。\n<\/ul>", "ch04": "<h1>第 4 章：神经网络的三起三落<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 1943 年麦卡洛克-皮茨模型在数学上做了什么，为什么它重要。\n<\/li><li>\n解释 1969 年《感知机》一书的批评到底说了什么，以及它被误读成了什么。\n<\/li><li>\n说出反向传播解决的是什么问题，为什么它没能立刻赢得认可。\n<\/li><li>\n列出三次&quot;寒冬&quot;与三次&quot;复兴&quot;各自的触发条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>神经网络的历史不是&quot;技术逐渐变好&quot;，而是&quot;<strong>每一次复兴都靠一次外部条件变化<\/strong>&quot;：算力、数据、或者一个能解释旧失败的新工具。模型本身的想法，1943 年就基本齐了。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：1943 年的那篇论文做了什么（难度：基础）<\/h3>\n<p>麦卡洛克（Warren McCulloch）和皮茨（Walter Pitts）1943 年发表《神经活动中内在思想的逻辑演算》。他们做的事可以概括成一句：<strong>把一个神经元抽象成一个带阈值的逻辑门<\/strong>。<\/p>\n<p>具体地：一个神经元接收若干输入，每个输入有权重；把所有输入加权求和，超过阈值就输出 1，否则输出 0。这在数学上就是 <code>y = 1[Σ w_i x_i ≥ θ]<\/code>。<\/p>\n<p>这一步的意义不在于&quot;模拟了大脑&quot;，而在于它证明了一件事：<strong>神经活动可以被写成命题逻辑<\/strong>。既然是逻辑，就能用逻辑的方法分析它的能力边界。这才是它进入人工智能史的原因。<\/p>\n<p>书里还记了皮茨的悲剧：他是个天才，十几岁就与罗素通信，后来在麻省理工与维纳合作，晚年酗酒、1956 年后逐渐离开学术界，1969 年去世，年仅 46 岁。<\/p>\n<h3>概念 2：维纳与控制论（难度：基础）<\/h3>\n<p>1948 年维纳（Norbert Wiener）出版《控制论》，把&quot;动物与机器中的通信与控制&quot;统一起来研究。这本书影响极大，以至于 1950 年代很多研究者自称在做&quot;控制论&quot;而不是&quot;人工智能&quot;。<\/p>\n<p>麦卡锡刻意选择了&quot;人工智能&quot;这个词，一部分原因就是要与维纳的框架划清界限。这是学科政治，但它造成了长期后果：<strong>人工智能与认知科学、神经生理学在体制上分家了<\/strong>，两边的评价标准不同，互相看不上。<\/p>\n<h3>概念 3：感知机与它的承诺（难度：基础）<\/h3>\n<p>1958 年，罗森布拉特（Frank Rosenblatt）做出感知机（Perceptron），并造了硬件 Mark I。它的学习规则简单到可以一句话说完：<\/p>\n<blockquote>如果分类正确，不动；如果错了，把权重往正确方向挪一点。<\/blockquote>\n<p>这就是后来所有梯度方法的雏形。当时媒体把它吹成&quot;能走路、说话、看见东西的计算机胚胎&quot;，《纽约时报》1958 年的报道说它将来能&quot;认人、叫出名字&quot;。<\/p>\n<p>罗森布拉特与明斯基当时都在麻省理工附近，两人的关系紧张。这段个人恩怨在后来的历史叙述里被放大，成了&quot;明斯基打压连接主义&quot;的故事。<\/p>\n<h3>概念 4：1969 年那本书到底说了什么（难度：进阶）<\/h3>\n<p>明斯基与西摩·帕波特（Seymour Papert）1969 年出版《感知机》（Perceptrons）。书里有两个结论：<\/p>\n<ol><li>\n<strong>单层感知机只能解决线性可分的问题<\/strong>，连异或（XOR）都做不了。\n<\/li><li>\n<strong>多层感知机的表达能力虽然更强，但他们证明不出它需要多少层、也证明不出它能学到什么<\/strong>——这是一个开放问题，不是否定。\n<\/ol>\n<p>第二条是关键，也是最常被误读的地方。书的原意是&quot;我们证明不了多层网络的能力&quot;，而流传的版本变成了&quot;多层网络没用、这条路死了&quot;。这个误读让神经网络研究在 1970 年代失去了大部分经费。<\/p>\n<p>历史上更准确的描述是：<strong>经费的消失是多重因素<\/strong>——英国方面有James Lighthill 1973 年的报告质疑 AI 的整体进展，美国 DARPA 削减无明确军事目标的基础研究，加上《感知机》给出的理论悲观结论，三件事叠加。<\/p>\n<h3>概念 5：异或为什么做不了（难度：进阶）<\/h3>\n<p>异或的真值表：<\/p>\n<table><thead><tr><th>x1<\/th><th>x2<\/th><th>XOR<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><\/tbody><\/table>\n<p>单层感知机的判定是&quot;加权和过阈值&quot;，几何上是一条直线把平面分成两半。而 XOR 的两个 1 在对角，两个 0 在另一条对角——<strong>没有任何一条直线能把它们分开<\/strong>。这就是&quot;线性不可分&quot;。<\/p>\n<p>解决方式：加一层。两层网络可以先画两条线把平面切成三块，再在第三层组合。这是几何直觉，也是后来的&quot;深度&quot;概念的最早动机。<\/p>\n<blockquote>类比：一层网络像只用一把直尺在纸上划线；两层网络可以先划两刀切出小块，再对小块贴标签。刀越多，能切出的形状越复杂。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：层数多了会带来&quot;梯度消失&quot;和&quot;训练不动&quot;的问题，这就是 1980 年代要解决的下一关。<\/blockquote>\n<h3>概念 6：1986 年反向传播与它的迟到（难度：进阶）<\/h3>\n<p>反向传播不是 1986 年才发明的。它的数学基础是微积分里的链式法则，1970 年代就有人在控制论、自动微分领域用过。1986 年让·鲁梅哈特（David Rumelhart）、杰弗里·辛顿（Geoffrey Hinton）、罗纳德·威廉姆斯（Ronald Williams）在《自然》上发表的文章，价值在于：<strong>给出了一个完整、可复现、在多任务上都有效的训练流程<\/strong>，并把它和&quot;内部表示&quot;这个概念绑在一起。<\/p>\n<p>但它仍然没有立刻赢。原因很实际：<\/p>\n<ul><li>\n数据太少：MNIST 是 1990 年代才有的，ImageNet 是 2009 年。\n<\/li><li>\n算力太弱：1990 年代的 CPU 跑一个小网络要几小时。\n<\/li><li>\n对手太强：1990 年代 SVM 有漂亮的统计学习理论（VC 维、结构风险最小化），在基准上稳定胜出，而且有理论保证。\n<\/ul>\n<h3>概念 7：三次复兴分别靠什么（难度：高阶）<\/h3>\n<table><thead><tr><th>复兴<\/th><th>年份<\/th><th>外部条件<\/th><th>标志事件<\/th><\/tr><\/thead><tbody><tr><td>第一次<\/td><td>1980s<\/td><td>反向传播 + 专家系统的失败让人重新看学习<\/td><td>Hopfield 网络（1982）、联结主义复兴<\/td><\/tr><tr><td>第二次<\/td><td>2006<\/td><td>逐层预训练让深层网络能训得动<\/td><td>深度信念网络<\/td><\/tr><tr><td>第三次<\/td><td>2012<\/td><td>GPU + ImageNet 数据<\/td><td>AlexNet 在 ImageNet 上大幅领先<\/td><\/tr><\/tbody><\/table>\n<p>看清楚这条线：<strong>每一次复兴都不是&quot;模型变强了&quot;，而是&quot;训练条件变好了&quot;<\/strong>。这也是为什么 2020 年代的大模型爆发，直接原因是 Transformer + 海量数据 + 集群算力，而不是某个新的神经元模型。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[1943 麦卡洛克与皮茨 阈值逻辑门] --&gt; B[1949 赫布学习规则]\n    B --&gt; C[1958 感知机 罗森布拉特]\n    C --&gt; D[1969 感知机一书 线性不可分]\n    D --&gt; E[1970s 第一次寒冬 经费削减]\n    E --&gt; F[1982 Hopfield 网络]\n    F --&gt; G[1986 反向传播 自然杂志]\n    G --&gt; H[1990s SVM 理论与基准胜出]\n    H --&gt; I[第二次寒冬]\n    I --&gt; J[2006 逐层预训练]\n    J --&gt; K[2012 AlexNet GPU 与 ImageNet]\n    K --&gt; L[深度学习成为主流]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：看两件事——每段上升之前都有一个&quot;条件变化&quot;的箭头（不是模型变好）；每段下降都伴随&quot;理论与基准的竞争&quot;。这是理解整段历史的关键结构。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：神经网络的历史像一种被反复放弃又反复捡起的工艺。每次放弃都是因为&quot;当时做不出来&quot;（算力、数据、训练方法），每次捡起都是因为&quot;当初卡住的那个条件变了&quot;。<\/p>\n<p>失效边界：这个类比会让人误以为&quot;只要等条件，想法总会赢&quot;。实际上有些方向是真的错了（比如把智能等同于逻辑推理的第五代机），不是等来的。<\/p>\n<p><strong>实例<\/strong>（一次权重更新，手算）：单层感知机，输入 x=1，权重 w=2，目标 y=3，学习率 0.1，损失取平方差的一半：<\/p>\n<ul><li>\n预测：2×1 = 2\n<\/li><li>\n误差：2 − 3 = −1\n<\/li><li>\n梯度：误差 × 输入 = −1\n<\/li><li>\n更新：w = 2 − 0.1 × (−1) = 2.1\n<\/ul>\n<p>再算一次：预测 2.1，误差 −0.9，w 变成 2.19。可以看到它朝 3 靠近。感知机学习规则和梯度下降在这里是同一件事。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为《感知机》一书&quot;宣判了神经网络死刑&quot;。<\/strong> 它证明的是单层网络的局限，对多层网络说的是&quot;我们证不出来&quot;。\n<\/li><li>\n<strong>别以为反向传播是 1986 年发明的。<\/strong> 数学上是链式法则，工程上是自动微分，1986 年的贡献是可复现的训练流程与&quot;内部表示&quot;的实证。\n<\/li><li>\n<strong>别以为寒冬只发生了一次。<\/strong> 1970 年代和 1990 年代各一次，诱因不同：前者是理论悲观 + 经费削减，后者是 SVM 在基准和理论上双重压制。\n<\/li><li>\n<strong>别以为深度学习是&quot;新东西&quot;。<\/strong> 它的核心构件（阈值神经元、反向传播、卷积）分别在 1943、1986、1989 年就有了。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：单层感知机无法解决________问题，因为它在几何上只能画一条________。\n<p><strong>答案<\/strong>：异或（XOR）；直线。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：1986 年反向传播论文的主要贡献是？\n<ul>\n<li>\nA. 发明了链式法则\n<\/li><li>\nB. 给出了可复现的多层网络训练流程并验证了内部表示\n<\/li><li>\nC. 证明了神经网络一定收敛\n<\/li><li>\nD. 提出了卷积结构\n<p><strong>答案<\/strong>：B。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么 1990 年代 SVM 能压过神经网络？\n<p><strong>答案<\/strong>：SVM 有完整的统计学习理论（VC 维、结构风险最小化）提供泛化保证，且在当时的基准上稳定胜出；神经网络缺理论支撑、训练不稳定、算力与数据都不足。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：深度学习 2012 年爆发的直接条件包括：\n<ul>\n<li>\nA. GPU 算力\n<\/li><li>\nB. ImageNet 级别的大规模标注数据\n<\/li><li>\nC. 一个新的神经元模型\n<\/li><li>\nD. 能训得动深层网络的工程技巧（ReLU、Dropout 等）\n<p><strong>答案<\/strong>：A、B、D。解析：神经元模型没有本质变化，变的是训练条件。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n1943：神经元＝阈值逻辑门，智能可写成逻辑。\n<\/li><li>\n1969：《感知机》证单层局限，被误读成整条路死了。\n<\/li><li>\n1986：反向传播给出可复现训练流程，但缺数据与算力。\n<\/li><li>\n三次复兴都靠外部条件变化，不靠模型创新。\n<\/ul>", "ch05": "<h1>第 5 章：向自然学习——遗传算法与强化学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清遗传算法的四个基本操作，并解释它为什么不需要求导。\n<\/li><li>\n说出&quot;没有免费午餐定理&quot;对进化算法的限制。\n<\/li><li>\n解释强化学习和监督学习的本质差别：反馈是&quot;评价&quot;而不是&quot;答案&quot;。\n<\/li><li>\n说出 Q 学习和时序差分在做什么，为什么它能在不知道环境模型的情况下学。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这两条路都不从&quot;人怎么想&quot;出发，而从&quot;自然怎么筛&quot;出发：遗传算法靠<strong>变异加选择<\/strong>，强化学习靠<strong>试错加回报<\/strong>。共同点是不需要正确答案，只需要一个能打分的机制。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：遗传算法的四个操作（难度：基础）<\/h3>\n<p>霍兰德（John Holland）1975 年出版《自然系统与人工系统中的适应》，把进化论写成算法。四个操作：<\/p>\n<table><thead><tr><th>操作<\/th><th>做什么<\/th><th>类比<\/th><\/tr><\/thead><tbody><tr><td>编码<\/td><td>把解写成一串（0/1 串、实数串、树结构）<\/td><td>把设计方案写成基因<\/td><\/tr><tr><td>选择<\/td><td>按适应度高的优先留下<\/td><td>环境淘汰<\/td><\/tr><tr><td>交叉<\/td><td>两个父代各取一段拼成子代<\/td><td>有性繁殖<\/td><\/tr><tr><td>变异<\/td><td>随机改一位<\/td><td>基因突变<\/td><\/tr><\/tbody><\/table>\n<p>为什么它能用？因为它<strong>不需要梯度<\/strong>。只要你能给一个解打分，它就能搜。这对那些&quot;可评价但不可求导&quot;的问题特别有用：排班、布线、参数调优、神经网络结构搜索。<\/p>\n<p>书里提到的扩展是遗传编程（Genetic Programming）：把&quot;树&quot;当基因，交叉就是交换子树，于是能自动生成程序表达式。Koza 在 1990 年代把它推成一套完整方法。<\/p>\n<h3>概念 2：没有免费午餐（难度：进阶）<\/h3>\n<p>&quot;没有免费午餐定理&quot;（No Free Lunch）说的是一件很扫兴的事：<strong>如果把所有可能的问题一视同仁地平均，任何优化算法的平均表现都一样<\/strong>。<\/p>\n<p>推论：遗传算法不比随机搜索更好的前提，是你对它要解的那类问题有先验知识（比如&quot;好解在空间里是成簇的&quot;）。如果你的问题没有结构，任何算法都退化成随机。<\/p>\n<blockquote>这一段是本章的&quot;防忽悠&quot;部分。很多教程会说&quot;遗传算法能解一切优化问题&quot;，正确的说法是&quot;遗传算法在你对它做了编码设计的前提下能解&quot;。<\/blockquote>\n<h3>概念 3：强化学习的问题设定（难度：进阶）<\/h3>\n<p>强化学习把学习写成一个五元组：<\/p>\n<ul><li>\n<strong>状态<\/strong> S：现在处在什么情况\n<\/li><li>\n<strong>动作<\/strong> A：能做什么\n<\/li><li>\n<strong>奖励<\/strong> R：做了之后拿到什么分数\n<\/li><li>\n<strong>转移<\/strong> P：做了之后会到哪\n<\/li><li>\n<strong>折扣<\/strong> γ：未来分数折算到今天的比率\n<\/ul>\n<p>和监督学习的关键差别：监督学习每个样本都有正确答案，告诉你&quot;该做什么&quot;；强化学习只有一个分数，告诉你&quot;做得好不好&quot;，而且这个分数可能延迟很久才来。<\/p>\n<p>这就是&quot;信用分配问题&quot;：赢了棋，是哪一步下得好？没人告诉你。<\/p>\n<h3>概念 4：贝尔曼方程与 Q 学习（难度：高阶）<\/h3>\n<p>价值函数的定义是&quot;从某个状态出发，未来能拿到的折扣累计奖励的期望&quot;。贝尔曼把它写成递推：<\/p>\n<p><code>V(s) = 当下奖励 + γ × 下一状态的价值<\/code><\/p>\n<p>这一步把&quot;无限长的未来&quot;压成了&quot;一步 + 一个数&quot;。有了它，价值可以用迭代算。<\/p>\n<p>Q 学习把它变成可执行的更新规则：<\/p>\n<p><code>Q(s,a) ← Q(s,a) + α[ r + γ max Q(s&#x27;,·) − Q(s,a) ]<\/code><\/p>\n<p>方括号里那项叫<strong>时序差分误差<\/strong>（TD 误差）：&quot;实际拿到的 + 对未来的新估计&quot;减去&quot;原来的估计&quot;。α 是学习率。<\/p>\n<p>为什么它重要？因为它用<strong>采样<\/strong>代替了对环境的完整知识：你不需要知道转移概率 P，只要真的走一步、看到 r 和 s&#x27; 就行。<\/p>\n<blockquote>类比：Q 学习像在没有地图的城市里认路。你不知道每条路通向哪，但你走一次就能更新一次&quot;这条路大概值多少&quot;。走得多了，估值就收敛。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：如果状态太多（比如围棋），表格存不下，就要用函数近似（DQN），而函数近似会带来不稳定性——这是 2015 年 DQN 要用经验回放和目标网络的原因。<\/blockquote>\n<h3>概念 5：从 TD 到 DQN 到策略梯度（难度：高阶）<\/h3>\n<ul><li>\n<strong>TD 学习<\/strong>（Sutton 1988）：用下一步的估计更新当前估计，是 Q 学习的前身。\n<\/li><li>\n<strong>Q 学习<\/strong>（Watkins 1989）：证明在表格情形下收敛到最优。\n<\/li><li>\n<strong>DQN<\/strong>（2015）：用卷积网络近似 Q，加经验回放（打散样本相关性）和目标网络（固定更新目标），在 49 个 Atari 游戏上达到人类水平。\n<\/li><li>\n<strong>策略梯度 / Actor-Critic<\/strong>：不学价值再取最大，而是直接调策略参数，提高高回报动作的概率。\n<\/li><li>\n<strong>AlphaGo / AlphaZero<\/strong>：把 MCTS 当搜索、把网络当直觉，两者交替强化。\n<\/ul>\n<p>书里记了一个细节：巴托和萨顿因为强化学习的工作获得了图灵奖（书中提到 2025 年颁出）。这是对一条&quot;慢路线&quot;的迟到认可——强化学习从 1980 年代就在做，一直不是主流，直到算力和深度网络把它托起来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[问题: 只有评分 没有答案] --&gt; B[建模为 MDP 状态 动作 奖励 转移 折扣]\n    B --&gt; C[贝尔曼方程 把未来压成一步]\n    C --&gt; D[表格 Q 学习]\n    D --&gt; E[状态爆炸 需要函数近似]\n    E --&gt; F[DQN 经验回放 目标网络]\n    F --&gt; G[策略梯度 Actor-Critic]\n    G --&gt; H[AlphaGo 搜索加直觉]\n    I[遗传算法 变异加选择] --&gt; J[不需求导 可评价即可]\n    J --&gt; K[排班 布线 结构搜索]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半支是&quot;试错路线&quot;的技术演进，每一步都在解决上一步的失效（状态太多→函数近似，近似不稳→回放与目标网络）。下半支是&quot;进化路线&quot;，它的优点是通用，缺点是依赖编码设计。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：遗传算法像养一群鸽子去送信，飞得快的多留后代，偶尔有鸽子飞错方向反而发现新路；强化学习像训狗，做对了给零食，但它不知道&quot;为什么对&quot;，只能靠反复试。<\/p>\n<p>失效边界：鸽子的例子忽略了&quot;编码决定一切&quot;——如果基因里没写&quot;会飞&quot;，怎么选都没用。训狗的例子忽略了延迟奖励——如果零食在十分钟后才给，狗无法建立联系，这正是信用分配问题。<\/p>\n<p><strong>实例<\/strong>（一次 Q 更新，手算）：Q(s,a)=0.2，执行后得到 r=0，进入 s&#x27;，s&#x27; 上最大 Q 为 0.5，γ=0.9，α=0.1。<\/p>\n<ul><li>\nTD 目标 = 0 + 0.9 × 0.5 = 0.45\n<\/li><li>\nTD 误差 = 0.45 − 0.2 = 0.25\n<\/li><li>\n更新 = 0.2 + 0.1 × 0.25 = 0.225\n<\/ul>\n<p>可以看到一次更新只挪了一小步，因为 α 小。这也解释了为什么强化学习训练慢：信息一次只进一点点。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为遗传算法&quot;总能找到全局最优&quot;。<\/strong> 它是随机搜索，只有概率保证，且强烈依赖编码与适应度设计。\n<\/li><li>\n<strong>别以为强化学习是&quot;无监督学习的一种&quot;。<\/strong> 它有监督信号（奖励），只是信号是评价性的、延迟的、稀疏的。\n<\/li><li>\n<strong>别以为 Q 学习需要知道环境模型。<\/strong> 这正是它的卖点：用采样替代模型。\n<\/li><li>\n<strong>别以为奖励设计是小事。<\/strong> 奖励函数写错，智能体会精确地学会错误行为（奖励黑客）。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：遗传算法的四个基本操作是编码、________、________、变异。\n<p><strong>答案<\/strong>：选择；交叉。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：强化学习与监督学习最关键的区别是？\n<ul>\n<li>\nA. 强化学习不需要数据\n<\/li><li>\nB. 强化学习的反馈是评价性的、可能延迟，而不是标准答案\n<\/li><li>\nC. 强化学习只能用于游戏\n<\/li><li>\nD. 强化学习不需要神经网络\n<p><strong>答案<\/strong>：B。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么 Q 学习能在不知道转移概率的情况下工作？\n<p><strong>答案<\/strong>：它用实际走一步得到的 r 和 s&#x27; 作为采样估计，用 max Q(s&#x27;,·) 作为未来价值的估计，从而用采样替代了对转移模型的期望计算。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：DQN 为了稳定训练用了哪些技巧？\n<ul>\n<li>\nA. 经验回放\n<\/li><li>\nB. 目标网络\n<\/li><li>\nC. 逐层预训练\n<\/li><li>\nD. 奖励裁剪/归一化\n<p><strong>答案<\/strong>：A、B、D。解析：逐层预训练是 2006 年深度信念网络的做法，与 DQN 无关。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n遗传算法＝编码 + 选择 + 交叉 + 变异，不需求导。\n<\/li><li>\n没有免费午餐：算法好坏取决于问题的先验结构。\n<\/li><li>\n强化学习＝MDP + 评价性反馈，核心难题是信用分配。\n<\/li><li>\nQ 学习用采样替代模型，靠 TD 误差一点点更新。\n<\/ul>", "ch06": "<h1>第 6 章：下棋——人工智能的试金石<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出&quot;土耳其人&quot;骗局与真正的下棋程序之间的分界线在哪里。\n<\/li><li>\n解释 Minimax 与 Alpha-Beta 剪枝在做什么，剪枝为什么不改变结果。\n<\/li><li>\n说出深蓝与 AlphaGo 的方法差别：一个靠什么，另一个靠什么。\n<\/li><li>\n解释 AlphaGo 的&quot;直觉&quot;是从哪来的，为什么它不需要穷举。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>下棋之所以是试金石，是因为它规则清晰、胜负明确、又复杂到无法穷举。它把人工智能的核心矛盾暴露得最干净：<strong>搜索的深度有限，所以必须靠评估；评估不准，所以必须靠学习。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从骗局开始（难度：基础）<\/h3>\n<p>1769 年，匈牙利工程师肯佩伦（Wolfgang von Kempelen）造了一个&quot;土耳其人&quot;：一个穿土耳其服装的木偶，坐在箱子前下棋，能赢大多数对手，包括拿破仑和富兰克林。<\/p>\n<p>真相是箱子里藏了一个人。这个骗局维持了八十多年，被拆穿多次又被重新组装。<\/p>\n<p>书里把它放在开篇是有用意的：<strong>在下棋这件事上，&quot;看起来会&quot;和&quot;真的会&quot;长期无法区分<\/strong>。这比图灵测试早了 180 年提出同一个问题。<\/p>\n<h3>概念 2：图灵与斯特雷奇的最早程序（难度：基础）<\/h3>\n<p>图灵 1947 年写过一个下棋程序的手稿，但当时没有机器能跑它，他就自己充当 CPU，一步一步执行，被同事称为&quot;纸上机器&quot;。<\/p>\n<p>1951 年，斯特雷奇（Christopher Strachey）在曼彻斯特的 Ferranti Mark I 上写了跳棋程序，能完整跑完一局。<\/p>\n<p>1956 年，塞缪尔（Arthur Samuel）的跳棋程序第一次展示了&quot;自我学习&quot;：它和自己下，从胜负中调整评估函数的权重。这是机器学习的早期标志性成果，也是&quot;机器学习&quot;这个词流行起来的源头。<\/p>\n<h3>概念 3：Minimax 与剪枝（难度：进阶）<\/h3>\n<p>下棋是双方交替决策。Minimax 的思路是：<strong>我方走的时候取最大，对手走的时候取最小<\/strong>。一直推到叶子（终局或评估值），再把值一层层往回传。<\/p>\n<p>问题在于节点数：分支因子 b，深度 d，节点数是 b^d。国际象棋 b≈35，d=10 就是 2.7 万亿个节点，算不动。<\/p>\n<p>Alpha-Beta 剪枝的作用：在搜索过程中维护两个边界——α（我方已能保证的下界）、β（对手已能保证的上界）。一旦发现某个分支的估值不可能影响最终结果，就整枝剪掉，不再评估。<\/p>\n<p>关键性质：<strong>剪枝不改变搜索结果，只减少计算量<\/strong>。最优情况下可以把有效分支因子从 b 降到 √b，相当于同样时间能搜两倍深度。<\/p>\n<blockquote>类比：你在挑餐厅，已经找到一家 8 分的，现在看第二家，发现它第一道菜只有 3 分。你不需要尝完所有菜——因为平均分不可能超过 8 了。这就是剪枝。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：剪枝依赖&quot;评估值的上下界&quot;，如果评估函数噪声很大，剪枝可能剪掉实际更好的分支。这是&quot;评估不准&quot;的代价。<\/blockquote>\n<h3>概念 4：深蓝赢在哪里（难度：进阶）<\/h3>\n<p>1997 年，IBM 深蓝以 3.5:2.5 战胜卡斯帕罗夫。它的方法很&quot;传统&quot;：<\/p>\n<ul><li>\n专用硬件（480 个专用芯片）做并行搜索；\n<\/li><li>\n每秒评估约 2 亿个局面；\n<\/li><li>\n评估函数由大师级棋手参与调校；\n<\/li><li>\n开局库和残局库硬编码了大量人类知识。\n<\/ul>\n<p>深蓝赢的是<strong>算力 + 人类知识<\/strong>，没有学习。它下一盘棋要消耗大量电力，通用性几乎为零。<\/p>\n<h3>概念 5：AlphaGo 换了什么（难度：高阶）<\/h3>\n<p>2016 年 AlphaGo 以 4:1 战胜李世石。它的结构是两套网络 + 一个搜索：<\/p>\n<table><thead><tr><th>部件<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>策略网络<\/td><td>给定局面，直接给出&quot;下哪里比较好&quot;的概率分布，替代了穷举候选<\/td><\/tr><tr><td>价值网络<\/td><td>给定局面，直接估计&quot;这局最后我赢的概率&quot;，替代了评估函数<\/td><\/tr><tr><td>蒙特卡洛树搜索<\/td><td>用上面两个网络引导搜索，把算力集中在少数候选上<\/td><\/tr><\/tbody><\/table>\n<p>关键在于：围棋的分支因子约 250，深蓝那种暴力搜索完全不可行。AlphaGo 的做法是<strong>用学习把搜索空间先砍掉 99%<\/strong>，再在剩下的部分做有限搜索。<\/p>\n<p>2017 年的 AlphaGo Zero 更进一步：不用人类棋谱，只靠自我对弈，从零学起，几天内超过所有版本。这证明了&quot;人类知识&quot;在围棋上不是必需的。<\/p>\n<blockquote>设计动机：为什么用 MCTS 而不是纯 Minimax？因为围棋的评估函数极难写准，而 MCTS 可以用&quot;模拟到终局看胜负&quot;来绕过评估——虽然方差大，但配合神经网络引导后收敛很快。<\/blockquote>\n<h3>概念 6：扑克与不完美信息（难度：高阶）<\/h3>\n<p>棋类是&quot;完全信息&quot;：双方都能看到整个棋盘。扑克不是：你看不到对手的牌，还涉及诈唬。<\/p>\n<p>2017 年 Libratus 在无限注德州扑克上战胜四位顶级职业选手，2019 年 Pluribus 在六人桌战胜人类。方法核心是<strong>反事实遗憾最小化<\/strong>（CFR）：<\/p>\n<ul><li>\n对每个&quot;我本可以怎么做&quot;计算遗憾；\n<\/li><li>\n按遗憾大小调整下一次的策略概率；\n<\/li><li>\n反复迭代，逼近期望意义上的纳什均衡。\n<\/ul>\n<p>这和棋类的思路完全不同：棋类追求&quot;找到最好的那一步&quot;，扑克追求&quot;让对手无法针对我&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[1769 土耳其人 骗局] --&gt; B[1947 图灵纸上程序]\n    B --&gt; C[1951 斯特雷奇跳棋]\n    C --&gt; D[1956 塞缪尔 自学习跳棋]\n    D --&gt; E[Minimax 加评估函数]\n    E --&gt; F[Alpha-Beta 剪枝 降低分支因子]\n    F --&gt; G[1997 深蓝 算力加人类知识]\n    G --&gt; H[围棋 分支因子 250 暴力不可行]\n    H --&gt; I[AlphaGo 策略网络 价值网络 MCTS]\n    I --&gt; J[AlphaGo Zero 无人类棋谱 自我对弈]\n    K[扑克 不完美信息] --&gt; L[CFR 追求不可针对]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：主线是&quot;搜索 → 搜索加剪枝 → 学习加搜索&quot;。分叉点在围棋：分支因子太大，逼出了&quot;用网络当直觉&quot;的路线。扑克那条支线提醒我们，信息不完全时目标函数本身变了。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：深蓝像一个背了十万局棋谱、算得极快的棋手，但它不会举一反三；AlphaGo 像一个棋感极好、但只算几十步的棋手，靠&quot;感觉哪里重要&quot;来决定往哪算。<\/p>\n<p>失效边界：这个类比会让人低估 AlphaGo 的搜索量——它仍然每步算几万种变化，只是候选被网络砍到了几十个。<\/p>\n<p><strong>实例<\/strong>（Minimax 手算）：根是 MAX，三个 MIN 子节点分别取 min(3,5)、min(2,9)、min(1,7)。<\/p>\n<ul><li>\n第一个 MIN = 3，第二个 = 2，第三个 = 1\n<\/li><li>\n根取 max(3,2,1) = 3\n<\/ul>\n<p>剪枝版：搜到第一个 MIN 得 3，α=3。看第二个 MIN，它的第一个孩子是 2，β=2，此时 β&lt;α，后面那个 9 不用看了——因为 MIN 只会取 ≤2 的值，不可能超过 3。这就是一次剪枝。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为深蓝&quot;理解&quot;棋。<\/strong> 它是搜索 + 人类调好的评估函数，没有学习，换一个游戏就废。\n<\/li><li>\n<strong>别以为 AlphaGo 靠穷举。<\/strong> 围棋穷举不可能，它靠网络把候选砍到几十个。\n<\/li><l
