<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人工智能简史</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>人工智能简史</h1>
    <div class="sub">三次起伏、三条路线，看懂 AI 的失败与复兴</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>

可以开会的学科。<\/p>\n<h2>零基础讲解<\/h2>\n<blockquote>原书开篇引了莎士比亚的一句：What is past is prologue，过去只是序幕。这句话是本章的基调——达特茅斯会议是序幕之后的第一幕，不是第一声锣。<\/blockquote>\n<h3>概念 1：前史——1955 年那场&quot;会中会&quot;（难度：基础）<\/h3>\n<p>1955 年，美国西部计算机联合大会在洛杉矶召开，会中套了一个&quot;学习机讨论会&quot;。两位关键参加者后来都去了达特茅斯：塞弗里奇（Oliver Selfridge）讲模式识别，纽厄尔（Allen Newell）讲计算机下棋。<\/p>\n<p>主持人皮茨（Walter Pitts，神经网络的奠基者之一）当场做了总结：一派人试图模拟神经系统，纽厄尔则试图模拟心智，&quot;但殊途同归&quot;。<\/p>\n<p>这句总结值钱的地方在于，它把此后几十年最主要的矛盾提前说了出来：<strong>模拟大脑的硬件结构，还是模拟思维的符号过程<\/strong>。两派都认为自己才是&quot;真正的人工智能&quot;。<\/p>\n<h3>概念 2：六个关键人物（难度：基础）<\/h3>\n<table><thead><tr><th>人物<\/th><th>当时的身份<\/th><th>后来<\/th><\/tr><\/thead><tbody><tr><td>麦卡锡（John McCarthy）<\/td><td>达特茅斯数学系助理教授，会议召集人<\/td><td>发明 LISP，提出&quot;人工智能&quot;一词<\/td><\/tr><tr><td>明斯基（Marvin Minsky）<\/td><td>普林斯顿数学博士，与麦卡锡读书时相熟<\/td><td>麻省理工人工智能实验室创始人，写《感知机》<\/td><\/tr><tr><td>香农（Claude Shannon）<\/td><td>贝尔实验室，信息论之父<\/td><td>为会议提供学术声望与经费支持<\/td><\/tr><tr><td>罗切斯特（Nathaniel Rochester）<\/td><td>IBM 第一代通用计算机 701 的主设计师<\/td><td>提供 IBM 的算力与背书<\/td><\/tr><tr><td>纽厄尔（Allen Newell）<\/td><td>兰德公司研究员<\/td><td>与西蒙合作&quot;逻辑理论家&quot;，1975 年图灵奖<\/td><\/tr><tr><td>西蒙（Herbert Simon）<\/td><td>卡内基理工学院的博导级人物<\/td><td>1975 年图灵奖、1978 年诺贝尔经济学奖<\/td><\/tr><\/tbody><\/table>\n<p>一个值得注意的细节：麦卡锡的博士导师是拓扑学家莱夫谢茨，他的博士论文不是逻辑；但他后半生都在用数理逻辑把常识形式化。明斯基的博士论文也不是逻辑，却写了一本很有影响力的计算理论教材。这两个人后来主导了符号派，但他们的学术出身并不是逻辑学。<\/p>\n<h3>概念 3：会议提案里那句关键的话（难度：基础）<\/h3>\n<p>1955 年，四位学者联名提交了《达特茅斯夏季人工智能研究项目提案》，第一次在正式文件里使用 &quot;artificial intelligence&quot; 这个词。提案的核心猜想是：<strong>学习的每一个方面，或者智能的任何其他特征，原则上都可以被精确描述，以至于可以造一台机器来模拟它<\/strong>。<\/p>\n<p>这句话是整门学科的&quot;立项理由&quot;。它包含一个很强的假设：智能可以被形式化。后面几十年的争论，本质上都是在这句话上打补丁或者拆台。<\/p>\n<h3>概念 4：图灵的两份文本（难度：进阶）<\/h3>\n<p>一般认为学科的源头是图灵 1950 年发表在《心》（Mind）杂志上的《计算机与智能》。这篇文章提出了后来被称为&quot;图灵测试&quot;的模仿游戏：如果一个人通过文字对话分不出对面是人还是机器，就可以说机器具有智能。<\/p>\n<p>但书里补了一个更早的文本：1948 年，图灵在英国国家物理实验室（NPL）写过一份内部报告《智能机器》，里面区分了&quot;肉体智能&quot;（embodied intelligence）和&quot;无肉体智能&quot;（disembodied intelligence）。机器人学家布鲁克斯认为这份报告比 1950 年那篇更重要，因为它预示了后来符号派与统计派之争——<strong>智能到底要不要有身体<\/strong>。<\/p>\n<blockquote>类比：1950 年那篇像&quot;产品说明书&quot;，告诉你什么样的机器算合格；1948 年那份像&quot;设计草图&quot;，里面有好几条互相冲突的技术路线，但还没定稿。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：图灵测试只测&quot;行为上能否骗过人&quot;，不测&quot;内部是否真的理解&quot;。这个区分后来成了塞尔&quot;中文屋&quot;论证的靶子（见第 11 章）。<\/blockquote>\n<h3>概念 5：为什么说它是&quot;学科的起点&quot;而不是&quot;概念的起点&quot;（难度：进阶）<\/h3>\n<p>书里反复强调一件事：达特茅斯会议之前，机器翻译、定理证明、下棋、模式识别都已经有人在做。1954 年乔治敦-IBM 实验已经把几十个俄文句子翻成英文（见第 7 章）；1954 年戴维斯已经写出第一个可运行的定理证明程序（见第 2 章）；1951 年斯特雷奇已经写了跳棋程序（见第 6 章）。<\/p>\n<p>所以会议真正的作用是&quot;命名 + 组织&quot;：给它一个名字，让分散的研究者意识到彼此在做同一件事，从此有了共同的语言、会议、期刊和评价标准。<\/p>\n<blockquote>原书用了一个很妙的说法：一门学科就是&quot;学科共同体共同关注的东西&quot;。这是从实用主义角度给的定义，比从内涵上下定义更管用。<\/blockquote>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[1936 图灵机] --&gt; D[1943 麦卡洛克与皮茨]\n    B[1948 NPL 智能机器报告] --&gt; E[1950 计算机与智能]\n    D --&gt; E\n    E --&gt; F[1955 学习机讨论会]\n    G[1954 定理证明程序] --&gt; F\n    H[1951 跳棋程序] --&gt; F\n    I[1954 乔治敦机器翻译] --&gt; F\n    F --&gt; J[1956 达特茅斯会议]\n    J --&gt; K[符号派 逻辑与搜索]\n    J --&gt; L[连接派 神经网络]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图要看的不是时间顺序，而是&quot;多条线汇到一个点，再分叉&quot;。汇入点之前，各路工作彼此不知道对方存在；分叉之后，两派开始争夺&quot;什么才算人工智能&quot;的定义权。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：达特茅斯会议像一次行业标准的发布会。在它之前，各家都在自己做零件，接口不一样；会议之后，大家至少同意&quot;我们做的是同一类东西&quot;，于是可以互相比较、互相批评、互相引用。<\/p>\n<p>失效边界：标准发布会能统一名字，不能统一方法。名字统一了，路线反而打得更凶——这正是后面几章的主题。<\/p>\n<p><strong>实例<\/strong>（名称的传播）：书里提到一个常被忽略的点：达特茅斯会议更多是&quot;人工智能&quot;这个词流行的源头，而不是学科的绝对起点。乔治敦-IBM 实验早于会议，就是证据之一。所以看到&quot;1956 年是人工智能元年&quot;这种说法，要理解它是&quot;命名元年&quot;，不是&quot;第一行代码之年&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 1956 年之前没人想过机器智能。<\/strong> 图灵 1936 年就在定义&quot;可计算&quot;，1943 年麦卡洛克和皮茨就画出了神经元的逻辑模型。\n<\/li><li>\n<strong>别以为达特茅斯会议提出了统一的方法论。<\/strong> 它提出的是一批松散的猜想，参会者各干各的，会后很快分成符号和连接两条路。\n<\/li><li>\n<strong>别以为图灵测试是图灵最看重的东西。<\/strong> 他在 1948 年的报告里讨论的&quot;肉体智能&quot;才是他更关心的方向，与后来机器人学、具身智能一脉相承。\n<\/li><li>\n<strong>别以为&quot;人工智能&quot;这个词是麦卡锡随手起的。<\/strong> 他刻意避开了&quot;控制论&quot;（cybernetics）这个词，因为不想让维纳的框架笼罩整个领域。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>单选<\/strong>：达特茅斯会议最准确的定位是？\n<ul>\n<li>\nA. 第一台智能机器诞生\n<\/li><li>\nB. 人工智能这个名称与学术共同体形成的标志\n<\/li><li>\nC. 神经网络被发明的年份\n<\/li><li>\nD. 图灵测试提出的年份\n<p><strong>答案<\/strong>：B。解析：会议命名并组织了领域；图灵测试是 1950 年，神经网络模型是 1943 年。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>填空<\/strong>：1955 年学习机讨论会上，主持人皮茨总结说，一派试图模拟________，另一派试图模拟________。\n<p><strong>答案<\/strong>：神经系统；心智。<\/p>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么说 1948 年图灵的 NPL 报告比 1950 年那篇文章更能预示后来的路线之争？\n<p><strong>答案<\/strong>：它区分了&quot;肉体智能&quot;与&quot;无肉体智能&quot;，即智能是否需要身体与感知。这正对应后来符号派（纯符号推理）与具身/连接派（靠感知与行动）的分歧。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：达特茅斯会议之前已经存在的工作有：\n<ul>\n<li>\nA. 可运行的定理证明程序\n<\/li><li>\nB. 跳棋程序\n<\/li><li>\nC. 乔治敦-IBM 机器翻译实验\n<\/li><li>\nD. 反向传播算法\n<p><strong>答案<\/strong>：A、B、C。解析：反向传播在 1980 年代才被系统推广。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n1956 年达特茅斯会议＝命名 + 建共同体，不是技术起点。\n<\/li><li>\n会议提案的核心假设：智能可以被精确描述并模拟。\n<\/li><li>\n图灵：1936 定义可计算，1948 分肉体/无肉体智能，1950 提模仿游戏。\n<\/li><li>\n两派分裂从 1955 年那场会中会就已经摆上台面。\n<\/ul>", "kind": "chapter", "title": "第 1 章：缘起——从图灵到 1956 年达特茅斯会议"}, "ch02": {"html": "<h1>第 2 章：自动定理证明的兴衰<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清逻辑主义、形式主义、直觉主义三派的差别，以及它们和机器证明的关系。\n<\/li><li>\n说出&quot;逻辑理论家&quot;和戴维斯程序谁先谁后，以及为什么在后世的叙述里前者更有名。\n<\/li><li>\n用一句话解释归结原理在做什么。\n<\/li><li>\n说清定理证明为什么在 1970 年代衰落，又在 2000 年代以什么形式回来。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>自动定理证明是符号派的技术地基：如果&quot;证明&quot;能被机械化，那么&quot;推理&quot;就能被机械化；它衰落不是因为逻辑错了，而是因为<strong>组合爆炸<\/strong>——逻辑上可行，算力上不可行。<\/p>\n<h2>零基础讲解<\/h2>\n<blockquote>原书这一章开篇引用约翰逊：&quot;就像机器能省体力一样，符号演算能省脑力。演算越完美，付出的脑力就越少。&quot;<\/blockquote>\n<h3>概念 1：三派数学哲学（难度：基础）<\/h3>\n<table><thead><tr><th>派别<\/th><th>代表<\/th><th>主张<\/th><th>对机器证明的意义<\/th><\/tr><\/thead><tbody><tr><td>逻辑主义<\/td><td>罗素<\/td><td>数学可以归约到逻辑<\/td><td>把数学问题变成逻辑问题，逻辑能机械算<\/td><\/tr><tr><td>形式主义<\/td><td>希尔伯特<\/td><td>数学是把一串符号变成另一串符号<\/td><td>只要设计出统一算法，所有数学问题都能解<\/td><\/tr><tr><td>直觉主义<\/td><td>布劳威尔<\/td><td>数学是心智构造，排中律不能随便用<\/td><td>拒绝&quot;非真即假&quot;的机械判定<\/td><\/tr><\/tbody><\/table>\n<p>希尔伯特那个&quot;大一统算法&quot;的梦想，被哥德尔 1931 年的不完备定理击碎：任何足够强的一致系统里，都存在既不能证明也不能证伪的命题。但机器定理证明没有因此消亡——它换了个更谦虚的目标：<strong>在能证明的问题上，把证明找出来<\/strong>。<\/p>\n<h3>概念 2：符号的来历（难度：基础）<\/h3>\n<p>日常写的 <code>∀<\/code>（对所有）和 <code>∃<\/code>（存在）不是自古就有的。书里给了一条清楚的谱系：<\/p>\n<ul><li>\n亚里士多德：三段论，最早的推理形式化。\n<\/li><li>\n弗雷格、罗素：现代逻辑的奠基，用函数表示谓词。\n<\/li><li>\n皮亚诺、约翰逊：用 <code>(x)<\/code> 表示全称，<code>∃x<\/code> 表示存在。\n<\/li><li>\n根岑（Gerhard Gentzen）1935 年：取 All 的首字母倒过来造成 <code>∀<\/code>，取 Exist 的首字母反写造成 <code>∃<\/code>。\n<\/ul>\n<p>根岑是证明论的奠基者之一，也是希尔伯特的逻辑助手。他的身世很曲折：纳粹冲锋队早期成员，战时参与 V-2 导弹研发，1945 年饿死在布拉格的战俘营。这类细节在书里很多，读的时候可以当人物志看，但技术上只需要记住：<strong>证明论给了&quot;证明&quot;一个可以操作的定义<\/strong>。<\/p>\n<h3>概念 3：谁写出了第一个程序（难度：基础）<\/h3>\n<p>这里有个常见的叙述偏差。<\/p>\n<ul><li>\n纽厄尔和西蒙的&quot;逻辑理论家&quot;（Logic Theorist）在人工智能圈子里开风气之先，它证明了《数学原理》里的若干定理。他们给罗素写信，罗素回信说：&quot;我相信演绎逻辑里的所有事，机器都能干。&quot;\n<\/li><li>\n但<strong>第一个可运行的定理证明程序<\/strong>是逻辑学家戴维斯（Martin Davis）1954 年做的，跑在普林斯顿高等研究院那台以冯诺依曼昵称命名的电子管计算机 JOHNNIAC 上。文章迟至 1957 年才发表。\n<\/ul>\n<p>为什么后人记住的是&quot;逻辑理论家&quot;？因为它被当成了&quot;机器能做人以为只有人才能做的事&quot;的标志性事件，叙事价值大于技术首创。<\/p>\n<blockquote>类比：第一个做出电灯的人不一定是最有名的那个；爱迪生赢在系统化、商业化和叙事。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：这个类比不是说&quot;逻辑理论家&quot;没技术含量，它的启发式搜索思想后来影响很大；只是提醒&quot;第一&quot;这个头衔要看定义。<\/blockquote>\n<h3>概念 4：归结原理——把证明变成机械消去（难度：进阶）<\/h3>\n<p>1965 年，鲁滨逊（John Alan Robinson）提出<strong>归结原理<\/strong>：把所有的公式化成子句形式（一堆文字的析取），然后反复做一件事——如果两个子句里有互补的文字（一个 <code>P<\/code>、一个 <code>¬P<\/code>），就把它们消掉，剩下的部分合并成新子句。推到出现空子句，就说明矛盾，反证成立。<\/p>\n<p>它的价值在于：<strong>只用一条规则<\/strong>，就能完成一阶逻辑的全部推理。这比&quot;人设计一堆推理规则&quot;优雅得多，也让程序实现变得简单——一个循环加匹配就够了。<\/p>\n<p>代价是<strong>组合爆炸<\/strong>：每一步都可能产生大量新子句，子句数量指数增长。所以后来的研究都在&quot;怎么少生成无用子句&quot;上做文章：设置文字顺序、支持集策略、单元优先等等。<\/p>\n<h3>概念 5：为什么衰落，又怎么回来（难度：进阶）<\/h3>\n<p>1970 年代之后，定理证明在人工智能里逐渐边缘化，原因有三个：<\/p>\n<ol><li>\n<strong>算力不够<\/strong>：组合爆炸让中等难度的定理都跑不动。\n<\/li><li>\n<strong>知识不够<\/strong>：很多证明需要领域知识（比如数学归纳法该用在哪一步），纯逻辑搜索找不到。\n<\/li><li>\n<strong>目标转移<\/strong>：专家系统证明了&quot;把知识直接喂给程序&quot;比&quot;让程序自己推&quot;更划算。\n<\/ol>\n<p>但它没有死，而是换了名字和场景回来了：<\/p>\n<ul><li>\n<strong>SAT/SMT 求解器<\/strong>：把问题编码成布尔可满足性或带理论的判定问题，工业界用它做芯片验证、软件漏洞检测、调度排程。今天的 SMT 求解器能处理几十万变量的工业实例。\n<\/li><li>\n<strong>交互式定理证明<\/strong>：Coq、Isabelle、Lean。人给大方向，机器检查每一步。2013 年 Gonthier 团队用 Coq 完成了四色定理的形式化验证；Lean 社区正在形式化整个数学基础。\n<\/li><li>\n<strong>数学竞赛<\/strong>：把形式化证明和搜索结合，让机器在有限时间内找证明。\n<\/ul>\n<blockquote>原书对这段历史的评价很克制：定理证明的衰落不是&quot;逻辑不行了&quot;，而是&quot;当年想要的通用推理太贵了&quot;。今天的复兴，是把目标从&quot;通用&quot;降到&quot;特定领域 + 强约束&quot;，代价小了，就能跑起来。<\/blockquote>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[数学哲学三派] --&gt; B[形式化 可机械检验]\n    B --&gt; C[1954 戴维斯 JOHNNIAC]\n    B --&gt; D[1956 逻辑理论家]\n    C --&gt; E[1965 归结原理]\n    D --&gt; E\n    E --&gt; F[组合爆炸 子句数量指数增长]\n    F --&gt; G[1970s 边缘化]\n    G --&gt; H[SAT SMT 工业求解]\n    G --&gt; I[Coq Lean 交互式证明]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从&quot;哲学上的形式化&quot;到&quot;程序上的消去规则&quot;，中间只隔了一步；但从&quot;规则&quot;到&quot;能跑&quot;隔了一座算力的山。看这张图要抓住中间那个瓶颈节点——它解释了一切兴衰。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：归结原理像一台只会做减法的机器。你给它两个式子，它把能抵消的部分抵消掉，剩下的吐出来；一直减到空，就证明完了。它不需要会加法、乘法、除法——只要这一种操作，就够表达所有推理。<\/p>\n<p>失效边界：只会一种操作意味着&quot;路径很长&quot;。人做证明会跳步、会用直觉、会类比，机器只能一步一步消，所以步数爆炸。<\/p>\n<p><strong>实例<\/strong>（子句消去）：前提是 <code>P ∨ Q<\/code> 和 <code>¬P ∨ R<\/code>。<\/p>\n<ul><li>\n两个子句里有互补的 <code>P<\/code> 和 <code>¬P<\/code>\n<\/li><li>\n归结得到 <code>Q ∨ R<\/code>\n<\/ul>\n<p>这就是一步。如果还能和 <code>¬Q<\/code> 归结，得到 <code>R<\/code>；再和 <code>¬R<\/code> 归结，得到空子句，矛盾成立，原命题得证。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为哥德尔定理&quot;杀死了&quot;机器证明。<\/strong> 不完备性说明有些命题证不出来，但没说&quot;能证的证不出来&quot;。机器证明的目标本来就限定在可证的部分。\n<\/li><li>\n<strong>别以为&quot;逻辑理论家&quot;是第一个程序。<\/strong> 第一个可运行的是戴维斯的程序，早两年。\n<\/li><li>\n<strong>别以为定理证明已经死了。<\/strong> 它变成了 SMT 求解器和形式化验证，藏在芯片设计、编译器验证、操作系统内核验证的背后。\n<\/li><li>\n<strong>别以为归结原理只对数学有用。<\/strong> 任何能写成&quot;前提-结论&quot;的问题都能编码，包括法律条款推理、电路等价性检查。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：希尔伯特的形式主义想把数学变成&quot;把一串________变成另一串________&quot;。\n<p><strong>答案<\/strong>：符号；符号。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：第一个可运行的定理证明程序是谁做的？\n<ul>\n<li>\nA. 纽厄尔和西蒙\n<\/li><li>\nB. 戴维斯\n<\/li><li>\nC. 鲁滨逊\n<\/li><li>\nD. 王浩\n<p><strong>答案<\/strong>：B。解析：1954 年在 JOHNNIAC 上运行；&quot;逻辑理论家&quot;名气更大但不是第一。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：归结原理为什么&quot;优雅但低效&quot;？\n<p><strong>答案<\/strong>：优雅在于只用一条消去规则就能完成一阶逻辑推理，实现简单；低效在于每步会产生大量新子句，搜索空间指数增长。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：定理证明在当代以哪些形式存在？\n<ul>\n<li>\nA. SAT/SMT 求解器\n<\/li><li>\nB. Coq、Lean 等交互式证明器\n<\/li><li>\nC. 芯片与软件形式化验证\n<\/li><li>\nD. 图像分类\n<p><strong>答案<\/strong>：A、B、C。解析：图像分类属于统计学习，与定理证明无直接关系。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三派哲学：逻辑主义归约、形式主义符号操作、直觉主义拒排中律。\n<\/li><li>\n第一个程序是戴维斯的，名气和首创不是一回事。\n<\/li><li>\n归结原理：一条规则完成全部推理，代价是组合爆炸。\n<\/li><li>\n衰落因算力与知识，复兴靠 SAT/SMT 与形式化验证。\n<\/ul>", "kind": "chapter", "title": "第 2 章：自动定理证明的兴衰"}, "ch03": {"html": "<h1>第 3 章：专家系统、知识图谱与第五代计算机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 2 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 3、4 章合并\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清专家系统的基本结构，以及它为什么在 1980 年代能卖钱。\n<\/li><li>\n说出&quot;知识获取瓶颈&quot;是什么，并解释它为什么难以绕过。\n<\/li><li>\n解释第五代计算机计划的赌注押在哪，为什么输了。\n<\/li><li>\n说清知识图谱与专家系统的承继关系：换了存储形式，没换问题本质。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这三件事是同一条思路的三个阶段：把专家的知识抽出来写成显式规则，让机器照着推。专家系统是它的小型化，第五代计算机是想把它塞进硬件，知识图谱是把它改成网络并放大到全网规模。<\/p>\n<h2>零基础讲解<\/h2>\n<blockquote>原书这一章讲费根鲍姆时用了一个词：&quot;知识就是力量&quot;。他的主张是：通用推理机没有用，真正的智能来自领域知识。<\/blockquote>\n<h3>概念 1：专家系统是怎么搭起来的（难度：基础）<\/h3>\n<p>一个典型专家系统有三个部件：<\/p>\n<table><thead><tr><th>部件<\/th><th>作用<\/th><th>类比<\/th><\/tr><\/thead><tbody><tr><td>知识库<\/td><td>一堆&quot;如果…那么…&quot;的规则<\/td><td>老医生的经验笔记<\/td><\/tr><tr><td>推理机<\/td><td>拿事实去匹配规则，推出新结论<\/td><td>一个只会照笔记查的实习生<\/td><\/tr><tr><td>解释器<\/td><td>说明&quot;为什么得出这个结论&quot;<\/td><td>实习生把引用过的笔记页码报给你<\/td><\/tr><\/tbody><\/table>\n<p>关键差别在这里：<strong>通用问题求解程序什么都不懂，专家系统什么都懂一点但只懂一个领域<\/strong>。<\/p>\n<p>书里讲的第一个成功例子是斯坦福的 DENDRAL。它是费根鲍姆、遗传学家莱德伯格（Joshua Lederberg，1958 年诺贝尔生理学或医学奖）、化学家翟若适（Carl Djerassi，口服避孕药的主要发明者）合作做出来的，任务是根据质谱数据推断有机分子的结构。这个任务有明确的判定标准——分子结构可以被实验验证，错了立刻知道。<\/p>\n<h3>概念 2：MYCIN 与&quot;专家级表现&quot;（难度：基础）<\/h3>\n<p>1970 年代斯坦福做的 MYCIN 是更著名的一个：诊断血液感染并推荐抗生素。它大约有 450 条规则，在测试中的表现被认为达到了专家水平。<\/p>\n<p>但它从没在临床上真正用起来。原因不是准确率，而是：<\/p>\n<ul><li>\n当时的机器太贵，医院没有终端；\n<\/li><li>\n医生不信任一个不能解释清楚的黑箱（MYCIN 的解释器能说明规则链，但链条太长时人看不懂）；\n<\/li><li>\n责任归属不清——机器开错药谁负责。\n<\/ul>\n<p>这三点今天依然成立。<strong>这是本章最有现实价值的一段<\/strong>：技术指标过关不等于产品能用。<\/p>\n<h3>概念 3：知识获取瓶颈（难度：进阶）<\/h3>\n<p>专家系统最贵的一步不是写代码，是&quot;把专家的知识问出来&quot;。书里把这个障碍叫<strong>知识获取瓶颈<\/strong>，它有三个层次：<\/p>\n<ol><li>\n<strong>专家说不出<\/strong>：很多判断是模式识别式的直觉，他自己也讲不清依据。\n<\/li><li>\n<strong>专家说的不准<\/strong>：人对自己决策的解释常常是事后编的，与真实依据不一致。\n<\/li><li>\n<strong>规则会冲突<\/strong>：不同专家给的规则互相矛盾，需要仲裁机制。\n<\/ol>\n<p>于是出现了一个行业：知识工程师。他们的工作是坐在专家旁边，一遍遍问&quot;这种情况你会怎么处理&quot;&quot;为什么&quot;，然后把回答翻译成规则。这个过程慢、贵、不可复用。<\/p>\n<blockquote>类比：知识获取像给一位老师傅录口述史。他干了一辈子，但你问&quot;你怎么知道这个零件该换了&quot;，他只能说&quot;听声音不对&quot;。你得自己把&quot;声音不对&quot;拆成频率、振幅、时长。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：有些领域的知识确实是可形式化的（配置、诊断、税务），有些不是（写作、谈判、诊断罕见病）。瓶颈的严重程度取决于领域。<\/blockquote>\n<h3>概念 4：第五代计算机——一次押错方向的豪赌（难度：进阶）<\/h3>\n<p>1981 年，日本通产省启动&quot;第五代计算机&quot;计划。背景是 1978 年委托元冈达做的调研，1981 年发布了一份 89 页的报告，提出 6 种并行体系结构方案。主导者是渕一博，执行机构是 ICOT。<\/p>\n<p>赌注的核心有两个：<strong>并行逻辑推理硬件 + Prolog 作为核心语言<\/strong>。逻辑是：如果智能等于推理，那么把推理做得又快又便宜，智能就自然来了。整个计划投入约 4.5 亿美元，1992 年结束，没有产出可商用的成果。<\/p>\n<p>失败的原因可以拆成三层：<\/p>\n<ul><li>\n<strong>技术层<\/strong>：专用逻辑推理机打不过通用微处理器。摩尔定律让&quot;专门为推理造的芯片&quot;在几年内就落后于便宜得多的通用 CPU。\n<\/li><li>\n<strong>方法论层<\/strong>：把智能等同于逻辑推理，忽略了感知、学习、不确定性。\n<\/li><li>\n<strong>组织层<\/strong>：全国一盘棋的集中研发，缺乏市场竞争的反馈回路。\n<\/ul>\n<p>同一时期，美国走了另一条路：不造专用硬件，让 AI 跑在通用工作站上（Symbolics、LMI 这些 Lisp 机后来也死于此）。教训是一样的：<strong>不要在通用算力快速进步的年代押注专用架构<\/strong>。<\/p>\n<h3>概念 5：知识图谱——把规则换成三元组（难度：进阶）<\/h3>\n<p>专家系统的规则库有个致命缺陷：只能处理预先想到的情况，加一条新知识可能和旧规则冲突，规模一大就维护不动。<\/p>\n<p>知识图谱换了表示方式：用（头实体，关系，尾实体）这样的<strong>三元组<\/strong>存事实，比如（吴飞，任职于，浙江大学）。一堆三元组连起来就是一张网。查询变成&quot;沿边找路径&quot;，扩展变成&quot;加新的三元组&quot;，不冲突。<\/p>\n<p>这条线索的谱系是：<\/p>\n<ul><li>\n语义网（Tim Berners-Lee 2001 年提出）：给网页加机器可读的语义标注。\n<\/li><li>\n谷歌 2012 年提出 Knowledge Graph，把搜索结果从&quot;字符串匹配&quot;变成&quot;实体理解&quot;。\n<\/li><li>\n学术界：Freebase、DBpedia、Wikidata、YAGO；中文有 CN-DBpedia、OwnThink。\n<\/li><li>\n推理方法：路径排序（把关系路径当特征，学习哪条路径更可信）、FOIL（归纳规则）、以及后来的表示学习（TransE 把实体和关系嵌入向量空间，让&quot;头 + 关系 ≈ 尾&quot;）。\n<\/ul>\n<blockquote>注意一个容易误解的点：知识图谱没有解决知识获取瓶颈，它只是把成本从&quot;写规则&quot;转成&quot;抽三元组 + 对齐实体&quot;。信息抽取的准确率、实体消歧、schema 设计，仍然是硬骨头。<\/blockquote>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[专家经验] --&gt; B[知识工程师访谈]\n    B --&gt; C[规则库 if then]\n    C --&gt; D[推理机 前向 后向链]\n    D --&gt; E[专家系统 MYCIN XCON]\n    E --&gt; F[知识获取瓶颈 维护困难]\n    F --&gt; G[换表示 三元组]\n    G --&gt; H[知识图谱 语义网]\n    H --&gt; I[表示学习 TransE]\n    J[第五代机 逻辑推理硬件] -.押错方向.-&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是&quot;人把知识搬进机器&quot;，右边是&quot;机器把知识连成网&quot;。中间的断点标注了两个失败点：知识获取太贵、专用硬件打不过通用芯片。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：专家系统像一本装订好的操作手册 + 一个严格照手册执行的实习生；知识图谱像维基百科的链接网络 + 一个会顺着链接找答案的搜索者。前者精确但僵，后者灵活但可能不准。<\/p>\n<p>失效边界：手册能覆盖的场景有限，一旦遇到手册没写的情况就卡住；网络能覆盖的场景多，但&quot;顺着链接找到的答案&quot;未必有推理保证。<\/p>\n<p><strong>实例<\/strong>（规则链）：一条简化版的感染诊断规则链：<\/p>\n<pre><code>R1: IF 病人有发热 AND 白细胞升高 THEN 可能存在细菌感染\nR2: IF 可能存在细菌感染 AND 培养结果为革兰氏阳性 THEN 考虑链球菌\nR3: IF 考虑链球菌 AND 病人对青霉素不过敏 THEN 推荐青霉素<\/code><\/pre>\n<p>前向链：从已知事实出发，反复匹配规则，推出结论（数据驱动）。后向链：从目标&quot;推荐什么药&quot;出发，倒推需要哪些条件（目标驱动）。前者适合监控告警，后者适合诊断问答。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为专家系统失败是因为算力不够。<\/strong> MYCIN 在 1970 年代的机器上就能跑，问题是责任、信任、部署成本。\n<\/li><li>\n<strong>别以为规则越多越聪明。<\/strong> 规则之间会冲突，规模上千条后维护成本爆炸，这是&quot;知识获取瓶颈&quot;的另一面。\n<\/li><li>\n<strong>别以为知识图谱是新技术。<\/strong> 它继承了语义网和描述逻辑，形式化基础在 1990 年代就成熟了。\n<\/li><li>\n<strong>别以为第五代计算机是纯失败。<\/strong> 它在并行推理、约束逻辑编程上留下了技术遗产，只是没有形成产业。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：专家系统最贵的环节不是编程，而是________，它指的是把专家知识问出来并形式化的困难。\n<p><strong>答案<\/strong>：知识获取。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：第五代计算机计划的核心赌注是？\n<ul>\n<li>\nA. 通用 CPU 加统计学习\n<\/li><li>\nB. 并行逻辑推理硬件加 Prolog\n<\/li><li>\nC. 神经网络加 GPU\n<\/li><li>\nD. 大规模分布式存储\n<p><strong>答案<\/strong>：B。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么第五代计算机在技术上输给了通用微处理器？\n<p><strong>答案<\/strong>：摩尔定律让通用 CPU 性价比快速提升，专用逻辑推理机几年内就落后；同时把智能等同于逻辑推理的方法论假设本身站不住。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：知识图谱相对规则库的优势包括：\n<ul>\n<li>\nA. 加新知识不必担心规则冲突\n<\/li><li>\nB. 天然支持多跳查询\n<\/li><li>\nC. 完全解决了知识获取成本\n<\/li><li>\nD. 便于与实体对齐、跨源融合\n<p><strong>答案<\/strong>：A、B、D。解析：知识获取从&quot;写规则&quot;变成&quot;抽三元组&quot;，成本转移而非消失。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n专家系统三件套：知识库、推理机、解释器。\n<\/li><li>\nMYCIN 准确率够但没落地，卡在信任与责任。\n<\/li><li>\n知识获取瓶颈三层：说不出、说不准、规则冲突。\n<\/li><li>\n第五代机输在&quot;专用硬件 vs 摩尔定律&quot;。\n<\/li><li>\n知识图谱＝三元组网络，换了表示，没换成本问题。\n<\/ul>", "kind": "chapter", "title": "第 3 章：专家系统、知识图谱与第五代计算机"}, "ch04": {"html": "<h1>第 4 章：神经网络的三起三落<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 1943 年麦卡洛克-皮茨模型在数学上做了什么，为什么它重要。\n<\/li><li>\n解释 1969 年《感知机》一书的批评到底说了什么，以及它被误读成了什么。\n<\/li><li>\n说出反向传播解决的是什么问题，为什么它没能立刻赢得认可。\n<\/li><li>\n列出三次&quot;寒冬&quot;与三次&quot;复兴&quot;各自的触发条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>神经网络的历史不是&quot;技术逐渐变好&quot;，而是&quot;<strong>每一次复兴都靠一次外部条件变化<\/strong>&quot;：算力、数据、或者一个能解释旧失败的新工具。模型本身的想法，1943 年就基本齐了。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：1943 年的那篇论文做了什么（难度：基础）<\/h3>\n<p>麦卡洛克（Warren McCulloch）和皮茨（Walter Pitts）1943 年发表《神经活动中内在思想的逻辑演算》。他们做的事可以概括成一句：<strong>把一个神经元抽象成一个带阈值的逻辑门<\/strong>。<\/p>\n<p>具体地：一个神经元接收若干输入，每个输入有权重；把所有输入加权求和，超过阈值就输出 1，否则输出 0。这在数学上就是 <code>y = 1[Σ w_i x_i ≥ θ]<\/code>。<\/p>\n<p>这一步的意义不在于&quot;模拟了大脑&quot;，而在于它证明了一件事：<strong>神经活动可以被写成命题逻辑<\/strong>。既然是逻辑，就能用逻辑的方法分析它的能力边界。这才是它进入人工智能史的原因。<\/p>\n<p>书里还记了皮茨的悲剧：他是个天才，十几岁就与罗素通信，后来在麻省理工与维纳合作，晚年酗酒、1956 年后逐渐离开学术界，1969 年去世，年仅 46 岁。<\/p>\n<h3>概念 2：维纳与控制论（难度：基础）<\/h3>\n<p>1948 年维纳（Norbert Wiener）出版《控制论》，把&quot;动物与机器中的通信与控制&quot;统一起来研究。这本书影响极大，以至于 1950 年代很多研究者自称在做&quot;控制论&quot;而不是&quot;人工智能&quot;。<\/p>\n<p>麦卡锡刻意选择了&quot;人工智能&quot;这个词，一部分原因就是要与维纳的框架划清界限。这是学科政治，但它造成了长期后果：<strong>人工智能与认知科学、神经生理学在体制上分家了<\/strong>，两边的评价标准不同，互相看不上。<\/p>\n<h3>概念 3：感知机与它的承诺（难度：基础）<\/h3>\n<p>1958 年，罗森布拉特（Frank Rosenblatt）做出感知机（Perceptron），并造了硬件 Mark I。它的学习规则简单到可以一句话说完：<\/p>\n<blockquote>如果分类正确，不动；如果错了，把权重往正确方向挪一点。<\/blockquote>\n<p>这就是后来所有梯度方法的雏形。当时媒体把它吹成&quot;能走路、说话、看见东西的计算机胚胎&quot;，《纽约时报》1958 年的报道说它将来能&quot;认人、叫出名字&quot;。<\/p>\n<p>罗森布拉特与明斯基当时都在麻省理工附近，两人的关系紧张。这段个人恩怨在后来的历史叙述里被放大，成了&quot;明斯基打压连接主义&quot;的故事。<\/p>\n<h3>概念 4：1969 年那本书到底说了什么（难度：进阶）<\/h3>\n<p>明斯基与西摩·帕波特（Seymour Papert）1969 年出版《感知机》（Perceptrons）。书里有两个结论：<\/p>\n<ol><li>\n<strong>单层感知机只能解决线性可分的问题<\/strong>，连异或（XOR）都做不了。\n<\/li><li>\n<strong>多层感知机的表达能力虽然更强，但他们证明不出它需要多少层、也证明不出它能学到什么<\/strong>——这是一个开放问题，不是否定。\n<\/ol>\n<p>第二条是关键，也是最常被误读的地方。书的原意是&quot;我们证明不了多层网络的能力&quot;，而流传的版本变成了&quot;多层网络没用、这条路死了&quot;。这个误读让神经网络研究在 1970 年代失去了大部分经费。<\/p>\n<p>历史上更准确的描述是：<strong>经费的消失是多重因素<\/strong>——英国方面有James Lighthill 1973 年的报告质疑 AI 的整体进展，美国 DARPA 削减无明确军事目标的基础研究，加上《感知机》给出的理论悲观结论，三件事叠加。<\/p>\n<h3>概念 5：异或为什么做不了（难度：进阶）<\/h3>\n<p>异或的真值表：<\/p>\n<table><thead><tr><th>x1<\/th><th>x2<\/th><th>XOR<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><\/tbody><\/table>\n<p>单层感知机的判定是&quot;加权和过阈值&quot;，几何上是一条直线把平面分成两半。而 XOR 的两个 1 在对角，两个 0 在另一条对角——<strong>没有任何一条直线能把它们分开<\/strong>。这就是&quot;线性不可分&quot;。<\/p>\n<p>解决方式：加一层。两层网络可以先画两条线把平面切成三块，再在第三层组合。这是几何直觉，也是后来的&quot;深度&quot;概念的最早动机。<\/p>\n<blockquote>类比：一层网络像只用一把直尺在纸上划线；两层网络可以先划两刀切出小块，再对小块贴标签。刀越多，能切出的形状越复杂。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：层数多了会带来&quot;梯度消失&quot;和&quot;训练不动&quot;的问题，这就是 1980 年代要解决的下一关。<\/blockquote>\n<h3>概念 6：1986 年反向传播与它的迟到（难度：进阶）<\/h3>\n<p>反向传播不是 1986 年才发明的。它的数学基础是微积分里的链式法则，1970 年代就有人在控制论、自动微分领域用过。1986 年让·鲁梅哈特（David Rumelhart）、杰弗里·辛顿（Geoffrey Hinton）、罗纳德·威廉姆斯（Ronald Williams）在《自然》上发表的文章，价值在于：<strong>给出了一个完整、可复现、在多任务上都有效的训练流程<\/strong>，并把它和&quot;内部表示&quot;这个概念绑在一起。<\/p>\n<p>但它仍然没有立刻赢。原因很实际：<\/p>\n<ul><li>\n数据太少：MNIST 是 1990 年代才有的，ImageNet 是 2009 年。\n<\/li><li>\n算力太弱：1990 年代的 CPU 跑一个小网络要几小时。\n<\/li><li>\n对手太强：1990 年代 SVM 有漂亮的统计学习理论（VC 维、结构风险最小化），在基准上稳定胜出，而且有理论保证。\n<\/ul>\n<h3>概念 7：三次复兴分别靠什么（难度：高阶）<\/h3>\n<table><thead><tr><th>复兴<\/th><th>年份<\/th><th>外部条件<\/th><th>标志事件<\/th><\/tr><\/thead><tbody><tr><td>第一次<\/td><td>1980s<\/td><td>反向传播 + 专家系统的失败让人重新看学习<\/td><td>Hopfield 网络（1982）、联结主义复兴<\/td><\/tr><tr><td>第二次<\/td><td>2006<\/td><td>逐层预训练让深层网络能训得动<\/td><td>深度信念网络<\/td><\/tr><tr><td>第三次<\/td><td>2012<\/td><td>GPU + ImageNet 数据<\/td><td>AlexNet 在 ImageNet 上大幅领先<\/td><\/tr><\/tbody><\/table>\n<p>看清楚这条线：<strong>每一次复兴都不是&quot;模型变强了&quot;，而是&quot;训练条件变好了&quot;<\/strong>。这也是为什么 2020 年代的大模型爆发，直接原因是 Transformer + 海量数据 + 集群算力，而不是某个新的神经元模型。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[1943 麦卡洛克与皮茨 阈值逻辑门] --&gt; B[1949 赫布学习规则]\n    B --&gt; C[1958 感知机 罗森布拉特]\n    C --&gt; D[1969 感知机一书 线性不可分]\n    D --&gt; E[1970s 第一次寒冬 经费削减]\n    E --&gt; F[1982 Hopfield 网络]\n    F --&gt; G[1986 反向传播 自然杂志]\n    G --&gt; H[1990s SVM 理论与基准胜出]\n    H --&gt; I[第二次寒冬]\n    I --&gt; J[2006 逐层预训练]\n    J --&gt; K[2012 AlexNet GPU 与 ImageNet]\n    K --&gt; L[深度学习成为主流]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：看两件事——每段上升之前都有一个&quot;条件变化&quot;的箭头（不是模型变好）；每段下降都伴随&quot;理论与基准的竞争&quot;。这是理解整段历史的关键结构。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：神经网络的历史像一种被反复放弃又反复捡起的工艺。每次放弃都是因为&quot;当时做不出来&quot;（算力、数据、训练方法），每次捡起都是因为&quot;当初卡住的那个条件变了&quot;。<\/p>\n<p>失效边界：这个类比会让人误以为&quot;只要等条件，想法总会赢&quot;。实际上有些方向是真的错了（比如把智能等同于逻辑推理的第五代机），不是等来的。<\/p>\n<p><strong>实例<\/strong>（一次权重更新，手算）：单层感知机，输入 x=1，权重 w=2，目标 y=3，学习率 0.1，损失取平方差的一半：<\/p>\n<ul><li>\n预测：2×1 = 2\n<\/li><li>\n误差：2 − 3 = −1\n<\/li><li>\n梯度：误差 × 输入 = −1\n<\/li><li>\n更新：w = 2 − 0.1 × (−1) = 2.1\n<\/ul>\n<p>再算一次：预测 2.1，误差 −0.9，w 变成 2.19。可以看到它朝 3 靠近。感知机学习规则和梯度下降在这里是同一件事。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为《感知机》一书&quot;宣判了神经网络死刑&quot;。<\/strong> 它证明的是单层网络的局限，对多层网络说的是&quot;我们证不出来&quot;。\n<\/li><li>\n<strong>别以为反向传播是 1986 年发明的。<\/strong> 数学上是链式法则，工程上是自动微分，1986 年的贡献是可复现的训练流程与&quot;内部表示&quot;的实证。\n<\/li><li>\n<strong>别以为寒冬只发生了一次。<\/strong> 1970 年代和 1990 年代各一次，诱因不同：前者是理论悲观 + 经费削减，后者是 SVM 在基准和理论上双重压制。\n<\/li><li>\n<strong>别以为深度学习是&quot;新东西&quot;。<\/strong> 它的核心构件（阈值神经元、反向传播、卷积）分别在 1943、1986、1989 年就有了。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：单层感知机无法解决________问题，因为它在几何上只能画一条________。\n<p><strong>答案<\/strong>：异或（XOR）；直线。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：1986 年反向传播论文的主要贡献是？\n<ul>\n<li>\nA. 发明了链式法则\n<\/li><li>\nB. 给出了可复现的多层网络训练流程并验证了内部表示\n<\/li><li>\nC. 证明了神经网络一定收敛\n<\/li><li>\nD. 提出了卷积结构\n<p><strong>答案<\/strong>：B。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么 1990 年代 SVM 能压过神经网络？\n<p><strong>答案<\/strong>：SVM 有完整的统计学习理论（VC 维、结构风险最小化）提供泛化保证，且在当时的基准上稳定胜出；神经网络缺理论支撑、训练不稳定、算力与数据都不足。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：深度学习 2012 年爆发的直接条件包括：\n<ul>\n<li>\nA. GPU 算力\n<\/li><li>\nB. ImageNet 级别的大规模标注数据\n<\/li><li>\nC. 一个新的神经元模型\n<\/li><li>\nD. 能训得动深层网络的工程技巧（ReLU、Dropout 等）\n<p><strong>答案<\/strong>：A、B、D。解析：神经元模型没有本质变化，变的是训练条件。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n1943：神经元＝阈值逻辑门，智能可写成逻辑。\n<\/li><li>\n1969：《感知机》证单层局限，被误读成整条路死了。\n<\/li><li>\n1986：反向传播给出可复现训练流程，但缺数据与算力。\n<\/li><li>\n三次复兴都靠外部条件变化，不靠模型创新。\n<\/ul>", "kind": "chapter", "title": "第 4 章：神经网络的三起三落"}, "ch05": {"html": "<h1>第 5 章：向自然学习——遗传算法与强化学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清遗传算法的四个基本操作，并解释它为什么不需要求导。\n<\/li><li>\n说出&quot;没有免费午餐定理&quot;对进化算法的限制。\n<\/li><li>\n解释强化学习和监督学习的本质差别：反馈是&quot;评价&quot;而不是&quot;答案&quot;。\n<\/li><li>\n说出 Q 学习和时序差分在做什么，为什么它能在不知道环境模型的情况下学。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这两条路都不从&quot;人怎么想&quot;出发，而从&quot;自然怎么筛&quot;出发：遗传算法靠<strong>变异加选择<\/strong>，强化学习靠<strong>试错加回报<\/strong>。共同点是不需要正确答案，只需要一个能打分的机制。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：遗传算法的四个操作（难度：基础）<\/h3>\n<p>霍兰德（John Holland）1975 年出版《自然系统与人工系统中的适应》，把进化论写成算法。四个操作：<\/p>\n<table><thead><tr><th>操作<\/th><th>做什么<\/th><th>类比<\/th><\/tr><\/thead><tbody><tr><td>编码<\/td><td>把解写成一串（0/1 串、实数串、树结构）<\/td><td>把设计方案写成基因<\/td><\/tr><tr><td>选择<\/td><td>按适应度高的优先留下<\/td><td>环境淘汰<\/td><\/tr><tr><td>交叉<\/td><td>两个父代各取一段拼成子代<\/td><td>有性繁殖<\/td><\/tr><tr><td>变异<\/td><td>随机改一位<\/td><td>基因突变<\/td><\/tr><\/tbody><\/table>\n<p>为什么它能用？因为它<strong>不需要梯度<\/strong>。只要你能给一个解打分，它就能搜。这对那些&quot;可评价但不可求导&quot;的问题特别有用：排班、布线、参数调优、神经网络结构搜索。<\/p>\n<p>书里提到的扩展是遗传编程（Genetic Programming）：把&quot;树&quot;当基因，交叉就是交换子树，于是能自动生成程序表达式。Koza 在 1990 年代把它推成一套完整方法。<\/p>\n<h3>概念 2：没有免费午餐（难度：进阶）<\/h3>\n<p>&quot;没有免费午餐定理&quot;（No Free Lunch）说的是一件很扫兴的事：<strong>如果把所有可能的问题一视同仁地平均，任何优化算法的平均表现都一样<\/strong>。<\/p>\n<p>推论：遗传算法不比随机搜索更好的前提，是你对它要解的那类问题有先验知识（比如&quot;好解在空间里是成簇的&quot;）。如果你的问题没有结构，任何算法都退化成随机。<\/p>\n<blockquote>这一段是本章的&quot;防忽悠&quot;部分。很多教程会说&quot;遗传算法能解一切优化问题&quot;，正确的说法是&quot;遗传算法在你对它做了编码设计的前提下能解&quot;。<\/blockquote>\n<h3>概念 3：强化学习的问题设定（难度：进阶）<\/h3>\n<p>强化学习把学习写成一个五元组：<\/p>\n<ul><li>\n<strong>状态<\/strong> S：现在处在什么情况\n<\/li><li>\n<strong>动作<\/strong> A：能做什么\n<\/li><li>\n<strong>奖励<\/strong> R：做了之后拿到什么分数\n<\/li><li>\n<strong>转移<\/strong> P：做了之后会到哪\n<\/li><li>\n<strong>折扣<\/strong> γ：未来分数折算到今天的比率\n<\/ul>\n<p>和监督学习的关键差别：监督学习每个样本都有正确答案，告诉你&quot;该做什么&quot;；强化学习只有一个分数，告诉你&quot;做得好不好&quot;，而且这个分数可能延迟很久才来。<\/p>\n<p>这就是&quot;信用分配问题&quot;：赢了棋，是哪一步下得好？没人告诉你。<\/p>\n<h3>概念 4：贝尔曼方程与 Q 学习（难度：高阶）<\/h3>\n<p>价值函数的定义是&quot;从某个状态出发，未来能拿到的折扣累计奖励的期望&quot;。贝尔曼把它写成递推：<\/p>\n<p><code>V(s) = 当下奖励 + γ × 下一状态的价值<\/code><\/p>\n<p>这一步把&quot;无限长的未来&quot;压成了&quot;一步 + 一个数&quot;。有了它，价值可以用迭代算。<\/p>\n<p>Q 学习把它变成可执行的更新规则：<\/p>\n<p><code>Q(s,a) ← Q(s,a) + α[ r + γ max Q(s&#x27;,·) − Q(s,a) ]<\/code><\/p>\n<p>方括号里那项叫<strong>时序差分误差<\/strong>（TD 误差）：&quot;实际拿到的 + 对未来的新估计&quot;减去&quot;原来的估计&quot;。α 是学习率。<\/p>\n<p>为什么它重要？因为它用<strong>采样<\/strong>代替了对环境的完整知识：你不需要知道转移概率 P，只要真的走一步、看到 r 和 s&#x27; 就行。<\/p>\n<blockquote>类比：Q 学习像在没有地图的城市里认路。你不知道每条路通向哪，但你走一次就能更新一次&quot;这条路大概值多少&quot;。走得多了，估值就收敛。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：如果状态太多（比如围棋），表格存不下，就要用函数近似（DQN），而函数近似会带来不稳定性——这是 2015 年 DQN 要用经验回放和目标网络的原因。<\/blockquote>\n<h3>概念 5：从 TD 到 DQN 到策略梯度（难度：高阶）<\/h3>\n<ul><li>\n<strong>TD 学习<\/strong>（Sutton 1988）：用下一步的估计更新当前估计，是 Q 学习的前身。\n<\/li><li>\n<strong>Q 学习<\/strong>（Watkins 1989）：证明在表格情形下收敛到最优。\n<\/li><li>\n<strong>DQN<\/strong>（2015）：用卷积网络近似 Q，加经验回放（打散样本相关性）和目标网络（固定更新目标），在 49 个 Atari 游戏上达到人类水平。\n<\/li><li>\n<strong>策略梯度 / Actor-Critic<\/strong>：不学价值再取最大，而是直接调策略参数，提高高回报动作的概率。\n<\/li><li>\n<strong>AlphaGo / AlphaZero<\/strong>：把 MCTS 当搜索、把网络当直觉，两者交替强化。\n<\/ul>\n<p>书里记了一个细节：巴托和萨顿因为强化学习的工作获得了图灵奖（书中提到 2025 年颁出）。这是对一条&quot;慢路线&quot;的迟到认可——强化学习从 1980 年代就在做，一直不是主流，直到算力和深度网络把它托起来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[问题: 只有评分 没有答案] --&gt; B[建模为 MDP 状态 动作 奖励 转移 折扣]\n    B --&gt; C[贝尔曼方程 把未来压成一步]\n    C --&gt; D[表格 Q 学习]\n    D --&gt; E[状态爆炸 需要函数近似]\n    E --&gt; F[DQN 经验回放 目标网络]\n    F --&gt; G[策略梯度 Actor-Critic]\n    G --&gt; H[AlphaGo 搜索加直觉]\n    I[遗传算法 变异加选择] --&gt; J[不需求导 可评价即可]\n    J --&gt; K[排班 布线 结构搜索]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半支是&quot;试错路线&quot;的技术演进，每一步都在解决上一步的失效（状态太多→函数近似，近似不稳→回放与目标网络）。下半支是&quot;进化路线&quot;，它的优点是通用，缺点是依赖编码设计。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：遗传算法像养一群鸽子去送信，飞得快的多留后代，偶尔有鸽子飞错方向反而发现新路；强化学习像训狗，做对了给零食，但它不知道&quot;为什么对&quot;，只能靠反复试。<\/p>\n<p>失效边界：鸽子的例子忽略了&quot;编码决定一切&quot;——如果基因里没写&quot;会飞&quot;，怎么选都没用。训狗的例子忽略了延迟奖励——如果零食在十分钟后才给，狗无法建立联系，这正是信用分配问题。<\/p>\n<p><strong>实例<\/strong>（一次 Q 更新，手算）：Q(s,a)=0.2，执行后得到 r=0，进入 s&#x27;，s&#x27; 上最大 Q 为 0.5，γ=0.9，α=0.1。<\/p>\n<ul><li>\nTD 目标 = 0 + 0.9 × 0.5 = 0.45\n<\/li><li>\nTD 误差 = 0.45 − 0.2 = 0.25\n<\/li><li>\n更新 = 0.2 + 0.1 × 0.25 = 0.225\n<\/ul>\n<p>可以看到一次更新只挪了一小步，因为 α 小。这也解释了为什么强化学习训练慢：信息一次只进一点点。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为遗传算法&quot;总能找到全局最优&quot;。<\/strong> 它是随机搜索，只有概率保证，且强烈依赖编码与适应度设计。\n<\/li><li>\n<strong>别以为强化学习是&quot;无监督学习的一种&quot;。<\/strong> 它有监督信号（奖励），只是信号是评价性的、延迟的、稀疏的。\n<\/li><li>\n<strong>别以为 Q 学习需要知道环境模型。<\/strong> 这正是它的卖点：用采样替代模型。\n<\/li><li>\n<strong>别以为奖励设计是小事。<\/strong> 奖励函数写错，智能体会精确地学会错误行为（奖励黑客）。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：遗传算法的四个基本操作是编码、________、________、变异。\n<p><strong>答案<\/strong>：选择；交叉。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：强化学习与监督学习最关键的区别是？\n<ul>\n<li>\nA. 强化学习不需要数据\n<\/li><li>\nB. 强化学习的反馈是评价性的、可能延迟，而不是标准答案\n<\/li><li>\nC. 强化学习只能用于游戏\n<\/li><li>\nD. 强化学习不需要神经网络\n<p><strong>答案<\/strong>：B。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么 Q 学习能在不知道转移概率的情况下工作？\n<p><strong>答案<\/strong>：它用实际走一步得到的 r 和 s&#x27; 作为采样估计，用 max Q(s&#x27;,·) 作为未来价值的估计，从而用采样替代了对转移模型的期望计算。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：DQN 为了稳定训练用了哪些技巧？\n<ul>\n<li>\nA. 经验回放\n<\/li><li>\nB. 目标网络\n<\/li><li>\nC. 逐层预训练\n<\/li><li>\nD. 奖励裁剪/归一化\n<p><strong>答案<\/strong>：A、B、D。解析：逐层预训练是 2006 年深度信念网络的做法，与 DQN 无关。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n遗传算法＝编码 + 选择 + 交叉 + 变异，不需求导。\n<\/li><li>\n没有免费午餐：算法好坏取决于问题的先验结构。\n<\/li><li>\n强化学习＝MDP + 评价性反馈，核心难题是信用分配。\n<\/li><li>\nQ 学习用采样替代模型，靠 TD 误差一点点更新。\n<\/ul>", "kind": "chapter", "title": "第 5 章：向自然学习——遗传算法与强化学习"}, "ch06": {"html": "<h1>第 6 章：下棋——人工智能的试金石<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出&quot;土耳其人&quot;骗局与真正的下棋程序之间的分界线在哪里。\n<\/li><li>\n解释 Minimax 与 Alpha-Beta 剪枝在做什么，剪枝为什么不改变结果。\n<\/li><li>\n说出深蓝与 AlphaGo 的方法差别：一个靠什么，另一个靠什么。\n<\/li><li>\n解释 AlphaGo 的&quot;直觉&quot;是从哪来的，为什么它不需要穷举。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>下棋之所以是试金石，是因为它规则清晰、胜负明确、又复杂到无法穷举。它把人工智能的核心矛盾暴露得最干净：<strong>搜索的深度有限，所以必须靠评估；评估不准，所以必须靠学习。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从骗局开始（难度：基础）<\/h3>\n<p>1769 年，匈牙利工程师肯佩伦（Wolfgang von Kempelen）造了一个&quot;土耳其人&quot;：一个穿土耳其服装的木偶，坐在箱子前下棋，能赢大多数对手，包括拿破仑和富兰克林。<\/p>\n<p>真相是箱子里藏了一个人。这个骗局维持了八十多年，被拆穿多次又被重新组装。<\/p>\n<p>书里把它放在开篇是有用意的：<strong>在下棋这件事上，&quot;看起来会&quot;和&quot;真的会&quot;长期无法区分<\/strong>。这比图灵测试早了 180 年提出同一个问题。<\/p>\n<h3>概念 2：图灵与斯特雷奇的最早程序（难度：基础）<\/h3>\n<p>图灵 1947 年写过一个下棋程序的手稿，但当时没有机器能跑它，他就自己充当 CPU，一步一步执行，被同事称为&quot;纸上机器&quot;。<\/p>\n<p>1951 年，斯特雷奇（Christopher Strachey）在曼彻斯特的 Ferranti Mark I 上写了跳棋程序，能完整跑完一局。<\/p>\n<p>1956 年，塞缪尔（Arthur Samuel）的跳棋程序第一次展示了&quot;自我学习&quot;：它和自己下，从胜负中调整评估函数的权重。这是机器学习的早期标志性成果，也是&quot;机器学习&quot;这个词流行起来的源头。<\/p>\n<h3>概念 3：Minimax 与剪枝（难度：进阶）<\/h3>\n<p>下棋是双方交替决策。Minimax 的思路是：<strong>我方走的时候取最大，对手走的时候取最小<\/strong>。一直推到叶子（终局或评估值），再把值一层层往回传。<\/p>\n<p>问题在于节点数：分支因子 b，深度 d，节点数是 b^d。国际象棋 b≈35，d=10 就是 2.7 万亿个节点，算不动。<\/p>\n<p>Alpha-Beta 剪枝的作用：在搜索过程中维护两个边界——α（我方已能保证的下界）、β（对手已能保证的上界）。一旦发现某个分支的估值不可能影响最终结果，就整枝剪掉，不再评估。<\/p>\n<p>关键性质：<strong>剪枝不改变搜索结果，只减少计算量<\/strong>。最优情况下可以把有效分支因子从 b 降到 √b，相当于同样时间能搜两倍深度。<\/p>\n<blockquote>类比：你在挑餐厅，已经找到一家 8 分的，现在看第二家，发现它第一道菜只有 3 分。你不需要尝完所有菜——因为平均分不可能超过 8 了。这就是剪枝。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：剪枝依赖&quot;评估值的上下界&quot;，如果评估函数噪声很大，剪枝可能剪掉实际更好的分支。这是&quot;评估不准&quot;的代价。<\/blockquote>\n<h3>概念 4：深蓝赢在哪里（难度：进阶）<\/h3>\n<p>1997 年，IBM 深蓝以 3.5:2.5 战胜卡斯帕罗夫。它的方法很&quot;传统&quot;：<\/p>\n<ul><li>\n专用硬件（480 个专用芯片）做并行搜索；\n<\/li><li>\n每秒评估约 2 亿个局面；\n<\/li><li>\n评估函数由大师级棋手参与调校；\n<\/li><li>\n开局库和残局库硬编码了大量人类知识。\n<\/ul>\n<p>深蓝赢的是<strong>算力 + 人类知识<\/strong>，没有学习。它下一盘棋要消耗大量电力，通用性几乎为零。<\/p>\n<h3>概念 5：AlphaGo 换了什么（难度：高阶）<\/h3>\n<p>2016 年 AlphaGo 以 4:1 战胜李世石。它的结构是两套网络 + 一个搜索：<\/p>\n<table><thead><tr><th>部件<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>策略网络<\/td><td>给定局面，直接给出&quot;下哪里比较好&quot;的概率分布，替代了穷举候选<\/td><\/tr><tr><td>价值网络<\/td><td>给定局面，直接估计&quot;这局最后我赢的概率&quot;，替代了评估函数<\/td><\/tr><tr><td>蒙特卡洛树搜索<\/td><td>用上面两个网络引导搜索，把算力集中在少数候选上<\/td><\/tr><\/tbody><\/table>\n<p>关键在于：围棋的分支因子约 250，深蓝那种暴力搜索完全不可行。AlphaGo 的做法是<strong>用学习把搜索空间先砍掉 99%<\/strong>，再在剩下的部分做有限搜索。<\/p>\n<p>2017 年的 AlphaGo Zero 更进一步：不用人类棋谱，只靠自我对弈，从零学起，几天内超过所有版本。这证明了&quot;人类知识&quot;在围棋上不是必需的。<\/p>\n<blockquote>设计动机：为什么用 MCTS 而不是纯 Minimax？因为围棋的评估函数极难写准，而 MCTS 可以用&quot;模拟到终局看胜负&quot;来绕过评估——虽然方差大，但配合神经网络引导后收敛很快。<\/blockquote>\n<h3>概念 6：扑克与不完美信息（难度：高阶）<\/h3>\n<p>棋类是&quot;完全信息&quot;：双方都能看到整个棋盘。扑克不是：你看不到对手的牌，还涉及诈唬。<\/p>\n<p>2017 年 Libratus 在无限注德州扑克上战胜四位顶级职业选手，2019 年 Pluribus 在六人桌战胜人类。方法核心是<strong>反事实遗憾最小化<\/strong>（CFR）：<\/p>\n<ul><li>\n对每个&quot;我本可以怎么做&quot;计算遗憾；\n<\/li><li>\n按遗憾大小调整下一次的策略概率；\n<\/li><li>\n反复迭代，逼近期望意义上的纳什均衡。\n<\/ul>\n<p>这和棋类的思路完全不同：棋类追求&quot;找到最好的那一步&quot;，扑克追求&quot;让对手无法针对我&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[1769 土耳其人 骗局] --&gt; B[1947 图灵纸上程序]\n    B --&gt; C[1951 斯特雷奇跳棋]\n    C --&gt; D[1956 塞缪尔 自学习跳棋]\n    D --&gt; E[Minimax 加评估函数]\n    E --&gt; F[Alpha-Beta 剪枝 降低分支因子]\n    F --&gt; G[1997 深蓝 算力加人类知识]\n    G --&gt; H[围棋 分支因子 250 暴力不可行]\n    H --&gt; I[AlphaGo 策略网络 价值网络 MCTS]\n    I --&gt; J[AlphaGo Zero 无人类棋谱 自我对弈]\n    K[扑克 不完美信息] --&gt; L[CFR 追求不可针对]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：主线是&quot;搜索 → 搜索加剪枝 → 学习加搜索&quot;。分叉点在围棋：分支因子太大，逼出了&quot;用网络当直觉&quot;的路线。扑克那条支线提醒我们，信息不完全时目标函数本身变了。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：深蓝像一个背了十万局棋谱、算得极快的棋手，但它不会举一反三；AlphaGo 像一个棋感极好、但只算几十步的棋手，靠&quot;感觉哪里重要&quot;来决定往哪算。<\/p>\n<p>失效边界：这个类比会让人低估 AlphaGo 的搜索量——它仍然每步算几万种变化，只是候选被网络砍到了几十个。<\/p>\n<p><strong>实例<\/strong>（Minimax 手算）：根是 MAX，三个 MIN 子节点分别取 min(3,5)、min(2,9)、min(1,7)。<\/p>\n<ul><li>\n第一个 MIN = 3，第二个 = 2，第三个 = 1\n<\/li><li>\n根取 max(3,2,1) = 3\n<\/ul>\n<p>剪枝版：搜到第一个 MIN 得 3，α=3。看第二个 MIN，它的第一个孩子是 2，β=2，此时 β&lt;α，后面那个 9 不用看了——因为 MIN 只会取 ≤2 的值，不可能超过 3。这就是一次剪枝。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为深蓝&quot;理解&quot;棋。<\/strong> 它是搜索 + 人类调好的评估函数，没有学习，换一个游戏就废。\n<\/li><li>\n<strong>别以为 AlphaGo 靠穷举。<\/strong> 围棋穷举不可能，它靠网络把候选砍到几十个。\n<\/li><li>\n<strong>别以为 AlphaGo Zero 证明&quot;人类知识没用&quot;。<\/strong> 它证明的是&quot;在规则明确、可自我对弈的领域，人类知识可以被替代&quot;。规则不明确、无法快速验证的领域不成立。\n<\/li><li>\n<strong>别以为下棋解决了就等于通用智能。<\/strong> 棋类是封闭、完全信息、有明确胜负的问题，现实问题大多不是。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：Alpha-Beta 剪枝不改变________，只减少________。\n<p><strong>答案<\/strong>：搜索结果；计算量（评估的节点数）。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：深蓝与 AlphaGo 最本质的差别是？\n<ul>\n<li>\nA. 深蓝用 CPU，AlphaGo 用 GPU\n<\/li><li>\nB. 深蓝靠算力与人类知识，AlphaGo 靠学习出的策略与价值网络引导搜索\n<\/li><li>\nC. 深蓝下国际象棋，AlphaGo 下围棋\n<\/li><li>\nD. 深蓝能学习，AlphaGo 不能\n<p><strong>答案<\/strong>：B。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么扑克不能用 Minimax 那套&quot;找最优一步&quot;的思路？\n<p><strong>答案<\/strong>：扑克是不完美信息博弈，存在诈唬与隐藏信息，无法通过穷举确定对手的手牌。正确的目标是求&quot;不可被针对&quot;的均衡策略，而不是单方面最优。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：AlphaGo 的组成部分包括：\n<ul>\n<li>\nA. 策略网络\n<\/li><li>\nB. 价值网络\n<\/li><li>\nC. 蒙特卡洛树搜索\n<\/li><li>\nD. 硬编码开局库为主\n<p><strong>答案<\/strong>：A、B、C。解析：AlphaGo 并未依赖硬编码开局库，那是深蓝的做法。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n&quot;土耳其人&quot;骗局：看起来会 ≠ 真的会，比图灵测试早 180 年。\n<\/li><li>\nMinimax 取最大最小，Alpha-Beta 剪枝不改结果只省算力。\n<\/li><li>\n深蓝＝算力 + 人类知识；AlphaGo＝学习 + 有限搜索。\n<\/li><li>\n扑克逼出 CFR：目标从&quot;最优&quot;变成&quot;不可针对&quot;。\n<\/ul>", "kind": "chapter", "title": "第 6 章：下棋——人工智能的试金石"}, "ch07": {"html": "<h1>第 7 章：自然语言处理——从规则到统计<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 3 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 8 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出 1954 年乔治敦-IBM 实验的做法与它的真实规模，解释它为什么被过度宣传。\n<\/li><li>\n说清 1966 年 ALPAC 报告叫停机器翻译的逻辑，以及它造成的长期后果。\n<\/li><li>\n解释乔姆斯基的四型文法与自动机的对应关系。\n<\/li><li>\n说出统计方法翻盘的三个条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>自然语言处理的历史是<strong>一次范式反转<\/strong>：先用规则硬编码语法，撞上&quot;语言太复杂&quot;；再用统计从数据里估概率，撞上&quot;数据太少&quot;；最后深度学习把两者结合，用大规模预训练绕过了两个瓶颈。<\/p>\n<h2>零基础讲解<\/h2>\n<blockquote>原书这一章开头引了一段分析哲学的争论：意义是&quot;指称对象&quot;还是&quot;用法&quot;。这个问题看似抽象，其实决定了机器翻译怎么做——是按词对应翻译，还是按上下文用法翻译。<\/blockquote>\n<h3>概念 1：乔治敦-IBM 实验（难度：基础）<\/h3>\n<p>1954 年 1 月，乔治敦大学和 IBM 合作，在一台 IBM 701 上演示了俄译英机器翻译。系统只有 6 条语法规则和 250 个词，语料是选取的有机化学领域文本。<\/p>\n<p>演示很成功，媒体标题写&quot;机器翻译即将实现&quot;。后续的乐观预测是：三到五年内解决机器翻译问题。<\/p>\n<p>实际发生了什么：这个系统几乎不能泛化。换一个领域、换一种句式，就完全失效。原因是它的规则是<strong>针对选定语料手工裁剪的<\/strong>，不是从语言的一般规律推出来的。<\/p>\n<blockquote>这一段是全书最好的&quot;技术宣传读法&quot;教材：演示成功（demo works）和系统可用（system works）之间隔着一个世界。看一个 AI 演示时，第一个要问的问题是&quot;它的规则/参数是为这个例子专门调的吗&quot;。<\/blockquote>\n<h3>概念 2：ALPAC 报告与第一次寒冬（难度：基础）<\/h3>\n<p>1966 年，美国国家科学院下属的自动语言处理咨询委员会（ALPAC）发布报告，结论是：机器翻译的成本高于人工翻译，质量更差，建议停止资助。<\/p>\n<p>这个报告的杀伤力极大：此后近二十年，美国的机器翻译研究基本停摆。书里对它的评价是&quot;短视但不荒谬&quot;——它说的在当时是事实，问题在于它把&quot;当时不行&quot;当成了&quot;以后也不行&quot;。<\/p>\n<p>历史的转折在 1980 年代：统计方法起来后，机器翻译以完全不同的技术路线回来了，而且做成了产业。<\/p>\n<h3>概念 3：乔姆斯基的四型文法（难度：进阶）<\/h3>\n<p>乔姆斯基（Noam Chomsky）在 1950 年代提出形式文法体系，把文法按生成能力分成四类，每一类对应一种自动机：<\/p>\n<table><thead><tr><th>类型<\/th><th>名称<\/th><th>生成能力<\/th><th>对应自动机<\/th><\/tr><\/thead><tbody><tr><td>3 型<\/td><td>正则文法<\/td><td>最简单，只能描述有限状态<\/td><td>有限状态自动机<\/td><\/tr><tr><td>2 型<\/td><td>上下文无关文法<\/td><td>能描述嵌套结构<\/td><td>下推自动机（带栈）<\/td><\/tr><tr><td>1 型<\/td><td>上下文相关文法<\/td><td>依赖上下文改写<\/td><td>线性有界自动机<\/td><\/tr><tr><td>0 型<\/td><td>无限制文法<\/td><td>最强<\/td><td>图灵机<\/td><\/tr><\/tbody><\/table>\n<p>这个对应表是本章的技术核心。它把&quot;语言有多复杂&quot;翻译成了&quot;需要多强的计算模型&quot;。比如自然语言里的嵌套（&quot;我知道你认为他说……&quot;），正则文法处理不了，必须用上下文无关文法；而上下文无关文法处理不了跨句依赖，所以自然语言究竟属于哪一型，长期有争议。<\/p>\n<h3>概念 4：规则时代的产物（难度：基础）<\/h3>\n<p>在统计方法之前，NLP 主要靠人写规则：<\/p>\n<ul><li>\n<strong>词法分析<\/strong>：分词、词性标注，靠词典 + 规则。\n<\/li><li>\n<strong>句法分析<\/strong>：靠文法规则做句法树。\n<\/li><li>\n<strong>语义分析<\/strong>：靠语义网络、格语法。\n<\/li><li>\n<strong>语用<\/strong>：靠脚本（script）理论，比如&quot;去餐厅&quot;的固定流程。\n<\/ul>\n<p>这些系统在受限领域能跑，一旦换文本就崩。共同的问题：<strong>规则写不全，写全了会冲突<\/strong>——和专家系统的知识获取瓶颈是同一个病。<\/p>\n<h3>概念 5：统计方法怎么翻盘的（难度：进阶）<\/h3>\n<p>1980 年代后期到 1990 年代，统计方法在 NLP 各任务上全面超过规则方法。三个条件同时成熟：<\/p>\n<ol><li>\n<strong>语料<\/strong>：出现了可机读的大规模文本（议会记录、新闻社稿件）。\n<\/li><li>\n<strong>算法<\/strong>：隐马尔可夫模型、n-gram 语言模型、IBM 的统计机器翻译模型（基于词对齐与噪声信道）。\n<\/li><li>\n<strong>评价<\/strong>：有了统一的评测集和指标（BLEU），进步可以被量化比较。\n<\/ol>\n<p>这一步的方法论变化很重要：从&quot;人写规则&quot;变成&quot;从数据估参数&quot;。规则方法追求&quot;覆盖所有语法现象&quot;，统计方法追求&quot;在测试集上平均表现好&quot;。后者放弃了完美，换来了可扩展。<\/p>\n<h3>概念 6：神经时代的三个里程碑（难度：进阶）<\/h3>\n<table><thead><tr><th>年份<\/th><th>事件<\/th><th>变化<\/th><\/tr><\/thead><tbody><tr><td>2013<\/td><td>word2vec<\/td><td>词变成稠密向量，语义相近的词在空间里靠近<\/td><\/tr><tr><td>2014–2015<\/td><td>序列到序列 + 注意力<\/td><td>翻译不再依赖词对齐，端到端训练<\/td><\/tr><tr><td>2017<\/td><td>Transformer<\/td><td>纯注意力架构，可大规模并行训练<\/td><\/tr><tr><td>2018 起<\/td><td>预训练 + 微调（BERT、GPT）<\/td><td>一次预训练，多任务复用<\/td><\/tr><tr><td>2022<\/td><td>ChatGPT<\/td><td>对话式对齐，把能力包装成产品<\/td><\/tr><\/tbody><\/table>\n<p>关键转折在于&quot;预训练&quot;：它把&quot;数据太少&quot;这个瓶颈绕过去了——不是为每个任务标注数据，而是先用海量无标注文本学语言的一般规律，再用少量标注数据微调。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[1954 乔治敦实验 6规则250词] --&gt; B[过度乐观 三到五年解决]\n    B --&gt; C[1966 ALPAC 报告 叫停]\n    C --&gt; D[规则时代 词法 句法 语义]\n    D --&gt; E[瓶颈 规则写不全 换领域就崩]\n    E --&gt; F[1980s 统计方法 语料 算法 评测]\n    F --&gt; G[统计机器翻译 产业落地]\n    G --&gt; H[2013 word2vec]\n    H --&gt; I[2017 Transformer]\n    I --&gt; J[预训练 微调 大模型]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这条线的节奏是&quot;乐观—打击—转向—再起&quot;。注意 C 点（ALPAC）之后不是消失，而是换路线；换路线的触发条件是 F 点那三个条件同时具备。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：规则方法像给翻译配一本语法手册，遇到手册里的句式就对，遇到没写的就死；统计方法像让翻译读一百万句双语对照，自己总结规律，遇到没见过的句式也能蒙个大概。<\/p>\n<p>失效边界：统计方法在低频现象上表现差（数据里没出现过就学不到），规则方法在低频但规则明确的现象上反而更好。这也是为什么后来的系统是混合的。<\/p>\n<p><strong>实例<\/strong>（n-gram 的直觉）：二元语言模型估的是&quot;给定上一个词，下一个词是什么&quot;的概率。如果语料里&quot;人工&quot;后面出现&quot;智能&quot;100 次、&quot;人工&quot;总共出现 120 次，那么 P(智能|人工) ≈ 0.83。<\/p>\n<p>问题立刻出现：如果某个组合在语料里一次都没出现，概率就是 0，整句概率变成 0。解决办法是平滑（给没出现的组合分配一点概率），这是统计 NLP 里最基础也最重要的技巧之一。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为乔姆斯基反对统计方法就等于&quot;统计方法是错的&quot;。<\/strong> 他反对的是&quot;只靠统计就能获得语言能力&quot;这个主张，理由是&quot;刺激贫乏&quot;：儿童接触的语言数据太少，不足以归纳出语法规则。\n<\/li><li>\n<strong>别以为 ALPAC 报告是纯粹的官僚错误。<\/strong> 它指出的成本与质量问题当时确实存在，错在把现状外推成永久结论。\n<\/li><li>\n<strong>别以为规则方法一无是处。<\/strong> 在需要精确、可解释、可审计的场景（法律条文解析、格式校验），规则仍然不可替代。\n<\/li><li>\n<strong>别以为大模型解决了 NLP 的全部问题。<\/strong> 它在事实性、可解释性、长文本一致性上仍有明显短板。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：1954 年乔治敦-IBM 实验用了________条语法规则和________个词。\n<p><strong>答案<\/strong>：6；250。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：2 型文法（上下文无关文法）对应的自动机是？\n<ul>\n<li>\nA. 有限状态自动机\n<\/li><li>\nB. 下推自动机\n<\/li><li>\nC. 线性有界自动机\n<\/li><li>\nD. 图灵机\n<p><strong>答案<\/strong>：B。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么 1954 年的演示成功没有带来可用的机器翻译系统？\n<p><strong>答案<\/strong>：规则和词表是为选定语料专门裁剪的，不具备泛化能力；换领域或换句式即失效，而真实翻译任务的多样性远超演示范围。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：统计方法在 1980 年代翻盘的条件包括：\n<ul>\n<li>\nA. 大规模可机读语料\n<\/li><li>\nB. 隐马尔可夫、n-gram 等概率模型\n<\/li><li>\nC. 统一的评测集与指标\n<\/li><li>\nD. 深度学习的出现\n<p><strong>答案<\/strong>：A、B、C。解析：深度学习要到 2010 年代才成为主力。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n乔治敦实验：6 条规则 250 词，演示成功≠系统可用。\n<\/li><li>\nALPAC 1966 叫停机器翻译，二十年停滞。\n<\/li><li>\n四型文法对应四类自动机，这是&quot;语言复杂度&quot;的计算刻画。\n<\/li><li>\n统计翻盘靠语料、模型、评测三件事同时到位。\n<\/li><li>\n预训练绕过了&quot;标注数据太少&quot;这个瓶颈。\n<\/ul>", "kind": "chapter", "title": "第 7 章：自然语言处理——从规则到统计"}, "ch08": {"html": "<h1>第 8 章：语言等于思维吗<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 7 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 9 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清乔姆斯基 2023 年那篇批评的三个论点。\n<\/li><li>\n解释&quot;刺激贫乏&quot;这个论证的结构与它的争议点。\n<\/li><li>\n区分&quot;柏拉图之问&quot;与&quot;奥威尔之问&quot;：它们分别问的是什么问题。\n<\/li><li>\n说出&quot;语言决定思维&quot;（萨丕尔-沃尔夫假说）有哪些实证反驳。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一章讨论的不是&quot;机器会不会说话&quot;，而是&quot;<strong>语言能力是不是思维能力的全部<\/strong>&quot;。乔姆斯基说不是，且认为大模型根本没有语言能力；他的批评者说，能用就够了，不必先有理论。<\/p>\n<h2>零基础讲解<\/h2>\n<blockquote>原书这一章写得很有现场感：2023 年 3 月，乔姆斯基在《纽约时报》发文批评 ChatGPT，随后语言学界在社交媒体上吵成一团。作者把这个场面当作案例来分析，而不是当结论。<\/blockquote>\n<h3>概念 1：乔姆斯基那篇文章说了什么（难度：基础）<\/h3>\n<p>2023 年 3 月 8 日，乔姆斯基与语言学家伊恩·罗伯茨、计算机科学家杰弗里·瓦图穆尔在《纽约时报》发表评论《ChatGPT 的虚假承诺》。三个论点：<\/p>\n<ol><li>\n<strong>大模型只是在做模式匹配<\/strong>，没有真正的语言理解。它学的是&quot;什么词后面常跟什么词&quot;，不是&quot;句子为什么合法&quot;。\n<\/li><li>\n<strong>它无法区分&quot;可能&quot;与&quot;不可能&quot;<\/strong>。人能判断&quot;无色的绿色想法愤怒地睡觉&quot;语法合法但语义荒谬；模型只会给一个概率。\n<\/li><li>\n<strong>它没有道德判断能力<\/strong>，因为道德需要基于因果与意图的推理，而不是统计关联。\n<\/ol>\n<p>文章的结论很尖锐：这类系统的成功让人误以为&quot;工程上的可用&quot;等于&quot;理论上的理解&quot;。<\/p>\n<h3>概念 2：反驳来得很快（难度：基础）<\/h3>\n<p>斯坦福语言学家曼宁（Christopher Manning）在社交平台上回应：语言学的科学已经被这些模型改变。他的核心论点是：<strong>语言能力本身就是一个统计现象<\/strong>，人脑处理语言时也在做概率预测；要求模型先具备&quot;理解&quot;才能处理语言，是设了一个不必要的门槛。<\/p>\n<p>另一条反驳更尖锐：乔姆斯基自己提出的语法理论，也从未给出一个能跑的程序。批评一个&quot;能用但解释不清&quot;的系统，用一个&quot;解释得多但跑不起来&quot;的理论，说服力有限。<\/p>\n<p>书里对这个争论的呈现是平衡的：它没有站队，而是把双方的前提摊开——<strong>争论的根不是技术，而是&quot;什么算理解&quot;这个定义<\/strong>。<\/p>\n<h3>概念 3：刺激贫乏论证（难度：进阶）<\/h3>\n<p>这是乔姆斯基理论的核心经验证据，结构如下：<\/p>\n<ol><li>\n儿童接触到的语言输入是有限的、残缺的、充满错误的。\n<\/li><li>\n但儿童在几岁内就能掌握复杂的语法规则，包括从未听过的结构。\n<\/li><li>\n因此，语法知识不可能全部来自输入。\n<\/li><li>\n结论：人脑有先天的&quot;语言官能&quot;，提供了一套普遍的语法框架（普遍语法）。\n<\/ol>\n<p>反驳有三类：<\/p>\n<ul><li>\n<strong>输入其实没那么贫乏<\/strong>：儿童每天听到的句子数量巨大，且有大量重复结构。\n<\/li><li>\n<strong>学习机制比想象中强<\/strong>：统计学习能从分布里提取结构，不需要先天规则。\n<\/li><li>\n<strong>结论过强<\/strong>：就算有先天成分，也不能推出&quot;必须有一套具体语法的先天模板&quot;。\n<\/ul>\n<blockquote>类比：刺激贫乏像&quot;我只给了你十块积木，你却搭出了整座城堡，所以你一定自带图纸&quot;。反驳是&quot;也许十块积木的信息量比看上去大，也许搭法本身就能生成城堡&quot;。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：这个类比弱化了&quot;儿童从不出错地掌握某些规则&quot;这一点——如果确实有规则从未在输入中出现却被普遍掌握，先天论的证据就更强。<\/blockquote>\n<h3>概念 4：柏拉图之问与奥威尔之问（难度：进阶）<\/h3>\n<p>书里用两个&quot;问题&quot;来框定讨论：<\/p>\n<ul><li>\n<strong>柏拉图之问<\/strong>：我们怎么在经验如此贫乏的情况下知道这么多？（对应先天论）\n<\/li><li>\n<strong>奥威尔之问<\/strong>：我们怎么在证据如此充分的情况下错得这么离谱？（对应认知偏差、意识形态扭曲）\n<\/ul>\n<p>前者问&quot;知识从哪来&quot;，后者问&quot;人为什么拒绝相信眼前的事实&quot;。作者把这两个问题并列，是想说：智能不只是&quot;能推出正确答案&quot;，还包括&quot;为什么会推错&quot;。<\/p>\n<blockquote>这一小节是全章最有哲学味的地方，也是考试常考的点：这两个&quot;问&quot;出自不同的传统，一个认识论，一个政治心理学。<\/blockquote>\n<h3>概念 5：语言决定思维吗（难度：进阶）<\/h3>\n<p>萨丕尔-沃尔夫假说（Sapir-Whorf hypothesis）主张语言结构影响甚至决定思维。它的强版本（语言决定思维）基本被否定，弱版本（语言影响注意与记忆）有实证支持。<\/p>\n<p>几个经典证据：<\/p>\n<ul><li>\n<strong>颜色词<\/strong>：俄语区分深浅蓝（goluboy / siniy），俄语母语者在区分深浅蓝时比英语母语者更快。但一旦加入干扰任务，差异消失——说明影响的是&quot;注意习惯&quot;，不是&quot;知觉能力&quot;。\n<\/li><li>\n<strong>空间方位<\/strong>：某些语言用绝对方位（东南西北）而非相对方位（左右），说这类语言的人方位感更强，能保持更好的方向感。\n<\/li><li>\n<strong>数字词<\/strong>：语言里没有精确数词的人群（如 Pirahã），在精确计数任务上表现弱，但在近似数量估计上正常。\n<\/ul>\n<p>结论：语言影响<strong>被强迫注意的维度<\/strong>，但不封锁思维能力。人可以在没有对应词的情况下思考一个概念，只是会更费力。<\/p>\n<h3>概念 6：这一章真正的论点（难度：高阶）<\/h3>\n<p>把上面几条合起来看，作者想说的是：<\/p>\n<ol><li>\n&quot;语言&quot;和&quot;思维&quot;不是一回事。语言是思维的一种编码方式，不是思维本身。\n<\/li><li>\n大模型擅长语言的<strong>表层统计<\/strong>，这能通过大量考试，但不等于具备因果推理与意图理解。\n<\/li><li>\n语言学的争论提醒我们：<strong>评价一个系统，要先明确&quot;用什么标准&quot;<\/strong>。用考试成绩评价，大模型很强；用&quot;能否解释为什么&quot;评价，它很弱。两个评价都对，只是问的问题不同。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[语言与思维的关系] --&gt; B[强假说 语言决定思维]\n    A --&gt; C[弱假说 语言影响注意]\n    A --&gt; D[独立假说 思维可脱离语言]\n    B --&gt; E[被实证否定 颜色词 方位词]\n    C --&gt; F[有实证支持 俄语蓝 绝对方位]\n    D --&gt; G[乔姆斯基 普遍语法 先天语言官能]\n    G --&gt; H[刺激贫乏论证]\n    H --&gt; I[2023 批评 ChatGPT 只有模式匹配]\n    I --&gt; J[曼宁反驳 语言本身就是统计现象]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图有三条平行假设，不要读成一条演进线。关键是底部那条冲突：先天论与统计学习论对&quot;语言能力从哪来&quot;给出了互斥答案，而两边都还没有决定性证据。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把语言能力想成&quot;开车&quot;。乔姆斯基要求先懂发动机原理才算会开车；曼宁认为能安全把车开到目的地就算会开。两个人说的&quot;会&quot;不是同一个意思，所以吵不出结果。<\/p>\n<p>失效边界：开车有明确的验收标准（不出事故），语言理解没有。&quot;能对话&quot;是不是&quot;理解&quot;，本身就是待定义的东西。<\/p>\n<p><strong>实例<\/strong>（一个让大模型出错的句子）：考虑&quot;约翰太固执了，没法跟他说话&quot;（John is too stubborn to talk to）。这句的表面结构是&quot;约翰太固执，以至于（某人）没法跟（约翰）说话&quot;，但机器很容易解析成&quot;约翰太固执，不去跟（别人）说话&quot;——主语和宾语的指向错了。<\/p>\n<p>这类句子是句法理论的经典测试材料：它说明&quot;表面词序&quot;不足以确定意义，需要隐式的句法结构。大模型在大量此类句子上会出错，正是乔姆斯基那篇文章举例的类型。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为乔姆斯基&quot;反对人工智能&quot;。<\/strong> 他反对的是&quot;统计关联等于理解&quot;这个主张，不是反对技术本身。\n<\/li><li>\n<strong>别以为曼宁的反驳证明了大模型有语言能力。<\/strong> 他论证的是&quot;语言能力可以只由统计机制实现&quot;，这是一个关于机制的主张，不等于已经实现。\n<\/li><li>\n<strong>别以为萨丕尔-沃尔夫假说完全错了。<\/strong> 强版本错，弱版本有支持。语言确实会改变你习惯注意什么。\n<\/li><li>\n<strong>别以为这一章是&quot;哲学闲谈&quot;。<\/strong> 它直接影响评价标准：如果你接受&quot;能通过考试就算懂&quot;，大模型已经达标；如果你要求&quot;能解释为什么&quot;，它远没达标。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：乔姆斯基论证人脑有先天语言官能的核心经验证据叫________论证。\n<p><strong>答案<\/strong>：刺激贫乏。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：柏拉图之问与奥威尔之问分别问的是？\n<ul>\n<li>\nA. 知识从哪来；人为何在证据充分时仍会错\n<\/li><li>\nB. 语言是否决定思维；机器能否思考\n<\/li><li>\nC. 语法是否先天；语义是否后天\n<\/li><li>\nD. 人为何会错；知识从哪来\n<p><strong>答案<\/strong>：A。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：曼宁反驳乔姆斯基的核心论点是什么？\n<p><strong>答案<\/strong>：语言能力本身可以是统计现象，人脑处理语言也依赖概率预测；要求系统先具备&quot;理解&quot;才能处理语言，是额外加了不必要的门槛。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：关于语言与思维的关系，实证支持的有：\n<ul>\n<li>\nA. 语言影响注意的维度（如颜色词、绝对方位）\n<\/li><li>\nB. 语言完全决定思维，没有对应词就无法思考\n<\/li><li>\nC. 思维可以在缺少对应词汇时进行，只是更费力\n<\/li><li>\nD. 语言与思维完全无关\n<p><strong>答案<\/strong>：A、C。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n乔姆斯基三论点：模式匹配、无法区分可能与不可能、缺道德推理。\n<\/li><li>\n刺激贫乏：输入有限却掌握复杂规则，故有先天官能。\n<\/li><li>\n柏拉图之问问知识来源，奥威尔之问问责备证据时的固执。\n<\/li><li>\n语言影响注意，不封锁思维。\n<\/ul>", "kind": "chapter", "title": "第 8 章：语言等于思维吗"}, "ch09": {"html": "<h1>第 9 章：人是机器吗——计算的理论边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 2 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n画出图灵机的三个部件，并说清&quot;可计算&quot;在这里的确切含义。\n<\/li><li>\n陈述丘奇-图灵论题，并说出它为什么是&quot;论题&quot;而不是&quot;定理&quot;。\n<\/li><li>\n用反证法复述停机问题的证明。\n<\/li><li>\n解释物理符号假设的内容，以及它今天为什么被质疑。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>图灵在 1936 年做了一件比&quot;造机器&quot;更彻底的事：<strong>他先定义了什么叫&quot;能被机械地算出来&quot;<\/strong>。这个定义划出了所有计算机（包括人脑若被视作计算装置）的能力边界。<\/p>\n<h2>零基础讲解<\/h2>\n<blockquote>原书这一章把&quot;人是机器吗&quot;当作标题，因为它要讨论的不是工程问题，而是本体论问题：如果思维是计算，那么计算的边界就是思维的边界。<\/blockquote>\n<h3>概念 1：图灵机的三个部件（难度：基础）<\/h3>\n<p>图灵机是一个思想实验装置，只有三样东西：<\/p>\n<table><thead><tr><th>部件<\/th><th>作用<\/th><th>类比<\/th><\/tr><\/thead><tbody><tr><td>纸带<\/td><td>分成格子，每格写一个符号，可无限延伸<\/td><td>无限长的草稿纸<\/td><\/tr><tr><td>读写头<\/td><td>停在某一格，能读、能写、能左右移动<\/td><td>一支会走路的笔<\/td><\/tr><tr><td>状态表<\/td><td>一张&quot;当前状态 + 读到符号 → 写什么、怎么移、变成什么状态&quot;的表<\/td><td>操作手册<\/td><\/tr><\/tbody><\/table>\n<p>就这三样。没有内存、没有指令集、没有操作系统。图灵证明了：<strong>凡是&quot;能按固定规则一步步算出来&quot;的东西，这台机器都能算<\/strong>。<\/p>\n<p>这个抽象的价值在于它<strong>去掉了实现细节<\/strong>。你的笔记本、手机、超算，在&quot;能算什么&quot;这个层面上，与图灵机等价——只是快慢和内存不同。<\/p>\n<h3>概念 2：可计算的确切含义（难度：进阶）<\/h3>\n<p>&quot;可计算&quot;在数学上的定义是：存在一台图灵机，对任意输入，能在有限步内停机并给出正确答案。<\/p>\n<p>注意三个限定词：<\/p>\n<ul><li>\n<strong>任意输入<\/strong>：不是某些输入能算，是所有合法输入都能算。\n<\/li><li>\n<strong>有限步<\/strong>：允许跑很久，但不允许永远跑下去。\n<\/li><li>\n<strong>正确答案<\/strong>：不是&quot;大概对&quot;，是确定对。\n<\/ul>\n<p>违反任何一条，就不叫可计算。这个定义比日常说的&quot;能算&quot;严格得多。<\/p>\n<h3>概念 3：丘奇-图灵论题（难度：进阶）<\/h3>\n<p>1936 年前后，三个人用三种完全不同的方式定义了&quot;可计算&quot;：<\/p>\n<ul><li>\n图灵：图灵机（机械步骤）\n<\/li><li>\n丘奇：λ 演算（函数抽象与替换）\n<\/li><li>\n哥德尔、克莱尼：递归函数\n<\/ul>\n<p>三者被证明<strong>能力完全等价<\/strong>——凡一个能算的，另两个也能算。这个等价性引出了丘奇-图灵论题：<strong>凡是直觉上&quot;可机械计算&quot;的函数，都是图灵可计算的<\/strong>。<\/p>\n<p>为什么叫&quot;论题&quot;（thesis）而不是&quot;定理&quot;？因为它的前半句&quot;直觉上可机械计算&quot;没有数学定义，无法证明。它是一个<strong>关于&quot;计算&quot;这个词的外延主张<\/strong>，我们接受它，是因为至今没有任何反例。<\/p>\n<blockquote>类比：这就像&quot;凡是能用尺规作图画出来的正多边形，都可以用代数方法构造&quot;。等价性可以证明，但&quot;能用尺规画&quot;本身是个直观概念。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：如果有人造出某种物理过程能算出图灵机算不出的东西（比如某些量子或超计算模型），这个论题就会被推翻。目前没有可靠证据。<\/blockquote>\n<h3>概念 4：停机问题（难度：高阶）<\/h3>\n<p>问题：给定一个程序 P 和输入 x，能不能写一个程序 H，判断 P 在 x 上会不会停机？<\/p>\n<p>图灵的回答：不能。证明用反证法：<\/p>\n<ol><li>\n假设存在这样的 H，它输出&quot;停&quot;或&quot;不停&quot;，且总能给出正确答案。\n<\/li><li>\n构造一个新程序 D：拿 D 自己当输入。如果 H 说&quot;D 会停&quot;，就让 D 死循环；如果 H 说&quot;D 不会停&quot;，就让 D 立刻停。\n<\/li><li>\n问：D 在输入 D 上会停吗？\n<ul>\n<li>\n若会停 → 按定义 H 说它会停 → D 死循环 → 不停，矛盾。\n<\/li><li>\n若不停 → H 说它不停 → D 立刻停 → 停，矛盾。\n<\/li><li>\n两种情况都矛盾，故 H 不存在。\n<\/ul>\n<\/ol>\n<p>这个证明的美在于它只用一个自指构造，不涉及任何具体实现。它和哥德尔不完备定理、罗素悖论是同一个&quot;对角化&quot;家族。<\/p>\n<p><strong>它的实际意义<\/strong>：不可能有一个万能的程序检查器，能提前告诉你&quot;这段代码会不会死循环&quot;。所以所有静态分析工具都只能给出&quot;可能有问题&quot;的近似答案，不能给保证。<\/p>\n<h3>概念 5：哥德尔不完备定理（难度：高阶）<\/h3>\n<p>1931 年，哥德尔证明：任何足够强（能表达算术）、一致（不自相矛盾）的形式系统，都存在一个命题，它在该系统中既不能被证明也不能被证伪。<\/p>\n<p>通俗版：<strong>系统里有一句真话，系统自己说不出来<\/strong>。<\/p>\n<p>它和停机问题的关系：都是&quot;系统无法完全把握自己&quot;。哥德尔用的是&quot;这句话不可证&quot;的自指句；图灵用的是&quot;这个程序不停&quot;的自指程序。<\/p>\n<p>但要小心一个常见误读：不完备定理<strong>不否定<\/strong>&quot;机器能思考&quot;，它只说明&quot;没有哪个形式系统能证明所有真理&quot;。人也会遇到同样的限制——人也不能证明所有真理。<\/p>\n<h3>概念 6：物理符号假设（难度：高阶）<\/h3>\n<p>纽厄尔和西蒙 1976 年提出：<strong>一个物理系统要表现出智能，必要且充分的条件是它能操作符号<\/strong>。<\/p>\n<p>这个假设是符号派的哲学纲领。它包含两个强主张：<\/p>\n<ul><li>\n<strong>必要<\/strong>：不操作符号，就不可能有智能，因此否定纯连接主义。\n<\/li><li>\n<strong>充分<\/strong>：只要操作符号，就能有智能，因此认为实现细节（硅、碳、神经元）无关。\n<\/ul>\n<p>它今天被质疑的地方：<\/p>\n<ol><li>\n<strong>感知与行动<\/strong>：机器人学发现，很多智能不需要符号操作（布鲁克斯的&quot;无表征智能&quot;）。\n<\/li><li>\n<strong>常识<\/strong>：符号系统需要把所有常识编码，成本极高（Cyc 的教训）。\n<\/li><li>\n<strong>具身性<\/strong>：意义的接地可能需要身体与环境的交互，纯符号没有&quot;意义&quot;只有&quot;语法&quot;。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[1931 哥德尔不完备] --&gt; D[自指与对角化]\n    B[1936 图灵机] --&gt; C[可计算的定义]\n    C --&gt; D\n    D --&gt; E[停机问题 不可判定]\n    C --&gt; F[丘奇-图灵论题 三种定义等价]\n    F --&gt; G[物理符号假设 符号即智能]\n    G --&gt; H[质疑 感知 常识 具身]\n    E --&gt; I[静态分析只能近似]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面三个节点（哥德尔、图灵机、停机问题）汇到同一个技术手段——自指。看这张图要理解：它们不是三个孤立结论，而是同一个数学结构在不同对象上的三次应用。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：图灵机像一台只有&quot;读一格、写一格、左移或右移、换状态&quot;四个动作的机器。它慢得可怕，但理论上能模拟任何其他计算机——包括你现在用的这台。<\/p>\n<p>失效边界：它能模拟任何&quot;可计算&quot;的东西，但代价是时间。用图灵机模拟现代 CPU 跑一个程序，可能需要宇宙年龄那么长。所以&quot;能算&quot;和&quot;算得动&quot;是两件事。<\/p>\n<p><strong>实例<\/strong>（停机问题的日常版）：你写了一个 <code>while<\/code> 循环，想知道它会不会永远转下去，希望有个工具能告诉你答案。停机问题说：不存在能对所有程序都给出正确答案的工具。现实中的折中：工具只对某一类程序给保证（比如限定循环变量单调递减），或者给&quot;可能不停&quot;的警告。这就是为什么代码检查器总有一堆误报。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为图灵机是&quot;一台具体的机器&quot;。<\/strong> 它是数学抽象，用来定义可计算性，不是工程图纸。\n<\/li><li>\n<strong>别以为丘奇-图灵论题&quot;被证明&quot;了。<\/strong> 它是关于&quot;计算&quot;外延的主张，只能被反例推翻，不能被证明。\n<\/li><li>\n<strong>别以为不完备定理证明&quot;人比机器强&quot;。<\/strong> 它对人同样成立：人也不能证明所有真理。\n<\/li><li>\n<strong>别以为物理符号假设已经过时。<\/strong> 它在需要精确推理的领域仍然有效（定理证明、编译器），只是不再是&quot;智能的唯一路径&quot;。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：图灵机的三个部件是纸带、________、________。\n<p><strong>答案<\/strong>：读写头；状态表。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：停机问题不可判定的意思是？\n<ul>\n<li>\nA. 目前算力不够，以后能算\n<\/li><li>\nB. 不存在对所有程序都能给出正确判断的通用算法\n<\/li><li>\nC. 只有部分程序无法判断\n<\/li><li>\nD. 只有量子计算机能判断\n<p><strong>答案<\/strong>：B。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么丘奇-图灵论题不是定理？\n<p><strong>答案<\/strong>：它连接&quot;直觉上的可机械计算&quot;与&quot;图灵可计算&quot;，前者没有严格的数学定义，因此无法证明；它只能通过反例被推翻。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：物理符号假设受到质疑的理由包括：\n<ul>\n<li>\nA. 感知与行动中的智能可能不需要符号操作\n<\/li><li>\nB. 常识编码成本极高\n<\/li><li>\nC. 符号缺乏与世界的&quot;接地&quot;\n<\/li><li>\nD. 图灵机已被证明不存在\n<p><strong>答案<\/strong>：A、B、C。解析：图灵机是抽象模型，不存在&quot;被证明不存在&quot;的问题。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n图灵机三件：纸带、读写头、状态表，抽象掉一切实现细节。\n<\/li><li>\n可计算＝存在图灵机在有限步内对所有输入给出正确答案。\n<\/li><li>\n停机问题用自指反证，与哥德尔同源。\n<\/li><li>\n物理符号假设：符号操作是智能的必要且充分条件，今天两头都被质疑。\n<\/ul>", "kind": "chapter", "title": "第 9 章：人是机器吗——计算的理论边界"}, "ch10": {"html": "<h1>第 10 章：大语言模型——&quot;学习&quot;到底是什么<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 4、7 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 11 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用一句话说清&quot;学习＝压缩&quot;这个命题的直觉来源。\n<\/li><li>\n说出所罗门诺夫归纳与奥卡姆剃刀的关系。\n<\/li><li>\n解释为什么&quot;预测下一个词&quot;这个目标能产生看似推理的能力。\n<\/li><li>\n说出大模型能力的三个来源与两个已知短板。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>如果所有可能的模型都能拟合训练数据，那么&quot;最好的模型&quot;就是<strong>最短的那个描述<\/strong>。这就是学习＝压缩；而大语言模型在做的&quot;预测下一个词&quot;，本质是在找一个能最短描述人类文本的压缩器。<\/p>\n<h2>零基础讲解<\/h2>\n<blockquote>原书这一章从一位几乎被遗忘的人开始：所罗门诺夫（Ray Solomonoff）。他 1956 年整个暑假都待在达特茅斯，是会议最早的参与者之一，但他的工作几十年后才被真正理解。<\/blockquote>\n<h3>概念 1：所罗门诺夫归纳（难度：进阶）<\/h3>\n<p>问题：看到一串数据（比如 0101010101…），下一个是什么？<\/p>\n<p>朴素做法是统计频率。但所罗门诺夫提出了一个更彻底的做法：<strong>在所有能生成这串数据的程序里，找最短的那个<\/strong>，然后用这个程序去预测。<\/p>\n<p>理由是这样的：既然&quot;最短程序&quot;能生成已见数据，它大概率也能生成接下来要出现的部分——因为短程序不会浪费描述长度去记住无关的细节，它倾向于捕捉规律。<\/p>\n<p>这就是<strong>所罗门诺夫归纳<\/strong>，也叫&quot;最小描述长度&quot;（MDL）思想的源头。它的理论最优性基于一个惊人的假设：所有可能的数据生成程序，按 2^−长度 的先验概率分布。这个先验是不可计算的（不可枚举），所以它只能当理论基准。<\/p>\n<h3>概念 2：柯尔莫哥洛夫复杂度与奥卡姆剃刀（难度：进阶）<\/h3>\n<p>柯尔莫哥洛夫（Andrey Kolmogorov）独立提出了几乎相同的概念：<strong>一个对象的最短描述长度<\/strong>就是它的复杂度。随机串复杂度高（没有规律，只能逐字描述），规律串复杂度低。<\/p>\n<p>这和奥卡姆剃刀的&quot;如无必要，勿增实体&quot;是同一件事的数学化：<strong>在同等解释力下，选假设更少的那个<\/strong>。区别在于奥卡姆剃刀是方法论建议，柯尔莫哥洛夫复杂度是可定义的量（虽然也不可计算）。<\/p>\n<p>书里给了一句很好的总结：&quot;我压缩，故我在。&quot;意思是：一个系统能理解世界，表现为它能用很短的规则描述大量现象；不能压缩，说明没找到规律。<\/p>\n<blockquote>类比：你把一本小说存成 zip，文件小说明小说有大量重复结构；如果压不小，说明它近乎随机。学习就是一个不断找更好压缩方式的过程——找得越准，需要的描述越短。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：压缩率不能完全等同于理解。一段文本可以因为&quot;用词重复&quot;而被高度压缩，但读者可能完全不懂它的意思。压缩是必要条件的代理指标，不是理解本身。<\/blockquote>\n<h3>概念 3：为什么&quot;预测下一个词&quot;就够了（难度：高阶）<\/h3>\n<p>大语言模型的训练目标简单到不可思议：给定前文，预测下一个 token。用交叉熵损失，等价于最小化&quot;用模型分布编码真实文本&quot;的平均长度。<\/p>\n<p>这就是压缩目标的直接实现：<\/p>\n<ul><li>\n模型对下一个词的分布越准，编码真实文本所需比特越少；\n<\/li><li>\n损失下降 = 压缩率提升 = 对文本规律的掌握变强。\n<\/ul>\n<p>为什么这件事能产出推理能力？因为要准确预测下一个词，模型必须隐式地学到：<\/p>\n<ul><li>\n语法（哪些结构合法）\n<\/li><li>\n事实（谁是谁、什么在哪）\n<\/li><li>\n推理模式（&quot;因为…所以…&quot;后面通常接什么）\n<\/li><li>\n甚至任务格式（&quot;求…&quot;后面通常接解题步骤）\n<\/ul>\n<p>这些都不是人教的，是&quot;要压低损失就必须学&quot;的副产品。<\/p>\n<blockquote>这一点解释了一个常见困惑：为什么没有人教它&quot;做数学题要分步&quot;，它却会分步？因为训练语料里的解题文本就是分步写的，要预测得准，就得学会那个模式。<\/blockquote>\n<h3>概念 4：规模、数据、架构三件事（难度：进阶）<\/h3>\n<p>2020 年前后，研究者发现了一个经验规律（缩放定律）：模型性能随参数量、数据量、计算量按幂律提升。这带来一个简单粗暴的策略：把三样都放大。<\/p>\n<p>三个条件同时到位才有 2022 年的爆发：<\/p>\n<ul><li>\n<strong>架构<\/strong>：Transformer（2017）让训练可以大规模并行，GPU 利用率高。\n<\/li><li>\n<strong>数据<\/strong>：互联网级别的文本，几万亿 token。\n<\/li><li>\n<strong>算力<\/strong>：大规模 GPU/TPU 集群，训练一次要几个月。\n<\/ul>\n<p>而&quot;对齐&quot;（RLHF 等）解决的是另一个问题：预训练模型会续写，但不一定会&quot;回答问题&quot;。用人类偏好数据做强化学习，把它调成助手。<\/p>\n<h3>概念 5：能力的来源与边界（难度：高阶）<\/h3>\n<p><strong>三个来源<\/strong>：<\/p>\n<ol><li>\n<strong>压缩带来的规律掌握<\/strong>：语法、事实、常见推理链。\n<\/li><li>\n<strong>上下文学习<\/strong>：给几个例子，它能在前向计算中&quot;临时学会&quot;任务模式，不需要改参数。\n<\/li><li>\n<strong>规模带来的涌现<\/strong>：某些能力（多步推理、代码、翻译）在小模型上几乎没有，过某个规模突然出现。\n<\/ol>\n<p><strong>两个短板<\/strong>：<\/p>\n<ol><li>\n<strong>事实性<\/strong>：它优化的是&quot;像人写的文本&quot;，不是&quot;真的世界&quot;。所以它会流畅地编造。\n<\/li><li>\n<strong>因果与规划<\/strong>：它能复现语料中的推理模式，但遇到需要真正因果模型或长程规划的任务，容易崩。\n<\/ol>\n<blockquote>这也解释了为什么&quot;再加数据&quot;不能解决幻觉：幻觉不是数据不足，而是目标函数不区分&quot;真&quot;和&quot;像真的&quot;。要解决它，需要外部知识、工具调用、验证机制。<\/blockquote>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[数据串 0101...] --&gt; B[找最短生成程序]\n    B --&gt; C[所罗门诺夫归纳]\n    C --&gt; D[柯尔莫哥洛夫复杂度]\n    D --&gt; E[奥卡姆剃刀 数学化]\n    E --&gt; F[学习等于压缩]\n    F --&gt; G[预测下一个词 交叉熵]\n    G --&gt; H[Transformer 大规模并行]\n    H --&gt; I[缩放定律 参数 数据 算力]\n    I --&gt; J[大语言模型]\n    J --&gt; K[上下文学习 涌现]\n    J --&gt; L[短板 幻觉 长程规划]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这条链把&quot;哲学上的简洁性原则&quot;一路推到&quot;工程上的训练目标&quot;。看的时候注意 F 点：它是整条链的枢纽，前面是理论，后面是实现。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：想象你要用最少的字数向朋友描述一部长篇小说。如果你只能说&quot;一个男人经历了很多事&quot;，字数少但信息丢光；如果要逐字复述，字数多但没压缩。好的描述是&quot;一个被冤枉入狱的人越狱后复仇&quot;——短，且能生成大部分情节。学习就是找这种描述。<\/p>\n<p>失效边界：小说有主题和结构，所以能压缩；随机噪声不能。现实世界的观测里，有大量真正随机的成分，压缩有下限。<\/p>\n<p><strong>实例<\/strong>（压缩率与困惑度）：假设一个模型对某段文本的平均交叉熵是 1 bit/token，另一个是 3 bit/token。前者意味着它平均只要 1 个比特就能编码一个词的选择，后者要 3 个。比特越少，说明模型越&quot;懂&quot;这段文本的规律。这就是为什么语言模型的评价指标叫&quot;困惑度&quot;（perplexity）——它本质上是平均编码长度的指数形式。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;预测下一个词&quot;是个低级目标。<\/strong> 要预测得准，必须掌握语法、事实、推理模式；这个目标的难点在数据规模上，不在目标本身。\n<\/li><li>\n<strong>别以为参数量越大越好。<\/strong> 缩放定律是三件事同时放大，只加参数不加数据会欠训练。\n<\/li><li>\n<strong>别以为幻觉是&quot;记错了&quot;。<\/strong> 它是目标函数的性质：模型被优化成&quot;生成像人写的东西&quot;，不是&quot;生成真的东西&quot;。\n<\/li><li>\n<strong>别以为涌现是玄学。<\/strong> 它指的是某些能力在小规模上测不出来、过了阈值才显现；机制仍未完全解释，但现象可复现。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：所罗门诺夫归纳的核心是：在所有能生成数据的程序里，找________的那个。\n<p><strong>答案<\/strong>：最短。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：&quot;学习＝压缩&quot;这个命题最接近下列哪种表述？\n<ul>\n<li>\nA. 学习就是把数据存下来\n<\/li><li>\nB. 好的模型能用更短的描述生成更多数据\n<\/li><li>\nC. 压缩率越高参数越少\n<\/li><li>\nD. 压缩就是降维\n<p><strong>答案<\/strong>：B。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么&quot;预测下一个词&quot;能带来推理能力？\n<p><strong>答案<\/strong>：要压低交叉熵，模型必须掌握文本中的语法、事实与推理模式；这些是准确预测的必要条件，因此作为副产物被学到。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：大模型幻觉的成因包括：\n<ul>\n<li>\nA. 训练目标是&quot;像人写的&quot;，不是&quot;符合事实&quot;\n<\/li><li>\nB. 缺乏外部知识校验机制\n<\/li><li>\nC. 参数量太大\n<\/li><li>\nD. 长尾事实在训练数据中出现次数少\n<p><strong>答案<\/strong>：A、B、D。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n学习＝压缩：最短描述能生成最多数据。\n<\/li><li>\n所罗门诺夫归纳 → 柯尔莫哥洛夫复杂度 → 奥卡姆剃刀的数学化。\n<\/li><li>\n预测下一个词＝最小化编码长度，副产品是语法、事实、推理模式。\n<\/li><li>\n爆发靠架构、数据、算力三件事同时到位；短板是事实性与长程规划。\n<\/ul>", "kind": "chapter", "title": "第 10 章：大语言模型——“学习”到底是什么"}, "ch11": {"html": "<h1>第 11 章：哲学质疑、教科书变迁与智能的进化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 9、10 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 12、13、14、15、16 章合并\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n复述德雷弗斯、塞尔、普特南三家对&quot;机器能思考&quot;的批评，并指出各自的薄弱处。\n<\/li><li>\n说出教科书四十年变迁说明了什么。\n<\/li><li>\n用数字说明人脑的规模与能耗，并解释&quot;皮层神经元数量&quot;为什么比&quot;总神经元数&quot;更重要。\n<\/li><li>\n复述作者的三分法与那个&quot;计划经济/市场经济&quot;的比喻。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>哲学家的任务是不断指出&quot;你还差什么&quot;，工程界的任务是&quot;先用起来再说&quot;。这两件事永远对不齐，但正是这种不对齐推动了领域前进——<strong>每一次哲学批评，后来都变成了一个具体的技术问题<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<blockquote>原书最后几章把哲学、教科书、脑科学、作者自己的判断放在一起，其实是在收束一条线：人工智能到底是什么。作者最后的答案是三分法，不是选一个赢家。<\/blockquote>\n<h3>概念 1：德雷弗斯——&quot;不能做什么&quot;（难度：基础）<\/h3>\n<p>休伯特·德雷弗斯（Hubert Dreyfus）1972 年出版《计算机不能做什么》，源自他 1965 年在兰德公司的报告。核心论点：<\/p>\n<ol><li>\n<strong>常识无法穷举<\/strong>：人做判断依靠大量背景知识，这些知识无法全部写成规则。\n<\/li><li>\n<strong>情境依赖<\/strong>：同一个动作在不同情境下意义不同，规则无法覆盖。\n<\/li><li>\n<strong>身体的作用<\/strong>：人的技能建立在身体与世界的互动上，没有身体的机器学不会&quot;熟练&quot;。\n<\/ol>\n<p>书里还提到他的兄弟斯图尔特·德雷弗斯写的《人定胜机》，以及他们合作的一本书。这两兄弟的观点后来被&quot;专家系统失败&quot;和&quot;机器人学需要身体&quot;两件事部分验证了。<\/p>\n<p>薄弱处：他们的批评精准指出了符号派的困难，但没有给出替代方案；而&quot;熟练技能&quot;这件事，深度强化学习在某种程度上绕过去了（不用显式规则，直接从试错中学）。<\/p>\n<h3>概念 2：塞尔的中文屋（难度：基础）<\/h3>\n<p>1980 年，塞尔（John Searle）提出中文屋思想实验：<\/p>\n<blockquote>你被关在房间里，不懂中文，但有一本规则手册，告诉你&quot;看到这种形状的符号，就输出那种形状的符号&quot;。外面的人递进中文问题，你按手册操作，输出中文答案。外面的人看来，你&quot;懂中文&quot;；但你自己知道，你只是照规则搬符号。<\/blockquote>\n<p>塞尔的结论：<strong>符号操作不等于理解<\/strong>。语法（符号的形式规则）不能产生语义（符号的意义）。所以&quot;强人工智能&quot;（真正理解）不可能通过纯符号程序实现。<\/p>\n<p>这个论证的争议点：<\/p>\n<ul><li>\n<strong>系统反驳<\/strong>：房间里的你不是理解者，整个&quot;房间 + 手册 + 你&quot;才是；系统整体可能理解。\n<\/li><li>\n<strong>机器人反驳<\/strong>：如果这个系统还与世界互动（有感知和行动），符号就有了接地。\n<\/li><li>\n<strong>模拟与复制之争<\/strong>：塞尔说&quot;模拟消化不等于消化&quot;，反驳者说&quot;那要看你怎么定义消化&quot;。\n<\/ul>\n<p>书里的评价是：中文屋把&quot;理解&quot;这个词的模糊性暴露得最彻底。它没有证明机器不能理解，它证明的是<strong>我们说不清&quot;理解&quot;是什么<\/strong>。<\/p>\n<h3>概念 3：普特南的缸中脑（难度：进阶）<\/h3>\n<p>普特南（Hilary Putnam）在《理性、真理与历史》（1981）里提出：如果一个人的大脑被取出放在营养液里，由计算机输入虚假的感官信号，他会不会知道自己在缸里？<\/p>\n<p>他的论证（后来他自己也部分放弃）是：如果&quot;缸&quot;这个词的意义来自我们与真实世界的因果联系，那么缸中脑说的&quot;缸&quot;根本指不到任何东西。由此推出&quot;指称依赖于外部世界&quot;。<\/p>\n<p>这条论证对 AI 的意义在于：<strong>意义可能不是纯内部的东西<\/strong>。一个只在文本里学词的模型，其&quot;意义&quot;是否成立，取决你接受哪种意义理论。这和第 8 章乔姆斯基的争论是同一个问题的两个侧面。<\/p>\n<h3>概念 4：教科书四十年（难度：基础）<\/h3>\n<p>书里列了尼尔森（Nils Nilsson）四本教科书的变迁，这条线索很有意思：<\/p>\n<table><thead><tr><th>年份<\/th><th>书名<\/th><th>主题重心<\/th><\/tr><\/thead><tbody><tr><td>1965<\/td><td>《学习机器》<\/td><td>机器学习<\/td><\/tr><tr><td>1971<\/td><td>《问题求解方法》<\/td><td>搜索与问题求解<\/td><\/tr><tr><td>1980<\/td><td>《人工智能原理》<\/td><td>符号推理、知识表示<\/td><\/tr><tr><td>1998<\/td><td>《人工智能：新的综合》<\/td><td>学习重新成为主线<\/td><\/tr><\/tbody><\/table>\n<p>四十年正好走了一个圈：从学习出发，绕到符号推理，再回到学习。书里用一句话概括：&quot;从机器学习起，到机器学习终。&quot;<\/p>\n<p>为什么绕这一圈？因为中间那三十年，符号方法在工程上更可行；而到了 1998 年，算力和数据让统计方法重新占优。<\/p>\n<h3>概念 5：人脑的规模与能耗（难度：进阶）<\/h3>\n<p>书里引了埃尔库拉诺-乌泽尔（Suzana Herculano-Houzel）的&quot;大脑汤&quot;方法：把脑组织溶解成细胞悬液，直接数细胞核，比传统切片估算准得多。测出来的数字：<\/p>\n<ul><li>\n人脑约 <strong>860 亿<\/strong>个神经元，其中皮层约 <strong>160 亿<\/strong>。\n<\/li><li>\n大象约 <strong>2570 亿<\/strong>个神经元，但 <strong>98% 在小脑<\/strong>，皮层只有约 <strong>56 亿<\/strong>。\n<\/ul>\n<p>这个对比推翻了一个流行说法&quot;神经元越多越聪明&quot;。关键在<strong>皮层神经元的数量<\/strong>，不在总数。人脑的皮层神经元数量在哺乳动物里是最高的之一。<\/p>\n<p>能耗方面：人脑约占体重的 2%，却消耗约 25% 的能量。这个能效比今天的 GPU 高得多——这也是类脑计算（第 3 章之外的另一条线）的动机。<\/p>\n<p>书里还提到一个有趣的观点：<strong>烹饪<\/strong>是人类超越其他物种的关键之一。加热让食物更易消化，把能量从消化系统转移到大脑，为大脑的扩张提供了物质基础。这个说法来自人类学，不是 AI，但作者用它说明&quot;智能不是纯算法，它依赖物质条件&quot;。<\/p>\n<h3>概念 6：作者的三分法（难度：高阶）<\/h3>\n<p>这是全书的收尾判断。作者把人工智能分成三派：<\/p>\n<ol><li>\n<strong>逻辑主义 / 规则派<\/strong>：智能＝符号推理。代表：逻辑理论家、专家系统、Prolog。\n<\/li><li>\n<strong>连接主义 / 统计派<\/strong>：智能＝从数据中拟合分布。代表：神经网络、深度学习、大模型。\n<\/li><li>\n<strong>自然主义<\/strong>：智能＝在环境中适应的行为。代表：进化算法、强化学习、机器人学、具身智能。\n<\/ol>\n<p>然后是一个很妙的比喻：<\/p>\n<blockquote><strong>规则派像计划经济，统计派像自由市场经济。<\/strong><\/blockquote>\n<p>计划经济：自上而下制定规则，覆盖已知情况，遇到没规定的就僵住。自由市场：自下而上从数据中涌现规律，适应性强，但不可解释、可能失控。<\/p>\n<p>这个比喻点出了本书的核心判断：<strong>没有哪一派能单独解决智能问题<\/strong>。规则派的可解释性、统计派的适应性、自然主义的具身性，各自解决不同层面的问题。<\/p>\n<p>作者还提到一句常被引用的话：深度学习不过是层数多一些；所有神经网络模型都是宽的，而不是深的。这句话是在提醒：不要被&quot;深&quot;这个字迷惑，真正的能力来自规模与数据的配合，而非某个架构上的玄机。<\/p>\n<h3>概念 7：图灵的生死与《斐多篇》（难度：基础）<\/h3>\n<p>书里有一章专门写图灵的死：1952 年因同性恋被定罪，被迫接受化学阉割，1954 年吃下浸过氰化物的苹果去世，年仅 41 岁。英国 2013 年给予皇家赦免。<\/p>\n<p>作者借苏格拉底《斐多篇》里关于灵魂不朽的对话，讨论&quot;机器能否不死&quot;。这一段的用意不是技术，而是提醒：这个领域从一开始就有人在问&quot;机器与人到底差在哪&quot;，而这个问题从来没有标准答案。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[哲学批评] --&gt; B[德雷弗斯 常识与身体]\n    A --&gt; C[塞尔 中文屋 语法不等于语义]\n    A --&gt; D[普特南 缸中脑 意义依赖外部]\n    B --&gt; E[变成技术问题 具身 学习]\n    C --&gt; E\n    D --&gt; E\n    E --&gt; F[三条路线]\n    F --&gt; G[逻辑主义 规则派 计划经济]\n    F --&gt; H[连接主义 统计派 自由市场]\n    F --&gt; I[自然主义 进化 强化学习 具身]\n    G --&gt; J[可解释 但脆]\n    H --&gt; K[适应 但不可解释]\n    I --&gt; L[能行动 但难训练]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半部分是&quot;批评如何转化成问题&quot;，下半部分是&quot;三条路线各自的强项与弱点&quot;。看这张图要接受一个结论：三条路线不是替代关系，是分工关系。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：三条路线像三种治国方式。规则派是法典治国，什么都写清楚，但新情况一来就要修法；统计派是市场调节，效率高，但危机来了没人能解释为什么；自然主义是生态演化，能适应，但慢且不可控。<\/p>\n<p>失效边界：国家可以同时有法律、市场、生态，而一个 AI 系统往往只能选一条主路线，混合的代价很高（可解释性与性能常常互相牵制）。<\/p>\n<p><strong>实例<\/strong>（一个混合系统）：现代自动驾驶就是一个三层混合：规则层（交规、安全兜底，属于逻辑主义）、感知层（神经网络识别行人车辆，属于连接主义）、决策层（强化学习或规划算法优化乘坐舒适性，属于自然主义）。它说明工程上早就在混合，只是学术叙述喜欢分成派别。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为中文屋证明&quot;机器永远不能理解&quot;。<\/strong> 它证明的是&quot;纯符号操作不等于理解&quot;，以及&quot;理解&quot;这个词本身没有清晰定义。\n<\/li><li>\n<strong>别以为神经元越多越聪明。<\/strong> 关键在皮层神经元数量与连接结构；大象总数是人脑的三倍，皮层却少得多。\n<\/li><li>\n<strong>别以为三分法是&quot;谁赢了&quot;的结论。<\/strong> 作者明确说三派各解决不同层面，是分工不是替代。\n<\/li><li>\n<strong>别以为&quot;深度学习只是层数多&quot;是贬低。<\/strong> 它是在纠正一种神秘化叙述：能力来自规模、数据、训练方法的配合。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：塞尔的中文屋论证想说明，________操作不等于________。\n<p><strong>答案<\/strong>：语法（符号）；语义（理解）。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：人脑皮层神经元数量约为？\n<ul>\n<li>\nA. 860 亿\n<\/li><li>\nB. 160 亿\n<\/li><li>\nC. 2570 亿\n<\/li><li>\nD. 56 亿\n<p><strong>答案<\/strong>：B。解析：860 亿是总神经元数，2570 亿是大象总数，56 亿是大象皮层数。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：作者用&quot;计划经济&quot;和&quot;自由市场经济&quot;分别比喻哪两派？各自的弱点是什么？\n<p><strong>答案<\/strong>：计划经济比喻规则派（逻辑主义），自上而下写规则，遇到未覆盖的情况就僵住；自由市场比喻统计派（连接主义），从数据中涌现规律，适应性强但不可解释、可能失控。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：尼尔森四本教科书的主题演变说明：\n<ul>\n<li>\nA. 领域重心从学习转向符号推理，再回到学习\n<\/li><li>\nB. 学科的技术可行性随算力变化而摆动\n<\/li><li>\nC. 符号方法从未被使用过\n<\/li><li>\nD. 统计方法在 1990 年代末重新成为主线\n<p><strong>答案<\/strong>：A、B、D。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三家哲学批评各自打中一个要害：常识、语义、意义的外部性。\n<\/li><li>\n教科书四十年：从学习出发，绕一圈回到学习。\n<\/li><li>\n人脑 860 亿神经元、皮层 160 亿，能耗占身体 25%。\n<\/li><li>\n三分法：规则派＝计划经济、统计派＝自由市场、自然主义＝生态演化。\n<\/ul>", "kind": "chapter", "title": "第 11 章：哲学质疑、教科书变迁与智能的进化"}, "c01": {"html": "<h1>图灵测试与中文屋<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1、8、11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>图灵测试问&quot;行为上能否骗过人&quot;，中文屋问&quot;内部是否真的理解&quot;。两个问题长得像，问的其实不是一件事。<\/p>\n<h2>为什么重要<\/h2>\n<p>整个领域的自我评价标准都绕不开这两个思想实验。它们决定了你用哪把尺子量 AI：量行为，还是量机制。<\/p>\n<h2>详解<\/h2>\n<p><strong>图灵测试（1950）<\/strong>：一个人通过文字与两端对话，如果分不出哪端是机器，就判定机器具有智能。它的设计刻意回避&quot;机器内部怎么想&quot;——只看可观察的行为。<\/p>\n<p>它的优点是<strong>可操作<\/strong>：不需要定义意识就能做实验。缺点是<strong>可欺骗<\/strong>：一个背了海量对话模板的程序也能通过，但这不说明它懂。<\/p>\n<p><strong>中文屋（1980）<\/strong>：塞尔构造一个不懂中文的人，靠规则手册把中文符号搬进搬出，外面的人以为他懂中文。结论：符号操作（语法）不等于理解（语义）。<\/p>\n<p>两者的关系可以这样看：<\/p>\n<table><thead><tr><th><\/th><th>图灵测试<\/th><th>中文屋<\/th><\/tr><\/thead><tbody><tr><td>问的问题<\/td><td>外部能否区分<\/td><td>内部是否理解<\/td><\/tr><tr><td>判据<\/td><td>行为<\/td><td>机制/语义<\/td><\/tr><tr><td>对 AI 的态度<\/td><td>乐观（行为达标即可）<\/td><td>悲观（行为达标不算）<\/td><\/tr><tr><td>弱点<\/td><td>可被欺骗<\/td><td>无法证伪&quot;系统整体理解&quot;<\/td><\/tr><\/tbody><\/table>\n<h2>常见误解<\/h2>\n<p><strong>别以为中文屋证明了&quot;机器永远不能理解&quot;<\/strong>——它证明的是&quot;纯符号操作不构成理解&quot;，而&quot;理解&quot;本身没有公认定义。系统反驳（整个房间算一个系统）至今没有被彻底驳倒。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>图灵 1950 年文章<\/td><td>行为主义式的智能判据<\/td><\/tr><tr><td>第 8 章<\/td><td>乔姆斯基批评大模型<\/td><td>模式匹配与理解的界线<\/td><\/tr><tr><td>第 11 章<\/td><td>塞尔、普特南<\/td><td>语义与&quot;接地&quot;问题<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">压缩即学习<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">具身智能<\/a>\n<\/ul>", "kind": "concept", "title": "图灵测试与中文屋"}, "c02": {"html": "<h1>符号主义与连接主义<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1、2、3、4、11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>符号主义认为智能是&quot;操作符号&quot;，连接主义认为智能是&quot;从数据里拟合出映射&quot;。这是同一门学科里最持久的一次分裂。<\/p>\n<h2>为什么重要<\/h2>\n<p>你读到的几乎每一次&quot;AI 寒冬&quot;和&quot;AI 复兴&quot;，都是这两派势力消长的结果。判断一项新技术属于哪一派，是理解它能力边界的第一步。<\/p>\n<h2>详解<\/h2>\n<table><thead><tr><th><\/th><th>符号主义<\/th><th>连接主义<\/th><\/tr><\/thead><tbody><tr><td>知识从哪来<\/td><td>人写进去的规则<\/td><td>从数据里学出来的参数<\/td><\/tr><tr><td>典型产物<\/td><td>逻辑程序、专家系统、知识图谱<\/td><td>感知机、CNN、Transformer<\/td><\/tr><tr><td>优点<\/td><td>可解释、精确、样本需求低<\/td><td>适应模糊模式、可扩展、能处理感知<\/td><\/tr><tr><td>弱点<\/td><td>遇到没写的情况就崩<\/td><td>不可解释、需要大量数据<\/td><\/tr><tr><td>类比<\/td><td>计划经济<\/td><td>自由市场经济<\/td><\/tr><\/tbody><\/table>\n<p>历史节奏：<\/p>\n<ol><li>\n1950s—1960s 符号派主导（定理证明、通用问题求解）。\n<\/li><li>\n1970s 第一次寒冬，两派都受挫。\n<\/li><li>\n1980s 专家系统商业化，符号派回潮；同时反向传播出现。\n<\/li><li>\n1990s SVM 压制神经网络，连接主义再受挫。\n<\/li><li>\n2012 之后连接主义全面胜出。\n<\/li><li>\n2020s 出现融合：神经符号方法、工具调用、检索增强。\n<\/ol>\n<h2>常见误解<\/h2>\n<p><strong>别以为这是&quot;谁对谁错&quot;的问题<\/strong>。符号方法在需要精确与可审计的场景（编译器、法律条文、定理证明）至今不可替代；连接方法在感知与生成上无可匹敌。二者是分工。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>1955 年学习机讨论会<\/td><td>皮茨：&quot;模拟神经系统 vs 模拟心智，殊途同归&quot;<\/td><\/tr><tr><td>第 2、3 章<\/td><td>定理证明、专家系统<\/td><td>符号派的黄金期与瓶颈<\/td><\/tr><tr><td>第 4 章<\/td><td>神经网络三次起伏<\/td><td>连接派的长期受压与反超<\/td><\/tr><tr><td>第 11 章<\/td><td>作者三分法<\/td><td>两派各解决不同层面<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">专家系统与知识获取瓶颈<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">感知机与线性不可分<\/a>\n<\/ul>", "kind": "concept", "title": "符号主义与连接主义"}, "c03": {"html": "<h1>专家系统与知识获取瓶颈<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>专家系统是把领域专家的&quot;如果…那么…&quot;规则写进程序，让机器照着推。瓶颈在于&quot;把专家的知识问出来&quot;这一步，叫知识获取。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 1980 年代 AI 唯一赚到钱的形态，也是&quot;知识工程&quot;这个词的来源。今天的知识图谱、RAG、工具调用，都是它的后裔，也继承了它的成本问题。<\/p>\n<h2>详解<\/h2>\n<p>结构三件套：知识库（规则）、推理机（匹配与链式推理）、解释器（说明为什么）。<\/p>\n<p>推理方式两种：<\/p>\n<ul><li>\n<strong>前向链<\/strong>：从已知事实出发，反复匹配规则推新结论。适合监控与告警。\n<\/li><li>\n<strong>后向链<\/strong>：从目标出发倒推需要哪些条件。适合诊断与问答。\n<\/ul>\n<p><strong>知识获取瓶颈<\/strong>的三层：<\/p>\n<ol><li>\n<strong>专家说不出<\/strong>：技能是模式识别式的，无法语言化。\n<\/li><li>\n<strong>专家说不准<\/strong>：人对自身决策的解释常是事后编的。\n<\/li><li>\n<strong>规则会冲突<\/strong>：不同专家的规则互斥，需要仲裁。\n<\/ol>\n<p>DE​NDRAL 能成功，是因为它的知识有客观判据（质谱数据可以验证分子结构）；MYCIN 没能落地，是因为医学诊断的责任与信任问题无法用准确率解决。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为专家系统死于算力不够<\/strong>——MYCIN 在 1970 年代的机器上就能跑，它死于部署成本、信任与责任归属。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>DENDRAL、MYCIN<\/td><td>专家系统的方法与落地困境<\/td><\/tr><tr><td>第 3 章<\/td><td>第五代计算机<\/td><td>把规则推理塞进硬件的失败尝试<\/td><\/tr><tr><td>第 3 章<\/td><td>知识图谱<\/td><td>换表示以绕开规则冲突<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">符号主义与连接主义<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">组合爆炸<\/a>\n<\/ul>", "kind": "concept", "title": "专家系统与知识获取瓶颈"}, "c04": {"html": "<h1>组合爆炸<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2、6、9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每一步都有几个选择、要走很多步时，总路径数随步数指数增长，很快就超过任何计算机的能力。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是符号派所有失败的总原因：不是逻辑错了，是算不完。理解它，你就能预判哪些问题&quot;理论上能解、实际不能解&quot;。<\/p>\n<h2>详解<\/h2>\n<p>基本算式：分支因子 b、深度 d，节点数约 b^d。<\/p>\n<ul><li>\n国际象棋：b≈35，d=10 → 约 2.7×10^15 个节点\n<\/li><li>\n围棋：b≈250，d=100 → 天文数字\n<\/ul>\n<p>三种对策：<\/p>\n<table><thead><tr><th>对策<\/th><th>做什么<\/th><th>代价<\/th><\/tr><\/thead><tbody><tr><td>剪枝<\/td><td>证明某些分支不影响结果，直接跳过<\/td><td>需要可靠的上下界<\/td><\/tr><tr><td>启发<\/td><td>用估计函数引导搜索方向<\/td><td>估计不准会错过最优<\/td><\/tr><tr><td>学习<\/td><td>用模型直接砍掉大量候选<\/td><td>需要数据与训练<\/td><\/tr><\/tbody><\/table>\n<p>Alpha-Beta 剪枝最优情况把有效分支因子从 b 降到 √b；AlphaGo 用策略网络把候选从 250 砍到几十。这两条路都是为了绕开同一个障碍。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为&quot;算力变强了组合爆炸就不成问题&quot;<\/strong>——指数增长会吞掉任何线性提升。算力翻 1000 倍，只能多搜 log(1
