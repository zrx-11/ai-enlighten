 9 章：人是机器吗——计算的理论边界<\/h1><div class='quiz-item' data-qid='ch09-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 图灵机的三个部件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q01' value='0'> 纸带、读写头、状态表<\/label><label class='quiz-opt'><input type='radio' name='ch09-q01' value='1'> 内存、CPU、硬盘<\/label><label class='quiz-opt'><input type='radio' name='ch09-q01' value='2'> 输入、输出、程序<\/label><label class='quiz-opt'><input type='radio' name='ch09-q01' value='3'> 编码、解码、校验<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 停机问题的证明使用____构造，与哥德尔不完备定理同源。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 丘奇-图灵论题为什么不是定理？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q03' value='0'> 已被证明为假<\/label><label class='quiz-opt'><input type='radio' name='ch09-q03' value='1'> 它连接直观概念与数学定义，前者无法形式化<\/label><label class='quiz-opt'><input type='radio' name='ch09-q03' value='2'> 只有部分情况成立<\/label><label class='quiz-opt'><input type='radio' name='ch09-q03' value='3'> 它只是猜想<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 物理符号假设受到质疑的理由包括：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch09-q04' value='0'> 感知与行动中的智能可能不需要符号<\/label><label class='quiz-opt'><input type='checkbox' name='ch09-q04' value='1'> 常识编码成本极高<\/label><label class='quiz-opt'><input type='checkbox' name='ch09-q04' value='2'> 符号缺乏与世界的接地<\/label><label class='quiz-opt'><input type='checkbox' name='ch09-q04' value='3'> 图灵机被证明不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章：大语言模型——“学习”到底是什么<\/h1><div class='quiz-item' data-qid='ch10-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 所罗门诺夫归纳的核心是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q01' value='0'> 统计词频<\/label><label class='quiz-opt'><input type='radio' name='ch10-q01' value='1'> 在所有能生成数据的程序里找最短的<\/label><label class='quiz-opt'><input type='radio' name='ch10-q01' value='2'> 用最大似然估计<\/label><label class='quiz-opt'><input type='radio' name='ch10-q01' value='3'> 用神经网络拟合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 语言模型的交叉熵损失，本质上是最小化文本的____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 为什么预测下一个词能带来推理能力？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q03' value='0'> 因为目标本身很难<\/label><label class='quiz-opt'><input type='radio' name='ch10-q03' value='1'> 因为压低损失必须掌握语法、事实与推理模式<\/label><label class='quiz-opt'><input type='radio' name='ch10-q03' value='2'> 因为模型很大<\/label><label class='quiz-opt'><input type='radio' name='ch10-q03' value='3'> 因为人工标注了推理步骤<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 大模型幻觉的成因包括：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch10-q04' value='0'> 目标是像人写的而不是符合事实<\/label><label class='quiz-opt'><input type='checkbox' name='ch10-q04' value='1'> 缺乏外部知识校验<\/label><label class='quiz-opt'><input type='checkbox' name='ch10-q04' value='2'> 参数量太大<\/label><label class='quiz-opt'><input type='checkbox' name='ch10-q04' value='3'> 长尾事实在训练数据中出现少<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章：哲学质疑、教科书变迁与智能的进化<\/h1><div class='quiz-item' data-qid='ch11-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 塞尔中文屋论证想说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q01' value='0'> 机器一定能理解中文<\/label><label class='quiz-opt'><input type='radio' name='ch11-q01' value='1'> 语法操作不等于语义理解<\/label><label class='quiz-opt'><input type='radio' name='ch11-q01' value='2'> 中文比英文难<\/label><label class='quiz-opt'><input type='radio' name='ch11-q01' value='3'> 符号系统不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch11-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 人脑约 860 亿神经元，其中皮层约____亿；大象总神经元多，但皮层只有约____亿。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch11-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 作者用「计划经济」比喻哪一派？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q03' value='0'> 连接主义<\/label><label class='quiz-opt'><input type='radio' name='ch11-q03' value='1'> 逻辑主义（规则派）<\/label><label class='quiz-opt'><input type='radio' name='ch11-q03' value='2'> 自然主义<\/label><label class='quiz-opt'><input type='radio' name='ch11-q03' value='3'> 强化学习<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch11-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 尼尔森四本教科书的主题演变说明：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch11-q04' value='0'> 重心从学习到符号推理再回到学习<\/label><label class='quiz-opt'><input type='checkbox' name='ch11-q04' value='1'> 技术可行性随算力变化而摆动<\/label><label class='quiz-opt'><input type='checkbox' name='ch11-q04' value='2'> 符号方法从未被使用<\/label><label class='quiz-opt'><input type='checkbox' name='ch11-q04' value='3'> 统计方法在 1990 年代末重新成为主线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='人工智能'>人工智能 — 以机器为载体展示出来的人类智能 <span class=glossary-ref>（第 1 章：缘起——从图灵到 1956 年达特茅斯会议）<\/span><\/li><li data-term='模仿游戏'>模仿游戏 — 图灵 1950 年提出的测试：文字对话中分不出人机即判定有智能 <span class=glossary-ref>（第 1 章：缘起——从图灵到 1956 年达特茅斯会议）<\/span><\/li><li data-term='图灵测试'>图灵测试 — 后世对模仿游戏的称呼 <span class=glossary-ref>（第 1 章：缘起——从图灵到 1956 年达特茅斯会议）<\/span><\/li><li data-term='肉体智能'>肉体智能 — 图灵 1948 年提出的概念：需要身体与感知的智能 <span class=glossary-ref>（第 1 章：缘起——从图灵到 1956 年达特茅斯会议）<\/span><\/li><li data-term='无肉体智能'>无肉体智能 — 不需要身体的纯符号推理式智能 <span class=glossary-ref>（第 1 章：缘起——从图灵到 1956 年达特茅斯会议）<\/span><\/li><li data-term='学科共同体'>学科共同体 — 共同关注同一类问题、共享评价标准的研究者群体 <span class=glossary-ref>（第 1 章：缘起——从图灵到 1956 年达特茅斯会议）<\/span><\/li><li data-term='逻辑主义'>逻辑主义 — 认为数学可以归约到逻辑的立场，代表是罗素 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='形式主义'>形式主义 — 认为数学是符号串到符号串的变换，代表是希尔伯特 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='直觉主义'>直觉主义 — 认为数学是心智构造、拒绝排中律的立场，代表是布劳威尔 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='不完备定理'>不完备定理 — 足够强的形式系统中存在既不可证也不可证伪的命题 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='三段论'>三段论 — 亚里士多德的形式推理，最早把推理规则化 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='谓词逻辑'>谓词逻辑 — 把句子拆成对象与性质、并允许量词的一阶逻辑 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='全称量词'>全称量词 — 符号 ∀，表示对所有对象成立 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='存在量词'>存在量词 — 符号 ∃，表示至少存在一个对象 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='根岑'>根岑 — 证明论奠基者，1935 年引入 ∀ 与 ∃ 符号 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='逻辑理论家'>逻辑理论家 — 纽厄尔与西蒙 1956 年的定理证明程序 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='归结原理'>归结原理 — 把推理化为子句消去，配合反证使用 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='子句'>子句 — 若干文字的析取，归结原理的操作单位 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='sat 求解'>SAT 求解 — 判定布尔公式是否可满足 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='smt 求解'>SMT 求解 — 在带背景理论的一阶逻辑上做可满足性判定 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='形式化验证'>形式化验证 — 用机器检查数学证明或程序正确性 <span class=glossary-ref>（第 2 章：自动定理证明的兴衰）<\/span><\/li><li data-term='专家系统'>专家系统 — 把领域专家的规则写进程序做推理的系统 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='知识库'>知识库 — 存规则或三元组的仓库 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='推理机'>推理机 — 拿事实匹配规则、推出新结论的部件 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='前向链'>前向链 — 从事实出发推结论，数据驱动 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='后向链'>后向链 — 从目标出发倒推条件，目标驱动 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='知识获取瓶颈'>知识获取瓶颈 — 把专家知识问出来并形式化的困难 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='知识工程师'>知识工程师 — 负责访谈专家、把知识写成规则的人 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='知识图谱'>知识图谱 — 用（头实体, 关系, 尾实体）三元组存储事实的网络 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='语义网'>语义网 — 给网页加机器可读语义标注的构想 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='三元组'>三元组 — 知识图谱的最小存储单位 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='路径排序'>路径排序 — 把关系路径当特征、学习哪条路径可信的推理方法 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='第五代计算机'>第五代计算机 — 日本 1981—1992 年押注并行逻辑推理硬件的计划 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='prolog'>Prolog — 基于逻辑程序的编程语言，第五代机的核心语言 <span class=glossary-ref>（第 3 章：专家系统、知识图谱与第五代计算机）<\/span><\/li><li data-term='感知机'>感知机 — 最早的线性神经元模型，无法解决异或 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='赫布规则'>赫布规则 — 同时激活的神经元之间连接会增强 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='控制论'>控制论 — 维纳创立的动物与机器通信控制研究 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='线性可分'>线性可分 — 存在一个超平面能把两类点分开 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='异或'>异或 — 两输入不同则输出 1 的逻辑运算，线性不可分 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='反向传播'>反向传播 — 用链式法则从损失倒推各层梯度 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='梯度消失'>梯度消失 — 层数多时梯度连乘衰减到近零 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='联结主义'>联结主义 — 以神经网络为智能模型的研究纲领 <span class=glossary-ref>（第 4 章：神经网络的三起三落）<\/span><\/li><li data-term='遗传算法'>遗传算法 — 编码、选择、交叉、变异的随机搜索方法 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='适应度'>适应度 — 衡量个体好坏的打分函数 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='遗传编程'>遗传编程 — 以树结构为基因、能自动生成程序的进化方法 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='细胞自动机'>细胞自动机 — 规则统一作用于格点、整体涌现复杂行为的模型 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='没有免费午餐'>没有免费午餐 — 平均所有问题时任何优化算法表现相同 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='马尔可夫决策过程'>马尔可夫决策过程 — 状态、动作、奖励、转移、折扣构成的序贯决策框架 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='贝尔曼方程'>贝尔曼方程 — 把状态价值拆成当下奖励加折扣未来价值 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='q 学习'>Q 学习 — 用采样替代期望、学最优动作价值的算法 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='时序差分误差'>时序差分误差 — 实际奖励加未来估计减去当前估计 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='信用分配'>信用分配 — 把最终回报归功或归咎到具体动作的问题 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='dqn'>DQN — 用深度网络近似 Q 值，配合经验回放与目标网络 <span class=glossary-ref>（第 5 章：向自然学习——遗传算法与强化学习）<\/span><\/li><li data-term='minimax'>Minimax — 我方取最大、对手取最小的对抗搜索 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='alpha-beta 剪枝'>Alpha-Beta 剪枝 — 用上下界剪掉不影响决策的分支 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='评估函数'>评估函数 — 给非终局局面打分的函数 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='蒙特卡洛树搜索'>蒙特卡洛树搜索 — 选择、扩展、模拟、回溯四步迭代的搜索方法 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='土耳其人'>土耳其人 — 1769 年肯佩伦造的下棋木偶，实为藏人骗局 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='深蓝'>深蓝 — IBM 1997 年战胜卡斯帕罗夫的国际象棋系统 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='完全信息'>完全信息 — 所有参与者都能看到全部局面信息 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='不完美信息'>不完美信息 — 存在隐藏信息的博弈，如扑克 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='反事实遗憾最小化'>反事实遗憾最小化 — 按累计遗憾调整策略、逼近期望均衡的方法 <span class=glossary-ref>（第 6 章：下棋——人工智能的试金石）<\/span><\/li><li data-term='机器翻译'>机器翻译 — 用机器把一种语言转成另一种 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='alpac 报告'>ALPAC 报告 — 1966 年叫停机器翻译资助的评估报告 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='正则文法'>正则文法 — 3 型文法，对应有限状态自动机 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='上下文无关文法'>上下文无关文法 — 2 型文法，对应下推自动机 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='下推自动机'>下推自动机 — 带栈的自动机，能处理嵌套结构 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='n-gram'>n-gram — 用前 n−1 个词预测下一个词的语言模型 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='平滑'>平滑 — 给未出现的组合分配少量概率，避免零概率 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='bleu'>BLEU — 机器翻译的自动评价指标 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='词向量'>词向量 — 把词表示成稠密向量，语义近则距离近 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='transformer'>Transformer — 2017 年提出的纯注意力架构 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='预训练'>预训练 — 先用海量无标注数据学通用表示，再微调 <span class=glossary-ref>（第 7 章：自然语言处理——从规则到统计）<\/span><\/li><li data-term='刺激贫乏'>刺激贫乏 — 儿童输入有限却掌握复杂语法，故有先天官能 <span class=glossary-ref>（第 8 章：语言等于思维吗）<\/span><\/li><li data-term='普遍语法'>普遍语法 — 乔姆斯基假设的人脑先天语法框架 <span class=glossary-ref>（第 8 章：语言等于思维吗）<\/span><\/li><li data-term='柏拉图之问'>柏拉图之问 — 经验贫乏为何能知道这么多 <span class=glossary-ref>（第 8 章：语言等于思维吗）<\/span><\/li><li data-term='奥威尔之问'>奥威尔之问 — 证据充分为何仍会错得离谱 <span class=glossary-ref>（第 8 章：语言等于思维吗）<\/span><\/li><li data-term='萨丕尔-沃尔夫假说'>萨丕尔-沃尔夫假说 — 语言影响或决定思维的主张 <span class=glossary-ref>（第 8 章：语言等于思维吗）<\/span><\/li><li data-term='上下文学习'>上下文学习 — 给几个例子就能临时学会任务模式 <span class=glossary-ref>（第 8 章：语言等于思维吗）<\/span><\/li><li data-term='图灵机'>图灵机 — 纸带、读写头、状态表构成的抽象计算模型 <span class=glossary-ref>（第 9 章：人是机器吗——计算的理论边界）<\/span><\/li><li data-term='可计算'>可计算 — 存在图灵机在有限步内对所有输入给出正确答案 <span class=glossary-ref>（第 9 章：人是机器吗——计算的理论边界）<\/span><\/li><li data-term='丘奇-图灵论题'>丘奇-图灵论题 — 直觉上可机械计算的函数都是图灵可计算的 <span class=glossary-ref>（第 9 章：人是机器吗——计算的理论边界）<\/span><\/li><li data-term='λ 演算'>λ 演算 — 丘奇提出的函数抽象与替换形式系统 <span class=glossary-ref>（第 9 章：人是机器吗——计算的理论边界）<\/span><\/li><li data-term='停机问题'>停机问题 — 不存在通用算法判定任意程序是否停机 <span class=glossary-ref>（第 9 章：人是机器吗——计算的理论边界）<\/span><\/li><li data-term='对角化'>对角化 — 用自指构造矛盾、证明不可能性的手法 <span class=glossary-ref>（第 9 章：人是机器吗——计算的理论边界）<\/span><\/li><li data-term='物理符号假设'>物理符号假设 — 符号操作是智能的必要且充分条件 <span class=glossary-ref>（第 9 章：人是机器吗——计算的理论边界）<\/span><\/li><li data-term='所罗门诺夫归纳'>所罗门诺夫归纳 — 在所有能生成数据的程序里找最短的做预测 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='柯尔莫哥洛夫复杂度'>柯尔莫哥洛夫复杂度 — 一个对象的最短描述长度 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='奥卡姆剃刀'>奥卡姆剃刀 — 同等解释力下选假设更少的那个 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='交叉熵'>交叉熵 — 衡量模型分布与真实分布差异的损失 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='困惑度'>困惑度 — 平均编码长度的指数形式，语言模型的常用指标 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='缩放定律'>缩放定律 — 性能随参数、数据、算力按幂律提升的经验规律 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='涌现能力'>涌现能力 — 小模型测不出、过某个规模才显现的能力 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='幻觉'>幻觉 — 模型流畅生成不符合事实的内容 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='强化学习人类反馈'>强化学习人类反馈 — 用人类偏好数据调模型输出倾向的方法 <span class=glossary-ref>（第 10 章：大语言模型——“学习”到底是什么）<\/span><\/li><li data-term='中文屋'>中文屋 — 塞尔的思想实验：照规则搬符号不等于理解 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='缸中脑'>缸中脑 — 普特南的思想实验：意义可能依赖外部世界 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='缸中脑论证'>缸中脑论证 — 指称依赖因果联系，故纯内部状态不构成意义 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='物理符号系统'>物理符号系统 — 能操作符号的物理装置 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='德雷弗斯'>德雷弗斯 — 《计算机不能做什么》作者，批评符号派忽视常识与身体 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='自然主义'>自然主义 — 主张智能是在环境中适应的行为 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='大脑汤'>大脑汤 — 把脑组织溶解后直接数细胞核的计数方法 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='皮层神经元'>皮层神经元 — 决定智能水平更关键的指标，人脑约 160 亿 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><li data-term='具身智能'>具身智能 — 需要身体在环境中感知与行动的智能 <span class=glossary-ref>（第 11 章：哲学质疑、教科书变迁与智能的进化）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架一：问&quot;他当时被什么卡住了&quot;<\/h2>\n<p>读任何一段 AI 史，先问这个问题，而不是问&quot;他用了什么方法&quot;。<\/p>\n<p>三种卡点，对应三种历史结局：<\/p>\n<table><thead><tr><th>卡点<\/th><th>表现<\/th><th>典型案例<\/th><\/tr><\/thead><tbody><tr><td>算力不够<\/td><td>方法对，跑不动<\/td><td>归结原理、深层网络<\/td><\/tr><tr><td>数据不够<\/td><td>方法对，没样本<\/td><td>统计 NLP、深度学习<\/td><\/tr><tr><td>假设错了<\/td><td>方法再快也没用<\/td><td>第五代计算机<\/td><\/tr><\/tbody><\/table>\n<p>判断标准：如果几年后同一方法被重新用起来并成功，卡点是前两类；如果这个方法再也没人用，卡点大概率是第三类。<\/p>\n<h2>框架二：判断一项技术属于哪一派<\/h2>\n<table><thead><tr><th>提问<\/th><th>符号派<\/th><th>连接派<\/th><th>自然派<\/th><\/tr><\/thead><tbody><tr><td>知识从哪来<\/td><td>人写的规则<\/td><td>数据里的参数<\/td><td>与环境的交互<\/td><\/tr><tr><td>出错会怎样<\/td><td>遇到未覆盖情况就崩<\/td><td>给出自信的错误答案<\/td><td>行为不稳但不解释<\/td><\/tr><tr><td>怎么评价<\/td><td>可解释、可审计<\/td><td>基准分数<\/td><td>任务完成率<\/td><\/tr><\/tbody><\/table>\n<p>用途：看到一个新技术，先归类，再预测它的失败模式。这比记住它的技术细节有用。<\/p>\n<h2>框架三：演示成功 ≠ 系统可用<\/h2>\n<p>看任何 AI 演示，按顺序问四个问题：<\/p>\n<ol><li>\n规则/参数是不是为这个例子专门调的？\n<\/li><li>\n换了领域还能跑吗？\n<\/li><li>\n失败时的表现是什么样的（崩掉还是给错答案）？\n<\/li><li>\n谁为错误负责？\n<\/ol>\n<p>1954 年乔治敦机器翻译、1970 年代专家系统、今天的很多产品演示，都栽在这四问上。<\/p>\n<h2>框架四：复兴的四个前兆<\/h2>\n<p>历史上每次 AI 复兴都不是突然的，都有四个前兆同时出现：<\/p>\n<ol><li>\n一个新工具解决了旧的训练/推理瓶颈（反向传播、ReLU、Transformer）。\n<\/li><li>\n出现大规模、可评价的数据集（MNIST、ImageNet）。\n<\/li><li>\n算力成本降到学术界能用。\n<\/li><li>\n有一个标志性的基准突破（AlexNet、AlphaGo）。\n<\/ol>\n<p>四个缺一个，复兴就会晚几年。<\/p>\n<h2>框架五：哲学批评 → 技术问题<\/h2>\n<p>历史上每一次重要的哲学批评，最后都变成了一个具体的技术问题：<\/p>\n<table><thead><tr><th>批评<\/th><th>变成的技术问题<\/th><\/tr><\/thead><tbody><tr><td>德雷弗斯：常识无法穷举<\/td><td>知识表示、常识推理、检索增强<\/td><\/tr><tr><td>塞尔：符号没有语义<\/td><td>接地、多模态、具身<\/td><\/tr><tr><td>乔姆斯基：模式匹配不是理解<\/td><td>因果推理、形式化验证、可解释性<\/td><\/tr><tr><td>图灵：行为能否作为判据<\/td><td>评测基准的设计<\/td><\/tr><\/tbody><\/table>\n<p>所以读哲学章节不要当&quot;闲谈&quot;，它是未来技术需求的清单。<\/p>\n<h2>反模式<\/h2>\n<p><strong>反模式一：把&quot;能通过考试&quot;当成&quot;具备能力&quot;。<\/strong> 考试题是有限的、可被模式覆盖的；真实任务是开放的。<\/p>\n<p><strong>反模式二：押注专用硬件。<\/strong> 摩尔定律会追上你（第五代计算机、Lisp 机的教训）。<\/p>\n<p><strong>反模式三：把寒冬归因于&quot;某个人的打压&quot;。<\/strong> 明斯基与罗森布拉特的私人恩怨被过度叙述，真实原因是理论悲观 + 经费削减 + 技术条件不足三重叠加。<\/p>\n<p><strong>反模式四：认为历史是线性进步的。<\/strong> 神经网络三次起伏、NLP 两次范式反转，都不是&quot;越来越好&quot;，而是&quot;条件变了就换一条路&quot;。<\/p>\n<p><strong>反模式五：忽略宣传与实际的差距。<\/strong> 1958 年感知机的媒体报道、1954 年机器翻译的新闻标题，都是&quot;技术未成熟先被吹大&quot;的经典案例。<\/p>\n<p><strong>反模式六：把&quot;规模&quot;当成&quot;理解&quot;。<\/strong> 规模带来能力，但不带来因果模型。幻觉就是这条反模式的代价。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>关键时间线<\/h2>\n<table><thead><tr><th>年份<\/th><th>事件<\/th><th>归属<\/th><\/tr><\/thead><tbody><tr><td>1936<\/td><td>图灵提出图灵机、停机问题<\/td><td>计算理论<\/td><\/tr><tr><td>1943<\/td><td>麦卡洛克-皮茨：神经元＝阈值逻辑门<\/td><td>连接主义<\/td><\/tr><tr><td>1948<\/td><td>图灵 NPL 报告《智能机器》；维纳《控制论》<\/td><td>前史<\/td><\/tr><tr><td>1950<\/td><td>图灵《计算机与智能》，模仿游戏<\/td><td>前史<\/td><\/tr><tr><td>1951<\/td><td>斯特雷奇跳棋程序<\/td><td>博弈<\/td><\/tr><tr><td>1954<\/td><td>戴维斯定理证明程序（JOHNNIAC）<\/td><td>符号<\/td><\/tr><tr><td>1954<\/td><td>乔治敦-IBM 机器翻译（6 条规则、250 词）<\/td><td>NLP<\/td><\/tr><tr><td>1955<\/td><td>洛杉矶学习机讨论会<\/td><td>前史<\/td><\/tr><tr><td>1956<\/td><td>达特茅斯会议，&quot;人工智能&quot;一词通行<\/td><td>建制<\/td><\/tr><tr><td>1956<\/td><td>塞缪尔自学习跳棋程序<\/td><td>机器学习<\/td><\/tr><tr><td>1958<\/td><td>罗森布拉特感知机<\/td><td>连接主义<\/td><\/tr><tr><td>1965<\/td><td>鲁滨逊归结原理<\/td><td>符号<\/td><\/tr><tr><td>1966<\/td><td>ALPAC 报告叫停机器翻译<\/td><td>NLP<\/td><\/tr><tr><td>1969<\/td><td>明斯基与帕波特《感知机》<\/td><td>连接主义<\/td><\/tr><tr><td>1972<\/td><td>德雷弗斯《计算机不能做什么》<\/td><td>哲学<\/td><\/tr><tr><td>1975<\/td><td>霍兰德《自然与人工系统中的适应》<\/td><td>进化计算<\/td><\/tr><tr><td>1980<\/td><td>塞尔中文屋<\/td><td>哲学<\/td><\/tr><tr><td>1981<\/td><td>日本第五代计算机计划启动<\/td><td>硬件<\/td><\/tr><tr><td>1982<\/td><td>Hopfield 网络<\/td><td>连接主义<\/td><\/tr><tr><td>1986<\/td><td>反向传播论文（《自然》）<\/td><td>连接主义<\/td><\/tr><tr><td>1989<\/td><td>Watkins Q 学习<\/td><td>强化学习<\/td><\/tr><tr><td>1992<\/td><td>第五代计划结束<\/td><td>硬件<\/td><\/tr><tr><td>1997<\/td><td>深蓝胜卡斯帕罗夫<\/td><td>博弈<\/td><\/tr><tr><td>2006<\/td><td>逐层预训练（深度信念网络）<\/td><td>连接主义<\/td><\/tr><tr><td>2012<\/td><td>AlexNet；谷歌知识图谱<\/td><td>连接主义<\/td><\/tr><tr><td>2015<\/td><td>DQN<\/td><td>强化学习<\/td><\/tr><tr><td>2016<\/td><td>AlphaGo 胜李世石 4:1<\/td><td>博弈<\/td><\/tr><tr><td>2017<\/td><td>AlphaGo Zero；Transformer；Libratus<\/td><td>多线<\/td><\/tr><tr><td>2022<\/td><td>ChatGPT<\/td><td>大模型<\/td><\/tr><tr><td>2023<\/td><td>乔姆斯基《ChatGPT 的虚假承诺》<\/td><td>哲学<\/td><\/tr><\/tbody><\/table>\n<h2>方法与人物对照<\/h2>\n<table><thead><tr><th>问题<\/th><th>方法<\/th><th>代表人物<\/th><\/tr><\/thead><tbody><tr><td>定理怎么自动证明<\/td><td>归结原理、SAT/SMT<\/td><td>戴维斯、鲁滨逊<\/td><\/tr><tr><td>专家知识怎么用<\/td><td>规则库 + 推理机<\/td><td>费根鲍姆、 Buchanan<\/td><\/tr><tr><td>知识怎么组织<\/td><td>三元组、知识图谱<\/td><td>谷歌、Berners-Lee<\/td><\/tr><tr><td>神经网络怎么训<\/td><td>反向传播 + 梯度下降<\/td><td>鲁梅哈特、辛顿、威廉姆斯<\/td><\/tr><tr><td>搜索空间太大怎么办<\/td><td>剪枝、启发、学习引导<\/td><td>深蓝团队、DeepMind<\/td><\/tr><tr><td>只有分数怎么学<\/td><td>贝尔曼方程、Q 学习、策略梯度<\/td><td>萨顿、巴托<\/td><\/tr><tr><td>语言怎么处理<\/td><td>规则 → 统计 → 预训练<\/td><td>乔姆斯基、曼宁<\/td><\/tr><\/tbody><\/table>\n<h2>关键数字<\/h2>\n<table><thead><tr><th>数字<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>6 条规则、250 词<\/td><td>1954 乔治敦机器翻译系统的规模<\/td><\/tr><tr><td><code>O(b^d)<\/code><\/td><td>搜索树节点数<\/td><\/tr><tr><td>2 亿局面/秒<\/td><td>深蓝的评估速度<\/td><\/tr><tr><td>b≈250<\/td><td>围棋的分支因子<\/td><\/tr><tr><td>4.5 亿美元<\/td><td>第五代计算机计划投入（约）<\/td><\/tr><tr><td>860 亿 / 160 亿<\/td><td>人脑总神经元 / 皮层神经元<\/td><\/tr><tr><td>2570 亿 / 56 亿<\/td><td>大象总神经元 / 皮层神经元<\/td><\/tr><tr><td>25%<\/td><td>人脑占身体能量消耗的比例<\/td><\/tr><\/tbody><\/table>\n<h2>一句话对照<\/h2>\n<table><thead><tr><th>容易混<\/th><th>区别<\/th><\/tr><\/thead><tbody><tr><td>图灵测试 vs 中文屋<\/td><td>外部行为 vs 内部理解<\/td><\/tr><tr><td>强人工智能 vs 弱人工智能<\/td><td>真有理解 vs 模拟智能行为<\/td><\/tr><tr><td>完全信息 vs 不完美信息<\/td><td>局面全可见 vs 存在隐藏信息<\/td><\/tr><tr><td>符号派 vs 统计派<\/td><td>人写规则 vs 数据拟合<\/td><\/tr><tr><td>深度学习 vs 机器学习<\/td><td>子集关系，深度指多层网络<\/td><\/tr><tr><td>演示成功 vs 系统可用<\/td><td>为例子调参 vs 能泛化<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：缘起——从图灵到 1956 年达特茅斯会议", "href": "#/chapter/ch01"}, {"label": "第 2 章：自动定理证明的兴衰", "href": "#/chapter/ch02"}, {"label": "第 3 章：专家系统、知识图谱与第五代计算机", "href": "#/chapter/ch03"}, {"label": "第 4 章：神经网络的三起三落", "href": "#/chapter/ch04"}, {"label": "第 5 章：向自然学习——遗传算法与强化学习", "href": "#/chapter/ch05"}, {"label": "第 6 章：下棋——人工智能的试金石", "href": "#/chapter/ch06"}, {"label": "第 7 章：自然语言处理——从规则到统计", "href": "#/chapter/ch07"}, {"label": "第 8 章：语言等于思维吗", "href": "#/chapter/ch08"}, {"label": "第 9 章：人是机器吗——计算的理论边界", "href": "#/chapter/ch09"}, {"label": "第 10 章：大语言模型——“学习”到底是什么", "href": "#/chapter/ch10"}, {"label": "第 11 章：哲学质疑、教科书变迁与智能的进化", "href": "#/chapter/ch11"}]}, {"label": "概念", "children": [{"label": "图灵测试与中文屋", "href": "#/concept/c01"}, {"label": "符号主义与连接主义", "href": "#/concept/c02"}, {"label": "专家系统与知识获取瓶颈", "href": "#/concept/c03"}, {"label": "组合爆炸", "href": "#/concept/c04"}, {"label": "感知机与线性不可分", "href": "#/concept/c05"}, {"label": "反向传播与梯度消失", "href": "#/concept/c06"}, {"label": "强化学习与信用分配", "href": "#/concept/c07"}, {"label": "压缩即学习", "href": "#/concept/c08"}, {"label": "摩尔定律与专用硬件", "href": "#/concept/c09"}, {"label": "具身智能", "href": "#/concept/c10"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：缘起——从图灵到 1956 年达特茅斯会议", "h const CROSS = {"doc1": "<h1>跨书总览：人工智能的双线学习路线<\/h1>\n<p>这两本书不是同一类东西，配起来读刚好互补：<\/p>\n<ul><li>\n《人工智能导论：模型与算法》（吴飞）是<strong>教材<\/strong>，按技术路线分章，讲&quot;每个方法怎么做&quot;。\n<\/li><li>\n《人工智能简史》（尼克）是<strong>历史<\/strong>，按时间与人物分章，讲&quot;每个方法为什么被放弃又被捡起来&quot;。\n<\/ul>\n<p>一本给你骨架，一本给你因果。只读导论，你会知道公式却不知道为什么这些公式能活下来；只读简史，你会知道故事却不会算任何东西。<\/p>\n<h2>推荐学习顺序<\/h2>\n<table><thead><tr><th>顺序<\/th><th>书<\/th><th>为什么在这个位置<\/th><th>能力里程碑<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>简史 ch01—ch03<\/td><td>建立时间轴与路线分裂，不需要任何数学基础<\/td><td>能说清符号派与连接派各自的主张与失败模式<\/td><\/tr><tr><td>2<\/td><td>导论 ch01<\/td><td>同一件事的技术版：五种计算范式<\/td><td>能对一个任务说出五种做法各自的成本<\/td><\/tr><tr><td>3<\/td><td>导论 ch02、ch03 + 简史 ch09<\/td><td>逻辑、搜索、可计算性，三者共用一套符号工具<\/td><td>能手算 A*、能反证停机问题<\/td><\/tr><tr><td>4<\/td><td>简史 ch04 + 导论 ch04<\/td><td>先看神经网络为什么三次起伏，再学监督学习的具体算法<\/td><td>能手算最小二乘、信息增益<\/td><\/tr><tr><td>5<\/td><td>导论 ch05、ch06<\/td><td>无监督与深度学习，这是今天的主流<\/td><td>能手算 K-means、一轮 EM、卷积尺寸<\/td><\/tr><tr><td>6<\/td><td>简史 ch05、ch06 + 导论 ch07、ch08<\/td><td>强化学习与博弈，两本书讲的是同一批案例<\/td><td>能手算 Q 更新、求混合策略均衡<\/td><\/tr><tr><td>7<\/td><td>简史 ch07、ch08、ch10 + 导论 ch09<\/td><td>语言、大模型、趋势，最后收束<\/td><td>能解释&quot;预测下一个词&quot;为什么有效，能判断一个场景该走哪条路线<\/td><\/tr><\/tbody><\/table>\n<h2>各书定位（一句话）<\/h2>\n<ul><li>\n《人工智能导论：模型与算法》：讲<strong>怎么做<\/strong>。九章覆盖五种范式，每章有公式、算法步骤、可手算的例子。不适合当小说读，适合配纸笔。\n<\/li><li>\n《人工智能简史》：讲<strong>为什么<\/strong>。十一条主线，每条都有一到两个&quot;当时被什么卡住&quot;的判断。适合先建立判断力，再回头补技术细节。\n<\/ul>\n<h2>学习节奏建议<\/h2>\n<p>按每周 6—8 小时算，全程约 10 周：<\/p>\n<table><thead><tr><th>周<\/th><th>内容<\/th><th>检查点<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>简史 ch01—ch03<\/td><td>能画出路线分裂图<\/td><\/tr><tr><td>2<\/td><td>导论 ch01、ch02<\/td><td>能翻一阶逻辑式、能说清五种范式<\/td><\/tr><tr><td>3<\/td><td>导论 ch03 + 简史 ch09<\/td><td>手算 A* 与剪枝<\/td><\/tr><tr><td>4<\/td><td>简史 ch04 + 导论 ch04 前半<\/td><td>能手算最小二乘<\/td><\/tr><tr><td>5<\/td><td>导论 ch04 后半（SVM、集成）<\/td><td>能算 AdaBoost 一轮<\/td><\/tr><tr><td>6<\/td><td>导论 ch05<\/td><td>手算 K-means 与一轮 EM<\/td><\/tr><tr><td>7<\/td><td>导论 ch06<\/td><td>算卷积尺寸、走一遍反向传播<\/td><\/tr><tr><td>8<\/td><td>简史 ch05、ch06 + 导论 ch07<\/td><td>手算 Q 更新<\/td><\/tr><tr><td>9<\/td><td>导论 ch08 + 简史 ch07、ch08<\/td><td>求一个混合均衡<\/td><\/tr><tr><td>10<\/td><td>简史 ch10、ch11 + 导论 ch09<\/td><td>写一份 800 字的场景判断<\/td><\/tr><\/tbody><\/table>\n<p>交叉复习的原则：<strong>每学完一个技术方法，回到简史看它当年为什么失败<\/strong>。这一遍比再读一遍教材有用。<\/p>\n<h2>总入口<\/h2>\n<p>打开 <code>index.html<\/code>，顶部切书，左侧按书导航。每本书的进度独立保存，搜索覆盖两本书的章节、概念、术语与测验。<\/p>", "doc2": "<h1>跨书概念映射表<\/h1>\n<p>对照两本书真实 <code>manifest.json<\/code> 的章节与概念生成，不凭记忆填写。<\/p>\n<table><thead><tr><th>概念<\/th><th>导论（模型与算法）<\/th><th>简史（尼克）<\/th><th>口径差异<\/th><\/tr><\/thead><tbody><tr><td>符号主义 / 逻辑推理<\/td><td>第 2 章 逻辑与推理；概念 c01<\/td><td>第 2 章 定理证明；概念 c02<\/td><td>导论讲归结与因果推断的技术细节；简史讲它为什么因组合爆炸衰落<\/td><\/tr><tr><td>搜索与启发式<\/td><td>第 3 章 搜索求解；概念 c02<\/td><td>第 6 章 下棋；概念 c04<\/td><td>导论给 A*、Minimax、MCTS 的算法与复杂度；简史给深蓝→AlphaGo 的方法演进<\/td><\/tr><tr><td>组合爆炸<\/td><td>第 3 章（隐式，体现在复杂度表）<\/td><td>概念 c04（独立成页）<\/td><td>简史把它单独拎出来当作&quot;符号派总失败原因&quot;<\/td><\/tr><tr><td>专家系统 / 知识表示<\/td><td>第 2 章（知识图谱、路径排序）<\/td><td>第 3 章（DENDRAL、MYCIN、五代机）<\/td><td>导论只讲知识图谱的技术做法；简史讲专家系统的商业化与落地困境<\/td><\/tr><tr><td>感知机与神经网络<\/td><td>第 6 章 深度学习；概念 c09<\/td><td>第 4 章 三起三落；概念 c05<\/td><td>导论从反向传播讲起；简史从 1943 年麦卡洛克-皮茨讲起<\/td><\/tr><tr><td>反向传播<\/td><td>第 6 章 6.2.3；概念 c09<\/td><td>第 4 章（1986 年论文）<\/td><td>导论给完整推导与算例；简史给&quot;为何 1986 年才被接受&quot;的外部条件<\/td><\/tr><tr><td>过拟合与泛化<\/td><td>第 4 章；概念 c03<\/td><td>第 4 章（SVM 压过神经网络）<\/td><td>导论给正则化、VC 维的技术处理；简史给&quot;理论保证为什么赢过工程直觉&quot;<\/td><\/tr><tr><td>支持向量机<\/td><td>第 4 章 4.6；概念 c05、c06<\/td><td>第 4 章（作为神经网络的对手）<\/td><td>导论讲间隔、对偶、核技巧；简史只讲它 1990 年代压制连接主义的历史角色<\/td><\/tr><tr><td>无监督 / 聚类 / 降维<\/td><td>第 5 章；概念 c07、c08<\/td><td>未展开<\/td><td>简史不涉及具体无监督算法<\/td><\/tr><tr><td>强化学习<\/td><td>第 7 章；概念 c11<\/td><td>第 5 章（Q 学习）、第 6 章（AlphaGo）<\/td><td>导论给贝尔曼方程、TD、策略梯度；简史给&quot;这条慢路线为何等了三十年&quot;<\/td><\/tr><tr><td>博弈与纳什均衡<\/td><td>第 8 章；概念 c12<\/td><td>第 6 章（扑克、CFR）<\/td><td>导论讲均衡定义与求解；简史讲不完美信息如何逼出 CFR<\/td><\/tr><tr><td>自然语言处理<\/td><td>第 4 章（文本分类作为应用）<\/td><td>第 7 章（乔治敦→ALPAC→统计）<\/td><td>导论不设 NLP 专章；简史有完整范式反转叙事<\/td><\/tr><tr><td>大模型 / 预训练<\/td><td>第 6 章（深度学习架构）<\/td><td>第 10 章（所罗门诺夫、压缩即学习）<\/td><td>导论讲架构与训练；简史讲&quot;为什么这个目标有效&quot;的理论解释<\/td><\/tr><tr><td>可计算性 / 图灵机<\/td><td>第 1 章（丘奇-图灵论题）<\/td><td>第 9 章（完整证明）<\/td><td>导论一句话带过；简史给停机问题的完整反证<\/td><\/tr><tr><td>哲学质疑（中文屋等）<\/td><td>未涉及<\/td><td>第 8、11 章；概念 c01<\/td><td>简史独有<\/td><\/tr><tr><td>具身智能 / 类脑<\/td><td>第 9 章（类脑计算）<\/td><td>第 1、11 章；概念 c10<\/td><td>导论从工程角度讲类脑芯片；简史从图灵 1948 年报告讲起<\/td><\/tr><\/tbody><\/table>\n<h2>使用方式<\/h2>\n<ol><li>\n在导论学到某个方法，先在这里查它在简史哪一章出现过。\n<\/li><li>\n去简史那一章读&quot;它当年为什么失败/为什么被替代&quot;，再回头重读技术细节，理解会深一层。\n<\/li><li>\n遇到口径差异（比如&quot;泛化&quot;在两边含义侧重不同），按表格最后一列对照，不要强行统一。\n<\/ol>", "doc3": "<h1>综合检验建议<\/h1>\n<p>跨书题必须同时用到两本书的知识，任何一本单独都能答的，不算。<\/p>\n<h2>跨书整合题<\/h2>\n<h3>题 1：为什么&quot;专家系统&quot;能赚钱，&quot;第五代计算机&quot;不能<\/h3>\n<ul><li>\n<strong>涉及<\/strong>：简史第 3 章、导论第 2 章（知识表示）、导论第 3 章（复杂度）\n<\/li><li>\n<strong>要求<\/strong>：写 500 字，说明两者在&quot;技术假设、商业模式、硬件依赖&quot;三个维度上的差别。\n<\/li><li>\n<strong>评分要点<\/strong>：① 指出专家系统卖的是&quot;领域知识 + 可解释推理&quot;，价值可局部交付；② 指出五代机卖的是&quot;通用推理硬件&quot;，必须整体成功才有价值；③ 引用摩尔定律说明专用硬件的风险；④ 提到知识获取瓶颈与规则冲突这一共同上限。\n<\/ul>\n<h3>题 2：用导论的公式解释简史的一次失败<\/h3>\n<ul><li>\n<strong>涉及<\/strong>：导论第 3 章、简史第 2、6 章\n<\/li><li>\n<strong>要求<\/strong>：算出 b=35、d=10 时 Minimax 的节点数，再算出 Alpha-Beta 最优剪枝后的有效节点数（分支因子约 √35），说明这两个数字如何解释&quot;深蓝必须靠专用硬件&quot;。\n<\/li><li>\n<strong>评分要点<\/strong>：① 节点数算对（约 2.7×10¹⁵）；② 剪枝后量级算对；③ 说明剪枝依赖可靠评估函数；④ 联系到简史里&quot;深蓝每秒 2 亿局面&quot;这个数字。\n<\/ul>\n<h3>题 3：大模型的&quot;理解&quot;之争，两边各缺什么证据<\/h3>\n<ul><li>\n<strong>涉及<\/strong>：简史第 8、10、11 章、导论第 6 章\n<\/li><li>\n<strong>要求<\/strong>：列一张两列表，左边支持&quot;大模型有语言能力&quot;的证据，右边支持&quot;只是模式匹配&quot;的证据，每边至少三条，并指出哪一条最难反驳。\n<\/li><li>\n<strong>评分要点<\/strong>：① 能区分&quot;行为达标&quot;与&quot;机制相同&quot;；② 引用刺激贫乏、中文屋、压缩即学习三个论点；③ 指出当前评测体系的局限（考试题可被模式覆盖）；④ 结论不站队，给出&quot;取决于你采用哪种判据&quot;。\n<\/ul>\n<h3>题 4：给一个真实场景做路线选型<\/h3>\n<ul><li>\n<strong>涉及<\/strong>：导论第 1、9 章、简史第 11 章（三分法）、patterns.md\n<\/li><li>\n<strong>要求<\/strong>：选一个场景（如校园二手交易定价、医院分诊、工厂质检），说明：属于哪条路线、数据与标注从哪来、用什么指标评价、上线后怎么发现模型退化、如果换另一条路线会失去什么。\n<\/li><li>\n<strong>评分要点<\/strong>：① 路线判断有依据而非凭感觉；② 指标与任务匹配（不平衡数据不能用准确率）；③ 退化检测具体（分布漂移、标签错误）；④ 换路线的代价说得清（可解释性 vs 适应性）。\n<\/ul>\n<h2>进阶路线<\/h2>\n<ol><li>\n<strong>偏理论<\/strong>：简史 ch09 → 导论 ch04 的 VC 维与结构风险 → 读《统计学习基础》前四章。目标：能自己推导泛化界。\n<\/li><li>\n<strong>偏工程<\/strong>：导论 ch04—ch06 → 简史 ch04、ch10 → 自己训一个图像分类模型并复现 AlexNet 的关键技巧（ReLU、Dropout、数据增强）。目标：能解释每个技巧解决什么失败模式。\n<\/li><li>\n<strong>偏历史与判断<\/strong>：简史 ch01—ch11 通读 → 导论 ch01、ch09 → 写一篇&quot;某个 AI 热点属于哪一次复兴&quot;的分析。目标：能对新出现的模型做归类与失败模式预判。\n<\/li><li>\n<strong>偏交叉（推荐给数学背景）<\/strong>：导论 ch05（PCA、SVD）→ 简史 ch10（压缩即学习）→ 读柯尔莫哥洛夫复杂度的入门材料。目标：把&quot;降维&quot;与&quot;压缩&quot;视为同一件事的两种语言。\n<\/ol>", "doc4": "<h1>从零推导：两个最难的课题<\/h1>\n<p>《人工智能导论：模型与算法》里有两处，读文字讲解能看懂&quot;是什么&quot;，但推不出来&quot;为什么&quot;：<strong>反向传播<\/strong>（6.2.3）和<strong>支持向量机<\/strong>（4.6）。这两份单文件交互页把那两步从头补上。<\/p>\n<h2>两份产物<\/h2>\n<table><thead><tr><th>网页<\/th><th>对应原书<\/th><th>章节数<\/th><th>从哪儿开始<\/th><th>学完能做什么<\/th><\/tr><\/thead><tbody><tr><td><a href='./03-从零推导-反向传播.html' target='_blank' rel='noopener'>03-从零推导-反向传播.html</a>（与 index.html 同目录）<\/td><td>6.2.3 反向传播<\/td><td>12<\/td><td>加减乘除与斜率<\/td><td>手算一个两层网络的梯度，解释梯度消失的成因与三种解法<\/td><\/tr><tr><td><a href='./03-从零推导-支持向量机.html' target='_blank' rel='noopener'>03-从零推导-支持向量机.html</a>（与 index.html 同目录）<\/td><td>4.6 支持向量机<\/td><td>15<\/td><td>坐标、直线、距离<\/td><td>独立推出最大间隔问题、对偶形式，算出一组具体数据的 w、b 与间隔<\/td><\/tr><\/tbody><\/table>\n<p>两份都是单文件、离线可开：KaTeX 连 20 个字体全部内联，断网也不掉公式；移动端按 375px 起步，桌面自动出侧边栏。<\/p>\n<h2>怎么用<\/h2>\n<ol><li>\n双击打开，默认停在第一章。\n<\/li><li>\n手机端左上角 <code>☰<\/code> 打开目录，或直接点顶栏左右箭头翻章。\n<\/li><li>\n每章底部有&quot;上一章 / 下一章&quot;，键盘 <code>←<\/code> <code>→<\/code> 也能翻。\n<\/li><li>\n自测题点&quot;显示答案&quot;再展开，先自己写。\n<\/li><li>\n页面里的滑块是真算的：反向传播页调学习率看损失曲线（η 超过 2 会震荡），支持向量机页调 C 看边界从宽变窄（解由离线求解后内嵌，滑块只在解之间插值）。\n<\/ol>\n<h2>依赖图（两份页面的第一章都有可视化版本）<\/h2>\n<pre><code>反向传播：四则运算 → 斜率/导数 → 链式法则 → 偏导与梯度 → 神经元与损失 → 计算图与反向传播\n支持向量机：坐标与直线 → 向量/内积/模长 → 点到直线距离 → 分类与 ±1 标签 → 间隔 → 约束优化 → 对偶 → 软间隔与核<\/code><\/pre>\n<h2>重Build<\/h2>\n<pre class=\"lang-bash\"><code>cd _build\npython3 build_fp.py bp     # 反向传播\npython3 build_fp.py svm    # 支持向量机<\/code><\/pre>\n<p>章节正文在 <code>_build/fp_bp_sections.py<\/code>、<code>_build/fp_svm_sections.py<\/code>；Canvas 演示在 <code>_build/fp_bp_demo.py<\/code>、<code>_build/fp_svm_demo.py<\/code>；KaTeX 解包在 <code>_build/katex/<\/code>。<\/p>\n<h2>自检<\/h2>\n<pre class=\"lang-bash\"><code>python3 ~/.doubao/agent_mode/workspace/.user_skills/doubao-first-principles-derivation/scripts/check_render.py &quot;03-从零推导-反向传播.html&quot;\npython3 .../check_render.py &quot;03-从零推导-支持向量机.html&quot;<\/code><\/pre>\n<p>当前结果：两份均 0 处公式裸 <code>&lt;<\/code>、全部章节通过（12 / 15）、390px 无横向溢出、控制台无报错。<\/p>\n<h2>已知边界<\/h2>\n<ul><li>\n数字都是自拟的教学数据（反向传播页 x=1、y=3、w=2 一路手算；SVM 页两点对称算例），不是真实数据集。正文里已标注。\n<\/li><li>\nSVM 页的 C 滑块只覆盖 0.01–100 的 12 个解，中间值是对数插值，不代表精确解。\n<\/li><li>\n不涉及：测度论、泛函分析、SMO 工程实现、Transformer。\n<\/ul>"};
const CROSS_META = [{"key": "doc1", "label": "跨书总览：人工智能的双线学习路线", "file": "README.md"}, {"key": "doc2", "label": "跨书概念映射表", "file": "跨书概念映射表.md"}, {"key": "doc3", "label": "综合检验建议", "file": "综合检验建议.md"}, {"key": "doc4", "label": "从零推导：两个最难的课题", "file": "从零推导.md"}];
const TABS = [{"key": "cross", "label": "跨书总览"}, {"key": "ai-models-algorithms", "label": "人工智能导论：模型与算法"}, {"key": "ai-brief-history", "label": "人工智能简史"}];
const FIRST_DOC = "doc1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let cur = {book:'cross', doc:FIRST_DOC, page:'cross'};
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
function stKey(book,k){ return 'hb:'+book+':'+k; }
function getState(book){
  return { visited: store.get(stKey(book,'visited'))||[], quiz: store.get(stKey(book,'quiz'))||{}, cards: store.get(stKey(book,'cards'))||{} };
}

/* ---------- 路由 ---------- */
function parseHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return {book:'cross', doc:FIRST_DOC, page:'cross'};
  const p = h.split('/');
  if(p[0]==='cross') return {book:'cross', doc:p[1]||FIRST_DOC, page:'cross'};
  if(p[0]==='book'){
    const key=p[1], page=p.slice(2).join('/')||'path';
    return {book:key, page:page, doc:null};
  }
  return {book:'cross', doc:FIRST_DOC, page:'cross'};
}
function pageIdOf(page){
  if(page==='path') return '__path__';
  if(page==='cards') return '__cards__';
  if(page==='glossary') return '__glossary__';
  if(page==='patterns') return '__patterns__';
  if(page==='cheatsheet') return '__cheatsheet__';
  if(page.startsWith('quiz/')) return '__quiz_'+(page.split('/')[1]||'all')+'__';
  if(page.startsWith('chapter/')) return page.slice(8);
  if(page.startsWith('concept/')) return page.slice(8);
  return page;
}

/* ---------- 顶栏 ---------- */
function renderTabs(){
  const el = $('#tabs'); el.innerHTML='';
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.className='tab'+(cur.book===t.key?' active':'');
    b.textContent=t.label;
    b.onclick=()=>{ location.hash = t.key==='cross' ? '#/cross/'+FIRST_DOC : '#/book/'+t.key+'/path'; };
    el.appendChild(b);
  });
}

/* ---------- 侧栏 ---------- */
function renderNav(){
  const nav=$('#nav'); nav.innerHTML='';
  const add=(label,href,cls)=>{
    const a=document.createElement('a'); a.className='nav-item'+(cls?' '+cls:''); a.href=href; a.textContent=label;
    nav.appendChild(a); return a;
  };
  const sec=t=>{ const d=document.createElement('div'); d.className='nav-sec'; d.textContent=t; nav.appendChild(d); };

  if(cur.book==='cross'){
    sec(CROSS_META.length>1 ? '跨书总览' : '总览');
    CROSS_META.forEach(c=> add(c.label, '#/cross/'+c.key, cur.doc===c.key?'active':''));
    sec('书籍入口');
    META.forEach(m=> add(m.title, '#/book/'+m.key+'/path'));
    updateProgress(0, CROSS_META.length>1 ? '跨书总览' : '总览');
    return;
  }
  const B=BOOKS[cur.book];
  const S=getState(cur.book);
  const man=B.manifest;
  add('学习路径','#/book/'+cur.book+'/path', cur.page==='path'?'active':'');
  sec('章节');
  (man.chapters||[]).forEach(c=>{
    const id=c.id;
    const a=add(c.title, '#/book/'+cur.book+'/chapter/'+id, cur.page==='chapter/'+id?'active':'');
    if(S.visited.includes(cur.book+'/chapter/'+id)){
      const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
    }
  });
  if((man.concepts||[]).length){
    sec('概念');
    man.concepts.forEach(c=>{
      const a=add(c.title, '#/book/'+cur.book+'/concept/'+c.id, cur.page==='concept/'+c.id?'active':'');
      if(S.visited.includes(cur.book+'/concept/'+c.id)){
        const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
      }
    });
  }
  sec('测验');
  add('全部测验','#/book/'+cur.book+'/quiz/all', cur.page==='quiz/all'?'active':'');
  (man.chapters||[]).forEach(c=>{
    if(!((B.quizCoverage||{})[c.id])) return;
    add('测验：'+c.title, '#/book/'+cur.book+'/quiz/'+c.id, cur.page==='quiz/'+c.id?'active':'');
  });
  sec('复习工具');
  add('抽认卡','#/book/'+cur.book+'/cards', cur.page==='cards'?'active':'');
  add('术语表','#/book/'+cur.book+'/glossary', cur.page==='glossary'?'active':'');
  if(B.rendered['__patterns__']) add('模式库','#/book/'+cur.book+'/patterns', cur.page==='patterns'?'active':'');
  if(B.rendered['__cheatsheet__']) add('速查表','#/book/'+cur.book+'/cheatsheet', cur.page==='cheatsheet'?'active':'');
  sec('其他');
  const m=META.find(x=>x.key===cur.book);
  if(m) add('单独打开学习伴侣 ↗', encodeURI(m.companion));

  updateProgressBook(cur.book);
}

/* ---------- 进度 ---------- */
function updateProgress(pct,label){
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=label;
}
function updateProgressBook(book){
  const B=BOOKS[book], S=getState(book);
  const chs=(B.manifest.chapters||[]).length;
  const done=(B.manifest.chapters||[]).filter(c=>S.visited.includes(book+'/chapter/'+c.id)).length;
  const pct=chs?Math.round(done/chs*100):0;
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=`《${(META.find(x=>x.key===book)||{}).title||book}》 进度 ${pct}% · 已学 ${done}/${chs} 章`;
}

/* ---------- 渲染 ---------- */
function renderCross(){
  const v=$('#view');
  const docId=cur.doc||FIRST_DOC;
  const html=CROSS[docId]||'<div class="empty">页面不存在</div>';
  let pre='';
  if(docId===FIRST_DOC){
    pre = '<h1>学习总手册</h1>'
      + '<p>本学习系统把书点化为一套可跟着走的学习内容。顶部切换书籍，或用下方卡片进入；'
      + '每本书含学习路径、章节精讲、概念页、测验、抽认卡、术语表、模式库与速查表，进度自动保存在本机浏览器。</p>'
      + '<div class="book-cards">'
      + META.map(m=>`<div class="book-card"><h3>${esc(m.title)}</h3>
          <div class="meta">${m.chapters} 章 · ${m.concepts} 概念 · ${m.quizzes} 测验 · ${m.cards} 抽认卡</div>
          <div class="enter"><a href="#/book/${m.key}/path">进入学习 →</a> &nbsp;|&nbsp;
          <a href="${encodeURI(m.companion)}" target="_blank">单独伴侣 ↗</a></div></div>`).join('')
      + '</div>';
  }
  v.innerHTML = pre + html;
  renderMermaid();
}

function renderBook(){
  const B=BOOKS[cur.book];
  if(!B){ $('#view').innerHTML='<div class="empty">书目不存在</div>'; return; }
  const pid=pageIdOf(cur.page);
  let html=B.rendered[pid];
  if(!html){ html='<div class="empty">页面不存在</div>'; }
  const S=getState(cur.book);
  if((cur.page.startsWith('chapter/')||cur.page.startsWith('concept/')) && !S.visited.includes(cur.book+'/'+cur.page)){
    S.visited.push(cur.book+'/'+cur.page);
    store.set(stKey(cur.book,'visited'), S.visited);
  }
  $('#view').innerHTML=html;
  if(cur.page==='cards') initCards();
  if(cur.page==='glossary') initGlossary();
  if(cur.page.startsWith('quiz/')) initQuizzes();
  if(pid==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 测验 ---------- */
function initQuizzes(){
  const B=BOOKS[cur.book];
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn=item.querySelector('.quiz-check');
    if(!btn||item.dataset.inited) return;
    item.dataset.inited='1';
    btn.addEventListener('click',()=>{
      const qid=item.dataset.qid, type=item.dataset.type;
      const q=(B.manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user=null, correct=false, fb='';
      if(type==='single'){
        const sel=item.querySelector('input:checked');
        user=sel?parseInt(sel.value):null;
        correct=(user===q.answer);
        fb=correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      }else if(type==='multi'){
        user=Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans=Array.isArray(q.answer)?q.answer.slice().sort():[q.answer];
        correct=user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb=correct?'✓ 正确':'✗ 错误';
      }else if(type==='blank'){
        const v=(item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        correct=(v===String(q.answer).trim().toLowerCase());
        fb=correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)?q.answer.includes(val):val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed=item.querySelector('.quiz-feedback');
      feed.className='quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent=fb;
      let ex=item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML='解析：'+esc(q.explain||'');
      const S=getState(cur.book);
      const ch=q.chapterId||'__all__';
      if(!S.quiz[ch]) S.quiz[ch]={n:0};
      S.quiz[ch].n+=1;
      store.set(stKey(cur.book,'quiz'), S.quiz);
    });
  });
}
function updatePath(){
  const B=BOOKS[cur.book], S=getState(cur.book);
  document.querySelectorAll('.path-step').forEach(el=>{
    const step=el.id.replace('path-','');
    const s=(B.manifest.learningPath||[]).find(x=>String(x.step)===step);
    if(s && (s.chapterIds||[]).every(c=>S.visited.includes(cur.book+'/chapter/'+c))){
      el.classList.add('passed');
      if(!el.querySelector('.ck')){ const sp=document.createElement('span'); sp.className='ck done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx=0, cardList=[];
function initCards(){
  const B=BOOKS[cur.book];
  const cards=B.manifest.flashcards||[];
  cardList=cards.slice(); cardIdx=0;
  if(!$('#card-done')){
    const d=document.createElement('div'); d.id='card-done'; d.className='empty';
    d.style.display='none'; d.textContent='本组卡片已全部复习完 🎉';
    const st=$('#card-stage'); if(st) st.appendChild(d);
  }
  const sel=$('#card-filter'); if(!sel) return;
  sel.innerHTML='<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c;
    const ch=(B.manifest.chapters||[]).find(x=>x.id===c);
    o.textContent=ch?ch.title:c; sel.appendChild(o);
  });
  sel.onchange=()=>{ const v=sel.value; cardList=v?cards.filter(c=>c.chapterId===v):cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick=()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick=()=>markCard(true);
  $('#card-again-btn').onclick=()=>markCard(false);
  showCard();
}
function showCard(){
  const S=getState(cur.book);
  updateCardCounts();
  const done=$('#card-done'), fc=$('#flashcard');
  if(cardIdx>=cardList.length){
    if(done) done.style.display=''; if(fc) fc.style.display='none'; return;
  }
  if(done) done.style.display='none'; if(fc) fc.style.display='';
  const c=cardList[cardIdx];
  document.querySelector('.fc-front').textContent=c.front;
  document.querySelector('.fc-back').textContent=c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const S=getState(cur.book);
  const c=cardList[cardIdx]; if(!c) return;
  S.cards[c.id]=known?'known':'again';
  store.set(stKey(cur.book,'cards'), S.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const S=getState(cur.book);
  const known=Object.values(S.cards).filter(v=>v==='known').length;
  const again=Object.values(S.cards).filter(v=>v==='again').length;
  const k=$('#card-known'), a=$('#card-again'), l=$('#card-left');
  if(k) k.textContent=known; if(a) a.textContent=again; if(l) l.textContent=Math.max(0,cardList.length-cardIdx);
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input=$('#glossary-filter');
  if(!input||input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput=()=>{
    const v=input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display=(!v||li.dataset.term.includes(v))?'':'none';
    });
  };
}

/* ---------- 全局搜索 ---------- */
let searchIdx=null;
function buildSearch(){
  if(searchIdx) return searchIdx;
  searchIdx=[];
  META.forEach(m=>{
    const B=BOOKS[m.key];
    Object.entries(B.rendered).forEach(([pid,html])=>{
      if(pid.startsWith('__')) return;
      const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
      searchIdx.push({book:m.key, page:pdfToPage(pid, B), text, label:m.title});
    });
  });
  Object.entries(CROSS).forEach(([k,html])=>{
    const meta=CROSS_META.find(x=>x.key===k)||{};
    searchIdx.push({book:'cross', page:'cross/'+k, text:html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '), label:(meta.label||'总览')});
  });
  return searchIdx;
}
function pdfToPage(pid, B){
  if(pid.startsWith('__quiz_')) return 'quiz/'+pid.replace('__quiz_','').replace('__','');
  if(pid==='__path__') return 'path';
  if(pid==='__cards__') return 'cards';
  if(pid==='__glossary__') return 'glossary';
  if(pid==='__patterns__') return 'patterns';
  if(pid==='__cheatsheet__') return 'cheatsheet';
  const ch=(B.manifest.chapters||[]).find(c=>c.id===pid);
  if(ch) return 'chapter/'+pid;
  return 'concept/'+pid;
}
$('#q').addEventListener('input', e=>{
  const v=e.target.value.trim().toLowerCase();
  if(!v){ route(); return; }
  const hits=buildSearch().filter(p=>p.text.toLowerCase().includes(v)).slice(0,40);
  $('#view').innerHTML='<h1>搜索结果：'+esc(v)+'</h1>'+
    (hits.length? hits.map(h=>{
      const href=h.book==='cross'?('#/cross/'+(h.page.split('/')[1]||FIRST_DOC)):('#/book/'+h.book+'/'+h.page);
      return `<div class="search-hit"><a href="${href}">${esc(h.label)}</a><br><span style="color:var(--muted);font-size:13px">${esc(h.text.slice(0,200))}</span></div>`;
    }).join('') : '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语。</div>');
});

/* ---------- Mermaid ---------- */
let mermaidState='idle';
function renderMermaid(){
  const els=Array.from(document.querySelectorAll('.mermaid')).filter(el=>!el.dataset.rendered);
  if(!els.length) return;
  const run=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme:document.body.dataset.theme==='dark'?'dark':'default'});
    els.forEach((el,idx)=>{ try{
      const out=mermaid.render('mm'+Date.now()+idx, el.textContent);
      if(out && typeof out.then==='function'){
        out.then(r=>{ el.innerHTML=r.svg; el.dataset.rendered='1'; }).catch(()=>{ el.dataset.rendered='0'; });
      } else { el.innerHTML=out; el.dataset.rendered='1'; }
    } catch(e){ el.dataset.rendered='0'; } });
  }catch(e){} };
  if(window.mermaid){ run(); return; }
  if(mermaidState==='loading') return;
  mermaidState='loading';
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ mermaidState='loaded'; run(); };
  s.onerror=()=>{ mermaidState='failed'; };
  document.head.appendChild(s);
}

/* ---------- 主题 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d=document.body.dataset.theme==='dark';
  document.body.dataset.theme=d?'':'dark';
  themeBtn.textContent=d?'🌙 深色':'☀️ 浅色';
};

/* ---------- 启动 ---------- */
function route(){
  cur=parseHash();
  renderTabs();
  renderNav();
  if(cur.book==='cross') renderCross(); else renderBook();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=820) sb.classList.remove('open'); });
})();
route();
</script>
