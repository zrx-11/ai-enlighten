，谁也没比坐着看得多。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：纳什均衡假设双方理性、且都知道对方理性。人会在意名誉、会有报复心理，行为经济学的实验结果经常偏离均衡预测。<\/blockquote>\n<h3>概念 3：混合策略——用概率出招（难度：进阶）<\/h3>\n<p>有些博弈没有纯策略均衡。猜硬币：我出正面你猜正面，你赢；我出反面你猜反面，你赢——不管怎么定，对方都能针对。<\/p>\n<p>解法是把策略变成概率分布，让对手<strong>无法针对<\/strong>。<strong>混合策略纳什均衡<\/strong>就是这个&quot;无法被针对&quot;的概率组合。<\/p>\n<p><strong>算例<\/strong>：零和博弈，行玩家的收益矩阵（列玩家收益取反）：<\/p>\n<table><thead><tr><th><\/th><th>列选左<\/th><th>列选右<\/th><\/tr><\/thead><tbody><tr><td>行选上<\/td><td>3<\/td><td>0<\/td><\/tr><tr><td>行选下<\/td><td>0<\/td><td>1<\/td><\/tr><\/tbody><\/table>\n<p>设行玩家选&quot;上&quot;的概率为 p，列玩家选&quot;左&quot;的概率为 q。行的期望收益：<\/p>\n<pre><code>E = 3pq + 0·p(1−q) + 0·(1−p)q + 1·(1−p)(1−q)\n  = 4pq − p − q + 1<\/code><\/pre>\n<p>对 p 求偏导得 <code>4q − 1<\/code>，令其为 0 得 <code>q = 0.25<\/code>；对 q 求偏导得 <code>4p − 1<\/code>，令其为 0 得 <code>p = 0.25<\/code>。<\/p>\n<p>均衡是双方各以 1/4 的概率选&quot;上&quot;和&quot;左&quot;，博弈值 <code>E = 4×0.0625 − 0.25 − 0.25 + 1 = 0.75<\/code>。验算：行玩家固定 p=0.25 时，无论 q 取多少，<code>E = q − 0.25 − q + 1 = 0.75<\/code>，恒定——这正是&quot;无法被针对&quot;的意思。<\/p>\n<p><strong>零和博弈可以转成线性规划<\/strong>求解：把&quot;最小化对手能逼我承受的最大损失&quot;写成一族约束，用单纯形法算。这是书里 8.2 节的做法，也是早期计算机下棋求解残局的理论基础。<\/p>\n<h3>概念 4：虚拟遗憾最小化（难度：高难）<\/h3>\n<p>扑克这类不完全信息博弈，Minimax 用不了——你不知道对手的牌，没法穷举&quot;他会怎么应&quot;。<\/p>\n<p>CFR 的思路是：不去算均衡，而是让智能体<strong>后悔<\/strong>。每轮把&quot;我实际选的策略&quot;和&quot;我事后看来的最优策略&quot;比较，算出<strong>遗憾<\/strong>；下轮选动作时，按&quot;遗憾大的动作多选&quot;来调整（这叫<strong>遗憾匹配<\/strong>）。<\/p>\n<ul><li>\n<strong>反事实遗憾<\/strong>：假设&quot;如果我当时一定走到这个信息集，我会后悔多少&quot;。这个&quot;反事实&quot;是数学技巧，用来把不同信息集解耦，让计算能分开做。\n<\/li><li>\n理论上可以证明，迭代足够多轮后，平均策略逼近纳什均衡，总的遗憾增长速度是 <code>O(1/√T)<\/code>（T 是迭代次数）。\n<\/ul>\n<p>Libratus 在 2017 年击败人类顶级德州扑克选手，靠的就是 CFR 的变体加大量算力。书里 8.2.2 讲的虚拟遗憾最小化就是这套框架。<\/p>\n<h3>概念 5：安全子博弈求解（难度：高难）<\/h3>\n<p>真实对局不能从头算到终局，只能&quot;往前看几步&quot;。但如果只看几步，可能算出一个&quot;局部最优、全局吃亏&quot;的策略。<\/p>\n<p><strong>安全子博弈<\/strong>（safe subgame solving）要求：在子博弈里算出的新策略，不能比原来的策略更差——用原策略的价值作为一个下界约束。这样&quot;重新计算&quot;就不会带来风险。它是 Libratus 能实时修正策略的关键技术。<\/p>\n<h3>概念 6：机制设计——改规则而不是改策略（难度：进阶）<\/h3>\n<p>前面都是&quot;规则给定，求最优策略&quot;。机制设计反过来：<strong>给定想达到的目标，设计一套规则让它自动实现<\/strong>。拍卖是最典型的场景。<\/p>\n<ul><li>\n<strong>二价拍卖<\/strong>（维克里拍卖）：出价最高者得，但付<strong>第二高<\/strong>的价格。它的性质是&quot;如实报价&quot;是最优策略——你报低了可能丢标，报高了要多付钱，只有报真实估值最划算。这种性质叫<strong>激励相容<\/strong>（说真话不吃亏）。\n<\/li><li>\n<strong>双边拍卖<\/strong>：买卖双方都报价，平台撮合。McAfee 机制的做法是先把报价排序，找到一个&quot;双方都能接受&quot;的成交价，再按规则补贴或收费，保证不亏钱且说真话近似最优。\n<\/li><li>\n<strong>匹配<\/strong>：书里 8.3 讲的双边匹配/单边匹配，典型是盖尔-沙普利算法（延迟接受）：每轮每个未匹配的一方按偏好向最想要的对象&quot;求婚&quot;，对方暂时接受最好的那个，被拒的继续求。它能保证<strong>稳定匹配<\/strong>——不存在一对男女彼此都更想在一起。\n<\/ul>\n<blockquote>类比：机制设计像设计游戏规则。你不是替玩家做决定，而是让规则本身把玩家推向你想要的结果。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：激励相容要求参与者理性、且能准确表达自己的偏好。真实拍卖里有人会战略性压价、有合谋、有机器人抢拍，理论保证会打折。<\/blockquote>\n<h3>概念 7：非完全信息博弈的实际应用（难度：进阶）<\/h3>\n<p>书里 8.4 节讲了这类方法的落地场景：谈判辅助、安全资源分配、拍卖平台定价、军事推演。它们的共同点是<strong>对手不会完全按理论最优行动<\/strong>，所以&quot;利用对手的弱点&quot;往往比&quot;追求理论均衡&quot;收益更高——这又回到第 7 章的探索与利用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[博弈] --&gt; B{信息是否完全}\n    B --&gt;|完全信息| C[Minimax 或 Alpha-Beta]\n    B --&gt;|不完全信息| D[CFR 遗憾最小化]\n    D --&gt; D1[反事实遗憾]\n    D1 --&gt; D2[平均策略逼近均衡]\n    D --&gt; D3[安全子博弈 保证不劣于原策略]\n    C --&gt; E{要不要设计规则}\n    E --&gt;|是| F[机制设计 拍卖 匹配]\n    E --&gt;|否| G[求均衡 线性规划 混合策略]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图把&quot;求解&quot;和&quot;设计&quot;分成两条路。求解是&quot;规则已定，我该怎么办&quot;，设计是&quot;我想让大家这么办，规则该怎么改&quot;。CFR 被放在不完全信息那一支，是因为它用&quot;遗憾&quot;绕过了&quot;必须知道对手手牌&quot;这个要求。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：完全信息博弈像两人明牌下棋，算得清；不完全信息博弈像打牌，你只能按概率猜对方的牌，猜错就认；机制设计像办一场比赛，你不是选手，而是制定赛制的人。<\/p>\n<p>失效边界：明牌下棋假设对手会算到同样深，人类会犯错反而更难看透；打牌的均衡策略在低级别对局里收益不如&quot;剥削式&quot;打法；赛制设计假设参赛者会如实报实力。<\/p>\n<p><strong>实例<\/strong>（囚徒困境的破解）：如果两人能事先约定&quot;都沉默，谁招供就报复谁&quot;，并且这个约定可信、可执行，均衡就会变成(沉默, 沉默)。这说明囚徒困境的&quot;困境&quot;来自<strong>缺乏有约束力的协议<\/strong>——这正是&quot;非合作博弈&quot;和&quot;合作博弈&quot;的分界线。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为纳什均衡就是&quot;最好的结果&quot;。<\/strong> 囚徒困境里均衡是最差的结果之一。均衡只保证&quot;没人能单方面改&quot;，不保证&quot;大家都满意&quot;。\n<\/li><li>\n<strong>别以为零和博弈一定是你死我活。<\/strong> 零和只描述收益之和为常数，&quot;我多得一分你少得一分&quot;，不代表手段上要互相毁灭。\n<\/li><li>\n<strong>别以为 CFR 只能打扑克。<\/strong> 任何&quot;信息不完全 + 动作有后果&quot;的场景都能用，比如安全资源调度、谈判策略生成。\n<\/li><li>\n<strong>别以为机制设计能消除投机。<\/strong> 它只能让&quot;说真话&quot;成为占优策略，不能阻止合谋、虚假身份（Sybil 攻击）这类规则外的行为。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：囚徒困境中，双方都招供是________均衡，但它不是________最优。\n<p><strong>答案<\/strong>：纳什；集体（或帕累托）。解析：单方面改变不会更好，但双方都沉默的收益更高。<\/p>\n<\/ol>\n<ol><li>\n<strong>计算<\/strong>：收益矩阵 <code>[[3,0],[0,1]]<\/code>（行为行玩家），混合策略均衡下双方各以多大概率选第一个动作？博弈值是多少？\n<p><strong>答案<\/strong>：各 1/4；值 0.75。解析：解 <code>4q−1=0<\/code> 与 <code>4p−1=0<\/code>，代回求期望。<\/p>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么完全信息博弈能用 Minimax，不完全信息博弈不能？\n<p><strong>答案<\/strong>：Minimax 要求能枚举对手在每个信息集上的所有可能动作。不完全信息下对手的手牌未知，同一局面在对手不同手牌下价值完全不同，无法形成唯一的博弈树，所以只能对&quot;信息集&quot;整体求期望，用 CFR 这类方法逼近均衡。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：关于二价拍卖，正确的是：\n<ul>\n<li>\nA. 出价最高者获胜\n<\/li><li>\nB. 成交价是第二高的报价\n<\/li><li>\nC. 如实报价是占优策略\n<\/li><li>\nD. 报价越高越可能以高价成交并获利更多\n<p><strong>答案<\/strong>：A、B、C。解析：D 错，报高于真实估值会增加亏损风险，不会增加收益。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：安全子博弈求解要防止什么风险？\n<p><strong>答案<\/strong>：只往前看几步时算出的局部策略，可能比全局策略更差（被对手利用）。安全子博弈用原策略的价值作为下界约束，保证重算后的策略不会更差，从而&quot;敢&quot;在实时对局中修正。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n四个维度：零和与否、信息是否完全、同时还是序贯、合作还是非合作。\n<\/li><li>\n纳什均衡＝无人能单方面改进；不等于最优结果。\n<\/li><li>\n无纯策略均衡时用混合策略，让对手无法针对；零和可转线性规划。\n<\/li><li>\nCFR 用遗憾匹配逼近期望意义上的均衡，适合不完全信息。\n<\/li><li>\n机制设计的核心是激励相容：让说真话成为最优选择。\n<\/ul>", "ch09": "<h1>第 9 章：人工智能未来发展和趋势<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 1—8 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出类脑计算与深度学习在&quot;模拟什么&quot;上的根本差别。\n<\/li><li>\n解释模型压缩的四种手段各自牺牲了什么。\n<\/li><li>\n判断一个场景该不该用量子机器学习。\n<\/li><li>\n说清算法伦理里&quot;可解释&quot;和&quot;准确&quot;为什么经常冲突。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一章不给预测，只给一张&quot;当下的瓶颈清单&quot;：算力、能耗、数据、可解释性、治理。每一项都对应一类正在发生的工作。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：类脑计算——照着大脑的结构造（难度：进阶）<\/h3>\n<p>深度学习的神经元是一个极度简化的模型：加权求和、过激活函数、反向传播。真实神经元不是这样：它有膜电位、有脉冲发放、有时间动态、有突触可塑性。<\/p>\n<p><strong>类脑计算<\/strong>（神经形态计算）试图在硬件层面模仿这些机制：<\/p>\n<ul><li>\n<strong>脉冲神经网络<\/strong>（SNN）：神经元只在膜电位超过阈值时发放一个脉冲，平时不输出。信息编码在&quot;脉冲的时间&quot;上，不是数值大小。\n<\/li><li>\n<strong>事件驱动<\/strong>：没有脉冲就没有计算，所以空闲时几乎不耗电。这是它在低功耗场景（传感器、可穿戴设备）上的核心优势。\n<\/li><li>\n<strong>存算一体<\/strong>：把存储和计算放在同一位置，避免&quot;数据在内存和处理器之间来回搬&quot;的能耗。\n<\/ul>\n<p>书里也提到<strong>类脑芯片<\/strong>（如 Loihi、TrueNorth）的现状：功耗优势明显，但训练方法不成熟——反向传播不能直接用在脉冲上，现在的训练大多靠&quot;人工神经网络训练完再转成脉冲网络&quot;，精度会掉。<\/p>\n<blockquote>类比：深度学习像用计算器算账，每一步都要按；类脑像用算盘，只在需要拨珠的时候动手。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：大脑的真实机制还没搞清楚，&quot;照抄结构&quot;不等于&quot;照抄智能&quot;。目前的类脑系统在复杂任务上的精度仍落后于主流深度学习。<\/blockquote>\n<h3>概念 2：自动化机器学习（难度：进阶）<\/h3>\n<p>调参、选模型、设计网络结构，过去靠人试。<strong>AutoML<\/strong> 把这些也变成搜索问题：<\/p>\n<ul><li>\n<strong>超参数搜索<\/strong>：学习率、批大小、层数。方法有网格搜索、随机搜索、贝叶斯优化（用历史结果建代理模型，决定下一个试点）。\n<\/li><li>\n<strong>神经架构搜索<\/strong>（NAS）：把&quot;网络结构&quot;当成搜索空间，用强化学习或进化算法找。代价是算力——早期的 NAS 要几百块 GPU 跑几周。\n<\/li><li>\n<strong>元学习<\/strong>：&quot;学会学习&quot;。在大量小任务上训练一个模型，让它面对新任务时只需几步梯度更新就能适应（few-shot learning 的理论基础之一）。\n<\/ul>\n<p>书里对这个方向的判断是谨慎的：AutoML 把&quot;人的经验&quot;变成了&quot;机器的搜索&quot;，但搜索空间是人定的，先验还是人给的。<\/p>\n<h3>概念 3：模型压缩——把大模型塞进小设备（难度：进阶）<\/h3>\n<p>一个 ResNet-50 有一千多万参数，直接放到手机上内存和电量都吃不消。四种常见手段：<\/p>\n<table><thead><tr><th>手段<\/th><th>做法<\/th><th>牺牲了什么<\/th><\/tr><\/thead><tbody><tr><td>剪枝<\/td><td>删掉权重接近 0 的连接或整个通道<\/td><td>结构变得不规则，硬件加速难<\/td><\/tr><tr><td>量化<\/td><td>32 位浮点换成 8 位整数<\/td><td>精度小幅下降，极端量化会崩<\/td><\/tr><tr><td>知识蒸馏<\/td><td>用大模型（教师）的输出训练小模型（学生）<\/td><td>需要教师模型，训练成本前置<\/td><\/tr><tr><td>低秩分解<\/td><td>把大矩阵拆成两个小矩阵相乘<\/td><td>表达能力受限，压缩率有上限<\/td><\/tr><\/tbody><\/table>\n<p>这四种可以叠加，工业上常把&quot;剪枝 + 量化 + 蒸馏&quot;一起用，把模型压到原来的十分之一，精度只掉一两个点。<\/p>\n<p><strong>为什么量化特别有效？<\/strong> 8 位整数比 32 位浮点省 4 倍内存，而且整数运算在多数芯片上更快、更省电。代价是动态范围变窄，需要校准（用一批真实数据统计每层的取值范围）。<\/p>\n<h3>概念 4：人工智能芯片（难度：进阶）<\/h3>\n<p>CPU 擅长通用逻辑控制，GPU 擅长大量并行的乘加。深度学习的主要运算是矩阵乘法，正好是 GPU 的强项，这也是 2012 年 AlexNet 用 GPU 训练成功的技术背景。<\/p>\n<p>专用芯片（ASIC/TPU）把矩阵乘法做成硬件电路，能效比更高，但只擅长这一件事。<strong>存算一体<\/strong>、<strong>光计算<\/strong>、<strong>忆阻器<\/strong>这些方向都在解决同一个问题：<strong>内存墙<\/strong>——算得快没用，数据搬不过来。<\/p>\n<h3>概念 5：量子机器学习（难度：高难）<\/h3>\n<p>量子计算的优势在特定问题上：大整数分解、量子系统模拟、某些搜索问题有理论加速。放到机器学习上，目前能证明加速的场景很窄：<\/p>\n<ul><li>\n量子版本的线性代数（HHL 算法）理论上能加速求解线性方程组，但需要满足&quot;数据能高效加载进量子态&quot;这个前提，而这个前提在现实中很难满足。\n<\/li><li>\n量子核方法、量子神经网络都还在早期，规模受量子比特数和噪声限制。\n<\/ul>\n<p>书里的态度是务实的：<strong>量子机器学习不是&quot;机器学习变快&quot;，而是&quot;某些特定子问题可能变快&quot;<\/strong>。把它当通用加速器是误解。<\/p>\n<h3>概念 6：伦理与治理（难度：进阶）<\/h3>\n<p>算法做决定时，会带进训练数据里的偏见。三个典型问题：<\/p>\n<ul><li>\n<strong>偏见放大<\/strong>：招聘模型如果拿历史录用数据训练，而历史上男性录用率高，模型会学到&quot;男性更合适&quot;。\n<\/li><li>\n<strong>不可解释<\/strong>：信贷拒贷、医疗诊断需要给出理由，黑箱给不出。\n<\/li><li>\n<strong>责任归属<\/strong>：自动驾驶出事，责任在车主、厂商、还是算法设计者？\n<\/ul>\n<p>治理手段大致三层：技术层（公平性约束、可解释方法、差分隐私）、制度层（算法备案、影响评估、审计）、法律层（个人信息保护、算法推荐管理规定）。书里 9.6 节把这些归到&quot;人工智能伦理与治理&quot;。<\/p>\n<p><strong>可解释与准确的冲突<\/strong>是真实的：在很多任务上，最简单的模型（线性、决策树）可解释但精度低；最准的深度模型说不清理由。工程上的折中是用&quot;事后解释&quot;（如 SHAP、注意力可视化）给一个近似理由，但要清楚：事后解释不等于因果解释。<\/p>\n<h3>概念 7：开发框架（难度：基础）<\/h3>\n<p>书里 9.7 节点了主流框架：TensorFlow、PyTorch、PaddlePaddle、MindSpore 等。它们的共同抽象是&quot;张量 + 自动微分 + 计算图&quot;。选框架看三件事：生态（预训练模型和工具链）、部署（能否转到手机或服务器）、团队熟悉度。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[当下瓶颈] --&gt; B[算力与能耗]\n    A --&gt; C[数据与标注]\n    A --&gt; D[可解释与可信]\n    B --&gt; B1[专用芯片]\n    B --&gt; B2[模型压缩]\n    B --&gt; B3[类脑与脉冲网络]\n    C --&gt; C1[AutoML]\n    C --&gt; C2[自监督与合成数据]\n    D --&gt; D1[公平性约束]\n    D --&gt; D2[事后解释]\n    D --&gt; D3[治理与审计]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图把技术趋势按&quot;它想解决哪个瓶颈&quot;归类。看的时候注意：同一个瓶颈有多条解法，彼此不替代——芯片解决速度，压缩解决体积，类脑解决能耗，它们可以同时上。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：模型压缩像把一本百科全书的排版改紧、去掉重复条目、把生僻字换成常用字——读起来还通顺，但极细节会丢。知识蒸馏像让老教授把毕生经验浓缩成一门课，讲给学生。<\/p>\n<p>失效边界：压缩到极致时，模型的&quot;长尾能力&quot;最先消失——常见样本还行，罕见样本全错。这就是为什么医疗、司法这类场景不敢激进压缩。<\/p>\n<p><strong>实例<\/strong>（量化的账）：一个 100MB 的 32 位浮点模型，换成 8 位整数量化后约 25MB，手机端推理延迟通常降到 1/2 到 1/4，精度在 ImageNet 上一般掉 0.5 到 1.5 个百分点。这个交换在多数消费级应用里是划算的。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为类脑计算会取代深度学习。<\/strong> 它现在更像&quot;低功耗推理&quot;的补充方案，训练方法还没成熟。\n<\/li><li>\n<strong>别以为模型压缩没有代价。<\/strong> 压缩一定会损失一部分表达能力，问题只是损失落在哪个分布上。\n<\/li><li>\n<strong>别以为量子计算一成熟 AI 就起飞。<\/strong> 加速是任务相关的，数据加载和读出仍是瓶颈。\n<\/li><li>\n<strong>别以为&quot;加个解释模块&quot;就解决了可解释性。<\/strong> 事后解释可能是错的，甚至自相矛盾。\n<\/li><li>\n<strong>别以为伦理只是道德问题。<\/strong> 它同时是法律合规问题（个人信息保护、算法备案）和工程问题（公平性指标怎么算、怎么测）。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>单选<\/strong>：类脑计算在哪个方面最有现实优势？\n<ul>\n<li>\nA. 训练速度\n<\/li><li>\nB. 低功耗推理\n<\/li><li>\nC. 大规模语言建模\n<\/li><li>\nD. 数据标注\n<p><strong>答案<\/strong>：B。解析：事件驱动、存算一体带来能效优势；训练方法仍是短板。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>填空<\/strong>：把 32 位浮点权重换成 8 位整数，这种压缩手段叫________；用大模型输出训练小模型叫________。\n<p><strong>答案<\/strong>：量化；知识蒸馏。<\/p>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么说&quot;内存墙&quot;是芯片方向的核心问题？\n<p><strong>答案<\/strong>：算力增长快于内存带宽，矩阵乘法时数据搬运的耗时和能耗超过计算本身。存算一体、近存计算都是为减少搬运而设计的。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：下列关于可解释性的说法，正确的有：\n<ul>\n<li>\nA. 线性模型与决策树本身可解释\n<\/li><li>\nB. 事后解释一定反映真实因果\n<\/li><li>\nC. 医疗与信贷场景对可解释性要求高\n<\/li><li>\nD. 可解释与高精度常常需要权衡\n<p><strong>答案<\/strong>：A、C、D。解析：B 错，事后解释是近似，不保证因果正确。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五个瓶颈：算力能耗、数据、可解释、治理、部署。\n<\/li><li>\n类脑＝脉冲 + 事件驱动 + 存算一体，优势在功耗，短板在训练。\n<\/li><li>\n压缩四件套：剪枝、量化、蒸馏、低秩；代价是长尾能力。\n<\/li><li>\n量子加速是任务相关的，不是通用加速。\n<\/li><li>\n可解释与准确通常是权衡关系，事后解释不等于因果。\n<\/ul>", "c01": "<h1>符号主义与连接主义<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1、2、5、6 章，第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>符号主义认为智能是&quot;对符号做逻辑运算&quot;，连接主义认为智能是&quot;大量简单单元连起来后涌现的行为&quot;。前者自上而下写规则，后者自下而上调参数。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是人工智能七十年来最主要的一条裂缝。看清它，你才能理解为什么&quot;专家系统&quot;和&quot;神经网络&quot;会轮流坐庄，也才能判断一个新方法到底属于哪一派、继承了哪种优点和缺点。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[智能] --&gt; B[符号主义]\n    A --&gt; C[连接主义]\n    B --&gt; B1[知识由人写]\n    B1 --&gt; B2[可解释 难覆盖例外]\n    C --&gt; C1[参数从数据学]\n    C1 --&gt; C2[能泛化 难解释]\n    B2 --&gt; D[融合 神经符号]\n    C2 --&gt; D<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条路各有明确的长处和短处，而且正好互补——一个能说清、一个能泛化。所以近年出现&quot;神经符号&quot;这类融合尝试。<\/p>\n<h2>详解<\/h2>\n<p>符号主义的典型工作是写规则、建本体、做逻辑推理。它的前提是&quot;知识可以被清楚地表达&quot;。这个前提在数学、棋类、法律条文里成立，在&quot;认出一张脸&quot;&quot;听懂一句话&quot;里不成立——你说不清自己是怎么认出熟人的。<\/p>\n<p>连接主义的前提相反：知识不需要被表达，只需要被&quot;拟合&quot;。给足够多的样本，网络自己找映射。代价是它学到的东西存在几百万个参数里，没法翻译成人话。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为连接主义&quot;不需要知识&quot;<\/strong>——训练数据、网络结构、损失函数，每一样都是人给的知识，只是形式从&quot;规则&quot;变成了&quot;先验约束&quot;。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>五种范式<\/td><td>符号主义是其中一支，不是全部<\/td><\/tr><tr><td>第 2 章<\/td><td>逻辑与知识图谱<\/td><td>符号路线的具体技术<\/td><\/tr><tr><td>第 6 章<\/td><td>深度学习<\/td><td>连接路线的当代形态<\/td><\/tr><tr><td>第 9 章<\/td><td>类脑计算<\/td><td>连接主义往硬件层面的延伸<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">状态空间与启发函数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">反向传播<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">卷积与权重共享<\/a>\n<\/ul>", "c02": "<h1>状态空间与启发函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>状态空间是&quot;把问题拆成一个个局面 + 一条条可执行的动作&quot;；启发函数 <code>h(n)<\/code> 是对&quot;从 n 到目标还要多少代价&quot;的猜测，用来决定先看哪个局面。<\/p>\n<h2>为什么重要<\/h2>\n<p>搜索是唯一能保证&quot;找到最优解&quot;的方法族。启发函数是让搜索从&quot;穷举&quot;变成&quot;可用&quot;的关键——没有 h，A* 就是广度优先，指数级爆炸；有了 h，很多实际问题能在可接受时间内求解。<\/p>\n<h2>详解<\/h2>\n<p>四个指标衡量搜索算法：完备性、最优性、时间复杂度、空间复杂度。<\/p>\n<p><code>h<\/code> 的两个性质决定 A* 的表现：<\/p>\n<ul><li>\n<strong>可采纳<\/strong>：<code>h<\/code> 不高估真实剩余代价，保证最优解。\n<\/li><li>\n<strong>一致<\/strong>：<code>h(n) ≤ c(n,n&#x27;) + h(n&#x27;)<\/code>，保证每个节点最多扩展一次。\n<\/ul>\n<p>工程上常故意用&quot;略高估&quot;的 h（加权 A*）换速度，代价是接受次优解。这在实时路径规划里很常见：宁可快 30%，多绕 2% 的路。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为 h 必须很准才有用<\/strong>——只要不太离谱，它就能大幅减少扩展节点；完全不准（比如恒为 0）才退化成盲目搜索。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>3.2 启发式搜索<\/td><td>贪婪、A<em>、A<\/em> 性能分析<\/td><\/tr><tr><td>第 3 章<\/td><td>3.4 蒙特卡洛树搜索<\/td><td>UCB 也用&quot;不确定性&quot;来决定探索方向<\/td><\/tr><tr><td>第 8 章<\/td><td>博弈求解<\/td><td>残局库可以看作一种精确的 h<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">符号主义与连接主义<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">贝尔曼方程<\/a>（价值函数本质上是&quot;最优的 h&quot;）\n<\/ul>", "c03": "<h1>过拟合与正则化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4、5、6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>过拟合是模型把训练集的噪声也当成规律学了，表现为训练集上很准、新数据上很差；正则化是给模型加约束，让它&quot;别学得太细&quot;。<\/p>\n<h2>为什么重要<\/h2>\n<p>机器学习里几乎所有的设计选择，最后都可以解释成&quot;在拟合能力和泛化能力之间找平衡&quot;。不理解过拟合，你调参就只能是碰运气。<\/p>\n<h2>详解<\/h2>\n<p>三个信号：<\/p>\n<ol><li>\n训练误差持续下降，验证误差先降后升——拐点就是过拟合开始的位置。\n<\/li><li>\n模型参数很大、决策边界很曲折。\n<\/li><li>\n数据量小、特征维度高。\n<\/ol>\n<p>四类对策：<\/p>\n<table><thead><tr><th>对策<\/th><th>怎么做<\/th><th>代价<\/th><\/tr><\/thead><tbody><tr><td>更多数据<\/td><td>采集、增强、合成<\/td><td>成本<\/td><\/tr><tr><td>L1/L2 正则<\/td><td>在损失里加参数绝对值/平方和<\/td><td>参数被压小，可能欠拟合<\/td><\/tr><tr><td>早停<\/td><td>验证误差开始上升就停<\/td><td>需要可靠的验证集<\/td><\/tr><tr><td>简化结构<\/td><td>剪枝、减层、减特征<\/td><td>表达能力下降<\/td><\/tr><\/tbody><\/table>\n<p>L1 有个额外好处：它会把不重要的权重压到正好 0，天然做特征选择。L2 把权重整体压小，更平滑。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为&quot;验证集准确率高于训练集&quot;一定是 bug<\/strong>——如果用了强增强或 dropout，训练时更难、测试时更容易，出现这种倒挂是正常的。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>4.1 基本概念<\/td><td>经验风险 vs 期望风险<\/td><\/tr><tr><td>第 4 章<\/td><td>4.6 SVM<\/td><td>结构风险最小化 = 经验风险 + 模型复杂度<\/td><\/tr><tr><td>第 6 章<\/td><td>6.3 正则化<\/td><td>Dropout、BatchNorm 等具体手段<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">支持向量与间隔<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">卷积与权重共享<\/a>\n<\/ul>", "c04": "<h1>信息熵与信息增益<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（决策树）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>信息熵衡量一个集合&quot;有多乱&quot;——全是同一类时熵为 0，各类均匀时熵最大；信息增益是&quot;按某个特征切开之后，乱度下降了多少&quot;。<\/p>\n<h2>为什么重要<\/h2>\n<p>决策树的每一次分裂都在问&quot;按哪个特征切最值&quot;。信息增益就是&quot;值不值&quot;的度量。它同时也是第 5 章 LSA、第 6 章交叉熵损失背后的同一个概念：不确定性。<\/p>\n<h2>详解<\/h2>\n<pre><code>H(S) = −Σ p_k log₂ p_k<\/code><\/pre>\n<p>p_k 是第 k 类的比例。举两个极端：<\/p>\n<ul><li>\n10 个样本全正：<code>H = −1×log₂1 = 0<\/code>\n<\/li><li>\n5 正 5 负：<code>H = −0.5log₂0.5 − 0.5log₂0.5 = 1<\/code>\n<\/ul>\n<p>所以熵的取值在 0 到 log₂(类别数) 之间。<\/p>\n<p><strong>信息增益<\/strong> = 切之前的熵 − 各子集熵的加权平均。权重是子集样本数占比。<\/p>\n<p>为什么要用 log？因为&quot;独立事件的信息量相加&quot;要求 log——抛两次硬币的总不确定性是一次的两倍，概率却是相乘，只有 log 能把相乘变成相加。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为信息增益越大特征越有信息<\/strong>——取值多的特征（编号、时间戳）会把数据切成很多纯的小组，增益虚高却毫无预测价值。C4.5 引入增益率就是为了惩罚这种&quot;碎切&quot;。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>4.3 决策树<\/td><td>ID3 用信息增益，C4.5 用增益率，CART 用基尼<\/td><\/tr><tr><td>第 4 章<\/td><td>4.2 逻辑回归<\/td><td>交叉熵损失来自同一个不确定性度量<\/td><\/tr><tr><td>第 6 章<\/td><td>6.6 词向量<\/td><td>上下文共现的统计也是信息度量<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">过拟合与正则化<\/a>（树越深越容易把噪声切开）\n<\/ul>", "c05": "<h1>支持向量与间隔<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章（4.6）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>支持向量是离分界线最近的那些训练点；间隔是分界线到两边最近点的距离之和。SVM 的目标是让这个间隔尽可能宽。<\/p>\n<h2>为什么重要<\/h2>\n<p>它回答了一个其他分类器不回答的问题：<strong>在无数条能分开数据的线里，选哪条<\/strong>。答案不是&quot;随便&quot;，而是&quot;最宽的那条&quot;——因为宽间隔意味着对噪声和小扰动更宽容，泛化更好。<\/p>\n<h2>详解<\/h2>\n<p>设超平面 <code>w·x + b = 0<\/code>。点 x 到它的距离是 <code>|w·x+b| / ‖w‖<\/code>。<\/p>\n<p>把约束归一化为 <code>y_i(w·x_i+b) ≥ 1<\/code>（y 取 ±1），则最近点满足 <code>=1<\/code>，距离为 <code>1/‖w‖<\/code>，两边相加间隔为 <code>2/‖w‖<\/code>。<\/p>\n<p>最大化间隔 ⇔ 最小化 <code>‖w‖<\/code> ⇔ 最小化 <code>(1/2)‖w‖²<\/code>（平方和 1/2 都是为了让求导干净）。<\/p>\n<p><strong>只有支持向量起作用<\/strong>：把其他点全部删掉，解不变。这是 SVM 最反直觉也最漂亮的性质——模型的复杂度由&quot;边界上的少数点&quot;决定，不由样本总量决定。<\/p>\n<p>软间隔版本加松弛变量和惩罚系数 C：C 大，死守每个点；C 小，容许违规。等价于合页损失 + L2 正则。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为&quot;间隔最大&quot;等于&quot;分类最准&quot;<\/strong>——间隔最大是在训练集上的一种偏好，最终准不准要看测试集。数据本身有重叠时，硬间隔根本无解，必须用软间隔。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>4.6.1 VC 维与结构风险<\/td><td>间隔宽 → 有效 VC 维低 → 泛化好<\/td><\/tr><tr><td>第 4 章<\/td><td>4.6.3 松弛变量<\/td><td>软间隔与合页损失等价<\/td><\/tr><tr><td>第 4 章<\/td><td>4.6.4 核函数<\/td><td>线性不可分时换内积<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">过拟合与正则化<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">核技巧<\/a>\n<\/ul>", "c06": "<h1>核技巧<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章（4.6.4）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>不真的把数据搬到高维，只把算法里出现的&quot;内积&quot;换成另一个函数 <code>K(x,z)<\/code>，等价于在高维空间里算内积。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让线性模型具备了非线性能力，而且计算量还停留在原始维度。这是 1990 年代 SVM 能横扫分类问题的核心技术，也是&quot;特征工程 → 表示学习&quot;过渡期的关键一步。<\/p>\n<h2>详解<\/h2>\n<p>关键观察：很多算法（SVM、核 PCA、核岭回归）可以写成只依赖内积 <code>x·z<\/code> 的形式。如果存在一个映射 φ，使得 <code>K(x,z) = φ(x)·φ(z)<\/code>，那把所有的 <code>x·z<\/code> 替换成 <code>K<\/code> 就行了，完全不用知道 φ 长什么样。<\/p>\n<p>常用核：<\/p>\n<table><thead><tr><th>核<\/th><th>式子<\/th><th>适用<\/th><\/tr><\/thead><tbody><tr><td>线性核<\/td><td><code>x·z<\/code><\/td><td>线性可分、高维稀疏<\/td><\/tr><tr><td>多项式核<\/td><td><code>(x·z + 1)^d<\/code><\/td><td>特征交互<\/td><\/tr><tr><td>高斯核 RBF<\/td><td><code>exp(−‖x−z‖²/(2σ²))<\/code><\/td><td>通用，σ 控制&quot;影响半径&quot;<\/td><\/tr><\/tbody><\/table>\n<p>高斯核隐式映射到无穷维——你没法写出 φ，但 <code>K<\/code> 有闭式，能算。这就是&quot;核技巧&quot;省下来的东西。<\/p>\n<p>代价：核矩阵是 n×n，n 是样本数。样本上万时存储和计算都是 <code>O(n²)<\/code>，这是核方法在大数据时代让位给深度学习的重要原因。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为核函数越复杂越好<\/strong>——σ 太小，每个点自成一个小岛，过拟合；σ 太大，退化成线性。核的选择和调参本身就是一场权衡。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>4.6.4 核函数解决线性不可分<\/td><td>用核替代内积<\/td><\/tr><tr><td>第 5 章<\/td><td>5.2 PCA<\/td><td>核 PCA 同理，把协方差换成核矩阵<\/td><\/tr><tr><td>第 6 章<\/td><td>6.6 词向量<\/td><td>相似度度量也常借用核思想<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">支持向量与间隔<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">特征值与主成分<\/a>\n<\/ul>", "c07": "<h1>特征值与主成分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章（5.2、5.3）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>协方差矩阵的特征向量是&quot;数据变化的方向&quot;，特征值是&quot;在这个方向上变化有多大&quot;。特征值最大的那个方向就是第一主成分。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;降维&quot;从&quot;随便挑几列&quot;变成&quot;挑信息最多的方向&quot;。PCA、特征人脸、LSA、甚至第 6 章的 BatchNorm，都在用这套线性代数的语言。<\/p>\n<h2>详解<\/h2>\n<p>设中心化后的数据矩阵 X（每行一个样本）。协方差矩阵 <code>C = XᵀX / (n−1)<\/code>。<\/p>\n<p>对 C 做特征分解 <code>C = V Λ Vᵀ<\/code>：<\/p>\n<ul><li>\nV 的每一列是一个方向（正交）\n<\/li><li>\nΛ 对角线上的元素是数据在该方向上的方差\n<\/li><li>\n所有特征值加起来等于原始数据的总方差\n<\/ul>\n<p>取前 k 个特征值对应的方向，把 X 投影上去，就完成了降维。<strong>降维后保留的方差比例<\/strong> = 前 k 个特征值之和 / 全部特征值之和。这个比例是判断&quot;降维损失了多少信息&quot;的直接指标。<\/p>\n<p><strong>和 SVD 的关系<\/strong>：对 X 做奇异值分解 <code>X = U Σ Vᵀ<\/code>，则 <code>V<\/code> 就是 C 的特征向量，<code>Σ²/(n−1)<\/code> 就是特征值。所以不用真的构造 n×n 的协方差矩阵，直接分解 X 更省。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为特征值小就&quot;没有信息&quot;<\/strong>——它只是在这个线性方向上变化小，可能是噪声，也可能是被大尺度特征掩盖的细节（所以要先标准化）。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>5.2 主成分分析<\/td><td>最大化投影方差<\/td><\/tr><tr><td>第 5 章<\/td><td>5.3 特征人脸<\/td><td>用 SVD 避免大协方差矩阵<\/td><\/tr><tr><td>第 5 章<\/td><td>5.4 潜在语义分析<\/td><td>词-文档矩阵的低秩近似<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">核技巧<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">EM 与隐变量<\/a>\n<\/ul>", "c08": "<h1>EM 与隐变量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章（5.5）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>隐变量是&quot;数据里存在但没被记录的量&quot;（比如每轮投的是哪枚硬币）；EM 是在不知道隐变量的情况下，交替&quot;猜隐变量&quot;和&quot;更新参数&quot;来估计模型。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是处理缺失信息最通用的框架之一。混合模型、隐马尔可夫模型、主题模型、甚至缺失数据填补，背后都是 EM 或它的变体。<\/p>\n<h2>详解<\/h2>\n<p>E 步：用当前参数 θ_old 算隐变量的后验 <code>γ_i = P(z_i | x_i, θ_old)<\/code>。 M 步：把 γ 当权重，最大化完整数据的对数似然，得到 θ_new。<\/p>\n<p>两条性质：<\/p>\n<ol><li>\n每一轮都不会让观测数据的似然变小（单调性）。\n<\/li><li>\n只保证收敛到局部极大，且对初值敏感。\n<\/ol>\n<p>二硬币例子里，初值 0.6 和 0.6 会让 γ 恒为 0.5，参数卡住不动——这就是&quot;对称陷阱&quot;的直观演示。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为 EM 一定比直接优化好<\/strong>——它只是保证单调上升、实现简单，收敛速度往往是线性的，比牛顿法慢。大数据场景下常用随机变体（如在线 EM）。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>5.5.1 二硬币<\/td><td>E 步算来源概率，M 步加权重估<\/td><\/tr><tr><td>第 5 章<\/td><td>5.5.2 三硬币<\/td><td>多个隐变量，只观测最终结果<\/td><\/tr><tr><td>第 5 章<\/td><td>5.5.3 一般形式<\/td><td>Q 函数、下界视角<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">特征值与主成分<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">贝尔曼方程<\/a>（都是&quot;用一个估计更新另一个估计&quot;的自举思想）\n<\/ul>", "c09": "<h1>反向传播<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 6 章（6.2.3）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>反向传播是用链式法则，从损失函数出发，把梯度一层层&quot;倒着&quot;算回每个参数的方法。它算的是梯度，不是学习本身。<\/p>\n<h2>为什么重要<\/h2>\n<p>没有它，几百万参数的模型只能靠数值差分估梯度，代价是参数个数乘以一次前向。BP 让&quot;一次前向 + 一次反向&quot;就拿到全部梯度，是深度学习能成立的计算基础。<\/p>\n<h2>详解<\/h2>\n<p>对一层 <code>z = Wx + b<\/code>、<code>a = σ(z)<\/code>，损失 L：<\/p>\n<pre><code>∂L/∂W = ∂L/∂z × xᵀ\n∂L/∂b = ∂L/∂z\n∂L/∂x = Wᵀ × ∂L/∂z<\/code><\/pre>\n<p>第三行是把误差往上一层传——这就是&quot;反向&quot;的含义。每一层只做三件事：拿到上一层传来的梯度、算本层参数梯度、把梯度改造后传下去。<\/p>\n<p><strong>为什么要存中间结果？<\/strong> 前向时每层的输入和输出都要留着，反向时才能算 <code>∂L/∂z × xᵀ<\/code>。这就是训练比推理更吃显存的原因。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为 BP 是&quot;智能的自我修正&quot;<\/strong>——它只是微积分，任何可微函数都能这么干。真正决定学到什么的是损失函数和数据。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章<\/td><td>6.2.3 参数优化与学习<\/td><td>梯度下降 + BP<\/td><\/tr><tr><td>第 6 章<\/td><td>6.4 RNN<\/td><td>沿时间展开后 BP 变成 BPTT，梯度易消失<\/td><\/tr><tr><td>第 7 章<\/td><td>7.3 策略梯度<\/td><td>用 log 技巧把不可导的采样变成可导<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">符号主义与连接主义<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">过拟合与正则化<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">卷积与权重共享<\/a>\n<\/ul>", "c10": "<h1>卷积与权重共享<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章（6.3）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>卷积是用一个小窗口（核）在输入上滑动，每个位置做内积；权重共享指同一个核扫遍整张图，参数只算一份。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把图像问题里的两个先验（局部相关、平移不变）写进了模型结构，参数量因此降了几个数量级。CNN 能在中等规模数据上训成，靠的就是这一条。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>局部性<\/strong>：核只看一个小邻域，符合&quot;相邻像素更相关&quot;的事实。\n<\/li><li>\n<strong>平移等变<\/strong>：同一个核在所有位置生效，猫在左上角和右下角用同一组权重就能识别。\n<\/li><li>\n<strong>层次性<\/strong>：堆叠卷积，感受野逐层扩大，从边缘到纹理到部件到物体。\n<\/ul>\n<p>输出尺寸 <code>(W − K + 2P)/S + 1<\/code>，这个式子要能现场算。参数量 <code>K×K×输入通道×输出通道<\/code>，与图像尺寸无关。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为卷积是&quot;滤波&quot;就等于&quot;模糊&quot;<\/strong>——核的数值决定它是做边缘检测、锐化还是模糊，学出来的核往往是人设计不出来的组合。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章<\/td><td>6.3.1 卷积计算<\/td><td>输出尺寸、参数共享<\/td><\/tr><tr><td>第 6 章<\/td><td>6.3.2 池化<\/td><td>降采样，扩大感受野<\/td><\/tr><tr><td>第 6 章<\/td><td>6.3.3 正则化<\/td><td>Dropout、BatchNorm<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">反向传播<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">贝尔曼方程<\/a>\n<\/ul>", "c11": "<h1>贝尔曼方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 7 章（7.1.4、7.2）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>贝尔曼方程说：一个状态的价值，等于&quot;当下的奖励&quot;加上&quot;折扣后的下一个状态的价值&quot;。它把长期回报拆成了可以一步步算的递推式。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是所有值函数方法的骨架。Q 学习、DQN、值迭代、策略评估，全都是在不同程度上&quot;解这个方程&quot;或&quot;近似这个方程&quot;。<\/p>\n<h2>详解<\/h2>\n<p>期望形式（评价给定策略 π）：<\/p>\n<pre><code>V(s) = Σ_a π(a|s) Σ_s&#x27; P(s&#x27;|s,a)[r + γV(s&#x27;)]<\/code><\/pre>\n<p>最优形式（求最好的策略）：<\/p>\n<pre><code>V*(s) = max_a Σ_s&#x27; P(s&#x27;|s,a)[r + γV*(s&#x27;)]<\/code><\/pre>\n<p>差别只在 <code>max<\/code>。期望形式是线性方程组，可以直接解；最优形式是非线性的，要靠迭代（值迭代）或&quot;评估-改进&quot;循环（策略迭代）。<\/p>\n<p>Q 学习的更新式本质上是贝尔曼最优方程的<strong>采样版<\/strong>：用一次实际采样 <code>r + γmaxQ(s&#x27;,·)<\/code> 代替期望。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为贝尔曼方程要求知道全局<\/strong>——它只要求&quot;下一步&quot;，这正是它能被采样近似、能在大状态空间里用的原因。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章<\/td><td>7.1.4 贝尔曼方程<\/td><td>定义与两种形式<\/td><\/tr><tr><td>第 7 章<\/td><td>7.2.2 策略优化定理<\/td><td>策略改进的单调性保证<\/td><\/tr><tr><td>第 7 章<\/td><td>7.2.4 基于价值的算法<\/td><td>Q 学习、SARSA、DQN<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">状态空间与启发函数<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">纳什均衡<\/a>\n<\/ul>", "c12": "<h1>纳什均衡<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 8 章（8.1.4）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在一个策略组合里，如果任何一方单方面改变策略都不会变得更好，这个组合就是纳什均衡。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是博弈论的&quot;解&quot;的定义方式。没有它，&quot;求最优策略&quot;这句话没有明确含义——因为多方同时优化时，结果取决于彼此。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>纯策略均衡<\/strong>：每方都固定选一个动作。囚徒困境的(招供, 招供)就是。\n<\/li><li>\n<strong>混合策略均衡<\/strong>：每方按概率分布选。猜硬币只有混合均衡。\n<\/ul>\n<p>存在性：有限博弈必有混合策略纳什均衡（纳什 1950 年的定理）。这是它成为标准解概念的理论支柱。<\/p>\n<p>求解：零和博弈可以转成线性规划；一般博弈可以用 Lemke-Howson、CFR 或迭代逼近。复杂度上，一般博弈求精确均衡是 PPAD 完全问题，大规模场景只能近似。<\/p>\n<p><strong>均衡不等于最优<\/strong>：囚徒困境里均衡收益比合作差。均衡只承诺&quot;稳定&quot;，不承诺&quot;好&quot;。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为均衡是&quot;大家商量好的结果&quot;<\/strong>——它不需要任何沟通，是各自独立推理后自然落到的一个不动点。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章<\/td><td>8.1.4 纳什均衡<\/td><td>定义与存在性<\/td><\/tr><tr><td>第 8 章<\/td><td>8.2 博弈策略求解<\/td><td>零和转线性规划、CFR<\/td><\/tr><tr><td>第 8 章<\/td><td>8.3 博弈规则设计<\/td><td>机制设计追求&quot;均衡即目标&quot;<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">贝尔曼方程<\/a>\n<\/li><li>\n后续：无\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：看懂五种范式<\/strong><br>阅读：<a href=\"#/book/ai-models-algorithms/chapter/ch01\">第 1 章：绪论——五种计算范式<\/a><br>检查点：能对同一任务说出五种做法<\/li><li class='path-step' id='path-02'><strong>步骤 02：符号路线：逻辑与因果<\/strong><br>阅读：<a href=\"#/book/ai-models-algorithms/chapter/ch02\">第 2 章：逻辑与推理<\/a><br>检查点：能把中文陈述翻成一阶逻辑式<\/li><li class='path-step' id='path-03'><strong>步骤 03：符号路线：搜索<\/strong><br>阅读：<a href=\"#/book/ai-models-algorithms/chapter/ch03\">第 3 章：搜索求解<\/a><br>检查点：能手算 A* 扩展顺序与剪枝<\/li><li class='path-step' id='path-04'><strong>步骤 04：统计路线：监督学习<\/strong><br>阅读：<a href=\"#/book/ai-models-algorithms/chapter/ch04\">第 4 章：监督学习<\/a><br>检查点：能手算最小二乘与信息增益<\/li><li class='path-step' id='path-05'><strong>步骤 05：统计路线：无监督学习<\/strong><br>阅读：<a href=\"#/book/ai-models-algorithms/chapter/ch05\">第 5 章：统计机器学习——无监督学习<\/a><br>检查点：能手算 K-means 与一轮 EM<\/li><li class='path-step' id='path-06'><strong>步骤 06：统计路线：深度学习<\/strong><br>阅读：<a href=\"#/book/ai-models-algorithms/chapter/ch06\">第 6 章：深度学习<\/a><br>检查点：能算卷积输出尺寸与一次梯度更新<\/li><li class='path-step' id='path-07'><strong>步骤 07：互动路线：强化学习<\/strong><br>阅读：<a href=\"#/book/ai-models-algorithms/chapter/ch07\">第 7 章：强化学习<\/a><br>检查点：能手算一次 Q 更新<\/li><li class='path-step' id='path-08'><strong>步骤 08：互动路线：博弈<\/strong><br>阅读：<a href=\"#/book/ai-models-algorithms/chapter/ch08\">第 8 章：人工智能博弈<\/a><br>检查点：能求混合策略均衡<\/li><li class='path-step' id='path-09'><strong>步骤 09：瓶颈与趋势<\/strong><br>阅读：<a href=\"#/book/ai-models-algorithms/chapter/ch09\">第 9 章：人工智能未来发展和趋势<\/a><br>检查点：能判断一个场景该用哪条路线<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：绪论——五种计算范式<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 本书定义人工智能时强调“以机器为载体”，主要想说明什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 机器比人聪明<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 智能必须能被计算装置执行<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 只有电子计算机才算机器<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 人工智能必须模仿人脑结构<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 五种范式中，靠“环境给的奖励”改进的是____；靠“人工编写的规则”推理的是____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 丘奇-图灵论题说明的是下列哪件事？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q03' value='0'> 机器一定有意识<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='1'> 图灵机比人脑快<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='2'> 三种计算模型的计算能力等价<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='3'> 所有问题都能被算法解决<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 下列哪些任务更适合先用搜索而不是深度学习？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch01-q04' value='0'> 八数码求解<\/label><label class='quiz-opt'><input type='checkbox' name='ch01-q04' value='1'> 卫星观测任务排程<\/label><label class='quiz-opt'><input type='checkbox' name='ch01-q04' value='2'> 判断照片里是不是猫<\/label><label class='quiz-opt'><input type='checkbox' name='ch01-q04' value='3'> 迷宫最短路<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：逻辑与推理<\/h2><div class='quiz-item' data-qid='ch02-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> ∀x (Bird(x) → Fly(x)) 与哪句意思最接近？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q05' value='0'> 有些鸟会飞<\/label><label class='quiz-opt'><input type='radio' name='ch02-q05' value='1'> 所有鸟都会飞<\/label><label class='quiz-opt'><input type='radio' name='ch02-q05' value='2'> 会飞的都是鸟<\/label><label class='quiz-opt'><input type='radio' name='ch02-q05' value='3'> 存在不会飞的鸟<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q06' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 辛普森悖论的肾结石例子里，导致结论反转的混杂因子是____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q07' data-type='single'><p class='quiz-q'><b>Q3.<\/b> P→Q 在什么情况下为假？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q07' value='0'> P 真 Q 真<\/label><label class='quiz-opt'><input type='radio' name='ch02-q07' value='1'> P 真 Q 假<\/label><label class='quiz-opt'><input type='radio' name='ch02-q07' value='2'> P 假 Q 真<\/label><label class='quiz-opt'><input type='radio' -q31' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch08-q31' value='3'> 3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q32' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 关于二价拍卖，正确的有：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch08-q32' value='0'> 最高价者获胜<\/label><label class='quiz-opt'><input type='checkbox' name='ch08-q32' value='1'> 成交价是第二高价<\/label><label class='quiz-opt'><input type='checkbox' name='ch08-q32' value='2'> 如实报价是占优策略<\/label><label class='quiz-opt'><input type='checkbox' name='ch08-q32' value='3'> 报价越高获利越多<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch09__": "<h1>测验：第 9 章：人工智能未来发展和趋势<\/h1><div class='quiz-item' data-qid='ch09-q33' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 类脑计算在哪个方面最有现实优势？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q33' value='0'> 训练速度<\/label><label class='quiz-opt'><input type='radio' name='ch09-q33' value='1'> 低功耗推理<\/label><label class='quiz-opt'><input type='radio' name='ch09-q33' value='2'> 大规模语言建模<\/label><label class='quiz-opt'><input type='radio' name='ch09-q33' value='3'> 数据标注<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q34' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 把 32 位浮点权重换成 8 位整数叫____；用大模型输出训练小模型叫____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q35' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 以下哪项不是模型压缩的常见手段？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q35' value='0'> 剪枝<\/label><label class='quiz-opt'><input type='radio' name='ch09-q35' value='1'> 量化<\/label><label class='quiz-opt'><input type='radio' name='ch09-q35' value='2'> 知识蒸馏<\/label><label class='quiz-opt'><input type='radio' name='ch09-q35' value='3'> 增加网络层数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q36' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 关于可解释性，正确的有：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch09-q36' value='0'> 线性模型与决策树本身可解释<\/label><label class='quiz-opt'><input type='checkbox' name='ch09-q36' value='1'> 事后解释一定反映真实因果<\/label><label class='quiz-opt'><input type='checkbox' name='ch09-q36' value='2'> 医疗与信贷对可解释性要求高<\/label><label class='quiz-opt'><input type='checkbox' name='ch09-q36' value='3'> 可解释与高精度常常需要权衡<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='人工智能'>人工智能 — 以机器为载体展示出来的人类智能 <span class=glossary-ref>（第 1 章：绪论——五种计算范式）<\/span><\/li><li data-term='机器智能'>机器智能 — 人工智能的另一个叫法，强调载体是机器 <span class=glossary-ref>（第 1 章：绪论——五种计算范式）<\/span><\/li><li data-term='丘奇-图灵论题'>丘奇-图灵论题 — 凡能机械计算的东西，图灵机、递归函数、λ 演算都能计算 <span class=glossary-ref>（第 1 章：绪论——五种计算范式）<\/span><\/li><li data-term='领域人工智能'>领域人工智能 — 只在特定任务上达到或超过人的系统 <span class=glossary-ref>（第 1 章：绪论——五种计算范式）<\/span><\/li><li data-term='通用人工智能'>通用人工智能 — 能在多领域自主理解、迁移、设定目标的系统 <span class=glossary-ref>（第 1 章：绪论——五种计算范式）<\/span><\/li><li data-term='命题'>命题 — 能判断真假的陈述句 <span class=glossary-ref>（第 2 章：逻辑与推理）<\/span><\/li><li data-term='实质蕴含'>实质蕴含 — P→Q 只在 P 真 Q 假时为假 <span class=glossary-ref>（第 2 章：逻辑与推理）<\/span><\/li><li data-term='重言式'>重言式 — 在所有取值下都为真的逻辑式 <span class=glossary-ref>（第 2 章：逻辑与推理）<\/span><\/li><li data-term='谓词逻辑'>谓词逻辑 — 把句子拆成对象与性质、关系，并允许量词的一阶逻辑 <span class=glossary-ref>（第 2 章：逻辑与推理）<\/span><\/li><li data-term='全称量词'>全称量词 — 符号 ∀，表示对所有对象都成立，后面接蕴含 <span class=glossary-ref>（第 2 章：逻辑与推理）<\/span><\/li><li data-term='存在量词'>存在量词 — 符号 ∃，表示至少有一个对象成立，后面接合取 <span class=glossary-ref>（第 2 章：逻辑与推理）<\/span><\/li><li data-term='归结原理'>归结原理 — 把推理化为子句消去操作，配合反证法使用 <span class=glossary-ref>（第 2 章：逻辑与推理）<\/span><\/li><li data-term='知识图谱'>知识图谱 — 用（头实体, 关系, 尾实体）三元组存储事实的网络 <span class=glossary-ref>（第 2 章：逻辑与推理）<\/span><\/li><li data-term='路径排序推理'>路径排序推理 — 把关系路径作为特征，学习哪类路径更可能连到答案 <span class=glossary-ref>（第 2 章：逻辑与推理）<\/span><\/li><li data-term='混杂因子'>混杂因子 — 同时影响“选择”和“结果”的第三变量 <span class=glossary-ref>（第 2 章：逻辑与推理）<\/span><\/li><li data-term='辛普森悖论'>辛普森悖论 — 分组内都更好、合计反而更差的现象 <span class=glossary-ref>（第 2 章：逻辑与推理）<\/span><\/li><li data-term='do 算子'>do 算子 — 表示强行干预的记号，区别于被动观察 <span class=glossary-ref>（第 2 章：逻辑与推理）<\/span><\/li><li data-term='反事实'>反事实 — 对已发生事件假设另一种做法会怎样的推理 <span class=glossary-ref>（第 2 章：逻辑与推理）<\/span><\/li><li data-term='状态空间'>状态空间 — 由初始状态、动作、转移、目标、代价构成的问题表示 <span class=glossary-ref>（第 3 章：搜索求解）<\/span><\/li><li data-term='启发函数'>启发函数 — 对“从当前节点到目标还需多少代价”的估计 <span class=glossary-ref>（第 3 章：搜索求解）<\/span><\/li><li data-term='可采纳性'>可采纳性 — 启发函数从不高估真实剩余代价，保证 A* 最优 <span class=glossary-ref>（第 3 章：搜索求解）<\/span><\/li><li data-term='一致性'>一致性 — 启发函数沿边下降不超过边代价，保证每节点只扩展一次 <span class=glossary-ref>（第 3 章：搜索求解）<\/span><\/li><li data-term='minimax'>Minimax — 我方取最大、对手取最小，交替回传的对抗搜索 <span class=glossary-ref>（第 3 章：搜索求解）<\/span><\/li><li data-term='alpha-beta 剪枝'>Alpha-Beta 剪枝 — 利用上下界剪掉不影响决策的分支 <span class=glossary-ref>（第 3 章：搜索求解）<\/span><\/li><li data-term='蒙特卡洛树搜索'>蒙特卡洛树搜索 — 通过反复选择、扩展、模拟、回溯估计局面胜率 <span class=glossary-ref>（第 3 章：搜索求解）<\/span><\/li><li data-term='ucb'>UCB — 用“胜率 + 探索奖励”平衡利用与探索的选点公式 <span class=glossary-ref>（第 3 章：搜索求解）<\/span><\/li><li data-term='监督学习'>监督学习 — 用带正确答案的样本学习输入到输出的映射 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='泛化'>泛化 — 模型在没见过的数据上的表现 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='过拟合'>过拟合 — 模型记住训练集噪声，训练好测试差 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='正则化'>正则化 — 给模型加约束以抑制过拟合的手段 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='最小二乘'>最小二乘 — 使残差平方和最小的参数估计方法 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='逻辑回归'>逻辑回归 — 用 Sigmoid 把线性打分压成概率的分类模型 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='信息熵'>信息熵 — 衡量集合类别混乱程度的量，全同类时为 0 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='信息增益'>信息增益 — 分裂前后熵的下降量，决策树据此选特征 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='基尼指数'>基尼指数 — CART 用来衡量不纯度的指标 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='线性判别分析'>线性判别分析 — 让类内散度小、类间散度大的线性投影方法 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='adaboost'>AdaBoost — 按错误率给弱分类器话语权、并放大错分样本权重的集成方法 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='弱学习器'>弱学习器 — 只比随机猜测略好的分类器 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='支持向量'>支持向量 — 离分类超平面最近、决定超平面的训练点 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='间隔'>间隔 — 超平面到两类最近点距离之和，等于 2/‖w‖ <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='软间隔'>软间隔 — 允许部分点越界、用松弛变量与惩罚系数 C 控制 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='合页损失'>合页损失 — max(0, 1−y·f(x))，违反间隔才计损失 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='核函数'>核函数 — 等价于高维映射后内积的函数，避免显式升维 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='vc 维'>VC 维 — 模型族能任意打散的最大点集大小，衡量复杂度 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='生成式模型'>生成式模型 — 学习联合分布 P(x,y) 再用贝叶斯反推 P(y|x) <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='判别式模型'>判别式模型 — 直接学习 P(y|x) 的模型 <span class=glossary-ref>（第 4 章：监督学习）<\/span><\/li><li data-term='k 均值聚类'>K 均值聚类 — 交替分配样本与更新簇中心的聚类算法 <span class=glossary-ref>（第 5 章：统计机器学习——无监督学习）<\/span><\/li><li data-term='簇内平方和'>簇内平方和 — 每个点到所属中心的距离平方之和，K-means 的目标 <span class=glossary-ref>（第 5 章：统计机器学习——无监督学习）<\/span><\/li><li data-term='主成分分析'>主成分分析 — 找方差最大的正交方向做线性降维 <span class=glossary-ref>（第 5 章：统计机器学习——无监督学习）<\/span><\/li><li data-term='协方差矩阵'>协方差矩阵 — 描述各维度之间如何共同变化的矩阵 <span class=glossary-ref>（第 5 章：统计机器学习——无监督学习）<\/span><\/li><li data-term='奇异值分解'>奇异值分解 — 把矩阵分解为 UΣVᵀ 的方法，PCA 的免协方差实现 <span class=glossary-ref>（第 5 章：统计机器学习——无监督学习）<\/span><\/li><li data-term='特征人脸'>特征人脸 — SVD 得到的、看起来像模糊人脸的主方向 <span class=glossary-ref>（第 5 章：统计机器学习——无监督学习）<\/span><\/li><li data-term='潜在语义分析'>潜在语义分析 — 对词-文档矩阵做低秩近似，让同义词在低维空间靠近 <span class=glossary-ref>（第 5 章：统计机器学习——无监督学习）<\/span><\/li><li data-term='期望最大化'>期望最大化 — 交替算隐变量后验与最大化似然的参数估计方法 <span class=glossary-ref>（第 5 章：统计机器学习——无监督学习）<\/span><\/li><li data-term='隐变量'>隐变量 — 数据中存在但未被记录的量 <span class=glossary-ref>（第 5 章：统计机器学习——无监督学习）<\/span><\/li><li data-term='感知机'>感知机 — 最早的线性神经元模型，无法解决异或 <span class=glossary-ref>（第 6 章：深度学习）<\/span><\/li><li data-term='激活函数'>激活函数 — 给网络引入非线性的函数，如 Sigmoid、ReLU <span class=glossary-ref>（第 6 章：深度学习）<\/span><\/li><li data-term='反向传播'>反向传播 — 用链式法则从损失倒推各层参数梯度 <span class=glossary-ref>（第 6 章：深度学习）<\/span><\/li><li data-term='学习率'>学习率 — 梯度下降每步移动的幅度 <span class=glossary-ref>（第 6 章：深度学习）<\/span><\/li><li data-term='卷积'>卷积 — 小窗口在输入上滑动做内积的操作 <span class=glossary-ref>（第 6 章：深度学习）<\/span><\/li><li data-term='权重共享'>权重共享 — 同一组卷积核在全部位置复用，大幅减少参数 <span class=glossary-ref>（第 6 章：深度学习）<\/span><\/li><li data-term='池化'>池化 — 对邻域做最大或平均的降采样操作 <span class=glossary-ref>（第 6 章：深度学习）<\/span><\/li><li data-term='感受野'>感受野 — 输出上一个点在输入上对应的区域 <span class=glossary-ref>（第 6 章：深度学习）<\/span><\/li><li data-term='循环神经网络'>循环神经网络 — 用隐状态在时间上传递信息的序列模型 <span class=glossary-ref>（第 6 章：深度学习）<\/span><\/li><li data-term='长短期记忆网络'>长短期记忆网络 — 用遗忘门、输入门、输出门缓解梯度消失的循环网络 <span class=glossary-ref>（第 6 章：深度学习）<\/span><\/li><li data-term='生成对抗网络'>生成对抗网络 — 生成器与判别器互相对抗的生成模型 <span class=glossary-ref>（第 6 章：深度学习）<\/span><\/li><li data-term='对抗样本'>对抗样本 — 加微小扰动就能让模型判错的输入 <span class=glossary-ref>（第 6 章：深度学习）<\/span><\/li><li data-term='马尔可夫决策过程'>马尔可夫决策过程 — 由状态、动作、奖励、转移、折扣构成序贯决策框架 <span class=glossary-ref>（第 7 章：强化学习）<\/span><\/li><li data-term='折扣因子'>折扣因子 — γ，把未来奖励按指数衰减折算到当下 <span class=glossary-ref>（第 7 章：强化学习）<\/span><\/li><li data-term='策略'>策略 — 在状态到动作之间的选择规则 <span class=glossary-ref>（第 7 章：强化学习）<\/span><\/li><li data-term='价值函数'>价值函数 — 从某状态出发能拿到的折扣累计奖励期望 <span class=glossary-ref>（第 7 章：强化学习）<\/span><\/li><li data-term='贝尔曼方程'>贝尔曼方程 — 把状态价值拆成当下奖励加折扣未来价值的递推式 <span class=glossary-ref>（第 7 章：强化学习）<\/span><\/li><li data-term='q 学习'>Q 学习 — 用采样替代期望、离线策略的值函数学习方法 <span class=glossary-ref>（第 7 章：强化学习）<\/span><\/li><li data-term='时序差分误差'>时序差分误差 — 实际奖励加未来估计减去当前估计的差值 <span class=glossary-ref>（第 7 章：强化学习）<\/span><\/li><li data-term='探索与利用'>探索与利用 — 试新动作求长期收益与用当前最优求短期收益的矛盾 <span class=glossary-ref>（第 7 章：强化学习）<\/span><\/li><li data-term='ε-贪心'>ε-贪心 — 以 ε 概率随机、其余按最优选择的折中策略 <span class=glossary-ref>（第 7 章：强化学习）<\/span><\/li><li data-term='dqn'>DQN — 用深度网络近似 Q 值，配合经验回放与目标网络 <span class=glossary-ref>（第 7 章：强化学习）<\/span><\/li><li data-term='策略梯度'>策略梯度 — 直接对策略参数求梯度、提高高回报动作概率的方法 <span class=glossary-ref>（第 7 章：强化学习）<\/span><\/li><li data-term='actor-critic'>Actor-Critic — 策略网络选动作、价值网络做评价的混合架构 <span class=glossary-ref>（第 7 章：强化学习）<\/span><\/li><li data-term='零和博弈'>零和博弈 — 一方所得等于另一方所失的博弈 <span class=glossary-ref>（第 8 章：人工智能博弈）<\/span><\/li><li data-term='纳什均衡'>纳什均衡 — 任何一方单方面改策略都不会更好的策略组合 <span class=glossary-ref>（第 8 章：人工智能博弈）<\/span><\/li><li data-term='混合策略'>混合策略 — 按概率分布选择动作的策略，用于无纯策略均衡时 <span class=glossary-ref>（第 8 章：人工智能博弈）<\/span><\/li><li data-term='虚拟遗憾最小化'>虚拟遗憾最小化 — 用反事实遗憾与遗憾匹配迭代逼近期望均衡的方法 <span class=glossary-ref>（第 8 章：人工智能博弈）<\/span><\/li><li data-term='安全子博弈'>安全子博弈 — 重算子博弈策略时以原策略价值为下界，保证不更差 <span class=glossary-ref>（第 8 章：人工智能博弈）<\/span><\/li><li data-term='机制设计'>机制设计 — 通过设计规则让参与者行为自动达到目标 <span class=glossary-ref>（第 8 章：人工智能博弈）<\/span><\/li><li data-term='激励相容'>激励相容 — 如实报告自己的真实估值成为最优策略的性质 <span class=glossary-ref>（第 8 章：人工智能博弈）<\/span><\/li><li data-term='二价拍卖'>二价拍卖 — 最高报价者得、按第二高价付款的拍卖机制 <span class=glossary-ref>（第 8 章：人工智能博弈）<\/span><\/li><li data-term='稳定匹配'>稳定匹配 — 不存在双方都更想配对的匹配结果 <span class=glossary-ref>（第 8 章：人工智能博弈）<\/span><\/li><li data-term='类脑计算'>类脑计算 — 模仿神经元脉冲与突触机制的计算方式 <span class=glossary-ref>（第 9 章：人工智能未来发展和趋势）<\/span><\/li><li data-term='脉冲神经网络'>脉冲神经网络 — 以脉冲时点传递信息的神经网络 <span class=glossary-ref>（第 9 章：人工智能未来发展和趋势）<\/span><\/li><li data-term='自动化机器学习'>自动化机器学习 — 把调参与结构设计也变成搜索问题的方法 <span class=glossary-ref>（第 9 章：人工智能未来发展和趋势）<\/span><\/li><li data-term='知识蒸馏'>知识蒸馏 — 用大模型输出训练小模型的技术 <span class=glossary-ref>（第 9 章：人工智能未来发展和趋势）<\/span><\/li><li data-term='量化'>量化 — 把浮点权重换成低位整数的压缩手段 <span class=glossary-ref>（第 9 章：人工智能未来发展和趋势）<\/span><\/li><li data-term='内存墙'>内存墙 — 算力增长快于数据搬运能力造成的瓶颈 <span class=glossary-ref>（第 9 章：人工智能未来发展和趋势）<\/span><\/li><li data-term='量子机器学习'>量子机器学习 — 用量子计算加速某些机器学习子问题的方向 <span class=glossary-ref>（第 9 章：人工智能未来发展和趋势）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架一：先问信息从哪来<\/h2>\n<p>拿到一个智能任务，别先想&quot;用什么模型&quot;，先问四个问题：<\/p>\n<ol><li>\n有没有标注好的输入输出对？有 → 监督学习。\n<\/li><li>\n有没有一个可以打分的环境？有 → 强化学习。\n<\/li><li>\n规则能不能写清楚、是否需要解释？能 → 符号方法或搜索。\n<\/li><li>\n有没有另一个会改变策略的参与者？有 → 博弈。\n<\/ol>\n<p>这个顺序的价值在于：它决定了你需要多少数据、能不能解释、上线后怎么维护。<\/p>\n<h2>框架二：拟合能力与泛化的平衡表<\/h2>\n<p>任何模型选择都可以填进这张表：<\/p>\n<table><thead><tr><th>问题<\/th><th>加拟合能力的做法<\/th><th>加泛化能力的做法<\/th><\/tr><\/thead><tbody><tr><td>训练误差高<\/td><td>加层、加特征、减正则<\/td><td>—<\/td><\/tr><tr><td>训练低测试高<\/td><td>—<\/td><td>加数据、加正则、剪枝、早停<\/td><\/tr><tr><td>两者都高<\/td><td>检查标签、检查特征是否有信息<\/td><td>换模型族<\/td><\/tr><\/tbody><\/table>\n<p>先定位在哪一格，再动手。直接&quot;多训几轮&quot;通常无效。<\/p>\n<h2>框架三：从&quot;能算&quot;到&quot;算得动&quot;<\/h2>\n<p>一个方法在理论上可行，不代表工程上可用。三个常被忽略的成本：<\/p>\n<ul><li>\n<strong>时间<\/strong>：<code>O(b^d)<\/code> 的搜索在 d=20、b=3 时是 35 亿个节点。\n<\/li><li>\n<strong>内存<\/strong>：核矩阵是 <code>O(n²)<\/code>，n=10 万就是 100 亿个浮点数。\n<\/li><li>\n<strong>标注<\/strong>：监督学习的效果上限由标签质量决定，不是由模型决定。\n<\/ul>\n<p>评估一个方案时，把这三项写成具体数字，比&quot;效果应该不错&quot;可靠得多。<\/p>\n<h2>框架四：因果问题的三步检查<\/h2>\n<p>看到&quot;X 和 Y 有关系&quot;的结论，按顺序查：<\/p>\n<ol><li>\n有没有混杂因子同时影响 X 和 Y？\n<\/li><li>\n数据是观测来的还是实验/干预来的？\n<\/li><li>\n结论说的是&quot;看见&quot;还是&quot;做了会怎样&quot;？\n<\/ol>\n<p>三步都过，才谈得上因果。<\/p>\n<h2>决策规则<\/h2>\n<pre><code>if 任务需要逐步推理且要解释 → 符号/搜索优先\nelif 有大量标注且模式模糊 → 监督学习\nelif 只有评分没有标准答案 → 强化学习\nelif 对手会适应你的策略 → 博弈方法\nelif 没有标签但想分组 → 聚类\nelif 维度太高想压缩 → 降维<\/code><\/pre>\n<h2>反模式<\/h2>\n<p><strong>反模式一：拿测试集调参。<\/strong> 调完再报测试成绩，等于自己给自己泄题。必须留一份从头到尾没看过的数据。<\/p>\n<p><strong>反模式二：用准确率评价不平衡数据。<\/strong> 99% 的样本是负类时，全判负也有 99% 准确率。要看精确率、召回率、F1 或 AUC。<\/p>\n<p><strong>反模式三：把&quot;训练 loss 下降&quot;当成&quot;模型变好&quot;。<\/strong> loss 下降可能只是记住了更多噪声。<\/p>\n<p><strong>反模式四：先上最复杂的模型。<\/strong> 先跑一个线性模型或决策树做基线，复杂模型要能明确超过基线才有意义。<\/p>\n<p><strong>反模式五：忽略数据泄漏。<\/strong> 特征里包含了标签的信息（比如&quot;是否违约&quot;的后续记录），模型会表现得极好但上线即崩。<\/p>\n<p><strong>反模式六：把相关性当因果做决策。<\/strong> 详见第 2 章辛普森悖论；营销、医疗、政策场景里这个错误代价很高。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式与规则<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>一元最小二乘<\/td><td><code>w = Σ(x−x̄)(y−ȳ) / Σ(x−x̄)²<\/code>，<code>b = ȳ − w x̄<\/code><\/td><\/tr><tr><td>Sigmoid<\/td><td><code>σ(z) = 1/(1+e^(−z))<\/code><\/td><\/tr><tr><td>信息熵<\/td><td><code>H = −Σ p_k log₂ p_k<\/code><\/td><\/tr><tr><td>信息增益<\/td><td>分裂前熵 − 子集熵的加权平均<\/td><\/tr><tr><td>AdaBoost 话语权<\/td><td><code>α = 0.5 ln((1−ε)/ε)<\/code><\/td><\/tr><tr><td>AdaBoost 权重更新<\/td><td>分错乘 <code>e^α<\/code>，分对乘 <code>e^(−α)<\/code>，再归一化<\/td><\/tr><tr><td>SVM 间隔<\/td><td><code>2/‖w‖<\/code>，约束 <code>y_i(w·x_i+b) ≥ 1<\/code><\/td><\/tr><tr><td>软间隔目标<\/td><td><code>(1/2)‖w‖² + C Σ ξ_i<\/code><\/td><\/tr><tr><td>合页损失<\/td><td><code>max(0, 1 − y(w·x+b))<\/code><\/td><\/tr><tr><td>高斯核<\/td><td><code>exp(−‖x−z‖²/(2σ²))<\/code><\/td><\/tr><tr><td>卷积输出尺寸<\/td><td><code>(W − K + 2P)/S + 1<\/code><\/td><\/tr><tr><td>卷积参数量<\/td><td><code>K×K×输入通道×输出通道<\/code><\/td><\/tr><tr><td>折扣回报<\/td><td><code>1 + γ + γ² + … = 1/(1−γ)<\/code><\/td><\/tr><tr><td>贝尔曼期望方程<\/td><td>`V(s) = Σ π(a<\/td><td>s) Σ P(s&#x27;<\/td><td>s,a)[r + γV(s&#x27;)]`<\/td><\/tr><tr><td>贝尔曼最优方程<\/td><td>`V*(s) = max_a Σ P(s&#x27;<\/td><td>s,a)[r + γV*(s&#x27;)]`<\/td><\/tr><tr><td>Q 学习更新<\/td><td><code>Q ← Q + α[r + γ max Q(s&#x27;,·) − Q]<\/code><\/td><\/tr><tr><td>UCB1<\/td><td><code>胜率 + c·√(ln N_父 / N_子)<\/code><\/td><\/tr><tr><td>二价拍卖<\/td><td>最高价得，付第二高价；如实报价是占优策略<\/td><\/tr><\/tbody><\/table>\n<h2>算法步骤<\/h2>\n<p><strong>A\\<\/strong>*<\/p>\n<ol><li>\n开放表放入起点，<code>f = g + h<\/code>。\n<\/li><li>\n取 f 最小的节点，若是目标则结束。\n<\/li><li>\n扩展它的邻居，更新 g，若更优则改父节点并放回开放表。\n<\/li><li>\n重复 2—3。\n<\/ol>\n<p><strong>AdaBoost<\/strong><\/p>\n<ol><li>\n初始化样本权重 <code>1/m<\/code>。\n<\/li><li>\n训练弱分类器，算加权错误率 ε。\n<\/li><li>\n算 <code>α = 0.5ln((1−ε)/ε)<\/code>，加入集成。\n<\/li><li>\n按 <code>e^(±α)<\/code> 更新权重并归一化。\n<\/li><li>\n重复 T 轮，按 α 加权投票。\n<\/ol>\n<p><strong>K-means<\/strong><\/p>\n<ol><li>\n初始化 k 个中心。\n<\/li><li>\n每个点归最近中心。\n<\/li><li>\n每个簇重算重心。\n<\/li><li>\n中心不变则停。\n<\/ol>\n<p><strong>EM<\/strong><\/p>\n<ol><li>\nE：算隐变量后验 γ。\n<\/li><li>\nM：用 γ 加权，最大化似然，更新参数。\n<\/li><li>\n似然变化小于阈值则停。\n<\/ol>\n<p><strong>反向传播<\/strong><\/p>\n<ol><li>\n前向：逐层算 <code>z = Wx+b<\/code>、<code>a = σ(z)<\/code>，保存中间值。\n<\/li><li>\n算输出层梯度 <code>∂L/∂z<\/code>。\n<\/li><li>\n反向：<code>∂L/∂W = ∂L/∂z · xᵀ<\/code>，<code>∂L/∂x = Wᵀ · ∂L/∂z<\/code>。\n<\/li><li>\n更新 <code>W ← W − lr·∂L/∂W<\/code>。\n<\/ol>\n<h2>复杂度速记<\/h "tags": ["大模型"]}, {"id": "f05", "chapterId": "ch10", "front": "上下文学习是什么？", "back": "给几个例子就能在前向计算中临时学会任务模式，不改参数", "tags": ["大模型"]}, {"id": "f01", "chapterId": "ch11", "front": "中文屋的核心结论？", "back": "语法操作不等于语义理解；「理解」本身没有公认定义", "tags": ["哲学"]}, {"id": "f02", "chapterId": "ch11", "front": "缸中脑想说明什么？", "back": "意义与指称可能依赖与外部世界的因果联系", "tags": ["哲学"]}, {"id": "f03", "chapterId": "ch11", "front": "作者三分法？", "back": "逻辑主义（规则）、连接主义（统计）、自然主义（环境适应）", "tags": ["总论"]}, {"id": "f04", "chapterId": "ch11", "front": "计划经济与自由市场各比喻谁？", "back": "规则派自上而下写规则；统计派从数据涌现规律", "tags": ["总论"]}, {"id": "f05", "chapterId": "ch11", "front": "人脑神经元的关键数字？", "back": "总 860 亿、皮层 160 亿；能耗占身体约 25%", "tags": ["脑科学"]}], "companion": "ai-brief-history学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章：缘起——从图灵到 1956 年达特茅斯会议<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：无\n<\/li><li>\n<strong>对应原书<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 1956 年达特茅斯会议到底&quot;发明&quot;了什么，没发明什么。\n<\/li><li>\n举出会议之前已经完成的三件事，说明这门学科不是凭空开始的。\n<\/li><li>\n说出图灵 1950 年文章的贡献，以及它和 1948 年那份内部报告的区别。\n<\/li><li>\n解释&quot;符号派&quot;与&quot;神经网络派&quot;的分裂从哪一天开始。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>1956 年那场会议没有发明智能，它发明的是<strong>一个名字和一套共同体<\/strong>：把原本散在逻辑学、控制论、心理学、神经生理学里的人聚到一起，让&quot;用机器模拟智能&quot;变成一门可以申请经费、可以招学生、可以开会的学科。<\/p>\n<h2>零基础讲解<\/h2>\n<blockquote>原书开篇引了莎士比亚的一句：What is past is prologue，过去只是序幕。这句话是本章的基调——达特茅斯会议是序幕之后的第一幕，不是第一声锣。<\/blockquote>\n<h3>概念 1：前史——1955 年那场&quot;会中会&quot;（难度：基础）<\/h3>\n<p>1955 年，美国西部计算机联合大会在洛杉矶召开，会中套了一个&quot;学习机讨论会&quot;。两位关键参加者后来都去了达特茅斯：塞弗里奇（Oliver Selfridge）讲模式识别，纽厄尔（Allen Newell）讲计算机下棋。<\/p>\n<p>主持人皮茨（Walter Pitts，神经网络的奠基者之一）当场做了总结：一派人试图模拟神经系统，纽厄尔则试图模拟心智，&quot;但殊途同归&quot;。<\/p>\n<p>这句总结值钱的地方在于，它把此后几十年最主要的矛盾提前说了出来：<strong>模拟大脑的硬件结构，还是模拟思维的符号过程<\/strong>。两派都认为自己才是&quot;真正的人工智能&quot;。<\/p>\n<h3>概念 2：六个关键人物（难度：基础）<\/h3>\n<table><thead><tr><th>人物<\/th><th>当时的身份<\/th><th>后来<\/th><\/tr><\/thead><tbody><tr><td>麦卡锡（John McCarthy）<\/td><td>达特茅斯数学系助理教授，会议召集人<\/td><td>发明 LISP，提出&quot;人工智能&quot;一词<\/td><\/tr><tr><td>明斯基（Marvin Minsky）<\/td><td>普林斯顿数学博士，与麦卡锡读书时相熟<\/td><td>麻省理工人工智能实验室创始人，写《感知机》<\/td><\/tr><tr><td>香农（Claude Shannon）<\/td><td>贝尔实验室，信息论之父<\/td><td>为会议提供学术声望与经费支持<\/td><\/tr><tr><td>罗切斯特（Nathaniel Rochester）<\/td><td>IBM 第一代通用计算机 701 的主设计师<\/td><td>提供 IBM 的算力与背书<\/td><\/tr><tr><td>纽厄尔（Allen Newell）<\/td><td>兰德公司研究员<\/td><td>与西蒙合作&quot;逻辑理论家&quot;，1975 年图灵奖<\/td><\/tr><tr><td>西蒙（Herbert Simon）<\/td><td>卡内基理工学院的博导级人物<\/td><td>1975 年图灵奖、1978 年诺贝尔经济学奖<\/td><\/tr><\/tbody><\/table>\n<p>一个值得注意的细节：麦卡锡的博士导师是拓扑学家莱夫谢茨，他的博士论文不是逻辑；但他后半生都在用数理逻辑把常识形式化。明斯基的博士论文也不是逻辑，却写了一本很有影响力的计算理论教材。这两个人后来主导了符号派，但他们的学术出身并不是逻辑学。<\/p>\n<h3>概念 3：会议提案里那句关键的话（难度：基础）<\/h3>\n<p>1955 年，四位学者联名提交了《达特茅斯夏季人工智能研究项目提案》，第一次在正式文件里使用 &quot;artificial intelligence&quot; 这个词。提案的核心猜想是：<strong>学习的每一个方面，或者智能的任何其他特征，原则上都可以被精确描述，以至于可以造一台机器来模拟它<\/strong>。<\/p>\n<p>这句话是整门学科的&quot;立项理由&quot;。它包含一个很强的假设：智能可以被形式化。后面几十年的争论，本质上都是在这句话上打补丁或者拆台。<\/p>\n<h3>概念 4：图灵的两份文本（难度：进阶）<\/h3>\n<p>一般认为学科的源头是图灵 1950 年发表在《心》（Mind）杂志上的《计算机与智能》。这篇文章提出了后来被称为&quot;图灵测试&quot;的模仿游戏：如果一个人通过文字对话分不出对面是人还是机器，就可以说机器具有智能。<\/p>\n<p>但书里补了一个更早的文本：1948 年，图灵在英国国家物理实验室（NPL）写过一份内部报告《智能机器》，里面区分了&quot;肉体智能&quot;（embodied intelligence）和&quot;无肉体智能&quot;（disembodied intelligence）。机器人学家布鲁克斯认为这份报告比 1950 年那篇更重要，因为它预示了后来符号派与统计派之争——<strong>智能到底要不要有身体<\/strong>。<\/p>\n<blockquote>类比：1950 年那篇像&quot;产品说明书&quot;，告诉你什么样的机器算合格；1948 年那份像&quot;设计草图&quot;，里面有好几条互相冲突的技术路线，但还没定稿。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：图灵测试只测&quot;行为上能否骗过人&quot;，不测&quot;内部是否真的理解&quot;。这个区分后来成了塞尔&quot;中文屋&quot;论证的靶子（见第 11 章）。<\/blockquote>\n<h3>概念 5：为什么说它是&quot;学科的起点&quot;而不是&quot;概念的起点&quot;（难度：进阶）<\/h3>\n<p>书里反复强调一件事：达特茅斯会议之前，机器翻译、定理证明、下棋、模式识别都已经有人在做。1954 年乔治敦-IBM 实验已经把几十个俄文句子翻成英文（见第 7 章）；1954 年戴维斯已经写出第一个可运行的定理证明程序（见第 2 章）；1951 年斯特雷奇已经写了跳棋程序（见第 6 章）。<\/p>\n<p>所以会议真正的作用是&quot;命名 + 组织&quot;：给它一个名字，让分散的研究者意识到彼此在做同一件事，从此有了共同的语言、会议、期刊和评价标准。<\/p>\n<blockquote>原书用了一个很妙的说法：一门学科就是&quot;学科共同体共同关注的东西&quot;。这是从实用主义角度给的定义，比从内涵上下定义更管用。<\/blockquote>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[1936 图灵机] --&gt; D[1943 麦卡洛克与皮茨]\n    B[1948 NPL 智能机器报告] --&gt; E[1950 计算机与智能]\n    D --&gt; E\n    E --&gt; F[1955 学习机讨论会]\n    G[1954 定理证明程序] --&gt; F\n    H[1951 跳棋程序] --&gt; F\n    I[1954 乔治敦机器翻译] --&gt; F\n    F --&gt; J[1956 达特茅斯会议]\n    J --&gt; K[符号派 逻辑与搜索]\n    J --&gt; L[连接派 神经网络]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图要看的不是时间顺序，而是&quot;多条线汇到一个点，再分叉&quot;。汇入点之前，各路工作彼此不知道对方存在；分叉之后，两派开始争夺&quot;什么才算人工智能&quot;的定义权。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：达特茅斯会议像一次行业标准的发布会。在它之前，各家都在自己做零件，接口不一样；会议之后，大家至少同意&quot;我们做的是同一类东西&quot;，于是可以互相比较、互相批评、互相引用。<\/p>\n<p>失效边界：标准发布会能统一名字，不能统一方法。名字统一了，路线反而打得更凶——这正是后面几章的主题。<\/p>\n<p><strong>实例<\/strong>（名称的传播）：书里提到一个常被忽略的点：达特茅斯会议更多是&quot;人工智能&quot;这个词流行的源头，而不是学科的绝对起点。乔治敦-IBM 实验早于会议，就是证据之一。所以看到&quot;1956 年是人工智能元年&quot;这种说法，要理解它是&quot;命名元年&quot;，不是&quot;第一行代码之年&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 1956 年之前没人想过机器智能。<\/strong> 图灵 1936 年就在定义&quot;可计算&quot;，1943 年麦卡洛克和皮茨就画出了神经元的逻辑模型。\n<\/li><li>\n<strong>别以为达特茅斯会议提出了统一的方法论。<\/strong> 它提出的是一批松散的猜想，参会者各干各的，会后很快分成符号和连接两条路。\n<\/li><li>\n<strong>别以为图灵测试是图灵最看重的东西。<\/strong> 他在 1948 年的报告里讨论的&quot;肉体智能&quot;才是他更关心的方向，与后来机器人学、具身智能一脉相承。\n<\/li><li>\n<strong>别以为&quot;人工智能&quot;这个词是麦卡锡随手起的。<\/strong> 他刻意避开了&quot;控制论&quot;（cybernetics）这个词，因为不想让维纳的框架笼罩整个领域。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>单选<\/strong>：达特茅斯会议最准确的定位是？\n<ul>\n<li>\nA. 第一台智能机器诞生\n<\/li><li>\nB. 人工智能这个名称与学术共同体形成的标志\n<\/li><li>\nC. 神经网络被发明的年份\n<\/li><li>\nD. 图灵测试提出的年份\n<p><strong>答案<\/strong>：B。解析：会议命名并组织了领域；图灵测试是 1950 年，神经网络模型是 1943 年。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>填空<\/strong>：1955 年学习机讨论会上，主持人皮茨总结说，一派试图模拟________，另一派试图模拟________。\n<p><strong>答案<\/strong>：神经系统；心智。<\/p>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么说 1948 年图灵的 NPL 报告比 1950 年那篇文章更能预示后来的路线之争？\n<p><strong>答案<\/strong>：它区分了&quot;肉体智能&quot;与&quot;无肉体智能&quot;，即智能是否需要身体与感知。这正对应后来符号派（纯符号推理）与具身/连接派（靠感知与行动）的分歧。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：达特茅斯会议之前已经存在的工作有：\n<ul>\n<li>\nA. 可运行的定理证明程序\n<\/li><li>\nB. 跳棋程序\n<\/li><li>\nC. 乔治敦-IBM 机器翻译实验\n<\/li><li>\nD. 反向传播算法\n<p><strong>答案<\/strong>：A、B、C。解析：反向传播在 1980 年代才被系统推广。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n1956 年达特茅斯会议＝命名 + 建共同体，不是技术起点。\n<\/li><li>\n会议提案的核心假设：智能可以被精确描述并模拟。\n<\/li><li>\n图灵：1936 定义可计算，1948 分肉体/无肉体智能，1950 提模仿游戏。\n<\/li><li>\n两派分裂从 1955 年那场会中会就已经摆上台面。\n<\/ul>", "ch02": "<h1>第 2 章：自动定理证明的兴衰<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清逻辑主义、形式主义、直觉主义三派的差别，以及它们和机器证明的关系。\n<\/li><li>\n说出&quot;逻辑理论家&quot;和戴维斯程序谁先谁后，以及为什么在后世的叙述里前者更有名。\n<\/li><li>\n用一句话解释归结原理在做什么。\n<\/li><li>\n说清定理证明为什么在 1970 年代衰落，又在 2000 年代以什么形式回来。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>自动定理证明是符号派的技术地基：如果&quot;证明&quot;能被机械化，那么&quot;推理&quot;就能被机械化；它衰落不是因为逻辑错了，而是因为<strong>组合爆炸<\/strong>——逻辑上可行，算力上不可行。<\/p>\n<h2>零基础讲解<\/h2>\n<blockquote>原书这一章开篇引用约翰逊：&quot;就像机器能省体力一样，符号演算能省脑力。演算越完美，付出的脑力就越少。&quot;<\/blockquote>\n<h3>概念 1：三派数学哲学（难度：基础）<\/h3>\n<table><thead><tr><th>派别<\/th><th>代表<\/th><th>主张<\/th><th>对机器证明的意义<\/th><\/tr><\/thead><tbody><tr><td>逻辑主义<\/td><td>罗素<\/td><td>数学可以归约到逻辑<\/td><td>把数学问题变成逻辑问题，逻辑能机械算<\/td><\/tr><tr><td>形式主义<\/td><td>希尔伯特<\/td><td>数学是把一串符号变成另一串符号<\/td><td>只要设计出统一算法，所有数学问题都能解<\/td><\/tr><tr><td>直觉主义<\/td><td>布劳威尔<\/td><td>数学是心智构造，排中律不能随便用<\/td><td>拒绝&quot;非真即假&quot;的机械判定<\/td><\/tr><\/tbody><\/table>\n<p>希尔伯特那个&quot;大一统算法&quot;的梦想，被哥德尔 1931 年的不完备定理击碎：任何足够强的一致系统里，都存在既不能证明也不能证伪的命题。但机器定理证明没有因此消亡——它换了个更谦虚的目标：<strong>在能证明的问题上，把证明找出来<\/strong>。<\/p>\n<h3>概念 2：符号的来历（难度：基础）<\/h3>\n<p>日常写的 <code>∀<\/code>（对所有）和 <code>∃<\/code>（存在）不是自古就有的。书里给了一条清楚的谱系：<\/p>\n<ul><li>\n亚里士多德：三段论，最早的推理形式化。\n<\/li><li>\n弗雷格、罗素：现代逻辑的奠基，用函数表示谓词。\n<\/li><li>\n皮亚诺、约翰逊：用 <code>(x)<\/code> 表示全称，<code>∃x<\/code> 表示存在。\n<\/li><li>\n根岑（Gerhard Gentzen）1935 年：取 All 的首字母倒过来造成 <code>∀<\/code>，取 Exist 的首字母反写造成 <code>∃<\/code>。\n<\/ul>\n<p>根岑是证明论的奠基者之一，也是希尔伯特的逻辑助手。他的身世很曲折：纳粹冲锋队早期成员，战时参与 V-2 导弹研发，1945 年饿死在布拉格的战俘营。这类细节在书里很多，读的时候可以当人物志看，但技术上只需要记住：<strong>证明论给了&quot;证明&quot;一个可以操作的定义<\/strong>。<\/p>\n<h3>概念 3：谁写出了第一个程序（难度：基础）<\/h3>\n<p>这里有个常见的叙述偏差。<\/p>\n<ul><li>\n纽厄尔和西蒙的&quot;逻辑理论家&quot;（Logic Theorist）在人工智能圈子里开风气之先，它证明了《数学原理》里的若干定理。他们给罗素写信，罗素回信说：&quot;我相信演绎逻辑里的所有事，机器都能干。&quot;\n<\/li><li>\n但<strong>第一个可运行的定理证明程序<\/strong>是逻辑学家戴维斯（Martin Davis）1954 年做的，跑在普林斯顿高等研究院那台以冯诺依曼昵称命名的电子管计算机 JOHNNIAC 上。文章迟至 1957 年才发表。\n<\/ul>\n<p>为什么后人记住的是&quot;逻辑理论家&quot;？因为它被当成了&quot;机器能做人以为只有人才能做的事&quot;的标志性事件，叙事价值大于技术首创。<\/p>\n<blockquote>类比：第一个做出电灯的人不一定是最有名的那个；爱迪生赢在系统化、商业化和叙事。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：这个类比不是说&quot;逻辑理论家&quot;没技术含量，它的启发式搜索思想后来影响很大；只是提醒&quot;第一&quot;这个头衔要看定义。<\/blockquote>\n<h3>概念 4：归结原理——把证明变成机械消去（难度：进阶）<\/h3>\n<p>1965 年，鲁滨逊（John Alan Robinson）提出<strong>归结原理<\/strong>：把所有的公式化成子句形式（一堆文字的析取），然后反复做一件事——如果两个子句里有互补的文字（一个 <code>P<\/code>、一个 <code>¬P<\/code>），就把它们消掉，剩下的部分合并成新子句。推到出现空子句，就说明矛盾，反证成立。<\/p>\n<p>它的价值在于：<strong>只用一条规则<\/strong>，就能完成一阶逻辑的全部推理。这比&quot;人设计一堆推理规则&quot;优雅得多，也让程序实现变得简单——一个循环加匹配就够了。<\/p>\n<p>代价是<strong>组合爆炸<\/strong>：每一步都可能产生大量新子句，子句数量指数增长。所以后来的研究都在&quot;怎么少生成无用子句&quot;上做文章：设置文字顺序、支持集策略、单元优先等等。<\/p>\n<h3>概念 5：为什么衰落，又怎么回来（难度：进阶）<\/h3>\n<p>1970 年代之后，定理证明在人工智能里逐渐边缘化，原因有三个：<\/p>\n<ol><li>\n<strong>算力不够<\/strong>：组合爆炸让中等难度的定理都跑不动。\n<\/li><li>\n<strong>知识不够<\/strong>：很多证明需要领域知识（比如数学归纳法该用在哪一步），纯逻辑搜索找不到。\n<\/li><li>\n<strong>目标转移<\/strong>：专家系统证明了&quot;把知识直接喂给程序&quot;比&quot;让程序自己推&quot;更划算。\n<\/ol>\n<p>但它没有死，而是换了名字和场景回来了：<\/p>\n<ul><li>\n<strong>SAT/SMT 求解器<\/strong>：把问题编码成布尔可满足性或带理论的判定问题，工业界用它做芯片验证、软件漏洞检测、调度排程。今天的 SMT 求解器能处理几十万变量的工业实例。\n<\/li><li>\n<strong>交互式定理证明<\/strong>：Coq、Isabelle、Lean。人给大方向，机器检查每一步。2013 年 Gonthier 团队用 Coq 完成了四色定理的形式化验证；Lean 社区正在形式化整个数学基础。\n<\/li><li>\n<strong>数学竞赛<\/strong>：把形式化证明和搜索结合，让机器在有限时间内找证明。\n<\/ul>\n<blockquote>原书对这段历史的评价很克制：定理证明的衰落不是&quot;逻辑不行了&quot;，而是&quot;当年想要的通用推理太贵了&quot;。今天的复兴，是把目标从&quot;通用&quot;降到&quot;特定领域 + 强约束&quot;，代价小了，就能跑起来。<\/blockquote>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[数学哲学三派] --&gt; B[形式化 可机械检验]\n    B --&gt; C[1954 戴维斯 JOHNNIAC]\n    B --&gt; D[1956 逻辑理论家]\n    C --&gt; E[1965 归结原理]\n    D --&gt; E\n    E --&gt; F[组合爆炸 子句数量指数增长]\n    F --&gt; G[1970s 边缘化]\n    G --&gt; H[SAT SMT 工业求解]\n    G --&gt; I[Coq Lean 交互式证明]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从&quot;哲学上的形式化&quot;到&quot;程序上的消去规则&quot;，中间只隔了一步；但从&quot;规则&quot;到&quot;能跑&quot;隔了一座算力的山。看这张图要抓住中间那个瓶颈节点——它解释了一切兴衰。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：归结原理像一台只会做减法的机器。你给它两个式子，它把能抵消的部分抵消掉，剩下的吐出来；一直减到空，就证明完了。它不需要会加法、乘法、除法——只要这一种操作，就够表达所有推理。<\/p>\n<p>失效边界：只会一种操作意味着&quot;路径很长&quot;。人做证明会跳步、会用直觉、会类比，机器只能一步一步消，所以步数爆炸。<\/p>\n<p><strong>实例<\/strong>（子句消去）：前提是 <code>P ∨ Q<\/code> 和 <code>¬P ∨ R<\/code>。<\/p>\n<ul><li>\n两个子句里有互补的 <code>P<\/code> 和 <code>¬P<\/code>\n<\/li><li>\n归结得到 <code>Q ∨ R<\/code>\n<\/ul>\n<p>这就是一步。如果还能和 <code>¬Q<\/code> 归结，得到 <code>R<\/code>；再和 <code>¬R<\/code> 归结，得到空子句，矛盾成立，原命题得证。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为哥德尔定理&quot;杀死了&quot;机器证明。<\/strong> 不完备性说明有些命题证不出来，但没说&quot;能证的证不出来&quot;。机器证明的目标本来就限定在可证的部分。\n<\/li><li>\n<strong>别以为&quot;逻辑理论家&quot;是第一个程序。<\/strong> 第一个可运行的是戴维斯的程序，早两年。\n<\/li><li>\n<strong>别以为定理证明已经死了。<\/strong> 它变成了 SMT 求解器和形式化验证，藏在芯片设计、编译器验证、操作系统内核验证的背后。\n<\/li><li>\n<strong>别以为归结原理只对数学有用。<\/strong> 任何能写成&quot;前提-结论&quot;的问题都能编码，包括法律条款推理、电路等价性检查。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：希尔伯特的形式主义想把数学变成&quot;把一串________变成另一串________&quot;。\n<p><strong>答案<\/strong>：符号；符号。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：第一个可运行的定理证明程序是谁做的？\n<ul>\n<li>\nA. 纽厄尔和西蒙\n<\/li><li>\nB. 戴维斯\n<\/li><li>\nC. 鲁滨逊\n<\/li><li>\nD. 王浩\n<p><strong>答案<\/strong>：B。解析：1954 年在 JOHNNIAC 上运行；&quot;逻辑理论家&quot;名气更大但不是第一。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：归结原理为什么&quot;优雅但低效&quot;？\n<p><strong>答案<\/strong>：优雅在于只用一条消去规则就能完成一阶逻辑推理，实现简单；低效在于每步会产生大量新子句，搜索空间指数增长。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：定理证明在当代以哪些形式存在？\n<ul>\n<li>\nA. SAT/SMT 求解器\n<\/li><li>\nB. Coq、Lean 等交互式证明器\n<\/li><li>\nC. 芯片与软件形式化验证\n<\/li><li>\nD. 图像分类\n<p><strong>答案<\/strong>：A、B、C。解析：图像分类属于统计学习，与定理证明无直接关系。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三派哲学：逻辑主义归约、形式主义符号操作、直觉主义拒排中律。\n<\/li><li>\n第一个程序是戴维斯的，名气和首创不是一回事。\n<\/li><li>\n归结原理：一条规则完成全部推理，代价是组合爆炸。\n<\/li><li>\n衰落因算力与知识，复兴靠 SAT/SMT 与形式化验证。\n<\/ul>", "ch03": "<h1>第 3 章：专家系统、知识图谱与第五代计算机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 2 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 3、4 章合并\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清专家系统的基本结构，以及它为什么在 1980 年代能卖钱。\n<\/li><li>\n说出&quot;知识获取瓶颈&quot;是什么，并解释它为什么难以绕过。\n<\/li><li>\n解释第五代计算机计划的赌注押在哪，为什么输了。\n<\/li><li>\n说清知识图谱与专家系统的承继关系：换了存储形式，没换问题本质。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这三件事是同一条思路的三个阶段：把专家的知识抽出来写成显式规则，让机器照着推。专家系统是它的小型化，第五代计算机是想把它塞进硬件，知识图谱是把它改成网络并放大到全网规模。<\/p>\n<h2>零基础讲解<\/h2>\n<blockquote>原书这一章讲费根鲍姆时用了一个词：&quot;知识就是力量&quot;。他的主张是：通用推理机没有用，真正的智能来自领域知识。<\/blockquote>\n<h3>概念 1：专家系统是怎么搭起来的（难度：基础）<\/h3>\n<p>一个典型专家系统有三个部件：<\/p>\n<table><thead><tr><th>部件<\/th><th>作用<\/th><th>类比<\/th><\/tr><\/thead><tbody><tr><td>知识库<\/td><td>一堆&quot;如果…那么…&quot;的规则<\/td><td>老医生的经验笔记<\/td><\/tr><tr><td>推理机<\/td><td>拿事实去匹配规则，推出新结论<\/td><td>一个只会照笔记查的实习生<\/td><\/tr><tr><td>解释器<\/td><td>说明&quot;为什么得出这个结论&quot;<\/td><td>实习生把引用过的笔记页码报给你<\/td><\/tr><\/tbody><\/table>\n<p>关键差别在这里：<strong>通用问题求解程序什么都不懂，专家系统什么都懂一点但只懂一个领域<\/strong>。<\/p>\n<p>书里讲的第一个成功例子是斯坦福的 DENDRAL。它是费根鲍姆、遗传学家莱德伯格（Joshua Lederberg，1958 年诺贝尔生理学或医学奖）、化学家翟若适（Carl Djerassi，口服避孕药的主要发明者）合作做出来的，任务是根据质谱数据推断有机分子的结构。这个任务有明确的判定标准——分子结构可以被实验验证，错了立刻知道。<\/p>\n<h3>概念 2：MYCIN 与&quot;专家级表现&quot;（难度：基础）<\/h3>\n<p>1970 年代斯坦福做的 MYCIN 是更著名的一个：诊断血液感染并推荐抗生素。它大约有 450 条规则，在测试中的表现被认为达到了专家水平。<\/p>\n<p>但它从没在临床上真正用起来。原因不是准确率，而是：<\/p>\n<ul><li>\n当时的机器太贵，医院没有终端；\n<\/li><li>\n医生不信任一个不能解释清楚的黑箱（MYCIN 的解释器能说明规则链，但链条太长时人看不懂）；\n<\/li><li>\n责任归属不清——机器开错药谁负责。\n<\/ul>\n<p>这三点今天依然成立。<strong>这是本章最有现实价值的一段<\/strong>：技术指标过关不等于产品能用。<\/p>\n<h3>概念 3：知识获取瓶颈（难度：进阶）<\/h3>\n<p>专家系统最贵的一步不是写代码，是&quot;把专家的知识问出来&quot;。书里把这个障碍叫<strong>知识获取瓶颈<\/strong>，它有三个层次：<\/p>\n<ol><li>\n<strong>专家说不出<\/strong>：很多判断是模式识别式的直觉，他自己也讲不清依据。\n<\/li><li>\n<strong>专家说的不准<\/strong>：人对自己决策的解释常常是事后编的，与真实依据不一致。\n<\/li><li>\n<strong>规则会冲突<\/strong>：不同专家给的规则互相矛盾，需要仲裁机制。\n<\/ol>\n<p>于是出现了一个行业：知识工程师。他们的工作是坐在专家旁边，一遍遍问&quot;这种情况你会怎么处理&quot;&quot;为什么&quot;，然后把回答翻译成规则。这个过程慢、贵、不可复用。<\/p>\n<blockquote>类比：知识获取像给一位老师傅录口述史。他干了一辈子，但你问&quot;你怎么知道这个零件该换了&quot;，他只能说&quot;听声音不对&quot;。你得自己把&quot;声音不对&quot;拆成频率、振幅、时长。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：有些领域的知识确实是可形式化的（配置、诊断、税务），有些不是（写作、谈判、诊断罕见病）。瓶颈的严重程度取决于领域。<\/blockquote>\n<h3>概念 4：第五代计算机——一次押错方向的豪赌（难度：进阶）<\/h3>\n<p>1981 年，日本通产省启动&quot;第五代计算机&quot;计划。背景是 1978 年委托元冈达做的调研，1981 年发布了一份 89 页的报告，提出 6 种并行体系结构方案。主导者是渕一博，执行机构是 ICOT。<\/p>\n<p>赌注的核心有两个：<strong>并行逻辑推理硬件 + Prolog 作为核心语言<\/strong>。逻辑是：如果智能等于推理，那么把推理做得又快又便宜，智能就自然来了。整个计划投入约 4.5 亿美元，1992 年结束，没有产出可商用的成果。<\/p>\n<p>失败的原因可以拆成三层：<\/p>\n<ul><li>\n<strong>技术层<\/strong>：专用逻辑推理机打不过通用微处理器。摩尔定律让&quot;专门为推理造的芯片&quot;在几年内就落后于便宜得多的通用 CPU。\n<\/li><li>\n<strong>方法论层<\/strong>：把智能等同于逻辑推理，忽略了感知、学习、不确定性。\n<\/li><li>\n<strong>组织层<\/strong>：全国一盘棋的集中研发，缺乏市场竞争的反馈回路。\n<\/ul>\n<p>同一时期，美国走了另一条路：不造专用硬件，让 AI 跑在通用工作站上（Symbolics、LMI 这些 Lisp 机后来也死于此）。教训是一样的：<strong>不要在通用算力快速进步的年代押注专用架构<\/strong>。<\/p>\n<h3>概念 5：知识图谱——把规则换成三元组（难度：进阶）<\/h3>\n<p>专家系统的规则库有个致命缺陷：只能处理预先想到的情况，加一条新知识可能和旧规则冲突，规模一大就维护不动。<\/p>\n<p>知识图谱换了表示方式：用（头实体，关系，尾实体）这样的<strong>三元组<\/strong>存事实，比如（吴飞，任职于，浙江大学）。一堆三元组连起来就是一张网。查询变成&quot;沿边找路径&quot;，扩展变成&quot;加新的三元组&quot;，不冲突。<\/p>\n<p>这条线索的谱系是：<\/p>\n<ul><li>\n语义网（Tim Berners-Lee 2001 年提出）：给网页加机器可读的语义标注。\n<\/li><li>\n谷歌 2012 年提出 Knowledge Graph，把搜索结果从&quot;字符串匹配&quot;变成&quot;实体理解&quot;。\n<\/li><li>\n学术界：Freebase、DBpedia、Wikidata、YAGO；中文有 CN-DBpedia、OwnThink。\n<\/li><li>\n推理方法：路径排序（把关系路径当特征，学习哪条路径更可信）、FOIL（归纳规则）、以及后来的表示学习（TransE 把实体和关系嵌入向量空间，让&quot;头 + 关系 ≈ 尾&quot;）。\n<\/ul>\n<blockquote>注意一个容易误解的点：知识图谱没有解决知识获取瓶颈，它只是把成本从&quot;写规则&quot;转成&quot;抽三元组 + 对齐实体&quot;。信息抽取的准确率、实体消歧、schema 设计，仍然是硬骨头。<\/blockquote>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[专家经验] --&gt; B[知识工程师访谈]\n    B --&gt; C[规则库 if then]\n    C --&gt; D[推理机 前向 后向链]\n    D --&gt; E[专家系统 MYCIN XCON]\n    E --&gt; F[知识获取瓶颈 维护困难]\n    F --&gt; G[换表示 三元组]\n    G --&gt; H[知识图谱 语义网]\n    H --&gt; I[表示学习 TransE]\n    J[第五代机 逻辑推理硬件] -.押错方向.-&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是&quot;人把知识搬进机器&quot;，右边是&quot;机器把知识连成网&quot;。中间的断点标注了两个失败点：知识获取太贵、专用硬件打不过通用芯片。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：专家系统像一本装订好的操作手册 + 一个严格照手册执行的实习生；知识图谱像维基百科的链接网络 + 一个会顺着链接找答案的搜索者。前者精确但僵，后者灵活但可能不准。<\/p>\n<p>失效边界：手册能覆盖的场景有限，一旦遇到手册没写的情况就卡住；网络能覆盖的场景多，但&quot;顺着链接找到的答案&quot;未必有推理保证。<\/p>\n<p><strong>实例<\/strong>（规则链）：一条简化版的感染诊断规则链：<\/p>\n<pre><code>R1: IF 病人有发热 AND 白细胞升高 THEN 可能存在细菌感染\nR2: IF 可能存在细菌感染 AND 培养结果为革兰氏阳性 THEN 考虑链球菌\nR3: IF 考虑链球菌 AND 病人对青霉素不过敏 THEN 推荐青霉素<\/code><\/pre>\n<p>前向链：从已知事实出发，反复匹配规则，推出结论（数据驱动）。后向链：从目标&quot;推荐什么药&quot;出发，倒推需要哪些条件（目标驱动）。前者适合监控告警，后者适合诊断问答。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为专家系统失败是因为算力不够。<\/strong> MYCIN 在 1970 年代的机器上就能跑，问题是责任、信任、部署成本。\n<\/li><li>\n<strong>别以为规则越多越聪明。<\/strong> 规则之间会冲突，规模上千条后维护成本爆炸，这是&quot;知识获取瓶颈&quot;的另一面。\n<\/li><li>\n<strong>别以为知识图谱是新技术。<\/strong> 它继承了语义网和描述逻辑，形式化基础在 1990 年代就成熟了。\n<\/li><li>\n<strong>别以为第五代计算机是纯失败。<\/strong> 它在并行推理、约束逻辑编程上留下了技术遗产，只是没有形成产业。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：专家系统最贵的环节不是编程，而是________，它指的是把专家知识问出来并形式化的困难。\n<p><strong>答案<\/strong>：知识获取。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：第五代计算机计划的核心赌注是？\n<ul>\n<li>\nA. 通用 CPU 加统计学习\n<\/li><li>\nB. 并行逻辑推理硬件加 Prolog\n<\/li><li>\nC. 神经网络加 GPU\n<\/li><li>\nD. 大规模分布式存储\n<p><strong>答案<\/strong>：B。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么第五代计算机在技术上输给了通用微处理器？\n<p><strong>答案<\/strong>：摩尔定律让通用 CPU 性价比快速提升，专用逻辑推理机几年内就落后；同时把智能等同于逻辑推理的方法论假设本身站不住。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：知识图谱相对规则库的优势包括：\n<ul>\n<li>\nA. 加新知识不必担心规则冲突\n<\/li><li>\nB. 天然支持多跳查询\n<\/li><li>\nC. 完全解决了知识获取成本\n<\/li><li>\nD. 便于与实体对齐、跨源融合\n<p><strong>答案<\/strong>：A、B、D。解析：知识获取从&quot;写规则&quot;变成&quot;抽三元组&quot;，成本转移而非消失。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n专家系统三件套：知识库、推理机、解释器。\n<\/li><li>\nMYCIN 准确率够但没落地，卡在信任与责任。\n<\/li><li>\n知识获取瓶颈三层：说不出、说不准、规则冲突。\n<\/li><li>\n第五代机输在&quot;专用硬件 vs 摩尔定律&quot;。\n<\/li><li>\n知识图谱＝三元组网络，换了表示，没换成本问题。\n<\/ul>", "ch04": "<h1>第 4 章：神经网络的三起三落<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 1943 年麦卡洛克-皮茨模型在数学上做了什么，为什么它重要。\n<\/li><li>\n解释 1969 年《感知机》一书的批评到底说了什么，以及它被误读成了什么。\n<\/li><li>\n说出反向传播解决的是什么问题，为什么它没能立刻赢得认可。\n<\/li><li>\n列出三次&quot;寒冬&quot;与三次&quot;复兴&quot;各自的触发条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>神经网络的历史不是&quot;技术逐渐变好&quot;，而是&quot;<strong>每一次复兴都靠一次外部条件变化<\/strong>&quot;：算力、数据、或者一个能解释旧失败的新工具。模型本身的想法，1943 年就基本齐了。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：1943 年的那篇论文做了什么（难度：基础）<\/h3>\n<p>麦卡洛克（Warren McCulloch）和皮茨（Walter Pitts）1943 年发表《神经活动中内在思想的逻辑演算》。他们做的事可以概括成一句：<strong>把一个神经元抽象成一个带阈值的逻辑门<\/strong>。<\/p>\n<p>具体地：一个神经元接收若干输入，每个输入有权重；把所有输入加权求和，超过阈值就输出 1，否则输出 0。这在数学上就是 <code>y = 1[Σ w_i x_i ≥ θ]<\/code>。<\/p>\n<p>这一步的意义不在于&quot;模拟了大脑&quot;，而在于它证明了一件事：<strong>神经活动可以被写成命题逻辑<\/strong>。既然是逻辑，就能用逻辑的方法分析它的能力边界。这才是它进入人工智能史的原因。<\/p>\n<p>书里还记了皮茨的悲剧：他是个天才，十几岁就与罗素通信，后来在麻省理工与维纳合作，晚年酗酒、1956 年后逐渐离开学术界，1969 年去世，年仅 46 岁。<\/p>\n<h3>概念 2：维纳与控制论（难度：基础）<\/h3>\n<p>1948 年维纳（Norbert Wiener）出版《控制论》，把&quot;动物与机器中的通信与控制&quot;统一起来研究。这本书影响极大，以至于 1950 年代很多研究者自称在做&quot;控制论&quot;而不是&quot;人工智能&quot;。<\/p>\n<p>麦卡锡刻意选择了&quot;人工智能&quot;这个词，一部分原因就是要与维纳的框架划清界限。这是学科政治，但它造成了长期后果：<strong>人工智能与认知科学、神经生理学在体制上分家了<\/strong>，两边的评价标准不同，互相看不上。<\/p>\n<h3>概念 3：感知机与它的承诺（难度：基础）<\/h3>\n<p>1958 年，罗森布拉特（Frank Rosenblatt）做出感知机（Perceptron），并造了硬件 Mark I。它的学习规则简单到可以一句话说完：<\/p>\n<blockquote>如果分类正确，不动；如果错了，把权重往正确方向挪一点。<\/blockquote>\n<p>这就是后来所有梯度方法的雏形。当时媒体把它吹成&quot;能走路、说话、看见东西的计算机胚胎&quot;，《纽约时报》1958 年的报道说它将来能&quot;认人、叫出名字&quot;。<\/p>\n<p>罗森布拉特与明斯基当时都在麻省理工附近，两人的关系紧张。这段个人恩怨在后来的历史叙述里被放大，成了&quot;明斯基打压连接主义&quot;的故事。<\/p>\n<h3>概念 4：1969 年那本书到底说了什么（难度：进阶）<\/h3>\n<p>明斯基与西摩·帕波特（Seymour Papert）1969 年出版《感知机》（Perceptrons）。书里有两个结论：<\/p>\n<ol><li>\n<strong>单层感知机只能解决线性可分的问题<\/strong>，连异或（XOR）都做不了。\n<\/li><li>\n<strong>多层感知机的表达能力虽然更强，但他们证明不出它需要多少层、也证明不出它能学到什么<\/strong>——这是一个开放问题，不是否定。\n<\/ol>\n<p>第二条是关键，也是最常被误读的地方。书的原意是&quot;我们证明不了多层网络的能力&quot;，而流传的版本变成了&quot;多层网络没用、这条路死了&quot;。这个误读让神经网络研究在 1970 年代失去了大部分经费。<\/p>\n<p>历史上更准确的描述是：<strong>经费的消失是多重因素<\/strong>——英国方面有James Lighthill 1973 年的报告质疑 AI 的整体进展，美国 DARPA 削减无明确军事目标的基础研究，加上《感知机》给出的理论悲观结论，三件事叠加。<\/p>\n<h3>概念 5：异或为什么做不了（难度：进阶）<\/h3>\n<p>异或的真值表：<\/p>\n<table><thead><tr><th>x1<\/th><th>x2<\/th><th>XOR<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><\/tbody><\/table>\n<p>单层感知机的判定是&quot;加权和过阈值&quot;，几何上是一条直线把平面分成两半。而 XOR 的两个 1 在对角，两个 0 在另一条对角——<strong>没有任何一条直线能把它们分开<\/strong>。这就是&quot;线性不可分&quot;。<\/p>\n<p>解决方式：加一层。两层网络可以先画两条线把平面切成三块，再在第三层组合。这是几何直觉，也是后来的&quot;深度&quot;概念的最早动机。<\/p>\n<blockquote>类比：一层网络像只用一把直尺在纸上划线；两层网络可以先划两刀切出小块，再对小块贴标签。刀越多，能切出的形状越复杂。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：层数多了会带来&quot;梯度消失&quot;和&quot;训练不动&quot;的问题，这就是 1980 年代要解决的下一关。<\/blockquote>\n<h3>概念 6：1986 年反向传播与它的迟到（难度：进阶）<\/h3>\n<p>反向传播不是 1986 年才发明的。它的数学基础是微积分里的链式法则，1970 年代就有人在控制论、自动微分领域用过。1986 年让·鲁梅哈特（David Rumelhart）、杰弗里·辛顿（Geoffrey Hinton）、罗纳德·威廉姆斯（Ronald Williams）在《自然》上发表的文章，价值在于：<strong>给出了一个完整、可复现、在多任务上都有效的训练流程<\/strong>，并把它和&quot;内部表示&quot;这个概念绑在一起。<\/p>\n<p>但它仍然没有立刻赢。原因很实际：<\/p>\n<ul><li>\n数据太少：MNIST 是 1990 年代才有的，ImageNet 是 2009 年。\n<\/li><li>\n算力太弱：1990 年代的 CPU 跑一个小网络要几小时。\n<\/li><li>\n对手太强：1990 年代 SVM 有漂亮的统计学习理论（VC 维、结构风险最小化），在基准上稳定胜出，而且有理论保证。\n<\/ul>\n<h3>概念 7：三次复兴分别靠什么（难度：高阶）<\/h3>\n<table><thead><tr><th>复兴<\/th><th>年份<\/th><th>外部条件<\/th><th>标志事件<\/th><\/tr><\/thead><tbody><tr><td>第一次<\/td><td>1980s<\/td><td>反向传播 + 专家系统的失败让人重新看学习<\/td><td>Hopfield 网络（1982）、联结主义复兴<\/td><\/tr><tr><td>第二次<\/td><td>2006<\/td><td>逐层预训练让深层网络能训得动<\/td><td>深度信念网络<\/td><\/tr><tr><td>第三次<\/td><td>2012<\/td><td>GPU + ImageNet 数据<\/td><td>AlexNet 在 ImageNet 上大幅领先<\/td><\/tr><\/tbody><\/table>\n<p>看清楚这条线：<strong>每一次复兴都不是&quot;模型变强了&quot;，而是&quot;训练条件变好了&quot;<\/strong>。这也是为什么 2020 年代的大模型爆发，直接原因是 Transformer + 海量数据 + 集群算力，而不是某个新的神经元模型。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[1943 麦卡洛克与皮茨 阈值逻辑门] --&gt; B[1949 赫布学习规则]\n    B --&gt; C[1958 感知机 罗森布拉特]\n    C --&gt; D[1969 感知机一书 线性不可分]\n    D --&gt; E[1970s 第一次寒冬 经费削减]\n    E --&gt; F[1982 Hopfield 网络]\n    F --&gt; G[1986 反向传播 自然杂志]\n    G --&gt; H[1990s SVM 理论与基准胜出]\n    H --&gt; I[第二次寒冬]\n    I --&gt; J[2006 逐层预训练]\n    J --&gt; K[2012 AlexNet GPU 与 ImageNet]\n    K --&gt; L[深度学习成为主流]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：看两件事——每段上升之前都有一个&quot;条件变化&quot;的箭头（不是模型变好）；每段下降都伴随&quot;理论与基准的竞争&quot;。这是理解整段历史的关键结构。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：神经网络的历史像一种被反复放弃又反复捡起的工艺。每次放弃都是因为&quot;当时做不出来&quot;（算力、数据、训练方法），每次捡起都是因为&quot;当初卡住的那个条件变了&quot;。<\/p>\n<p>失效边界：这个类比会让人误以为&quot;只要等条件，想法总会赢&quot;。实际上有些方向是真的错了（比如把智能等同于逻辑推理的第五代机），不是等来的。<\/p>\n<p><strong>实例<\/strong>（一次权重更新，手算）：单层感知机，输入 x=1，权重 w=2，目标 y=3，学习率 0.1，损失取平方差的一半：<\/p>\n<ul><li>\n预测：2×1 = 2\n<\/li><li>\n误差：2 − 3 = −1\n<\/li><li>\n梯度：误差 × 输入 = −1\n<\/li><li>\n更新：w = 2 − 0.1 × (−1) = 2.1\n<\/ul>\n<p>再算一次：预测 2.1，误差 −0.9，w 变成 2.19。可以看到它朝 3 靠近。感知机学习规则和梯度下降在这里是同一件事。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为《感知机》一书&quot;宣判了神经网络死刑&quot;。<\/strong> 它证明的是单层网络的局限，对多层网络说的是&quot;我们证不出来&quot;。\n<\/li><li>\n<strong>别以为反向传播是 1986 年发明的。<\/strong> 数学上是链式法则，工程上是自动微分，1986 年的贡献是可复现的训练流程与&quot;内部表示&quot;的实证。\n<\/li><li>\n<strong>别以为寒冬只发生了一次。<\/strong> 1970 年代和 1990 年代各一次，诱因不同：前者是理论悲观 + 经费削减，后者是 SVM 在基准和理论上双重压制。\n<\/li><li>\n<strong>别以为深度学习是&quot;新东西&quot;。<\/strong> 它的核心构件（阈值神经元、反向传播、卷积）分别在 1943、1986、1989 年就有了。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>填空<\/strong>：单层感知机无法解决________问题，因为它在几何上只能画一条________。\n<p><strong>答案<\/strong>：异或（XOR）；直线。<\/p>\n<\/ol>\n<ol><li>\n<strong>单选<\/strong>：1986 年反向传播论文的主要贡献是？\n<ul>\n<li>\nA. 发明了链式法则\n<\/li><li>\nB. 给出了可复现的多层网络训练流程并验证了内部表示\n<\/li><li>\nC. 证明了神经网络一定收敛\n<\/li><li>\nD. 提出了卷积结构\n<p><strong>答案<\/strong>：B。<\/p>\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>简答<\/strong>：为什么 1990 年代 SVM 能压过神经网络？\n<p><strong>答案<\/strong>：SVM 有完整的统计学习理论（VC 维、结构风险最小化）提供泛化保证，且在当时的基准上稳定胜出；神经网络缺理论支撑、训练不稳定、算力与数据都不足。<\/p>\n<\/ol>\n<ol><li>\n<strong>多选<\/strong>：深度学习 2012 年爆发的直接条件包括：\n<ul>\n<li>\nA. GPU 算力\n<\/li><li>\nB. ImageNet 级别的大规模标注数据\n<\/li><li>\nC. 一个新的神经元模型\n<\/li><li>\nD. 能训得动深层网络的工程技巧（ReLU、Dropout 等）\n<p><strong>答案<\/strong>：A、B、D。解析：神经元模型没有本质变化，变的是训练条件。<\/p>\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n1943：神经元＝阈值逻辑门，智能可写成逻辑。\n<\/li><li>\n1969：《感知机》证单层局限，被误读成整条路死了。\n<\/li><li>\n1986：反向传播给出可复现训练流程，但缺数据与算力。\n<\/li><li>\n三次复兴都靠外部条件变化，不靠模型创新。\n<\/ul>", "ch05": "<h1>第 5 章：向自然学习——遗传算法与强化学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清遗传算法的四个基本操作，并解释它为什么不需要求导。\n<\/li><li>\n说出&quot;没有免费午餐定理&quot;对进化算法的限制。\n<\/li><li>\n解释强化学习和监督学习的本质差别：反馈是&quot;评价&quot;而不是&quot;答案&quot;。\n<\/li><li>\n说出 Q 学习和时序差分在做什么，为什么它能在不知道环境模型的情况下学。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这两条路都不从&quot;人怎么想&quot;出发，而从&quot;自然怎么筛&quot;出发：遗传算法靠<strong>变异加选择<\/strong>，强化学习靠<strong>试错加回报<\/strong>。共同点是不需要正确答案，只需要一个能打分的机制。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：遗传算法的四个操作（难度：基础）<\/h3>\n<p>霍兰德（John Holland）1975 年出版《自然系统与人工系统中的适应》，把进化论写成算法。四个操作：<\/p>\n<table><thead><tr><th>操作<\/th><th>做什么<\/th><th>类比<\/th><\/tr><\/thead><tbody><tr><td>编码<\/td><td>把解写成一串（0/1 串、实数串、树结构）<\/td><td>把设计方案写成基因<\/td><\/tr><tr><td>选择<\/td><td>按适应度高的优先留下<\/td><td>环境淘汰<\/td><\/tr><tr><td>交叉<\/td><td>两个父代各取一段拼成子代<\/td><td>有性繁殖<\/td><\/tr><tr><td>变异<\/td><td>随机改一位<\/td><td>基因突变<\/td><\/tr><\/tbody><\/table>\n<p>为什么它能用？因为它<strong>不需要梯度<\/strong>。只要你能给一个解打分，它就能搜。这对那些&quot;可评价但不可求导&quot;的问题特别有用：排班、布线、参数调优、神经网络结构搜索。<\/p>\n<p>书里提到的扩展是遗传编程（Genetic Programming）：把&quot;树&quot;当基因，交叉就是交换子树，于是能自动生成程序表达式。Koza 在 1990 年代把它推成一套完整方法。<\/p>\n<h3>概念 2：没有免费午餐（难度：进阶）<\/h3>\n<p>&quot;没有免费午餐定理&quot;（No Free Lunch）说的是一件很扫兴的事：<strong>如果把所有可能的问题一视同仁地平均，任何优化算法的平均表现都一样<\/strong>。<\/p>\n<p>推论：遗传算法不比随机搜索更好的前提，是你对它要解的那类问题有先验知识（比如&quot;好解在空间里是成簇的&quot;）。如果你的问题没有结构，任何算法都退化成随机。<\/p>\n<blockquote>这一段是本章的&quot;防忽悠&quot;部分。很多教程会说&quot;遗传算法能解一切优化问题&quot;，正确的说法是&quot;遗传算法在你对它做了编码设计的前提下能解&quot;。<\/blockquote>\n<h3>概念 3：强化学习的问题设定（难度：进阶）<\/h3>\n<p>强化学习把学习写成一个五元组：<\/p>\n<ul><li>\n<strong>状态<\/strong> S：现在处在什么情况\n<\/li><li>\n<strong>动作<\/strong> A：能做什么\n<\/li><li>\n<strong>奖励<\/strong> R：做了之后拿到什么分数\n<\/li><li>\n<strong>转移<\/strong> P：做了之后会到哪\n<\/li><li>\n<strong>折扣<\/strong> γ：未来分数折算到今天的比率\n<\/ul>\n<p>和监督学习的关键差别：监督学习每个样本都有正确答案，告诉你&quot;该做什么&quot;；强化学习只有一个分数，告诉你&quot;做得好不好&quot;，而且这个分数可能延迟很久才来。<\/p>\n<p>这就是&quot;信用分配问题&quot;：赢了棋，是哪一步下得好？没人告诉你。<\/p>\n<h3>概念 4：贝尔曼方程与 Q 学习（难度：高阶）<\/h3>\n<p>价值函数的定义是&quot;从某个状态出发，未来能拿到的折扣累计奖励的期望&quot;。贝尔曼把它写成递推：<\/p>\n<p><code>V(s) = 当下奖励 + γ × 下一状态的价值<\/code><\/p>\n<p>这一步把&quot;无限长的未来&quot;压成了&quot;一步 + 一个数&quot;。有了它，价值可以用迭代算。<\/p>\n<p>Q 学习把它变成可执行的更新规则：<\/p>\n<p><code>Q(s,a) ← Q(s,a) + α[ r + γ max Q(s&#x27;,·) − Q(s,a) ]<\/code><\/p>\n<p>方括号里那项叫<strong>时序差分误差<\/strong>（TD 误差）：&quot;实际拿到的 + 对未来的新估计&quot;减去&quot;原来的估计&quot;。α 是学习率。<\/p>\n<p>为什么它重要？因为它用<strong>采样<\/strong>代替了对环境的完整知识：你不需要知道转移概率 P，只要真的走一步、看到 r 和 s&#x27; 就行。<\/p>\n<blockquote>类比：Q 学习像在没有地图的城市里认路。你不知道每条路通向哪，但你走一次就能更新一次&quot;这条路大概值多少&quot;。走得多了，估值就收敛。<\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>失效边界：如果状态太多（比如围棋），表格存不下，就要用函数近似（DQN），而函数近似会带来不稳定性——这是 2015 年 DQN 要用经验回放和目标网络的原因。<\/blockquote>\n<h3>概念 5：从 TD 到 DQN 到策略梯度（难度：高阶）<\/h3>\n<ul><li>\n<strong>TD 学习<\/strong>（Sutton 1988）：用下一步的估计更新当前估计，是 Q 学习的前身。\n<\/li><li>\n<strong>Q 学习<\/strong>（Watkins 1989）：证明在表格情形下收敛到最优。\n<\/li><li>
